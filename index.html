<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헌법 OX 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#3c3c3c;--sub:#777;--line:#e5e5e5;--gray:#f0f0f0;--g:#58cc02;--gd:#58a700;--gl:#d7ffb8;--r:#ff4b4b;--rd:#ea2b2b;--rl:#ffdfe0;--b:#1cb0f6;--bd:#1899d6;--y:#ffc800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131f24;--card:#1f2c34;--ink:#f1f7fb;--sub:#9fb0ba;--line:#37464f;--gray:#2b3a43;--gl:#1f3a14;--rl:#3d1f23}}
:root[data-theme="dark"]{--bg:#131f24;--card:#1f2c34;--ink:#f1f7fb;--sub:#9fb0ba;--line:#37464f;--gray:#2b3a43;--gl:#1f3a14;--rl:#3d1f23}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.65 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.w{max-width:620px;margin:0 auto;padding:16px 16px 140px}
h1,.j{font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-weight:400}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.top{display:flex;gap:14px;align-items:center;font-weight:700}
.goal{flex:1;height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.goal i,.bar i{display:block;height:100%;background:var(--y);border-radius:9px;transition:width .3s}
h1{font-size:30px;margin:18px 0 4px}
.sub{color:var(--sub);font-size:14px;margin:0 0 14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-family:"Jua","Noto Sans KR",sans-serif;font-size:19px;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}
.btn.bl{background:var(--b);box-shadow:0 4px 0 var(--bd)}
.btn.ghost{background:var(--card);color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.row{display:flex;gap:10px;margin:12px 0}
.row .btn{font-size:16px;padding:11px 6px}
select{width:100%;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;margin:26px 0}
.node{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;background:conic-gradient(var(--g) var(--p),var(--line) 0);position:relative}
.node span{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:24px;line-height:1}
.node small{position:absolute;bottom:-17px;font-size:11px;color:var(--sub);white-space:nowrap}
.set{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;margin-top:22px}
.set button{background:none;border:0;color:var(--sub);text-decoration:underline;padding:4px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .x{background:none;border:0;font-size:22px;color:var(--sub)}
.bar{flex:1;height:16px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{background:var(--g)}
.chip{display:inline-block;margin:22px 0 8px;padding:3px 12px;border-radius:12px;background:var(--gray);font-size:13px;color:var(--sub)}
.stmt{font-size:19px;line-height:1.8;margin:0 0 18px;word-break:keep-all}
.stmt mark{background:rgba(255,200,0,.45);color:inherit;border-radius:4px;padding:0 2px}
.ox{display:flex;gap:14px}
.ox button{flex:1;border:2px solid var(--line);border-radius:18px;background:var(--card);padding:18px 0;font-family:"Jua",sans-serif;font-size:56px;line-height:1;box-shadow:0 4px 0 var(--line)}
.ox .o{color:var(--b)}.ox .xx{color:var(--r)}
.ox button:active{transform:translateY(3px);box-shadow:none}
.ox button[disabled]{opacity:.45;cursor:default}
.ox button.pick{opacity:1;border-color:currentColor}
.sure{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--sub);font-size:14px}
.exp{margin-top:18px;background:var(--gray);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.75}
.exp b.k{font-family:"Jua",sans-serif;font-weight:400;font-size:18px}
.exp p{margin:6px 0}.exp .rel{color:var(--sub);font-size:13px}
.exp textarea{width:100%;margin-top:8px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:8px;resize:vertical}
.exp .bm{background:none;border:0;font-size:14px;color:var(--sub);padding:2px 0}
.exp del{background:rgba(255,75,75,.2);color:var(--rd);text-decoration:line-through;border-radius:3px;padding:0 2px}.exp ins{background:rgba(88,204,2,.28);text-decoration:none;border-radius:3px;padding:0 2px}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
.sheet.ok{background:var(--gl);color:#4a8f00}.sheet.no{background:var(--rl);color:var(--rd)}
.sheet>div{max-width:620px;margin:0 auto}
.sheet .j{font-size:22px;margin-bottom:8px}
.sheet .btn.r{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.shake{animation:sh .35s}
@keyframes up{from{transform:translateY(100%)}}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.res{text-align:center;padding-top:30px}.res .big{font-size:64px}
.stat{display:flex;gap:10px;margin:18px 0}.stat div{flex:1;border:2px solid var(--line);border-radius:14px;padding:10px;font-weight:700}
.stat small{display:block;color:var(--sub);font-weight:400}
.msg{background:var(--card);border:2px solid var(--y);border-radius:12px;padding:8px 12px;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const Q=[{"set":1,"num":1,"q":"합헌적 법률해석은 헌법해석의 일종으로 민주주의와 권력분립원칙의 관점에서 입법자의 입법권에 대한 존중과 규범유지의 원칙에 의하여 정당화된다.","src":"2023 경정승진","a":false,"exp":"합헌적 법률해석은 헌법해석의 일종이 아니라 법률해석의 일종이다."},{"set":1,"num":2,"q":"법률 또는 법률 조항은 원칙적으로 가능한 범위 안에서 합헌적으로 해석하여야 하나 그 해석은 문의적 한계와 법 목적에 따른 한계가 있다. 이러한 한계를 벗어난 합헌적 해석은 그것이 바로 실질적 의미에서의 입법작용을 뜻하게 되어 결과적으로 입법권자의 입법권을 침해하는 것이 된다.","src":"2024 경찰 제1차","a":true,"exp":"법률 또는 법률의 위 조항은 원칙적으로 가능한 범위 안에서 합헌적으로 해석함이 마땅하나 그 해석은 법의 문구와 목적에 따른 한계가 있다. 즉, 법률의 조항의 문구가 간직하고 있는 말의 뜻을 넘어서 말의 뜻이 완전히 다 른 의미로 변질되지 아니하는 범위 내이어야 한다는 문의적 한계와 입법권자가 그 법률의 제정으로써 추구하고자 하는 입법자의 명백한 의지와 입법의 목적을 헛되게 하는 내용으로 해석할 수 없다는 법목적에 따른 한계가 바로 그것이다. 왜냐하면, 그러한 범위를 벗어난 합헌적 해석은 그것이 바로 실질적 의미에서의 입법작용을 뜻하게 되어 결과적으로 입법권자의 입법권을 침해하는 것이 되기 때문이다(헌재 1989.7.14. 88헌가5)."},{"set":1,"num":3,"q":"구 군인사법 제48조 제4항 후단의 ‘무죄의 선고를 받은 때’의 의미와 관련하여, 형식상 무죄판결뿐 아니라 공소기각재판을 받았다 하더라도 그와 같은 공소기각의 사유가 없었더라면 무죄가 선고될 현저한 사유가 있는 이른바 내용상 무죄재판의 경우도 이에 포함된다고 해석하는 것은 법률의 문의적 한계를 벗어난 것으로서 합헌적 법률해석에 부합하지 아니한다.","src":"2014 변호사시험","a":false,"exp":"군인사법은 형사사건으로 기소되어 휴직명령을 받아 봉급의 반액을 지급받은 자는 ‘무죄의 선고를 받은 때’ 그 차액을 소급하여 수령할 수 있도록 규정하고 있는바, ‘무죄의 선고를 받은 때’의 의미와 관련하여, 형식상 무죄판결뿐 아니라 공소기각재판을 받았다 하더라도 그와 같은 공소기각의 사유가 없었더라면 무죄가 선고될 현저한 사유가 있는 이른바 내용상 무죄재판의 경우도 이에 포함된다고 확대 해석함이 법률의 문의적 한계 내의 합헌적 법률해석에 부합한다. (대법원 2004. 8. 20. 2004다22377)"},{"set":1,"num":4,"q":"군인사법 제48조 제4항 후단의 ‘무죄의 선고를 받은 때’를 형식상 무죄판결뿐 아니라 공소기각재판을 받았다 하더라도 그와 같은 공소기각의 사유가 없었더라면 무죄가 선고될 현저한 사유가 있는 이른바 내용상 무죄재판의 경우까지로 확 대 해석한 것은 법률의 문의적 한계 내의 합헌적 법률해석에 따른 정당한 것이다.","src":"2026 변호사시험","a":true,"exp":"대법원 2004. 8. 20. 2004다22377"},{"set":1,"num":5,"q":"영업주가 고용한 종업원 등의 업무에 관한 범법행위에 대하여 영업주도 자동적으로 함께 처벌하도록 규정한 조항을 ‘영업주가 종업원 등에 대한 선임감독상의 주의의무를 위반한 과실 기타 영업주의 귀책사유가 있는 경우에만 처벌하는 것’으로 해석하는 것은 허용된다.","src":"2026 변호사시험","a":false,"exp":"이 사건 법률조항을 그 문언상 명백한 의미와 달리 “종업원의 범죄행위에 대해 영업주의 선임감독상의 과실이 인정되는 경우”라는 요건을 추가하여 해석하는 것은 문언상 가능한 범위를 넘어서는 해석으로서 허용되지 않는다고 보아야 한다. (헌재 2007. 11. 29. 2005헌가10)"},{"set":1,"num":6,"q":"헌법정신에 맞도록 법률의 내용을 해석 보충하거나 정정하는 ‘헌법합치적 법률해석’은 ‘유효한’ 법률조항의 의미나 문구를 대상으로 하는 것이므로 입법의 공백을 방지하기 위하여 실효된 법률 조항을 유효한 것으로 해석하는 결과에 이르는 것은 ‘헌법합치적 법률해석’을 이유로도 정당화될 수 없다.","src":"2023 경찰간부","a":true,"exp":"해석을 통하여 전혀 새로운 법률상의 근거를 만들어 내거나, 기존에는 존재하였으나 실효되어 더 이상 존재한다고 볼 수 없는 법률조항을 여전히 ‘유효한’ 것으로 해석한다면, 이는 법률해석의 한계를 벗어나는 것으로서, ‘법률의 부존재’로 말미암아 형벌의 부과나 과세의 근거가 될 수 없는 것을 법률해석을 통하여 이를 창설해내는 일종의 ‘입법행위’에 해당하므로 헌법상의 권력분립원칙에 반할 뿐만 아니라 죄형법정주의, 조세법률주의의 원칙에도 반하는 것이다. 또한 헌법정신에 맞도록 법률의 내용을 해석·보충하거나 정정하는 ‘헌법합치적 법률해석’ 역시 ‘유효한’ 법률조항의 의미나 문구를 대상으로 하는 것이지, 이를 넘어 이미 실효된 법률조항을 대상으로 하여 헌법합치적인 법률해석을 할 수는 없는 것이어서, 유효하지 않은 법률조항을 유효한 것으로 해석하는 결과에 이르는 것은 ‘헌법합치적 법률해석’을 이유로도 정당화될 수 없다 할 것이다(헌재 2012. 5. 31. 2009헌바123)."},{"set":1,"num":7,"q":"조세법의 영역에서는 경과규정의 미비라는 명백한 입법의 공백을 방지하고 형평성의 왜곡을 시정하는 것은 원칙적으로 법률조항의 법문의 한계 안에서 법률을 해석 적용하여야 하는 법원이나 과세관청의 의무에 해당한다.","src":"2022 법원직","a":false,"exp":"과세요건법정주의 및 과세요건명확주의를 포함하는 조세법률주의가 지배하는 조세법의 영역에서는 경과규정의 미비라는 명백한 입법의 공백을 방지하고 형평성의 왜곡을 시정하는 것은 원칙적으로 입법자의 권한이고 책임이지 법문의 한계 안에서 법률을 해석·적용하는 법원이나 과세관청의 몫은 아니다(헌재 2012. 5. 31. 2009헌바123)."},{"set":1,"num":8,"q":"헌법 개정은 국회재적의원 과반수 또는 대통령의 발의로 제안된다.","src":"2023 법원직","a":true,"exp":"헌법 제128조 제1항"},{"set":1,"num":9,"q":"제안된 헌법개정안은 국회가 20일 이상의 기간 이를 공고하여야 한다.","src":"2024 경찰 제2차","a":false,"exp":"제안된 헌법개정안은 대통령이 20일 이상의 기간 이를 공고하여야 한다."},{"set":1,"num":10,"q":"국회는 헌법개정안이 공고된 날로부터 30일 이내에 의결하여야 하며, 국회의 의결은 출석의원 3분의 2 이상의 찬성을 얻어야 한다.","src":"2021 국가직 7급","a":false,"exp":"국회는 헌법개정안이 공고된 날로부터 60일 이내에 의결하여야 하며, 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 한다(헌법 제130조 제1항). 따라서 “30일 이내” 부분과 “출석의원 3분의 2” 부분이 틀렸다."},{"set":1,"num":11,"q":"국회는 헌법개정안이 제안된 날로부터 60일 이내에 의결하여야 하며, 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 한다.","src":"2026 경정승진","a":false,"exp":"헌법개정안이 제안된 날이 아니라 공고된 날로부터 60일 이내에 의결하여야 한다(헌법 제130조 제1항)."},{"set":1,"num":12,"q":"국회는 헌법개정안이 공고된 날로부터 60일 이내에 의결하여야 하며, 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 하는데, 표결은 무기명투표로 한다.","src":"2024 경찰 제2차","a":false,"exp":"헌법개정안에 대한 국회의 의결은 기명투표로 한다(국회법 제112조 제5항)."},{"set":1,"num":13,"q":"헌법개정안에 대한 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 하며 무기명투표로 표결한다.","src":"2026 법원직","a":false,"exp":"헌법개정안에 대한 국회의 의결은 기명투표로 한다(국회법 제112조 제5항)."},{"set":1,"num":14,"q":"헌법개정안은 국회가 의결한 후 30일 이내에 국민투표에 붙여 국회의원선거권자 과반수의 찬성을 얻어야 한다.","src":"2023 법원직","a":false,"exp":"헌법개정안은 국회가 의결한 후 30일 이내에 국민투표에 붙여 국회의원선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻어야 한다(헌법 제130조 제3항)."},{"set":1,"num":15,"q":"헌법개정안은 국회가 의결한 후 30일 이내에 국민투표에 붙여 국회의원선거권자 과반수의 투표와 유효투표수 과반수의 찬성을 얻어야 한다.","src":"2026 경정승진","a":false,"exp":"국회의원선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻어야 한다(헌법 제130조 제2항)."},{"set":1,"num":16,"q":"헌법개정안이 국회 재적의원 3분의 2 이상의 찬성을 얻고, 국회의원선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻 어, 대통령이 공포함으로써 확정된다.","src":"2020 법원직","a":false,"exp":"헌법개정안은 국회가 의결한 후 30일 이내에 국민투표에 붙여 국회의원선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻은 때에는 헌법개정은 확정되며, 대통령은 즉시 이를 공포하여야 한다(헌법 제130조 제3항)."},{"set":1,"num":17,"q":"입법기관의 직무소재지라는 것은 수도로서의 성격의 중요한 요소의 하나이지만, 정부 각 부처의 소재지 및 헌법재판권을 포함한 사법권이 행사되는 장소는 수도를 결정하는 데 있어서 별도로 결정적인 요소가 된다고 볼 필요는 없다.","src":"2023 법원행시","a":true,"exp":"우선 대의민주제 입헌국가에서는 국민의 대의기관인 의회를 통한 입법기능이 수행되는 곳이어야 한다. 입법기관의 \"직무소재지\"라는 것은 수도로서의 성격의 중요한 요소의 하나다. 다음으로 수도는 국가의 대표기능 내지 통합기능이 수행되는 곳이어야 한다. 우리나라와 같은 대통령제 국가의 헌법에서는 대통령이 국가를 대표하고 국가의 통일성을 유지하도록 하는바 대통령의 이러한 대내외적 활동은 그 활동이 수행되는 장소에 대하여 \"수도적인것\"의 한 필수적 요소를 부여하게 된다. 대통령의 소재지를 수도의 특징적 요소로 보는 한 정부 각 부처의 소재지는 수도를 결정하는 데 있어서 별도로 결정적인 요소가 된다고 볼 필요는 없다. 한편 헌법재판권을 포함한 사법권이 행사되는 장소와 도시의 경제적 능력 등은 수도를 결정하는 필수적인 요소에는 해당하지 아니한다고 볼 것이다(헌재 2004.10.21. 2004헌마554)."},{"set":1,"num":18,"q":"국민은 성문헌법의 제·개정에는 직접 참여하지만, 헌법전에 포함되지 아니한 헌법사항을 필요에 따라 관습의 형태로 직접 형성할 수 없다.","src":"2023 경찰간부","a":false,"exp":"국민이 대한민국의 주권자이며, 국민은 최고의 헌법제정권력이기 때문에 성문헌법의 제·개정에 참여할 뿐만 아니라 헌법전에 포함되지 아니한 헌법사항을 필요에 따라 관습의 형태로 직접 형성할 수 있다. 그렇다면 관습헌법도 성문헌법과 마찬가지로 주권자인 국민의 헌법적 결단의 의사의 표현이며 성문헌법과 동등한 효력을 가진다고 보아야 한다(헌재 2004. 10. 21. 2004헌마554)."},{"set":1,"num":19,"q":"관습헌법도 성문헌법과 마찬가지로 주권자인 국민의 헌법적 결단의 의사의 표현이지만, 관습헌법이 성문헌법과 동일한 효력을 가지는 것은 아니다.","src":"2024 경찰간부","a":false,"exp":"국민은 성문헌법의 제·개정에 참여할 뿐만 아니라 헌법전에 포함되지 아니한 헌법사항을 필요에 따라 관습의 형태로 직접 형성할 수 있다. 그렇다면 관습헌법도 성문헌법과 동등한 효력을 가진다고 보아야 한다(헌재 2004.10.21. 2004헌마554)."},{"set":1,"num":20,"q":"관습헌법은 헌법 제130조에 의거한 헌법개정의 방법에 의하지 않는 한, 그것을 지탱하고 있는 국민적 합의성을 상실하였다는 사정만으로 법적효력을 상실할 수 없다.","src":"2023 법원행시","a":false,"exp":"형식적인 헌법개정 외에도, 관습헌법은 그것을 지탱하고 있는 국민적 합의성을 상실함에 의하여 법적 효력을 상실할 수 있다(헌재 2004. 10. 21. 2004헌마554)."},{"set":1,"num":21,"q":"1954년 제2차 개헌에서는 헌법개정의 한계 사항을 규정하였다.","src":"2023 지방직 7급","a":true,"exp":"헌법개정의 한계 사항을 명시한 개정금지조항은 제2차~제4차 개정헌법에 규정되었다."},{"set":1,"num":22,"q":"헌법은 전문과 각 개별조항이 서로 밀접한 관련을 맺으면서 하나의 통일된 가치체계를 이루고 있는 것으로서, 이념적·논리적으로는 헌법규범 상호간의 우열을 인정할 수 있다 하더라도, 그것이 헌법의 어느 특정규정이 다른 규정의 효력을 전면적으로 부인할 수 있을 정도의 개별적 헌법규정 상호간에 효력상의 차등을 의미하는 것이라고는 볼 수 없다.","src":"2023 법원직","a":true,"exp":"헌재 1995. 12. 28. 95헌바3"},{"set":1,"num":23,"q":"헌법의 제규정 가운데는 헌법의 근본가치를 보다 추상적으로 선언한 것도 있고, 이를 보다 구체적으로 표현한 것도 있으므로 이념적 논리적으로는 규범상호간의 우열을 인정할 수 있으므로, 우리 헌법의 각 개별규정 가운데 무엇이 헌법제정규정이고 무엇이 헌법개정규정인지를 구분하는 것이 가능할 뿐 아니라, 각 개별규정에 그 효력상의 차이를 인정할 수도 있다.","src":"2024 경찰 제1차","a":false,"exp":"헌법은 전문과 각 개별조항이 서로 밀접한 관련을 맺으면서 하나의 통일된 가치체계를 이루고 있는 것으로서, 헌법의 제규정 가운데는 헌법의 근본가치를 보다 추상적으로 선언한 것도 있고, 이를 보다 구체적으로 표현한 것도 있으므로 이념적·논리적으로는 헌법규범 상호간의 우열을 인정할 수 있는 것이 사실이다. 그러나 우리 헌법의 각 개별규정 가운데 무엇이 헌법제정규정이고 무엇이 헌법개정규정인지를 구분하는 것이 가능하지 아니할 뿐 아니라, 각 개별규정에 그 효력상의 차이를 인정하여야 할 형식적인 이유를 찾을 수 없다. (헌재 1995. 12. 28. 95헌바3)"},{"set":1,"num":24,"q":"헌법은 전문과 각 개별조항이 서로 밀접한 관련을 맺으면서 하나의 통일된 가치 체계를 이루고 있는 것으로서, 헌법의 제규정 가운데는 헌법의 근본가치를 보다 추상적으로 선언한 것도 있고 이를 보다 구체적으로 표현한 것도 있을 수 있으나, 이념적·논리적으로는 규범상호간의 우열을 인정할 수는 없다.","src":"2023 경정승진","a":false,"exp":"헌법은 전문과 각 개별조항이 서로 밀접한 관련을 맺으면서 하나의 통일된 가치 체계를 이루고 있는 것으로서, 헌법의 제규정 가운데는 헌법의 근본가치를 보다 추상적으로 선언한 것도 있고, 이를 보다 구체적으로 표현한 것 도 있으므로 이념적 논리적으로는 규범상호간의 우열을 인정할 수 있는 것이 사실이다(헌재 1995.12.28. 95헌바3)."},{"set":1,"num":25,"q":"헌법의 개정에 한계가 있는지 여부에 관하여 학설상 대립이 있지만 현실적으로 그 한계를 무시한 개헌이 이루어지는 경우, 헌법재판소 판례에 따르면 위헌법률심판이나 헌법소원 어느 절차에 의하여도 그 헌법규정에 대한 위헌심사가 가능하지 않다.","src":"2012 변호사시험","a":true,"exp":"헌법 제111조 제1항 제1호, 제5호 및 헌법재판소법 제41조 제1항, 제68조 제2항은 위헌심사의 대상이 되는 규범을 법률 로 명시하고 있으며,……헌법은 그 전체로서 주권자인 국민의 결단내지 국민적 합의의 결과라고 보아야 할 것이므로, 헌법의 개별 규정을 헌법재판소법 제68조 재1항 소정의 공권력행사의 결과라고 볼 수도 없다(헌재1996.6.13. 94헌바20)."},{"set":1,"num":26,"q":"저항권의 행사는 민주적 기본질서의 유지, 회복이라는 소극적인 목적에 그쳐야 하고 정치적, 사회적, 경제적 체제를 개혁하기 위한 수단으로 이용될 수 없다.","src":"2026 경위공채","a":true,"exp":"헌재 2014. 12. 19. 2013헌다1"},{"set":1,"num":27,"q":"저항권이 헌법이나 실정법에 규정이 있는지 여부를 가려볼 필요도 없이 국회법 소정의 협의없는 개의시간의 변경과 회의일시를 통지하지 아니한 입법과정의 하자는 저항권행사의 대상이 되지 아니한다.","src":"2026 경위공채","a":true,"exp":"국회법 소정의 협의 없는 개의시간의 변경과 회의일시를 통지하지 아니한 입법과정의 하자는 저항권행사의 대상이 되지 아니한다. 왜냐하면 저항권은 국가권력에 의하여 헌법의 기본원리에 대한 중대한 침해가 행하여지고 그 침해가 헌법의 존재 자체를 부인하는 것으로서 다른 합법적인 구제수단으로는 목적을 달성할 수 없을 때에 국민이 자기의 권리 자유를 지키기 위하여 실력으로 저항하는 권리이기 때문이다. 헌법재판소는 심판대상법률과 관련하여 국회 본회의에 참석하지 못한 국회의원 125명이 국회의장을 상대로 제기한 국회의원과 국회의장간의 권한쟁의 심판청구 사건에서 “피청구인(국회의장)이 1996. 12. 26. 06：00경 국가안전기획부법중개정 법률안, 노동조합및노동관계조정법안 등을 상정하여 가결 선포한 것은 청구인들(국회의원)의 법률안 심의 표결의 권한을 침해한 것이다”라는 취지의 결정을 한 바 있다(헌재 1997. 9. 25. 97헌가4)."},{"set":1,"num":28,"q":"국적법 상 부모가 모두 국적이 없는 경우라도 대한민국에서 출생한 사람은 대한민국 국적을 취득한다.","src":"2024 경정승진","a":true,"exp":"국적법 제2조 제1항 제3호"},{"set":1,"num":29,"q":"대한민국에서 발견된 기아(棄兒)는 대한민국에서 출생한 것으로 간주한다.","src":"2014 법원행시","a":false,"exp":"대한민국에서 발견된 기아(棄兒)는 대한민국에서 출생한 것으로 추정한다(국적법 제2조 제2항)."},{"set":1,"num":30,"q":"외국인이 국적법 상 귀화요건을 갖추었더라도 법무부장관은 그 외국인의 귀화 허가 여부에 대한 재량권을 가진다.","src":"2022 경찰 제2차","a":true,"exp":"귀화허가는 외국인에게 대한민국 국적을 부여함으로써 국민으로서의 법적 지위를 포괄적으로 설정하는 행위에 해당한다. 귀화허가의 근거 규정의 형식과 문언, 귀화허가의 내용과 특성 등을 고려해 보면, 법무부장관은 귀화 신청인이 귀화 요건을 갖추었다 하더라도 귀화를 허가할 것인지 여부에 관하여 재량권을 가진다고 보는 것이 타당하다(대법원 2010. 10. 28. 2010두6496)."},{"set":1,"num":31,"q":"법무부장관은 출생에 의하여 대한민국 국적을 취득한 복수국적자에 대해서는 그가 대한민국의 국익에 반하는 행위를 하여 대한민국 국적을 보유함이 현저히 부적합하다고 인정하는 경우에도 해당 복수국적자의 국적 상실을 결정할 수 없다.","src":"2023 변호사시험","a":true,"exp":"국적법 제14조의3 제1항 단서"},{"set":1,"num":32,"q":"주된 생활의 근거를 외국에 두고 있는 복수국적자가 병역준비역에 편입된 때부터 대한민국 국적으로부터 이탈한다는 뜻을신고하지 않고 3개월이 지난 경우 병역의무 해소 전에는 예외 없이 대한민국 국적에서 이탈할 수 없도록 제한하는 국적법 조항은 국적이탈의 자유를 침해한다.","src":"2022 법원직","a":true,"exp":"헌재 2020. 9. 24. 2016헌마889"},{"set":1,"num":33,"q":"헌법에서 재외국민에 대한 국가의 보호를 처음으로 명시한 것은 제5공화국 헌법(제8차 개헌)이다.","src":"2024 경찰간부","a":true,"exp":""},{"set":1,"num":34,"q":"헌법상 영토조항만을 근거로 국민의 구체적 기본권이 도출된다고 할 수는 없으므로 영토에 관한 권리를 이른바 ‘영토권’이라 구성하여 헌법소원으로 그 구제를 청구하는 것은 불가능하다.","src":"2022 법원행시","a":false,"exp":"국민의 개별적 기본권이 아니라 할지라도 기본권보장의 실질화를 위하여서는, 영토조항만을 근거로 하여 독자적으로는 헌법소원을 청구할 수 없다할지라도, 모든 국가권능의 정당성의 근원인 국민의 기본권 침해에 대한 권리 구제를 위하여 그 전제조건으로서 영토에 관한 권리를, 이를테면 영토권이라 구성하여, 이를 헌법소원의 대상인 기본권의 하나로 간주하는 것은 가능한 것으로 판단된다(헌재 2001.03.21. 99헌마139)."},{"set":1,"num":35,"q":"독도 등을 중간수역으로 정한 대한민국과 일본국 간의 어업에 관한 협정 은 배타적 경제수역을 직접 규정한 것이 아니고, 독도의 영유권 문제나 영해 문제와는 직접적인 관련을 가지지 아니하므로 헌법상 영토조항에 위반되지 않는다.","src":"2016 사법시험","a":true,"exp":"헌재 2001.3.21. 99헌마139"},{"set":1,"num":36,"q":"현행 헌법 전문은 “1948년 7월 12일에 제정되고 9차에 걸쳐 개정된 헌법을 이제 국회의 의결을 거쳐 국민투표에 의하여 개정한다”라고 규정하고 있다.","src":"2017 국가직 7급","a":false,"exp":"현행헌법이 제9차 개정헌법이므로 “8차에 걸쳐 개정된 헌법을 ... 개정한다”라고 규정하고 있다."},{"set":1,"num":37,"q":"1972년 제7차 개정헌법의 전문에서는 3 1운동의 숭고한 독립정신과 4 19 의거 및 5 16 혁명의 이념을 계승한다고 규정하였다.","src":"2021 지방직 7급","a":true,"exp":"‘3 1운동’은 1948년 헌법에서부터 규정하였고, ‘4 19 의거 및 5 16 혁명’은 1962년 헌법~1972년 헌법에서 규정하였다."},{"set":1,"num":38,"q":"현행 헌법은 전문에서 “3 1운동으로 건립된 대한민국임시정부의 법통을 계승”한다고 선언하고 있으나, 이는 추상적 프로그램적 규정일 뿐이고 이로부터 국민의 구체적인 기본권이나 국가의 헌법적 의무가 도출되는 것은 아니다.","src":"2018 법원직","a":false,"exp":"헌법은 국가유공자 인정에 관하여 명문 규정을 두고 있지 않으나 전문(前文)에서 “3.1운동으로 건립된 대한민국임시정부의 법통을 계승”한다고 선언하고 있다. 이는 대한민국이 일제에 항거한 독립운동가의 공헌과 희생을 바탕으로 이룩된 것임을 선언한 것이고, 그렇다면 국가는 일제로부터 조국의 자주독립을 위하여 공헌한 독립유공자와 그 유족에 대하여는 응분의 예우를 하여야 할 헌법적 의무를 지닌다(헌재 2005. 6. 30. 2004헌마859)."},{"set":1,"num":39,"q":"헌법 전문에서 ‘3 1운동으로 건립된 대한민국임시정부의 법통을 계승’한다고 선언하고 있는바, 국가는 일제로부터 조국의 자주독립을 위하여 공헌한 독립유공자와 그 유족에 대하여는 응분의 예우를 하여야 할 헌법적 의무를 지니며, 이러한 헌법적 의무는 당사자가 주장하는 특정인을 독립유공자로 인정해야 한다는 것을 뜻한다.","src":"2021 지방직 7급","a":false,"exp":"헌법은 국가유공자 인정에 관하여 명문 규정을 두고 있지 않다. 그러나 헌법은 전문에서 “3.1운동으로 건립된 대한민국임시정부의 법통을 계승”한다고 선언하고 있다. 이는 대한민국이 일제에 항거한 독립운동가의 공헌과 희생을 바탕으로 이룩된 것임을 선언한 것이고, 그렇다면 국가는 일제로부터 조국의 자주독립을 위하여 공헌한 독립유공자와 그 유족에 대하여는 응분의 예우를 하여야 할 헌법적 의무를 지닌다고 보아야 할 것이다. 다만 그러한 의무는 국가가 독립유공자의 인정절차를 합리적으로 마련하고 독립유공자에 대한 기본적 예우를 해주어야한다는 것을 뜻할 뿐이며, 당사자가 주장하는 특정인을 반드시 독립유공자로 인정하여야 하는 것을 뜻할 수는 없다(헌재 2005. 6. 30. 2004헌마859)."},{"set":1,"num":40,"q":"헌법의 기본원리는 헌법의 이념적 기초인 동시에 헌법을 지배하는 지도원리로서 입법이나 정책결정의 방향을 제시하며 공무원을 비롯한 모든 국민·국가기관이 헌법을 존중하고 수호하도록 하는 지침이 되며, 구체적 기본권을 도출하는 근거로 될 수 있다.","src":"2023 법원직","a":false,"exp":"헌법의 기본원리는 헌법의 이념적 기초인 동시에 헌법을 지배하는 지도원리로서 입법이나 정책결정의 방향을 제시하며 공무원을 비롯한 모든 국민·국가기관이 헌법을 존중하고 수호하도록 하는 지침이 되며, 구체적 기본권을 도출하는 근거로 될 수는 없으나 기본권의 해석 및 기본권제한입법의 합헌성 심사에 있어 해석기준의 하나로서작용한다(헌재 1996. 4. 25. 92헌바47)."},{"set":1,"num":41,"q":"국민주권의 원리는 헌법의 해석기준으로 작용하므로 그에 기하여 곧바로 국민의 개별적 기본권을 도출할 수 있다.","src":"2016 사법시험","a":false,"exp":"청구인들이 주장하는 것 가운데 통일정신, 국민주권원리 등은 우리나라 헌법의 연혁적ㆍ이념적 기초로서 헌법이나 법률해석에서의 해석기준으로 작용한다고 할 수 있지만, 그에 기하여 곧바로 국민의 개별적 기본권성을 도출 해 내기는 어렵다(헌재 2008.11.27. 2008헌마517)."},{"set":1,"num":42,"q":"민주주의 원리의 한 내용인 국민주권주의는 모든 국가권력이 국민의 의사에 기초해야 한다는 의미일 뿐만 아니라 국민이 정치적 의사결정에 관한 모든 정보를 제공받고 직접 참여하여야 한다는 의미이다.","src":"2025 경위공채","a":false,"exp":"민주주의 원리의 한 내용인 국민주권주의는 모든 국가권력이 국민의 의사에 기초해야 한다는 의미일 뿐 국민이 정치적 의사결정에 관한 모든 정보를 제공받고 직접 참여하여야 한다는 의미는 아니다(헌재 2016. 10. 27. 2012헌마121)."},{"set":1,"num":43,"q":"오늘날 법률유보원칙은 국가공동체와 그 구성원에게 기본적이고도 중요한 의미를 갖는 영역, 특히 국민의 기본권 실현과 관련된 영역에 있어서는 국민의 대표자인 입법자가 그 본질적 사항에 대해서 스스로 결정하여야 한다는 요구까지 내포하고 있다.","src":"2022 지방직 7급","a":true,"exp":"헌재 1999. 5. 27. 98헌바70"},{"set":1,"num":44,"q":"수신료 징수업무를 지정받은 자가 수신료를 징수하는 때 지정받은 자의 고유업무와 관련된 고지행위와 결합하여 이를 행 해서는 안 된다고 규정한 방송법 시행령 제43조 제2항(이하 ‘심판대상조항’이라 한다)은 수신료의 구체적인 고지방법에관한 규정인바, 이는 수신료의 부과 징수에 관한 본질적인 요소로서 법률에 직접 규정할 사항이 아니므로 이를 법률에서 직접 정하지 않았다고 하여 의회유보원칙에 위반된다고 볼 수 없다.","src":"2025 법원직","a":true,"exp":"헌재 2024. 5. 30. 2023헌마820"},{"set":1,"num":45,"q":"도시환경정비사업의 시행자인 토지등소유자가 사업시행인가를 신청하기 전에 얻어야 하는 토지등소유자의 동의요건을 토지등소유자가 자치적으로 정하여 운영하는 규약에 정하도록 규정한 구 도시 및 주거환경정비법 조항은 최소한 사업시행인가 신청에 필요한 토지등소유자의 동의정족수를 자치규약에서 정하도록 위임하였으므로 의회유보원칙에 위배되지 않는다.","src":"2026 경찰 제1차","a":false,"exp":"토지등소유자가 도시환경정비사업을 시행하는 경우 사업시행인가 신청시 필요한 토지등소유자의 동의는, 개발사업의 주체 및 정비구역 내 토지등소유자를 상대로 수용권을 행사하고 각종 행정처분을 발할 수 있는 행정주체로서의 지위를 가지는 사업시행자를 지정하는 문제로서, 그 동의요건을 정하는 것은 국민의 권리와 의무의 형성에 관한 기본적이고 본질적인 사항이므로 국회가 스스로 행하여야 하는 사항에 속하는 것임에도 불구하고, 사업시행인가 신청에 필요한 동의정족수를 토지등소유자가 자치적으로 정하여 운영하는 규약에 정하도록 한 것은 법률유보 내지 의회유보원칙에 위배된다(헌재 2012. 4. 24. 2010헌바1)."},{"set":1,"num":46,"q":"구 도시 및 주거환경정비법 상 토지등소유자가 도시환경정비사업을 시행하는 경우 사업시행인가 신청시 필요한 토지등소유자의 동의요건을 정하는 것은 국민의 권리와 의무의 형성에 관한 기본적이고 본질적인 사항이므로 국회가 스스로 행하여야 하는 사항에 속하는 것임에도 불구하고, 사업시행인가 신청에 필요한 동의정족수를 토지등소유자가 자치적으로 정하여 운영하는 규약에 정하도록 한 것은 법률유보원칙에 위반된다.","src":"2025 국가직 7급","a":true,"exp":"헌재 2012. 4. 24. 2010헌바1"},{"set":1,"num":47,"q":"기후위기 대응을 위한 탄소중립 녹색성장 기본법 제8조 제1항이 2031년부터 2049년까지의 감축목표에 관하여 정량적 수준을 규정하지 않고 이에 관해 정부가 5년마다 정하도록 하였다고 하더라도, 온실가스 감축목표의 수치와 경로를 정하는 것 은 과학적 예측과 분석에 기반한 전문적이고 기술적인 영역에 해당하여 법률에 이를 상세하게 정하는 것은 한계가 있으므로, 이를 들어 의회유보원칙과 법률유보원칙을 위반하였다고 할 수 없다.","src":"2025 법원직","a":false,"exp":"탄소중립기본법 제8조 제1항에서 2030년까지의 감축목표에 대하여 2030년을 목표연도로 한 2018년 대비 감축비율의 하한만 법률에서 정하였을 뿐, 구체적인 감축비율의 수치는 대통령령에 위임하고 감축의 경로는 정부가 설정하는 부문별 및 연도별 감축목표에 따르도록 한 것은 법률유보원칙을 위반한 것으로 볼 수 없다. 그러나 중장기적인 온실가스 감축목표와 감축경로를 계획할 때에는 매우 높은 수준의 사회적 합의가 필요하다는 점, 미래세대는 민주적 정치과정에 참여하는 것이 제약되어 있다는 점과 관련하여 입법자에게 더욱 구체적인 입법의무와 책임이 있음을 고려할 때, 2031년부터 2049년까지의 감축목표에 관하여 대강의 정량적 수준도 규정하지 않고 이 에 관해 정부가 5년마다 정하도록 한 것은 의회유보원칙을 포함하는 법률유보원칙을 위반한 것이다(헌재 2024. 8. 29. 2020헌마389)."},{"set":2,"num":1,"q":"헌법 제13조 제2항이 금하고 있는 소급입법은, 이미 과거에 완성된 사실․법률관계를 규율의 대상으로 하는 이른바 진정소급효의 입법과 이미 과거에 시작하였으나 아직 완성되지 아니하고 진행과정에 있는 사실․법률관계를 규율의 대상으로 하는 이른바 부진정소급효의 입법을 모두 의미한다.","src":"2020 법원직","a":false,"exp":"과거의 사실관계 또는 법률관계를 규율하기 위한 소급입법의 태양에는 이미 과거에 완성된 사실·법률관계를 규율의 대상으로 하는 이른바 진정소급효의 입법과 이미 과거에 시작하였으나 아직 완성되지 아니하고 진행과정에 있는 사실·법률관계를 규율의 대상으로 하는 이른바 부진정소급효의 입법이 있다. 헌법 제13조 제2항이 금하고 있는 소급입법은 전자, 즉 진정소급효를 가지는 법률만을 의미하는 것으로서, 이에 반하여 후자, 즉 부진정소급효의 입법은 원칙적으로 허용되는 것이다(헌재 1999. 4. 29. 94헌바37)."},{"set":2,"num":2,"q":"부진정소급입법은 특단의 사정이 없는 한 헌법적으로 허용되지 않는 것이 원칙이나, 예외적으로 신뢰보호의 요청에우선하는 심히 중대한 공익상의 사유가 소급입법을 정당화하는 경우에 허용될 수 있다.","src":"2019 국가직 7급","a":false,"exp":"새로운 입법으로 이미 종료된 사실관계에 작용케 하는 진정소급입법은 헌법적으로 허용되지 않는 것이 원칙이며 특단의 사정이 있는 경우에만 예외적으로 허용될 수 있는 반면, 현재 진행 중인 사실관계에 작용케 하는 부진정소급입법은 원칙적으로 허용되지만 소급효를 요구하는 공익상의 사유와 신뢰보호의 요청 사이의 교량과정에서 신뢰보호의 관점이 입법자의 형성권에 제한을 가하게 된다(헌재 1998. 11. 26. 97헌바58)."},{"set":2,"num":3,"q":"조세에 관한 법규․제도는 신축적으로 변할 수밖에 없다는 점에서 납세의무자로서는 구법 질서에 의거한 신뢰를 바탕으로 적극적으로 새로운 법률관계를 형성하였다든지 하는 특별한 사정이 없는 한 원칙적으로 현재의 세법이 변함없이 유지되리라고 기대하거나 신뢰할 수는 없다.","src":"2021 국가직 7급","a":true,"exp":"헌재 2003. 4. 24. 2002헌바9"},{"set":2,"num":4,"q":"법률에 따른 개인의 행위가 단지 법률이 반사적으로 부여하는 기회의 활용을 넘어서 국가에 의하여 일정 방향으로 유인된 것이라 하더라도 개인의 신뢰보호가 국가의 법률개정이익에 우선된다고 볼 여지는 없다.","src":"2021 국가직 7급","a":false,"exp":"개인의 신뢰이익에 대한 보호가치는 ① 법령에 따른 개인의 행위가 국가에 의하여 일정방향으로 유인된 신뢰의 행사인지, ② 아니면 단지 법률이 부여한 기회를 활용한 것으로서 원칙적으로 사적 위험부담의 범위에 속하는 것인지 여부에 따라 달라진다. 만일 법률에 따른 개인의 행위가 단지 법률이 반사적으로 부여하는 기회의 활용을 넘어서 국가에 의하여 일정 방향으로 유인된 것이라면 특별히 보호가치가 있는 신뢰이익이 인정될 수 있고, 원칙적으로 개인의 신뢰보호가 국가의 법률개정이익에 우선된다고 볼 여지가 있다(헌재 2002. 11. 28. 2002헌바45)."},{"set":2,"num":5,"q":"헌법재판소는 수급권자 자신이 종전에 지급받던 평균임금을 기초로 산정된 장해보상연금을 수령하고 있던 수급권 자에게, 실제의 평균임금이 노동부장관이 고시한 한도금액 이상일 경우 그 한도금액을 실제임금으로 의제하는 내용으로 신설된 최고보상제도를, 2년 6개월의 유예기간 후 적용하는 ｢산업재해보상보험법｣ 부칙 조항이 신뢰보호원칙에 위배된다고 판시하였다.","src":"2015 변호사시험","a":true,"exp":"최고보상제를 도입하는 것 자체는 입법자의 결단으로서 형성적 재량권의 범위 내에 있다고 보더라도, 그러한 입법자의 결단은최고보상제도 시행 이후에 산재를 입는 근로자들부터 적용될 수 있을 뿐, 제도 시행 이전에 이미 재해를 입고 산재보상수급권이 확정적으로 발생한 청구인들에 대하여 그 수급권의 내용을 일시에 급격히 변경하여 가면서까지 적용할 수 있는 것은 아니라고 보아야 할 것이다. 따라서, 심판대상조항은 신뢰보호의 원칙에 위배하여 청구인들의 재산권을 침해하는 것으로서 헌법에 위반된다(헌재 2009.5.28. 2005헌바20)."},{"set":2,"num":6,"q":"부당환급받은 세액을 징수하는 근거규정인 개정조항을 개정된 법 시행 후 최초로 환급세액을 징수하는 분부터 적용하도록 규정한 법인세법 부칙 조항은 이미 완성된 사실․법률관계를 규율하는 진정소급입법에 해당하나, 이를 허용하지 아니하면 위 개정조항과 같이 법인세 부과처분을 통하여 효율적으로 환수하지 못하고 부당이득 반환 등 복잡한 절차를 거칠 수밖에 없어 중대한 공익상 필요에 의하여 예외적으로 허용된다.","src":"2019 국가직 5급","a":false,"exp":"심판대상조항은 개정 후 법인세법의 시행 이전에 결손금 소급공제 대상 중소기업이 아닌 법인이 결손금 소급공제로 법인세를환급받은 경우에도 이 사건 개정조항을 적용할 수 있도록 규정하고 있으므로, 이는 이미 종결한 과세요건사실에 소급하여 적용할 수 있도록 하는 것이다. 따라서 심판대상조항은 청구인이 이 사건 개정조항이 시행되기 전 환급세액을 수령한 부분까지사후적으로 소급하여 적용되는 것으로서 헌법 제13조 제2항에 따라 원칙적으로 금지되는 이미 완성된 사실·법률관계를 규율하는 진정소급입법에 해당한다. ... 공익상 필요성이 크다고 보기 어렵다(헌재 2014.7.24. 2012헌바105)."},{"set":2,"num":7,"q":"사법연수원의 소정 과정을 마치더라도 바로 판사임용자격을 취득할 수 없고 일정 기간 이상의 법조경력을 갖추어야 판사로 임용될 수 있도록 한 법원조직법 개정조항의 시행일 및 그 경과조치에 관한 부칙은, 동법 개정 시점에이미 사법연수원에 입소하여 사법연수생의 신분을 가지고 있었던 자가 사법연수원을 수료하는 해의 판사 임용에지원하는 경우에 적용되는 한 신뢰보호원칙에 위반된다.","src":"2022 경정승진","a":true,"exp":"판사임용자격에 관한 법원조직법 규정이 지난 40여 년 동안 유지되어 오면서, 국가는 입법행위를 통하여 사법시험에 합격한 후 사법연수원을 수료한 즉시 판사임용자격을 취득할 수 있다는 신뢰의 근거를 제공하였다고 보아야 하며, 수년간 상당한 노력과 시간을들인 끝에 사법시험에 합격한 후 사법연수원에 입소하여 사법연수생의 지위까지 획득한 청구인들의 경우 사법연수원 수료로써 판사임용자격을 취득할 수 있으리라는 신뢰이익은 보호가치가 있다고 할 것이다. 따라서 개정법을 법 개정 당시 이미 사법연수원에 입소한 사람들에게 적용되도록 한 것은 신뢰보호원칙에 반한다고 할 것이다(헌재 2012. 11. 29. 2011헌마786)."},{"set":2,"num":8,"q":"변리사 제1, 2차 시험을 종전의 ‘절대평가제’에서 ‘상대평가제’로 전환하는 내용의 변리사법 시행령 조항을 즉 시 시행함으로 인한 수험생들의 신뢰이익 침해는 공익적 목적을 고려하더라도 정당화될 수 없을 정도로 과도하므로, 위 조항을 즉시 2002년의 변리사 제1차 시험에 대하여 시행하도록 그 시행시기를 정한 개정 시행령 부칙 부분은 헌법에 위반되어 무효이다.","src":"2020 법원직","a":true,"exp":"절대평가제가 요구하는 합격기준에 맞추어 시험준비를 한 수험생들은 제1차 시험 실시를 불과 2개월밖에 남겨놓지 않은 시점에서 개정 시행령의 즉시 시행으로 합격기준이 변경됨으로 인하여 시험준비에 막대한 차질을 입게 되어 위 신뢰가 크게 손상되었고, 특히 절대평가제에 의한 합격기준인 매 과목 40점 및 전과목 평균 60점 이상을 득점하고도 불합격처분을 받은 수험생들의 신뢰이익은 그 침해된 정도가 극심하며, 그 반면 개정 시행령에 의하여 상대평가제를 도입함으로써 거둘 수 있는 공익적 목적은 개정 시행령을 즉시 시행하여 바로 임박해 있는 2002년의 변리사 제1차 시험에 적용하면서까지 이를 실현하여야 할 합리적인 이유가 있다고 보기 어려우므로, 변리사 제1차 시험의 상대평가제를 규정한 개정 시행령 제4조 제1항을 2002년의 제1차 시험에 시행하는 것은 헌법상 신뢰보호의 원칙에 비추어 허용될 수 없으므로, 개정 시행령 부칙 중 제4조 제1항을 즉시 2002년의 변리사 제1차 시험에 대하여 시행하도록 그 시행시기를 정한 부분은 헌법에 위반되어 무효이다(대법원2006.11.16. 2003두12899)."},{"set":2,"num":9,"q":"친일재산을 그 취득·증여 등 원인행위시에 국가의 소유로 하도록 규정한 ｢친일반민족행위자 재산의 국가귀속에 관 한 특별법｣ 조항은 현재 진행 중인 사실관계 또는 법률관계에 작용하는 부진정소급입법에 해당한다.","src":"2023 경찰간부","a":false,"exp":"친일재산을 그 취득·증여 등 원인행위 시에 국가의 소유로 하도록 규정한 친일재산귀속법 조항은 진정소급입법에 해당하나 헌 법 제13조 제2항에 반하지 않는다(헌재 2011. 3. 31. 2008헌바141)."},{"set":2,"num":10,"q":"위헌인 법률일지라도 해당 법률에 대한 헌법재판소의 위헌 결정이 있기 전까지는 합헌성이 추정되므로 합헌적인 법률에 기초한 신뢰이익과 동일한 정도의 보호, 즉 ‘헌법에서 유래하는 국가의 보호의무’까지 요청된다.","src":"2025 변호사시험","a":false,"exp":"이러한 신뢰이익은 합헌적인 법률에 기초한 신뢰이익과 동일한 정도의 보호, 즉 “헌법에서 유래하는 국가의 보호의무”까지는 요청할 수는 없다(헌재 2006. 3. 30. 2005헌마598)."},{"set":2,"num":11,"q":"우리 헌법의 경제질서는 사유재산제를 바탕으로 하고 자유경쟁을 존중하는 시장경제에 입각하고 있으므로, 사회적시장경제질서로서의 성격을 띤다고 할 수 없다.","src":"2026 변호사시험","a":false,"exp":"우리나라 헌법상의 경제질서는 사유재산제를 바탕으로 하고 자유경쟁을 존중하는 자유시장경제질서를 기본으로 하면서도 이에수반되는 갖가지 모순을 제거하고 사회복지·사회정의를 실현하기 위하여 국가적 규제와 조정을 용인하는 사회적 시장경제질서로서의 성격을 띠고 있다(헌재 1996. 4. 25. 92헌바47)."},{"set":2,"num":12,"q":"국가는 농지에 관하여 경자유전의 원칙이 달성될 수 있도록 노력하여야 하며, 농지의 소작제도는 금지되나, 농업생산성의 제고와 농지의 합리적인 이용을 위하거나 불가피한 사정으로 발생하는 농지의 임대차와 위탁경영은 허용될 수 있다.","src":"2019 법원행시","a":true,"exp":"국가는 농지에 관하여 경자유전의 원칙이 달성될 수 있도록 노력하여야 하며, 농지의 소작제도는 금지된다(헌법 제121조 제1항). 농업생산성의 제고와 농지의 합리적인 이용을 위하거나 불가피한 사정으로 발생하는 농지의 임대차와 위탁경영은 법률이 정하는 바에 의하여 인정된다(동조 제2항)."},{"set":2,"num":13,"q":"농업생산성의 제고와 농지의 합리적인 이용을 위하거나 불가피한 사정으로 발생하는 농지의 소작제도, 임대차 및 위탁경영은 법률이 정하는 바에 의하여 인정된다.","src":"2026 변호사시험","a":false,"exp":"농업생산성의 제고와 농지의 합리적인 이용을 위하거나 불가피한 사정으로 발생하는 농지의 임대차와 위탁경영은 법률이 정하는 바에 의하여 인정된다(헌법 제121조 제2항). 그러나 농지의 소작제도는 금지된다(헌법 제121조 제1항)."},{"set":2,"num":14,"q":"국방상 또는 국민경제상 긴절한 필요를 이유로 법률이 정하는 경우에는 사영기업을 국유로 이전하는 것이 허용된다.","src":"2026 변호사시험","a":true,"exp":"국방상 또는 국민경제상 긴절한 필요로 인하여 법률이 정하는 경우를 제외하고는, 사영기업을 국유 또는 공유로 이전하거나그 경영을 통제 또는 관리할 수 없다(헌법 제126조). 따라서 국방상 또는 국민경제상 긴절한 필요를 이유로 법률이 정하는 경우에는 사영기업을 국유로 이전하는 것이 허용된다."},{"set":2,"num":15,"q":"택시운송사업자에게 운송수입금 전액 수납의무를 부과하는 것은 헌법 제126조에 의하여 원칙적으로 금지되는 기 업 경영과 관련한 국가의 광범위한 감독과 통제 또는 관리에 해당되지 않는다.","src":"2023 변호사시험","a":true,"exp":"운송수입금 전액관리제로 인하여 청구인들이 기업경영에 있어서 영리추구라고 하는 사기업 본연의 목적을 포기할 것을 강요받거나 전적으로 사회․경제정책적 목표를 달성하는 방향으로 기업활동의 목표를 전환해야 하는 것도 아니고, 그 기업경영과 관련하여 국가의 광범위한 감독과 통제 또는 관리를 받게 되는 것도 아니다(헌재 1998. 10. 29. 97헌마345)."},{"set":2,"num":16,"q":"헌법 제119조 제2항에 규정된 ‘경제주체간의 조화를 통한 경제민주화’의 이념은 경제영역에서 정의로운 사회질서를 형성하기 위하여 추구할 수 있는 국가목표일 뿐, 개인의 기본권을 제한하는 국가행위를 정당화하는 헌법규범 이 아니다.","src":"2020 법원직","a":false,"exp":"헌법 제119조 제2항에 규정된 '경제주체간의 조화를 통한 경제민주화'의 이념도 경제영역에서 정의로운 사회질서를 형성하기 위하여 추구할 수 있는 국가목표로서 개인의 기본권을 제한하는 국가행위를 정당화하는 헌법규범이다(헌재 2003. 11. 27. 2001헌바35)."},{"set":2,"num":17,"q":"헌법 제119조는 헌법상 경제질서에 관한 일반조항으로서 국가의 경제정책에 대한 하나의 헌법적 지침일 뿐, 그 자체가 기본권의 성질을 가진다거나 독자적인 위헌심사의 기준이 된다고 할 수 없다.","src":"2023 국가직 7급","a":true,"exp":"청구인들은 심판대상조항들이 헌법 제119조 등에 위반된다고 주장한다. 그러나 헌법 제119조는 헌법상 경제질서에 관한 일반조항으로서 국가의 경제정책에 대한 하나의 헌법적 지침일 뿐 그 자체가 기본권의 성질을 가진다거나 독자적인 위헌심사의 기준이 된다고 할 수 없다. 그러므로 청구인들의 이러한 주장에 대하여는 더 나아가 살펴보지 않는다(헌재 2017. 7. 27. 2015헌바278)."},{"set":2,"num":18,"q":"경제적 기본권을 제한하는 법률의 합헌성 여부를 심사하는 경우, 그 법률을 정당화하는 공익은 헌법에 명시적으로 규정된 목표에만 제한된다.","src":"2022 지방직 7급","a":false,"exp":"경제적 기본권의 제한을 정당화하는 공익이 헌법에 명시적으로 규정된 목표에만 제한되는 것은 아니고, 헌법은 단지 국가가실현하려고 의도하는 전형적인 경제목표를 예시적으로 구체화하고 있을 뿐이므로 헌법재판소는 기본권의 제한을 정당화할 수 있는 모든 공익을 아울러 고려하여 법률의 합헌성 여부를 심사하여야 한다(헌재 1996. 12. 26. 96헌가18)."},{"set":2,"num":19,"q":"헌법 제119조제2항은 독과점규제라는 경제정책적 목표를 개인의 경제적 자유를 제한할 수 있는 정당한 공익의 하나로 명문화하고 있는데, 독과점규제의 목적이 경쟁의 회복에 있다면 이 목적을 실현하는 수단 또한 자유롭고 공정한 경쟁을 가능하게 하는 방법이어야 한다.","src":"2023 국가직 7급","a":true,"exp":"헌법 제119조 제2항은 독과점규제라는 경제정책적 목표를 개인의 경제적 자유를 제한할 수 있는 정당한 공익의 하나로 명문화하고 있다. 독과점규제의 목적이 경쟁의 회복에 있다면 이 목적을 실현하는 수단 또한 자유롭고 공정한 경쟁을 가능하게 하 는 방법이어야 한다. 그러나 주세법의 구입명령제도는 전국적으로 자유경쟁을 배제한 채 지역할거주의로 자리잡게 되고 그로써 지역 독과점현상의 고착화를 초래하므로, 독과점규제란 공익을 달성하기에 적정한 조치로 보기 어렵다(헌재 1996. 12. 26. 96헌가18)."},{"set":2,"num":20,"q":"특정의료기관이나 특정의료인의 기능･진료방법에 관한 광고를 금지하는 것은 새로운 의료인들에게 자신의 기능이나 기술 혹은 진단 및 치료방법에 관한 광고와 선전을 할 기회를 배제함으로써, 기존의 의료인과의 경쟁에서 불리한 결과를 초래할 수 있는데, 이는 자유롭고 공정한 경쟁을 추구하는 헌법상의 시장경제질서에 부합되지 않는다.","src":"2013 법원행시","a":true,"exp":"의료광고의 금지는 자유롭고 공정한 경쟁을 추구하는 헌법상의 시장경제질서에 부합되지 않는다. ... 비례의 원칙에 위배하여 표현의 자유와 직업수행의 자유를 침해한다(헌재 2005.10.27. 2003헌가3)."},{"set":2,"num":21,"q":"특수한 불법행위책임에 관하여 위험책임의 원리를 수용하는 것은 입법정책에 관한 사항으로서 입법자의 재량에 속한다고 할 것이므로 ｢자동차손해배상보장법｣ 조항이 운행자의 재산권을 본질적으로 제한하거나 평등의 원칙에 위반되지 아니하는 이상 위험책임의 원리에 기하여 무과실책임을 지운 것만으로 헌법 제119조제1항의 자유시장경제질서에 위반된다고 할 수 없다.","src":"2022 국가직 7급","a":true,"exp":"헌재 1998. 5. 28. 96헌가4"},{"set":2,"num":22,"q":"헌법 제119조 제2항은 국가가 경제영역에서 실현하여야 할 목표의 하나로서 ‘적정한 소득의 분배’를 들고 있으므로, 이로부터 소득에 대하여 누진세율에 따른 종합과세를 시행하여야 할 구체적인 헌법적 의무가 입법자에게 부과된다.","src":"2024 법원직","a":false,"exp":"헌법 제119조 제2항은 국가가 경제영역에서 실현하여야 할 목표의 하나로서 “적정한 소득의 분배”를 들고 있지만, 이로부터 반드시 소득에 대하여 누진세율에 따른 종합과세를 시행하여야 할 구체적인 헌법적 의무가 조세입법자에게 부과되는 것이라고 할 수 없다(헌재 1999. 11. 25. 98헌마55)."},{"set":2,"num":23,"q":"우리나라는 건국헌법 이래 문화국가의 원리를 헌법의 기본원리로 채택하고 있다.","src":"2023 국가직 7급","a":true,"exp":""},{"set":2,"num":24,"q":"국가의 문화육성의 대상에는 원칙적으로 다수의 사람에게 문화창조의 기회를 부여한다는 의미에서 엘리트문화를 제외한 서민문화, 대중문화를 정책적인 배려의 대상으로 하여야 한다.","src":"2021 국가직 7급","a":false,"exp":"국가의 문화육성의 대상에는 원칙적으로 모든 사람에게 문화 창조의 기회를 부여한다는 의미에서 모든 문화가 포함된다. 따라서 엘리트문화뿐만 아니라 서민문화, 대중문화도 그 가치를 인정하고 정책적인 배려의 대상으로 하여야 한다(헌재 2004. 5. 27. 2003헌가1)."},{"set":2,"num":25,"q":"헌법 제9조의 규정취지와 민족문화유산의 본질에 비추어 볼 때, 국가가 민족문화유산을 보호하고자 하는 경우 이 에 관한 헌법적 보호법익은 ‘민족문화유산의 존속’ 그 자체를 보장하는 것이고, 원칙적으로 민족문화유산의 훼손등에 관한 가치보상이 있는지 여부는 이러한 헌법적 보호법익과 직접적인 관련이 없다.","src":"2023 국가직 7급","a":true,"exp":"헌재 2003. 1. 30. 2001헌바64"},{"set":2,"num":26,"q":"문화국가원리는 국가의 문화정책과 밀접 불가분의 관계를 맺고 있는바, 오늘날 문화국가에서의 문화정책은 문화풍토의 조성이 아니라 문화 그 자체에 초점을 두어야 한다.","src":"2023 지방직 7급","a":false,"exp":"오늘날 문화국가에서의 문화정책은 그 초점이 문화 그 자체에 있는 것이 아니라 문화가 생겨날 수 있는 문화풍토를 조성하는데 두어야 한다(헌재 2004. 5. 27. 2003헌가1)."},{"set":2,"num":27,"q":"개인의 정치적 견해를 기준으로 청구인들을 문화예술계 정부지원사업에서 배제되도록 차별취급한 것은 헌법상 문화국가원리에 반하는 자의적인 것으로 정당화될 수 없다.","src":"2021 국가직 7급","a":true,"exp":"우리 헌법상 문화국가원리는 견해와 사상의 다양성을 그 본질로 하며, 이를 실현하는 국가의 문화정책은 불편부당의 원칙에 따라야 하는바, 모든 국민은 정치적 견해 등에 관계없이 문화 표현과 활동에서 차별을 받지 않아야 한다. 특히 아직까지 국가지원에의 의존도가 높은 우리나라 문화예술계 환경을 고려할 때, 정부는 문화국가실현에 관한 과제를 수행함에 있어 과거 문화간섭정책에서 벗어나 문화의 다양성, 자율성, 창조성이 조화롭게 실현될 수 있도록 중립성을 지키면서 문화에 대한 지원 및육성을 하도록 유의하여야 한다. 그럼에도 불구하고 피청구인들이 이러한 중립성을 보장하기 위하여 법률에서 정하고 있는 제도적 장치를 무시하고 정치적 견해를 기준으로 청구인들을 문화예술계 정부지원사업에서 배제되도록 차별취급한 것은 헌법상문화국가원리와 법률유보원칙에 반하는 자의적인 것으로 정당화될 수 없다. ... 청구인들의 평등권을 침해한다(헌재 2020. 12. 23. 2017헌마416)."},{"set":2,"num":28,"q":"남북 사이의 화해와 불가침 및 교류협력에 관한 합의서(남북기본합의서)는 남북한 당국이 특수관계인 남북관계에 관하여 채택한 합의문서로서, 국가 간의 조약 또는 이에 준하는 것으로 볼 수 있다.","src":"2015 법원직","a":false,"exp":"1992. 2. 19. 발효된 ‘남북사이의화해와불가침및교류협력에관한합의서’는 일종의 공동성명 또는 신사협정에 준하는 성격을 가짐에 불과하여 법률이 아님은 물론 국내법과 동일한 효력이 있는 조약이나 이에 준하는 것으로 볼 수 없다(헌재 2000. 7. 20. 98헌바63)."},{"set":2,"num":29,"q":"이른바 한미주둔군지위협정(SOFA)은 비록 그 내용이 외국군대의 지위에 관한 것이고 국민에게 재정적 부담을 지우는 입법사항을 포함하고 있다 하더라도, 그 명칭이 협정으로 되어 있어 국회의 동의 없이 체결될 수 있는 행정협정에 해당한다.","src":"2023 변호사시험","a":false,"exp":"조약의 명칭이 ‘협정’으로 되어 있다 하더라도 외국 군대의 지위에 관한 것이고, 국가에게 재정적 부담을 지우는 내용과 입법사항을 포함하고 있으면 국회의 동의를 요하는 조약으로 취급되어야 한다(헌재 1999.4.29. 97헌가14)."},{"set":2,"num":30,"q":"국제법적으로, 조약은 국제법 주체들이 일정한 법률효과를 발생시키기 위하여 체결한 국제법의 규율을 받는 국제적 합의를 말하며 서면에 의한 경우가 대부분이지만 예외적으로 구두합의도 조약의 성격을 가질 수 있다.","src":"2021 지방직 7급","a":true,"exp":"조약의 개념에 관하여 우리 헌법상 명문의 규정은 없다. 국제법적으로, 조약은 국제법 주체들이 일정한 법률효과를 발생시키기 위하여 체결한 국제법의 규율을 받는 국제적 합의를 말하며 서면에 의한 경우가 대부분이지만 예외적으로 구두합의도 조약의 성격을 가질 수 있다(헌재 2019. 12. 27. 2016헌마253)."},{"set":2,"num":31,"q":"자유권규약위원회는 자유권규약의 이행을 위해 만들어진 조약상의 기구이므로, 규약의 당사국은 그 견해를 존중하여야 하며, 우리 입법자는 자유권규약위원회의 견해의 구체적인 내용에 구속되어 그 모든 내용을 그대로 따라야 하는 의무를 부담한다.","src":"2021 지방직 7급","a":false,"exp":"‘시민적 및 정치적 권리에 관한 국제규약’(이하 ‘자유권규약’이라 한다)의 조약상 기구인 자유권규약위원회의 견해는 규약을 해석함에 있어 중요한 참고기준이 되고, 규약 당사국은 그 견해를 존중하여야 한다. 특히 우리나라는 자유권규약을 비준함과 동시에, 자유권규약위원회의 개인통보 접수·심리 권한을 인정하는 내용의 선택의정서에 가입하였으므로, 대한민국 국민이 제기한 개인통보에 대한 자유권규약위원회의 견해(Views)를 존중하고, 그 이행을 위하여 가능한 범위에서 충분한 노력을 기울여야 한 다. 다만, 자유권규약위원회의 심리가 서면으로 비공개로 진행되는 점 등을 고려하면, 개인통보에 대한 자유권규약위원회의 견해(Views)에 사법적인 판결이나 결정과 같은 법적 구속력이 인정된다고 단정하기는 어렵다. 또한, 자유권규약위원회의 견해가 규약 당사국의 국내법 질서와 충돌할 수 있고, 그 이행을 위해서는 각 당사국의 역사적, 사회적, 정치적 상황 등이 충분히 고려될 필요가 있으므로, 우리 입법자가 자유권규약위원회의 견해(Views)의 구체적인 내용에 구속되어 그 모든 내용을 그대로따라야만 하는 의무를 부담한다고 볼 수는 없다(헌재 2018. 7. 26. 2011헌마306)."},{"set":2,"num":32,"q":"우리 헌법에서 명시적으로 입법위임을 하고 있거나 우리 헌법의 해석상 입법의무가 발생하는 경우가 아니더라도, 국제인권규범이 명시적으로 입법을 요구하고 있거나 국제인권규범의 해석상 국가의 기본권보장의무가 인정되는 경우에는 곧바로 국가의 입법의무가 도출된다.","src":"2024 국가직 7급","a":false,"exp":"자유권규약을 포함한 국제인권규범은 국내법체계상에서 법률적 효력을 가질 뿐이므로 우리 헌법에서 명시적으로 입법위임을 하고 있거나 우리 헌법의 해석상 입법의무가 발생하는 경우가 아니라면, 국제인권규범이 명시적으로 입법을 요구하고 있거나 그 해석상 국가의 기본권보장의무가 인정되는 경우라고 하더라도 곧바로 국가의 입법의무가 도출된다고 볼 수 없다(헌재 2024. 1. 25. 2020헌바475)."},{"set":2,"num":33,"q":"마라케쉬협정은 적법하게 체결되어 공포된 조약이므로 국내법과 같은 효력을 갖는 것이어서 마라케쉬협정에 의하여 관세법위반자의 처벌이 가중된다고 하더라도 이를 들어 법률에 의하지 아니한 형사처벌이라거나 행위 시의 법률에 의하지 아니한 형사처벌이라고 할 수 없다.","src":"2015 변호사시험","a":true,"exp":"헌재 1998. 11. 26. 97헌바65"},{"set":2,"num":34,"q":"평화적 통일정책의 수립과 추진을 규정한 조항은 1980년 헌법에서 처음으로 규정되었다.","src":"2015 사법시험","a":false,"exp":"“평화적 통일 정책”은 현행 헌법에서 최초로 규정되었다."},{"set":2,"num":35,"q":"헌법상의 여러 통일관련 조항들은 국가의 통일의무를 선언한 것이므로, 그로부터 국민 개개인의 통일에 대한 기본권, 특 히 국가기관에 대하여 통일과 관련된 구체적인 행위를 요구하거나 일정한 행동을 할 수 있는 권리도 도출된다.","src":"2021 국가직 7급","a":false,"exp":"헌법상의 여러 통일관련 조항들은 국가의 통일의무를 선언한 것이기는 하지만, 그로부터 국민 개개인의 통일에 대한 기본권, 특히 국가기관에 대하여 통일과 관련된 구체적인 행동을 요구하거나 일정한 행동을 할 수 있는 권리가 도출된다고 볼 수 없다(헌재 2000. 7. 20. 98헌바63)."},{"set":2,"num":36,"q":"조선인을 부친으로 하여 출생한 자는 북한법의 규정에 따라 북한국적을 취득하여 중국 주재 북한대사관으로부터북한의 해외공민증을 발급받은 경우라도, 대한민국 국적을 취득하기 위해서는 일정한 요건을 갖추어 국적회복절차를 거쳐야 한다.","src":"2024 지방직 7급","a":false,"exp":"북한지역은 대한민국의 영토에 속하는 한반도의 일부를 이루는 것이어서 대한민국의 주권이 미치는 점에 비추어 볼 때, 북한법의 규정에 따라 북한국적을 취득하고 북한의 해외공민증을 발급받았다는 사정은 대한민국 국적을 취득하고 이를 유지함에있어 아무런 영향을 끼칠 수 없다(대판 1996.11.12. 96누1221)."},{"set":2,"num":37,"q":"헌법이 “대한민국의 영토는 한반도와 그 부속도서로 한다.”는 영토조항을 두고 있는 이상 대한민국의 헌법은 북한지역을 포함한 한반도 전체에 그 효력이 미치고 따라서 북한지역은 당연히 대한민국의 영토가 되므로, 북한을 외국환거래법 소정의 ‘외국’으로, 북한의 주민 또는 법인 등을 ‘비거주자’로 인정하기는 어려우며, 개별 법률의 적용 내지 준용에 있어서도 북한지역을 외국에 준하는 지역으로, 북한주민 등을 외국인에 준하는 지위에 있는 자로 규정할 수 없다.","src":"2009 사법시험","a":false,"exp":"우리 헌법이 “대한민국의 영토는 한반도와 그 부속도서로 한다”는 영토조항(제3조)을 두고 있는 이상 대한민국의 헌법은 북한지역을 포함한 한반도 전체에 그 효력이 미치고 따라서 북한지역은 당연히 대한민국의 영토가 되므로, 북한을 외국환거래법소정의 “외국”으로, 북한의 주민 또는 법인 등을 “비거주자”로 바로 인정하기는 어렵지만, 개별 법률의 적용 내지 준용에 있어서는 남북한의 특수관계적 성격을 고려하여 북한지역을 외국에 준하는 지역으로, 북한주민 등을 외국인에 준하는 지위에 있 는 자로 규정할 수 있다(대법원 2004. 11. 12. 2004도4044)."},{"set":2,"num":38,"q":"국가보안법 제7조 제1항의 ʻʻ국가의 존립·안전이나 자유민주적 기본질서를 위태롭게 한다는 정을 알면서ʼʼ라는 구성요건은, 그 소정의 행위가 국가의 존립·안전이나 자유민주적 기본질서에 해악을 끼칠 명백한 위험성이 있는 경우에만 적용되어야 한다.","src":"2012 변호사시험","a":true,"exp":"헌재 2004.08.26. 2003헌바85"},{"set":3,"num":1,"q":"제도적 보장은 주관적 권리가 아닌 객관적 법규범이라는 점에서 기본권과 구별되기는 하지만 헌법에 의하여 일정한 제도가 보장되면 입법자는 그 제도를 설정하고 유지할 입법의무를 지게 될 뿐만 아니라 헌법에 규정되어 있기 때문에 법률로써 이를 폐지할 수 없고, 비록 내용을 제한하더라도 그 본질적 내용을 침해할 수 없다.","src":"2022 경찰 제2차","a":true,"exp":"헌재 1997. 4. 24. 95헌바48"},{"set":3,"num":2,"q":"1972년 제7차 개헌에서는 정당운영자금의 국고보조조항을 신설하였다.","src":"2023 지방직 7급","a":false,"exp":"정당운영자금의 국고보조조항을 신설한 것은 1980년 제8차 개정헌법이다."},{"set":3,"num":3,"q":"정당의 등록요건으로서 ‘5개 이상의 시·도당과 각 시·도당마다 1천인 이상의 당원’을 요구하는 것은 국민의 정당설립의 자유에 어느 정도 제한을 가하지만, 이러한 제한은 ‘상당한 기간 또는 계속해서’, ‘상당한 지역에서’ 국민의 정치적 의사형성과정에 참여해야 한다는 헌법상 정당의 개념표지를 구현하기 위한 합리적인 제한이다.","src":"2025 법원직","a":true,"exp":"헌재 2006.3.30. 2004헌마246"},{"set":3,"num":4,"q":"헌법 제8조 제1항은 정당설립의 자유, 정당조직의 자유, 정당활동의 자유를 포괄하는 정당의 자유를 보장하는 규정이어서, 이와 같은 정당의 자유는 단체로서 정당이 가지는 기본권이고, 국민이 개인적으로 가지는 기본권이 될 수 는 없다.","src":"2019 변호사시험","a":false,"exp":"헌법 제8조 제1항은 정당설립의 자유, 정당조직의 자유, 정당활동의 자유 등을 포괄하는 정당의 자유를 보장하고 있다. 이러한 정당의 자유는 국민이 개인적으로 갖는 기본권일 뿐만 아니라, 단체로서의 정당이 가지는 기본권이기도 하다. 따라서 개인인 국민으로서 청구인 김웅이 정당의 자유를 가지고 있음은 물론, 청구인 민주노동당도 단체로서 정당의 자유를 가지고 있다(헌재 2004. 12. 16. 2004헌마456)."},{"set":3,"num":5,"q":"외국인이 사립대학의 교원이라도 학교의 장이나 교수 등 교원이 아닌 경우에는 정당의 당원이 될 수 있다.","src":"2025 법원직","a":false,"exp":"대한민국의 국민이 아닌 자는 당원이 될 수 없다(정당법 제22조 제2항)."},{"set":3,"num":6,"q":"대한민국 국민이 아닌 자는 정당의 당원이 될 수 없으며, 누구든지 2이상의 정당의 당원이 되지 못한다.","src":"2023 경찰 제2차","a":true,"exp":"정당법 제22조 제2항, 제42조 제2항"},{"set":3,"num":7,"q":"정당이 그 소속 국회의원을 제명하기 위해서는 당헌이 정하는 절차를 거치는 외에 그 소속 국회의원 전원의 3분의 1 이상의 찬성이 있어야 한다.","src":"2022 국가직 7급","a":false,"exp":"정당이 그 소속 국회의원을 제명하기 위해서는 당헌이 정하는 절차를 거치는 외에 그 소속 국회의원 전원의 2분의 1 이상의 찬성이 있어야 한다(정당법 제33조)."},{"set":3,"num":8,"q":"공무원의 정당가입이 허용된다면, 공무원의 정치적 행위가 직무 내의 것인지 직무 외의 것인지 구분하기 어려운 경우가 많고, 설사 공무원이 근무시간 외에 혹은 직무와 관련 없이 정당과 관련한 정치적 표현행위를 한다 하더라도 공무원의 정치적 중립성에 대한 국민의 기대와 신뢰는 유지되기 어렵다.","src":"2023 법원직","a":true,"exp":"헌재 2014.3.27. 2011헌바43"},{"set":3,"num":9,"q":"｢국가공무원법｣ 조항 중 교육공무원인 초·중등교원은 ‘그 밖의 정치단체’의 결성에 관여하거나 이에 가입할 수 없다고 한 부분은 명확성원칙에 위배된다.","src":"2024 변호사시험","a":true,"exp":"초·중등학교의 교육공무원이 정치단체의 결성에 관여하거나 이에 가입하는 행위를 금지하는 국가공무원법조항 중 ‘그 밖의 정치단체’에 관한 부분은, ‘그 밖의 정치단체’라는 불명확한 개념을 사용하고 있어, 표현의 자유를 규제하는 법률조항, 형벌의 구성요건을 규정하는 법률조항에 대하여 헌법이 요구하는 명확성원칙의 엄격한 기준을 충족하지 못하였다. 위 조항은 ‘그 밖의 정치단체’라는 불명확한 개념을 사용하여, 수범자에 대한 위축효과와 법 집행 공무원의 자의적 판단 위험을 야기하고 있다. 위 조항이 명확성원칙에 위배되어 청구인들의 정치적 표현의 자유, 결사의 자유를 침해하여 헌법에 위반된다(헌재 2020. 4. 23. 2018헌마551)."},{"set":3,"num":10,"q":"사회복무요원이 정당 가입을 할 수 없도록 규정한 병역법 조항은 사회복무요원의 정치적 중립성 보장과 아무런 관련이 없는 사회적 활동까지 금지한다는 점에서 사회복무요원의 결사의 자유를 침해한다.","src":"2023 법원직","a":false,"exp":"사회복무요원이 정당 가입을 할 수 없도록 규정한 것은 정치적 표현의 자유 및 결사의 자유를 침해하지 않는다(헌재 2021. 11. 25. 2019헌마534)."},{"set":3,"num":11,"q":"정당법 조항에 의한 합당의 경우에 합당으로 인한 권리의무의 승계조항은 강행규정으로서 합당 전 정당들의 해당 기관의 결의나 합동회의의 결의로써 달리 정하였더라도 그 결의는 효력이 없다.","src":"2012 법원행시","a":true,"exp":"대법원 2002.2.8. 2001다68969"},{"set":3,"num":12,"q":"임기만료에 의한 국회의원선거에 참여하여 의석을 얻지 못하고 유효투표총수의 100분의 2 이상을 득표하지 못한 때 정당의 등록을 취소하도록 한 구 정당법 해당 규정은 과잉금지원칙에 위반되어 정당설립의 자유를 침해하는 것이다.","src":"2025 법원직","a":true,"exp":"정당등록취소조항은 어느 정당이 대통령선거나 지방자치선거에서 아무리 좋은 성과를 올리더라도 국회의원선거에서 일정 수준의 지지를 얻는 데 실패하면 등록이 취소될 수밖에 없어 불합리하고, 신생·군소정당으로 하여금 국회의원선거에의 참여 자체를 포기하게 할우려도 있어 법익의 균형성 요건도 갖추지 못하였다. 따라서 정당등록취소조항은 과잉금지원칙에 위반되어 청구인들의 정당설립의 자유를 침해한다(헌재 2014. 1. 28. 2012헌가19)."},{"set":3,"num":13,"q":"모든 정당의 존립과 활동이 최대한 보장되어야 하는 것은 아니므로, 어떤 정당이 민주적 기본질서를 부정하고 이 를 적극적으로 공격하는 경우에는 행정부의 통상적인 처분에 의해서도 해산될 수 있다.","src":"2021 지방직 7급","a":false,"exp":"모든 정당의 존립과 활동은 최대한 보장되며, 설령 어떤 정당이 민주적 기본질서를 부정하고 이를 적극적으로 공격하는 것으로 보인다 하더라도 국민의 정치적 의사형성에 참여하는 정당으로서 존재하는 한 우리 헌법에 의해 최대한 두텁게 보호되므로, 단순히 행정부의 통상적인 처분에 의해서는 해산될 수 없고, 오직 헌법재판소가 그 정당의 위헌성을 확인하고 해산의 필요성을 인정한 경우에만정당정치의 영역에서 배제된다(헌재 2014. 12. 19. 2013헌다1)."},{"set":3,"num":14,"q":"헌법재판소는 정당해산심판의 청구를 받은 때에는 직권 또는 청구인의 신청에 의하여 종국결정의 선고 시까지 피청구인의 활동을 정지하는 결정을 할 수 있다.","src":"2025 법원직","a":true,"exp":"헌법재판소법 제57조"},{"set":3,"num":15,"q":"헌법재판소는 정당해산심판의 청구를 받은 때에는 청구인의 신청에 의해서만 종국결정의 선고 시까지 피청구인의 활동을 정지하는 결정을 할 수 있다.","src":"2020 국가직 7급","a":false,"exp":"헌법재판소는 정당해산심판의 청구를 받은 때에는 직권 또는 청구인의 신청에 의하여 종국결정의 선고 시까지 피청구인의 활동을 정지하는 결정을 할 수 있다(헌법재판소법 제57조)."},{"set":3,"num":16,"q":"정당의 활동이란 정당 기관의 행위나 주요 정당관계자, 당원 등의 행위로서 그 정당에게 귀속시킬 수 있는 활동 일반을 의미하는데, 정당 소속의 국회의원 등은 비록 정당과 밀접한 관련성을 가지지만 헌법상으로는 정당의 대표자가 아닌 국민 전체의 대표자이므로 그들의 행위를 곧바로 정당의 활동으로 귀속시킬 수는 없다.","src":"2022 국가직 7급","a":true,"exp":"정당의 활동이란, 정당 기관의 행위나 주요 정당관계자, 당원 등의 행위로서 그 정당에게 귀속시킬 수 있는 활동 일반을 의미한다. 여기에서는 정당에게 귀속시킬 수 있는 활동의 범위, 즉 정당과 관련한 활동 중 어느 범위까지를 그 정당의 활동으로 볼 수 있는지 가 문제된다. 구체적으로 살펴보면, 당대표의 활동, 대의기구인 당대회와 중앙위원회의 활동, 집행기구인 최고위원회의 활동, 원내기구인 원내의원총회와 원내대표의 활동 등 정당 기관의 활동은 정당 자신의 활동이므로 원칙적으로 정당의 활동으로 볼 수 있고, 정당의 최고위원 등 주요 당직자의 공개된 정치 활동은 일반적으로 그 지위에 기하여 한 것으로 볼 수 있으므로 원칙적으로 정당에 귀속시킬 수 있을 것으로 보인다. 정당 소속의 국회의원 등은 비록 정당과 밀접한 관련성을 가지지만 헌법상으로는 정당의 대표자가 아닌 국민 전체의 대표자이므로 그들의 행위를 곧바로 정당의 활동으로 귀속시킬 수는 없겠으나, 가령 그들의 활동 중에서도 국민의 대표자의 지위가 아니라 그 정당에 속한 유력한 정치인의 지위에서 행한 활동으로서 정당과 밀접하게 관련되어 있는 행위들은 정당의 활동이 될 수도 있을 것이다(헌재 2014. 12. 19. 2013헌다1)."},{"set":3,"num":17,"q":"비례원칙 준수 여부는 법률이나 기타 공권력 행사의 위헌 여부를 판단할 때 사용하는 위헌심사의 척도에 해당하므로, 헌법재판소가 정당해산결정을 내리기 위해서는 그 해산결정이 비례원칙에 부합하는지를 판단할 필요가 없다.","src":"2021 변호사시험","a":false,"exp":"일반적으로 비례원칙은 우리 재판소가 법률이나 기타 공권력 행사의 위헌 여부를 판단할 때 사용하는 위헌심사 척도의 하나이다. 그러나 정당해산심판제도에서는 헌법재판소의 정당해산결정이 정당의 자유를 침해할 수 있는 국가권력에 해당하므로 헌법재판소가 정당해산결정을 내리기 위해서는 그 해산결정이 비례원칙에 부합하는지를 숙고해야 하는바, 이 경우의 비례원칙 준수 여부는 그것이 통상적으로 기능하는 위헌심사의 척도가 아니라 헌법재판소의 정당해산결정이 충족해야 할 일종의 헌법적 요건 혹은 헌법적 정당화 사유에 해당한다. 이와 같이 강제 적 정당해산은 우리 헌법상 핵심적인 정치적 기본권인 정당 활동의 자유에 대한 근본적 제한이므로 헌법재판소는 이에 관한 결정을 할 때 헌법 제37조 제2항이 규정하고 있는 비례원칙을 준수해야만 하는 것이다. 따라서 헌법 제37조 제2항의 내용, 침익적 국가권력의 행사에 수반되는 법치국가적 한계, 나아가 정당해산심판제도의 최후수단적 성격이나 보충적 성격을 감안한다면, 헌법 제8조 제4항의 명문규정상 요건 이 구비된 경우에도 해당 정당의 위헌적 문제성을 해결할 수 있는 다른 대안적 수단이 없고, 정당해산결정을 통하여 얻을 수 있는 사회적 이익이 정당해산결정으로 인해 초래되는 정당의 정당활동 자유 제한으로 인한 불이익과 민주주의 사회에 대한 중대한 제약이라는 사회적 불이익을 초과할 수 있을 정도로 큰 경우에 한하여 정당해산결정이 헌법적으로 정당화될 수 있다(헌재 2014. 12. 19. 2013헌다1)."},{"set":3,"num":18,"q":"헌법재판소의 해산결정으로 정당이 해산되는 경우에 그 정당 소속 국회의원은 지역구에서 당선되었는지, 비례대표 로 당선되었는지와 상관없이 모두 그 의원직이 상실되어야 한다는 것이 헌법재판소의 결정이다.","src":"2015 법원행시","a":true,"exp":"헌재 2014.12.19. 2013헌다1"},{"set":3,"num":19,"q":"위헌정당해산제도의 실효성을 확보하기 위하여 헌법재판소의 위헌정당 해산결정에 따라 해산된 정당 소속 비례대표 지방의회의원은 해산결정 시 의원의 지위를 상실한다.","src":"2023 국가직 7급","a":false,"exp":"헌법재판소의 정당해산결정에 따라 해산된 정당 소속 비례대표 지방의회의원은 비례대표 지방의회의원의 지위를 상실하지 않는다(대법원 2021. 4. 29. 2016두39825)."},{"set":3,"num":20,"q":"헌법재판소의 위헌정당 해산결정으로 해산된 정당 소속의 국회의원의 의원직은 당선방식을 불문하고 모두 상실되어야 하나, 위헌정당 소속 비례대표지방의회의원은 의원직을 유지한다.","src":"2024 지방직 7급","a":true,"exp":"대법원 2021. 4. 29. 2016두39825"},{"set":3,"num":21,"q":"정당제 민주주의 하에서 정당에 대한 재정적 후원이 전면적으로 금지되더라도 정당이 스스로 재정을 충당하고자 하는 정당활동의 자유와 국민의 정치적 표현의 자유에 대한 제한이 크지 아니하므로, 이를 규정한 법률조항은 정당의 정당활동의 자유와 국민의 정치적 표현의 자유를 침해하지 않는다.","src":"2019 지방직 7급","a":false,"exp":"정당에 대한 재정적 후원이 전면적으로 금지됨으로써 정당이 스스로 재정을 충당하고자 하는 정당활동의 자유와 국민의 정치적 표현의 자유에 대한 제한이 매우 크다고 할 것이므로, 이 사건 법률조항은 정당의 정당활동의 자유와 국민의 정치적 표현의 자유를 침해한다. (헌재 2015. 12. 23. 2013헌바168)"},{"set":3,"num":22,"q":"특별시장·광역시장·특별자치시장·도지사·특별자치도지사 선거의 예비후보자를 후원회지정권자에서 제외하고 있는 ｢정치자금법｣ 조항은 이들 예비후보자의 평등권을 침해한다.","src":"2024 지방직 7급","a":true,"exp":"헌재 2019. 12. 27. 2018헌마301"},{"set":3,"num":23,"q":"국회의원을 후원회지정권자로 정하면서 지방의회의원을 후원회지정권자에서 제외하는 구 정치자금법 해당 조항은, 지방의회의원에게 소요되는 정치자금이 국회의원에 비해 적고 후원회의 설치 및 운영을 허용할 필요도 크지 않으므로, 평등권을 침해한다고 보기 어렵다.","src":"2024 법원직","a":false,"exp":"지방의회는 유능한 신인정치인의 유입 통로가 되므로, 지방의회의원에게 후원회를 지정할 수 없도록 하는 것은 경제력을 갖추지 못 한 사람의 정치입문을 저해할 수도 있다. 따라서 이러한 사정들을 종합하여 보면, 심판대상조항이 국회의원과 달리 지방의회의원을 후원회지정권자에서 제외하고 있는 것은 불합리한 차별로서 청구인들의 평등권을 침해한다(헌재 2022. 11. 24. 2019헌마528)."},{"set":4,"num":1,"q":"현행 헌법은 대통령선거에 관하여 국민의 보통·평등·직접·비밀선거의 원칙을 규정하고 있고, 국회의원선거에 관하여는 위 원칙들에 관한 규정이 없으나, 헌법해석상 당연히 적용되는 것으로 보아야 한다.","src":"2020 법원직","a":false,"exp":"대통령선거뿐만 아니라 국회의원선거에 관하여도 보통·평등·직접·비밀선거의 원칙을 규정하고 있다(헌법 제41조, 제67조)."},{"set":4,"num":2,"q":"보통선거라 함은 개인의 납세액이나 소유하는 재산을 선거권의 요건으로 하는 제한선거에 대응하는 것으로 이러한요건뿐만 아니라 그 밖에 사회적 신분 인종･성별･종교･교육 등을 요건으로 하지 않고 일정한 연령에 달한 모든 국민에게 선거권을 인정하는 제도를 말한다.","src":"2013 법원행시","a":true,"exp":"헌재 2001.6.28. 2000헌마111"},{"set":4,"num":3,"q":"대통령 및 국회의원의 선거권 연령은 헌법에 18세 이상으로 명문화되어 있다.","src":"2024 경정승진","a":false,"exp":"선거권 연령은 헌법에 명문화되어 있지 않고, 법률(공직선거법)에 18세 이상으로 규정되어 있다."},{"set":4,"num":4,"q":"보통선거의 원칙이란 성별, 종교, 재산, 사회적 신분에 관계없이 일정한 연령에 달한 모든 국민에게 선거권이 부여되는 것을 말한다. 공직선거법에 따르면, 18세 이상의 국민은 대통령 및 국회의원의 선거권이 있다.","src":"2026 법원직","a":true,"exp":"헌재 2001.6.28. 2000헌마111, 공직선거법 제15조"},{"set":4,"num":5,"q":"외국인은 대통령선거 및 국회의원선거에서는 선거권이 없으나, 지방선거권이 조례에 의해서 인정되고 있다.","src":"2020 법원직","a":false,"exp":"외국인은 대통령선거 및 국회의원선거에서는 선거권이 없으나, 일정한 요건을 갖추면 지방선거권이 인정된다. 다만 조례에 의해서 인정되는 것이 아니라 공직선거법에 따라 인정된다."},{"set":4,"num":6,"q":"집행유예기간 중에 있는 자에 대해 공직선거법상의 선거권을 부인한 것은 과잉금지의 원칙에 위배되나, 형의 집행이 종료되지 않은 수형자에 대한 선거권을 부인하는 것은 형벌집행의 실효성 확보차원에서 헌법에 위배되지 않는다.","src":"2013 사법시험","a":false,"exp":"심판대상조항은 집행유예자와 수형자에 대하여 전면적·획일적으로 선거권을 제한하고 있다. 심판대상조항의 입법목적에 비추어 보더라도, 구체적인 범죄의 종류나 내용 및 불법성의 정도 등과 관계없이 일률적으로 선거권을 제한하여야 할 필요성이 있다고 보기는 어렵다. 범죄자가 저지른 범죄의 경중을 전혀 고려하지 않고 수형자와 집행유예자 모두의 선거권을 제한하는 것은 침해의 최소성원칙에 어긋난다. 특히 집행유예자는 집행유예 선고가 실효되거나 취소되지 않는 한 교정시설에 구금되지 않고 일반 인과 동일한 사회생활을 하고 있으므로, 그들의 선거권을 제한해야 할 필요성이 크지 않다. 따라서 심판대상조항은 청구인들의 선거권을 침해하고, 보통선거원칙에 위반하여 집행유예자와 수형자를 차별취급하는 것이므로 평등원칙에도 어긋난다(헌재 2014. 1. 28. 2012헌마409)."},{"set":4,"num":7,"q":"10개월의 징역형을 선고받고 그 집행이 종료되지 아니한 사람은 선거권이 없다.","src":"2022 지방직 7급","a":false,"exp":"1년 이상의 징역 또는 금고의 형의 선고를 받고 그 집행이 종료되지 아니하거나 그 집행을 받지 아니하기로 확정되지 아니한 사람은 선거권이 없다. 다만, 그 형의 집행유예를 선고받고 유예기간 중에 있는 사람은 제외한다(공직선거법 제18조 제1항 제2호). 따라서 10개월의 징역형을 선고를 받고 그 집행이 종료되지 아니한 사람은 선거권이 있다."},{"set":4,"num":8,"q":"구 공직선거법 중 1년 이상의 징역의 형의 선고를 받고 그 집행이 종료되지 아니한 사람의 선거권을 제한하는 조항은 형사적ㆍ사회적 제재를 부과하고 준법의식을 강화한다는 공익이 형 집행 기간 선거권을 행사하지 못하는 수형자 개인의 불이익보다 작다고 할 수 없으므로 선거권을 침해한다고 볼 수 없다.","src":"2026 법원직","a":true,"exp":"헌재 2017. 5. 25. 2016헌마292"},{"set":4,"num":9,"q":"부재자투표시간을 오전 10시부터 오후 4시까지로 정하고 있는 ｢공직선거법｣ 제155조제2항 본문 중 “오전 10시에열고” 부분은 투표관리의 효율성을 도모하고 행정부담을 줄이며, 부재자투표의 인계ㆍ발송절차의 지연위험 등을경감하기 위한 것이므로 청구인의 선거권이나 평등권을 침해하지 않는다.","src":"2023 지방직 7급","a":false,"exp":"이 사건 투표시간조항이 투표종료시간을 오후 4시까지로 정한 것은 투표당일 부재자투표의 인계·발송 절차를 밟을 수 있도록 함으로써 부재자투표의 인계·발송절차가 지연되는 것을 막고 ... 청구인의 선거권이나 평등권을 침해하지 않는다. ... 이 사건 투표시간조항이 투표개시시간을 일과시간 이내인 오전 10시부터로 정한 것은 ... 일과시간에 학업이나 직장업무를 하여야 하는부재자투표자는 일과시간 이전에 투표소에 가서 투표할 수 없게 되어 사실상 선거권을 행사할 수 없게 되는 중대한 제한을 받는다. 따라서 이 사건 투표시간조항 중 투표개시시간 부분은 수단의 적정성, 법익균형성을 갖추지 못하므로 과잉금지원칙에 위배하여 청구인의 선거권과 평등권을 침해하는 것이다(헌재 2012. 2. 23. 2010헌마601)."},{"set":4,"num":10,"q":"단지 주민등록이 되어 있는지 여부에 따라 선거인명부에 오를 자격을 결정하여 그에 따라 선거권 행사 여부가 결정되도록 함으로써 엄연히 대한민국의 국민임에도 불구하고 주민등록법상 주민등록을 할 수 없는 재외국민의 선거권 행사를 전면적으로 부정하고 있는 구 공직선거법 해당 규정은 재외국민의 선거권을 침해하고 보통선거원칙에도 위배된다.","src":"2025 법원직","a":true,"exp":"헌재 2007.6.28. 2004헌마644"},{"set":4,"num":11,"q":"재외투표기간 개시일에 임박하여 또는 재외투표기간 중에 재외선거사무 중지결정이 있었고 그에 대한 재개결정이 없었던 예외적인 상황에서 재외투표기간 개시일 이후에 귀국한 재외선거인 및 국외부재자신고인이 국내에서 선거일에 투표할 수 있도록 하는 절차를 마련하지 아니한 것이, 재외투표기간 개시일 이후에 귀국한 재외선거인 등의 선거권을 침해하는 것은 아니다.","src":"2025 경찰경위공채","a":false,"exp":"재외투표기간 개시일에 임박하여 또는 재외투표기간 중에 재외선거사무 중지결정이 있었고 그에 대한 재개결정이 없었던 예외적인 상황에서 재외투표기간 개시일 이후에 귀국한 재외선거인 및 국외부재자신고인이 국내에서 선거일에 투표할 수 있도록 하는 절차를 마련하지 아니한 것은 선거권을 침해한다."},{"set":4,"num":12,"q":"평등선거의 원칙은 평등의 원칙이 선거제도에 적용된 것으로서 투표의 수적 평등, 즉 1인 1표의 원칙(oneperson, one vote)과 투표의 성과가치의 평등, 즉 1표의 투표가치가 대표자선정이라는 선거의 결과에 대하여 기여한 정도에 있어서도 평등하여야 한다는 원칙(one vote, one value)을 그 내용으로 할 뿐, 일정한 집단의 의사가 정치과정에서 반영될 수 없도록 차별적으로 선거구를 획정하는 이른바 ‘게리맨더링’에 대한 부정까지는 의미 하지 않는다.","src":"2026 법원직","a":false,"exp":"평등선거의 원칙은 평등의 원칙이 선거제도에 적용된 것으로서 투표의 수적 평등, 즉 복수투표제 등을 부인하고 모든 선거인에게 1인 1표를 인정함을 의미할 뿐만 아니라, ② 투표의 성과가치의 평등, 즉 1표의 투표가치가 대표자 선정이라는 선거의 결과에 대하여 기여한 정도에 있어서도 평등하여야 함을 의미한다. ③ 또한 일정한 집단의 의사가 정치과정에서 반영될 수 없도록 차별적으로 선거구를 획정하는 이른바 ‘게리맨더링’에 대한 부정을 의미하기도 한다(헌재 1998. 11. 26. 96헌마54)."},{"set":4,"num":13,"q":"선거구 획정에 있어서 인구비례의 원칙에 의한 투표가치의 평등은 헌법적 요청으로서 다른 요소에 비해 기본적이고 일차적인 기준이어야 하므로, 자치구·시·군의원 선거구 획정에 있어서 행정구역 내지 지역대표성 등 2차적요소를 고려해서는 아니 된다.","src":"2025 경위공채","a":false,"exp":"헌법이 요구하는 투표가치의 평등은 선거제도의 결정에 있어서 유일, 절대의 기준이라고는 할 수 없으며, 국회는 구체적인 선거제도를 정함에 있어서 합리적인 다른 정책적 목표도 고려할 수 있는 것이지만, 적어도 선거구의 획정에 있어서는 인구비례의 원칙을 가장 중요하고 기본적인 기준으로 삼아야 한다(헌재 1995. 12. 27. 95헌마224)."},{"set":4,"num":14,"q":"국회의원 지역선거구에 있어, 전국 선거구의 최대인구수와 최소인구수의 비율이 3:1 이하로 유지되면 평등선거의 원칙에 위배되지 않는다.","src":"2015 법원직","a":false,"exp":"현재의 시점에서 헌법이 허용하는 인구편차의 기준을 인구편차 상하33⅓%, 인구비례 2:1을 넘어서지 않는 것으로 변경하는것이 타당하다(헌재 2014. 10. 30. 2012헌마192)."},{"set":4,"num":15,"q":"비례대표선거제의 도입으로 선거권자에 의하여 직접 결정되어야 할 선거결과가 의원의 선출뿐만 아니라 정당의 의석확보도 포함하게 됨으로써 직접선거의 원칙이 내용상 변화를 겪게 되었다.","src":"2005 사법시험","a":true,"exp":"비례대표제를 채택하는 경우 직접선거의 원칙은 의원의 선출뿐만 아니라 정당의 비례적인 의석확보도 선거권자의 투표에 의하여 직접 결정될 것을 요구한다(헌재 2001.7.19. 2000헌마91등)."},{"set":4,"num":16,"q":"선거에서 중립성이 요구되는 공무원은 원칙적으로 좁은 의미의 직업공무원은 물론이고, 적극적인 정치활동을 통하여 국가에 봉사하는 정치적 공무원을 포함하지만, 국회의원과 지방의회의원은 위 공무원의 범위에 포함되지 않는다.","src":"2013 사법시험","a":true,"exp":"헌재 2004.5.14. 2004헌나1"},{"set":4,"num":17,"q":"선거운동의 자유는 선거의 공정성이라는 또 다른 가치를 위하여 무제한 허용될 수는 없는 것이고, 선거운동이 허용되거나 금지되는 사람의 인적 범위는 입법자가 재량의 범위 내에서 직무의 성질과 내용 등 제반 사정을 종합적으로 검토하여 정할 사항이므로 제한입법의 위헌여부에 대하여는 다소 완화된 심사기준이 적용되어야 한다.","src":"2023 국가직 7급","a":false,"exp":"선거운동은 국민주권 행사의 일환일 뿐 아니라 정치적 표현의 자유의 한 형태로서 민주사회를 구성하고 움직이게 하는 요소이므로 그 제한입법의 위헌여부에 대하여는 엄격한 심사기준이 적용되어야 할 것이다(헌재 2018. 2. 22. 2015헌바124)."},{"set":4,"num":18,"q":"정치적 표현의 자유의 헌법상 지위와 성격, 선거의 공정성과의 관계 등에 비추어 볼 때, 선거운동 등에 대한 제한이 정치적 표현의 자유를 침해하는지 여부를 판단함에 있어서는 표현의 자유의 규제에 관한 판단기준으로서 엄격한 심사기준을 적용하여야 한다.","src":"2026 법원직","a":true,"exp":"헌재 2024. 6. 27. 2023헌바78"},{"set":4,"num":19,"q":"공무원이 선거운동의 기획에 참여하거나 그 기획의 실시에 관여하는 행위를 금지하는 규정을 공무원이 그 지위를 이 용하지 아니한 행위에까지 적용하는 것은 공무원 개인의 정치적 표현의 자유를 침해하는 것으로 위헌이다.","src":"2014 법원행시","a":true,"exp":"헌재 2008.5.29. 2006헌마1096"},{"set":4,"num":20,"q":"서울교통공사의 상근직원은 서울교통공사의 경영에 관여하거나 실질적인 영향력을 미칠 수 있는 권한이 있다고 인정하기 어려우므로, 당원이 아닌 자에게도 투표권을 부여하여 실시하는 당내경선에서 서울교통공사의 상근직원이 경선운동을 할 수 없도록 일률적으로 금지ㆍ처벌하는 것은 정치적 표현의 자유를 과도하게 제한하는 것이다.","src":"2023 법원직","a":true,"exp":"심판대상조항은 당내경선의 형평성과 공정성을 확보하기 위한 것으로 목적의 정당성과 수단의 적합성이 인정된다. 그러나 서울교통공사의 상근직원은 서울교통공사의 경영에 관여하거나 실질적인 영향력을 미칠 수 있는 권한을 가지고 있지 아니하므로, 경선운동을 한다고 하여 그로 인한 부작용과 폐해가 크다고 보기 어렵다. 또한 공직선거법은 이미 서울교통공사의 상근직원이 당내경선에 직ㆍ간접적으로 영향력을 행사하는 행위들을 금지ㆍ처벌하는 규정들을 마련하고 있다. 서울교통공사의 상근직원이 그 지위를 이용하여 경선운동을 하는 행위를 금지ㆍ처벌하는 규정을 두는 것은 별론으로 하고, 경선운동을 일률적으로 금지ㆍ처벌하는 것은 정치적 표현의 자유를 과도하게 제한하는 것이다. 정치적 표현의 자유의 중대한 제한에 비하여, 서울교통공사의 상근직원이 당내경선에서 공무원에 준하는 영향력이 있다고 볼 수 없는 점 등을 고려하면 심판대상조항이 당내경선의 형평성과 공정성의 확보라는 공익에 기여하는 바가 크다고 보기 어렵다. 따라서 심판대상조항은 과잉금지원칙에 반하여 정치적 표현의 자유를 침해한다(헌재 2022. 6. 30. 2021헌가24)."},{"set":4,"num":21,"q":"선거일전 180일부터 선거일까지 인터넷상 선거와 관련한 정치적 표현 및 선거운동을 금지하고 처벌하는 것은 후보자 간 경제력 차이에 따른 불균형 및 흑색선전을 통한 부당한 경쟁을 막고, 선거의 평온과 공정을 해하는 결과를 방지한다는 입법목적 달성을 위하여 적합한 수단이라고 할 수 없다.","src":"2022 국가직 5급","a":true,"exp":"헌재 2011.12.29. 2007헌마1001"},{"set":4,"num":22,"q":"선거운동기간 전에 개별적으로 대면하여 말로 하는 선거운동을 금지하고 처벌하는 공직선거법 해당 조항은, 탈법적인 선거운동 규제를 통한 선거의 공정성을 달성하고 부당한 과열경쟁으로 인한 사회․경제적 손실을 방지할 수 있으므로, 정치적 표현의 자유를 침해하지 않는다.","src":"2024 법원직","a":false,"exp":"선거운동기간 전에 개별적으로 대면하여 말로 하는 선거운동을 금지하고, 이를 처벌하는 것은 돈이 들지 않는 방법으로서 ‘후보자 간 경제력 차이에 따른 불균형 문제’나 ‘사회ㆍ경제적 손실을 초래할 위험성’이 낮은, 개별적으로 대면하여 말로 지지를호소하는 선거운동까지 금지하고 처벌함으로써, 과잉금지원칙에 반하여 선거운동 등 정치적 표현의 자유를 과도하게 제한하고 있다(헌재 2022. 2. 24. 2018헌바146)."},{"set":4,"num":23,"q":"누구든지 선거기간 중 선거에 영향을 미치게 하기 위하여 그 밖의 집회나 모임을 개최할 수 없고, 이를 위반한 자 를 처벌하도록 규정한 공직선거법 조항은 선거기간 중에도 국민들이 제기하는 건전한 비판과 여론 형성을 금지하는 것은 아니므로 집회의 자유를 침해한다고 할 수 없다.","src":"2023 법원직","a":false,"exp":"집회의 금지는 원칙적으로 공공의 안녕질서에 대한 직접적인 위협이 명백하게 존재하는 경우에 한하여 허용될 수 있다. 그럼에도 불구하고 집회개최 금지조항은 선거의 공정과 평온에 대한 위험 상황이 구체적으로 존재하지 않는 경우까지도 예외 없 이 선거에 영향을 미치게 하기 위한 선거기간 중의 집회나 모임을 금지하고 있는바, 이는 입법목적의 달성에 필요한 범위를 넘는 과도한 제한이다. ... 따라서 선거기간 중 선거에 영향을 미치게 하기 위하여 ‘그 밖의 집회나 모임’을 개최할 수 없다고 규정한 것은 과잉금지원칙에 반하여 집회의 자유, 정치적 표현의 자유를 침해한다(헌재 2022. 7. 21. 2018헌바357)."},{"set":4,"num":24,"q":"인터넷언론사에 대하여 선거일 전 90일부터 선거일까지 후보자 명의의 칼럼이나 저술을 게재하는 보도를 제한하는 ‘인터넷선거보도 심의기준 등에 관한 규정’ 조항은 후보자 명의로 칼럼을 게재하는 자의 표현의 자유를 침해한다.","src":"2021 법원직","a":true,"exp":"인터넷언론은 높은 접근성·개방성·자율성·자발성 등의 특성을 지니며 정보기술의 발달과 관련 서비스 등의 확산과 결합하여 언론시장에서 영향력을 확대해 나가고 있다. 인터넷언론에 대하여는 자율성을 최대한 보장하고 언론의 자유에 대한 제한을 최소화하는 것이 바람직하고, 계속 변화하는 이 분야에서 규제 수단 또한 헌법의 틀 안에서 다채롭고 새롭게 강구되어야 한다. 공직선거의 후보자 또는 후보자가 되려고 하는 사람이 선거에 임박한 기간 동안 인터넷언론사에 자신의 명의로 칼럼 등을 게재하여 선거운동에 탈법적으로 이용하려는 것을 방지함으로써 선거의 공정성을 확보할 필요성은 인정된다. 그러나 이 사건 조항은 선거의 공정성을 해치지 않는 보도까지 광범위하게 제한하고 있다. 결국 과잉금지원칙에 반하여 청구인의 표현의 자유를 침해한다(헌재 2019. 11. 28. 2016헌마90)."},{"set":4,"num":25,"q":"당선되거나 되게 하거나 되지 못하게 할 목적으로 공연히 사실을 적시하여 후보자가 되고자 하는 자를 비방한 자 를 처벌하는 구 공직선거법 조항(이하 ‘비방금지 조항’이라 한다)은 죄형법정주의의 명확성원칙에 위반되지 아니한다.","src":"2026 법원직","a":true,"exp":"당선되거나 되게 하거나 되지 못하게 할 목적으로 공연히 사실을 적시하여 후보자가 되고자 하는 자를 비방한 자를 처벌하는 공직선거법 조항은 죄형법정주의의 명확성원칙에 위배되지 않는다. 그러나 과잉금지원칙에 위배되어 정치적 표현의 자유를 침해한다(헌재 2024. 6. 27. 2023헌바78)."},{"set":4,"num":26,"q":"당선되지 못하게 할 목적으로 후보자가 되고자 하는 자에 관하여 허위의 사실을 공표한 자를 처벌하는 구 공직선거법 조항은 과잉금지원칙에 반하여 정치적 표현의 자유를 침해하나 당선되거나 되게 하거나 되지 못하게 할 목적으로 공연히 사실을 적시하여 후보자가 되고자 하는 자를 비방한 자를 처벌하는 구 공직선거법 조항은 과잉금지원칙에 반하여 정치적 표현의 자유를 침해하지 아니한다.","src":"2026 법원직","a":false,"exp":"‘당선되지 못하게 할 목적으로 후보자가 되고자 하는 자에 관하여 허위의 사실을 공표한 자를 처벌하는 공직선거법 조항’은 죄형법정주의의 명확성원칙에 위배되지 않고, 과잉금지원칙에 위배되지 않으므로 정치적 표현의 자유를 침해하지 않는다. 그러나 ‘당선되거나 되게 하거나 되지 못하게 할 목적으로 공연히 사실을 적시하여 후보자가 되고자 하는 자를 비방한 자를 처벌하는 공직선거법 조항’은 죄형법정주의의 명확성원칙에 위배되지 않지만 과잉금지원칙에 위배되어 정치적 표현의 자유를 침해한다(헌재 2024. 6. 27. 2023헌바78)"},{"set":4,"num":27,"q":"구 공직선거법 중 비례대표국회의원선거에서 전국 유효투표총수의 100분의 3 이상을 득표한 정당에게만 비례대표국회의원의석을 배분하도록 한 조항은 우리 정치상황 등을 고려할 때 평등선거원칙에 위배하여 선거권, 피선거권, 평등권을 침해한다.","src":"2026 법원직","a":true,"exp":"우리나라의 정치상황이나 정부형태, 정당 및 선거 제도 등을 고려하면, 심판대상조항은 합리적 이유 없이 투표가치를 왜곡하고 선거의 대표성을 훼손하는 것으로서 평등선거원칙에 위배하여 선거권, 피선거권, 평등권을 침해한다(헌재 2026. 1. 29. 2020헌마956)."},{"set":4,"num":28,"q":"대통령 선거에 있어서 최고득표자가 2인 이상인 때에는 국회의 공개회의에서 재적의원 과반수의 출석과 출석의원 과반수의 찬성을 얻은 자를 당선자로 한다.","src":"2021 국가직 7급","a":false,"exp":"대통령 선거에 있어서 최고득표자가 2인 이상인 때에는 국회의 재적의원 과반수가 출석한 공개회의에서 다수표를 얻은 자를 당선자로 한다(헌법 제67조 제2항). 즉 출석의원 과반수의 찬성을 얻은 자가 아니라, 다수표를 얻은 자이다."},{"set":4,"num":29,"q":"대통령 후보자가 1인일 때에는 그 득표수가 선거권자 총수의 과반수가 아니면 대통령으로 당선될 수 없다.","src":"2023 국가직 7급","a":false,"exp":"대통령후보자가 1인일 때에는 그 득표수가 선거권자 총수의 3분의 1 이상이 아니면 대통령으로 당선될 수 없다(헌법 제67조 제3항)."},{"set":4,"num":30,"q":"전임자의 임기가 만료된 후에 실시하는 선거와 궐위로 인한 선거에 의한 대통령의 임기는 선거일의 다음날 0시부터 개시된다.","src":"2023 국가직 7급","a":false,"exp":"대통령의 임기는 전임대통령의 임기만료일의 다음날 0시부터 개시된다. 다만, 전임자의 임기가 만료된 후에 실시하는 선거와 궐위로 인한 선거에 의한 대통령의 임기는 당선이 결정된 때부터 개시된다(공직선거법 제14조 제1항)."},{"set":4,"num":31,"q":"대통령선거에 있어서 중앙선거관리위원회는 천재·지변 기타 부득이한 사유로 인하여 개표를 모두 마치지 못하였다 하더라도 개표를 마치지 못한 지역의 투표가 선거의 결과에 영향을 미칠 염려가 없다고 인정되는 때에는 우선당선인을 결정할 수 있다.","src":"2014 사법시험","a":true,"exp":"공직선거법 제187조 제4항"},{"set":4,"num":32,"q":"국회의원선거에 있어서 선거의 효력에 관하여 이의가 있는 선거인·정당 또는 후보자는 선거일부터 30일 이내에 당해 선거구선거관리위원회위원장을 피고로 하여 관할 고등법원에 소를 제기할 수 있다.","src":"2015 변호사시험","a":false,"exp":"대통령선거 및 국회의원선거에 있어서 선거의 효력에 관하여 이의가 있는 선거인·정당(후보자를 추천한 정당에 한한다) 또는 후보자는 선거일부터 30일 이내에 당해 선거구선거관리위원회위원장을 피고로 하여 대법원에 소를 제기할 수 있다(공직선거법제222조 제1항)."},{"set":4,"num":33,"q":"최초의 지방의회가 구성된 것은 제1공화국 기간이었던 1950년이었고, 지방의회를 조국통일이 이루어질 때까지 구성하지 아니한다는 것을 헌법 부칙에 규정한 것은 1980년 제8차 개정 헌법에서였다.","src":"2025 법원직","a":false,"exp":"최초의 지방의회가 구성된 것은 제1공화국 기간이었던 1952년이었고, 지방의회를 조국통일이 이루어질 때까지 구성하지 아니한다는 것을 헌법 부칙에 규정한 것은 1972년 제7차 개정 헌법에서였다."},{"set":4,"num":34,"q":"지방자치단체의 자치권이 미치는 관할구역의 범위에는 육지만 포함되므로, 공유수면에 대해서는 지방자치단체의 자치권한이 존재하지 않는다.","src":"2021 국가직 5급","a":false,"exp":"지방자치법 제4조 제1항에 규정된 지방자치단체의 구역은 주민·자치권과 함께 자치단체의 구성요소이고, 자치권이 미치는 관할구역의 범위에는 육지는 물론 바다도 포함되므로, 공유수면에 대하여도 지방자치단체의 자치권한이 존재한다(헌재2020.7.16. 2015헌라3)."},{"set":4,"num":35,"q":"지방자치법 제5조 제1항에 규정된 지방자치단체의 구역은 주민·자치권과 함께 자치단체의 구성요소이고, 자치권이 미치는 관할구역의 범위에는 육지는 물론 바다도 포함되므로, 공유수면에 대해서도 지방자치단체의 자치권한이 미친다.","src":"2025 법원직","a":true,"exp":"헌재 2020.7.16. 2015헌라3"},{"set":4,"num":36,"q":"헌법상 지방자치제도보장의 핵심영역 내지 본질적 부분이 지방자치단체에 의한 자치행정을 보장하는 것이므로, 현 행법에 따른 지방자치단체의 중층구조를 계속하여 존속하도록 할지 여부는 입법자의 입법형성권의 범위에 포함되지 않는다.","src":"2021 지방직 7급","a":false,"exp":"헌법상 지방자치제도보장의 핵심영역 내지 본질적 부분이 지방자치단체에 의한 자치행정을 일반적으로 보장하는 것이라면, 현 행법에 따른 지방자치단체의 중층구조 또는 지방자치단체로서 특별시·광역시 및 도와 함께 시·군 및 구를 계속하여 존속하도록 할지 여부는 결국 입법자의 입법형성권의 범위에 들어가는 것으로 보아야 한다. 같은 이유로 일정구역에 한하여 모든 자치단체를 전면적으로 폐지하거나 지방자치단체인 시·군이 수행해온 자치사무를 국가의 사무로 이관하는 것이 아니라 당해 지역 내의 지방자치단체인 시·군을 모두 폐지하여 중층구조를 단층화하는 것 역시 입법자의 선택범위에 들어가는 것이다(헌재 2006. 4. 27. 2005헌마1190)."},{"set":4,"num":37,"q":"조례 제정은 지방자치단체의 고유사무인 자치사무와 국가사무로서 지방자치단체의 장에게 위임된 기관위임사무에 관해 서 허용되며, 개별 법령에 의하여 지방자치단체에 위임된 단체위임사무에 관해서는 조례를 제정할 수 없다.","src":"2023 지방직 7급","a":false,"exp":"지방자치단체가 자치조례를 제정할 수 있는 것은 원칙적으로 이러한 자치사무와 단체위임사무에 한하므로, 국가사무가 지방자치단체의 장에게 위임된 기관위임사무와 같이 지방자치단체의 장이 국가기관의 지위에서 수행하는 사무일 뿐 지방자치단체 자 체의 사무라고 할 수 없는 것은 원칙적으로 자치조례의 제정범위에 속하지 않는다. 그러나 기관위임사무에 있어서도 그에 관 한 개별 법령에서 일정한 사항을 조례로 정하도록 위임하고 있는 경우에는 지방자치단체의 자치조례 제정권과 무관하게 이른바 위임조례를 정할 수 있다(대판 1999.9.17. 99추30)."},{"set":4,"num":38,"q":"광역지방자치단체가 기초지방자치단체의 자치사무에 대한 감사에 착수하기 위해서는 감사 대상을 특정하고, 특정된 감사대상을 기초지방자치단체에게 사전 통보해야 한다.","src":"2024 경찰간부","a":false,"exp":"광역지방자치단체가 자치사무에 대한 감사에 착수하기 위해서는 감사대상을 특정하여야 하나, 특정된 감사대상을 사전에 통보할 것까지 요구된다고 볼 수는 없다. 따라서 피청구인이 조사개시 통보를 하면서 내부적으로 특정한 감사대상을 통보하지 않았다고 하더라도, 그러한 사정만으로는 이 사건 감사가 위법하다고 할 수 없다(헌재 2023. 3. 23. 2020헌라5)."},{"set":4,"num":39,"q":"감사 과정에서 사전에 감사대상으로 특정되지 아니한 사항에 관하여 위법사실이 발견된 경우, 당초 특정된 감사대상과 관련성이 인정되는 것으로서 당해 절차에서 함께 감사를 진행하더라도 감사대상 지방자치단체가 절차적인 불이익을 받을 우려가 없고, 해당 감사대상을 적발하기 위한 목적으로 감사가 진행된 것으로 볼 수 없는 사항이라 하더라도, 감사대상을 확장하거나 추가하는 것은 허용되지 않는다.","src":"2023 국가직 7급","a":false,"exp":"기초지방자치단체의 자치사무에 대한 광역지방자치단체의 감사과정에서 사전에 감사대상으로 특정되지 않은 사항에 관하여 위법사실이 발견된 경우, 당초 특정된 감사대상과 관련성이 있어 함께 감사를 진행해도 기초지방자치단체가 절차적인 불이익을 받을 우려가 없고, 해당 감사대상을 적발하기 위한 목적으로 감사가 진행된 것으로 볼 수 없는 사항에 대하여는 감사대상의 확 장 내지 추가가 허용된다(헌재 2023. 3. 23. 2020헌라5)."},{"set":4,"num":40,"q":"헌법이 감사원을 독립된 외부감사기관으로 정하고 있는 취지, 중앙정부와 지방자치단체는 서로 행정기능과 행정책임을 분담하면서 중앙행정의 효율성과 지방행정의 자주성을 조화시켜 국민과 주민의 복리증진이라는 공동목표를 추구하는 협력관계에 있다는 점을 고려하면 지방자치단체의 자치사무에 대한 합목적성 감사의 근거가 되는 ｢감사원법｣ 조항은 지방자치권의 본질적 내용을 침해하였다고는 볼 수 없다.","src":"2023 국가직 7급","a":true,"exp":"헌법이 감사원을 독립된 외부감사기관으로 정하고 있는 취지, 국가기능의 총체적 극대화를 위하여 중앙정부와 지방자치단체는 서로 행정기능과 행정책임을 분담하면서 중앙행정의 효율성과 지방행정의 자주성을 조화시켜 국민과 주민의 복리증진이라는 공동목표를 추구하는 협력관계에 있다는 점에 비추어 보면, 감사원에 의한 지방자치단체의 자치사무에 대한 감사를 합법성 감사에 한정하고 있지 아니한 이 사건 관련 규정은 그 목적의 정당성과 합리성을 인정할 수 있다. …지방자치단체의 인사권이나자치행정의 자기책임적 판단이 말살될 정도로 지방자치권의 본질이 훼손되었다고 보기는 어렵다(헌재 2008.5.29. 2005헌라3)."},{"set":4,"num":41,"q":"지방의회 사무직원의 임용권을 지방자치단체의 장에게 부여하도록 규정한 것은 지방의회와 지방자치단체의 장 사이의 상호견제와 균형의 원리에 비추어 헌법상 권력분립원칙에 위반된다.","src":"2023 법원직","a":false,"exp":"지방의회는 지방의회의원 개인을 중심으로 한 구조이며, 사무직원은 지방의회의원을 보조하는 지위를 가진다. 이러한 인적 구조아래서 지방의회 사무직원의 임용권의 귀속 및 운영 문제를 지방자치제도의 본질적인 내용이라고 볼 수는 없다. 지방자치제도가 본질적으로 훼손되지 않는다면, 중앙·지방간 권력의 수직적 분배라고 하는 지방자치제의 권력분립적 속성상 중앙정부와 국회 사이의 구성 및 관여와는 다른 방법으로 국민주권·민주주의원리가 구현될 수 있다. 심판대상조항에 따른 지방의회 의장의 추천권이 적극적이고 실질적으로 발휘된다면 지방의회 사무직원의 임용권이 지방자치단체의 장에게 있다고 하더라도 그것이 곧바로 지방의회와 집행기관 사이의 상호견제와 균형의 원리를 침해할 우려로 확대된다거나 또는 지방자치제도의 본질적 내용을 침해한다고 볼 수는 없다. 따라서 지방의회 사무직원의 임용권을 지방자치단체의 장에게 부여하도록 규정한 것은 지방의회와 지방자치단체의 장 사이의 상호견제와 균형의 원리에 어긋나지 않는다(헌재 2014. 1. 28. 2012헌바216)."},{"set":4,"num":42,"q":"헌법 제118조제2항에서 지방자치단체의 장의 ‘선임방법’에 관한 사항은 법률로 정한다고 규정하고 있으므로 지방자치단체의 장 선거권은 다른 공직선거권과 달리 헌법상 보장되는 기본권으로 볼 수 없다.","src":"2022 국가직 7급","a":false,"exp":"공직선거 관련법상 지방자치단체의 장 선임방법은 ‘선거’로 규정되어 왔고, 지방자치단체의 장을 선거로 선출하여 온 우리 지방자치제의 역사에 비추어 볼 때, 지방자치단체의 장에 대한 주민직선제 이외의 다른 선출방법을 허용할 수 없다는 관행과 이에 대한 국민적 인식이 광범위하게 존재한다고 볼 수 있다. 주민자치제를 본질로 하는 민주적 지방자치제도가 안정적으로 뿌리내린 현 시점에서 지방자치단체의 장 선거권을 지방의회의원 선거권, 나아가 국회의원 선거권 및 대통령 선거권과 구별하여 하나는 법률상의 권리로, 나머지는 헌법상의 권리로 이원화하는 것은 허용될 수 없다. 그러므로 지방자치단체의 장 선거권 역시 다 른 선거권과 마찬가지로 헌법 제24조에 의해 보호되는 기본권으로 인정하여야 한다(헌재 2016. 10. 27. 2014헌마797)."},{"set":4,"num":43,"q":"주민자치제를 본질로 하는 민주적 지방자치제도가 안정적으로 뿌리내린 현 시점에서 지방자치단체의 장 선거권을 지방의회의원 선거권, 나아가 국회의원 선거권 및 대통령 선거권과 구별하여 하나는 법률상의 권리로, 나머지는 헌법상의 권리로 이원화하는 것은 허용될 수 없으므로 지방자치단체의 장 선거권 역시 다른 선거권과 마찬가지로 헌법 제24조에 의해 보호되는 기본권으로 인정하여야 한다.","src":"2025 법원직","a":true,"exp":"헌재 2016. 10. 27. 2014헌마797"},{"set":4,"num":44,"q":"지방자치단체의 장이 금고 이상의 형을 선고받고 그 형이 확정되지 아니한 경우 부단체장이 그 권한을 대행하도록 하였더라도 지방자치단체의 장의 공무담임권을 침해한 것으로 볼 수 없다.","src":"2022 법원직","a":false,"exp":"헌법 제27조 제4항은 “형사피고인은 유죄의 판결이 확정될 때까지는 무죄로 추정된다.”고 선언함으로써, 공소가 제기된 피고인이 비록 1심이나 2심에서 유죄판결을 선고받았더라도 그 유죄판결이 확정되기 전까지는 원칙적으로 죄가 없는 자에 준하여취급해야 함은 물론, 유죄임을 전제로 하여 해당 피고인에 대하여 유형·무형의 일체의 불이익을 가하지 못하도록 하고 있다. 그런데 이 사건 법률조항은 자치단체장으로서의 직무를 정지시키는 불이익을 가하고 있으므로, 무죄추정의 원칙에 위배된다. 금고 이상의 형을 선고받았더라도 불구속상태에 있는 이상 자치단체장이 직무를 수행하는 데는 아무런 지장이 없으므로 부단체장으로 하여금 그 권한을 대행시킬 직접적 필요가 없다는 점에서 과잉금지원칙에 위배되어 자치단체장인 청구인의 공무담임권을 침해한다. 국회의원에게는 금고 이상의 형을 선고받은 후 그 형이 확정되기도 전에 직무를 정지시키는 제도가 없으므로, 자치단체장인 청구인의 평등권을 침해한다(헌재 2010. 9. 2. 2010헌마418)."},{"set":4,"num":45,"q":"조례에 의한 규제가 지역 여건이나 환경 등 그 특성에 따라 다르게 나타나는 것은 헌법이 지방자치단체의 자치입법권을 인정한 이상 당연히 예상되는 결과이다. 자신들이 거주하는 지역의 학원조례조항으로 인하여 다른 지역 주민들에 비하여 더한 규제를 받게 되었다하여 평등권이 침해되었다고 볼 수는 없다.","src":"2024 법원직","a":true,"exp":"헌재 2009. 10. 29. 2008헌마454"},{"set":4,"num":46,"q":"지방자치단체가 주민의 권리 제한 또는 의무 부과에 관한 사항이나 벌칙을 정할 때에는 법률의 위임이 있어야 한다.","src":"2026 법원직","a":true,"exp":"지방자치단체는 법령의 범위에서 그 사무에 관하여 조례를 제정할 수 있다. 다만, 주민의 권리 제한 또는 의무 부과에 관한 사항이나 벌칙을 정할 때에는 법률의 위임이 있어야 한다(지방자치법 제28조 제1항)."},{"set":4,"num":47,"q":"지방자치단체의 장은 지방의회에서 의결된 조례안에 대해 이의가 있는 경우 그 일부에 대하여 또는 조례안을 수정하여 재의를 요구할 수 있다.","src":"2026 법원직","a":false,"exp":"지방자치단체의 장은 이송 받은 조례안에 대하여 이의가 있으면 제2항의 기간(20일 이내)에 이유를 붙여 지방의회로 환부하고, 재의를 요구할 수 있다. 이 경우 지방자치단체의 장은 조례안의 일부에 대하여 또는 조례안을 수정하여 재의를 요구할 수없다(지방자치법 제32조 제3항)."},{"set":4,"num":48,"q":"조례의 제정권자인 지방의회는 지역적인 민주적 정당성을 지니고 있으며, 헌법이 지방자치단체에 대해 포괄적인 자치권을 보장하고 있는 취지에 비추어, 조례에 대한 법률의 위임은 반드시 구체적으로 범위를 정하여 할 필요가 없으며 포괄적인 것으로 족하다.","src":"2023 지방직 7급","a":true,"exp":"조례의 제정권자인 지방의회는 선거를 통해서 그 지역적인 민주적 정당성을 지니고 있는 주민의 대표기관이고 헌법이 지방자치단체에 포괄적인 자치권을 보장하고 있는 취지로 볼 때, 조례에 대한 법률의 위임은 법규명령에 대한 법률의 위임과 같이 반드시 구체적으로 범위를 정하여 할 필요가 없으며 포괄적인 것으로 족하다(헌재 1995. 4. 20. 92헌마264)."},{"set":4,"num":49,"q":"법령에서 조례로 정하도록 위임한 사항은 그 법령의 하위 법령에서 그 위임의 내용과 범위를 제한하거나 직접 규정할 수 없다.","src":"2023 법원직","a":true,"exp":"지방자치법 제28조 제2항"},{"set":4,"num":50,"q":"조례 제정·개폐청구권은 법률에 의하여 보장되는 권리가 아니라 헌법 제37조 제1항의 ‘헌법에 열거되지 아니한 권리’에 해당하므로 헌법상 보장된 기본권으로 볼 수 있다.","src":"2023 변호사시험","a":false,"exp":"주민투표권이나 조례제정·개폐청구권은 법률에 의하여 보장되는 권리에 해당하고, 헌법상 보장되는 기본권이라거나 헌법 제37조 제1항의 ‘헌법에 열거되지 아니한 권리’로 보기 어렵다(헌재 2014. 4. 24. 2012헌마287)."},{"set":4,"num":51,"q":"지방자치법상 주민투표권은 법률이 보장하는 참정권이라고 할 수 있을지언정 헌법이 보장하는 참정권이라고 할 수는 없다.","src":"2023 법원행시","a":true,"exp":"지방자치법 제13조의2와 이에 근거한 주민투표법이 정하는 주민투표권은 그 성질상 선거권, 공무담임권, 국민투표권과는 다른 것이어서 이를 법률이 보장하는 참정권이라고 할 수 있을지언정 헌법이 보장하는 참정권이라고 할 수는 없다(헌재 2001.6.28. 2000헌마735)."},{"set":4,"num":52,"q":"지방교육자치는 지방자치권행사의 일환으로서 보장되는 것이므로, 중앙권력에 대한 지방적 자치로서의 속성을 지니고 있지만, 동시에 그것은 헌법 제31조제4항이 보장하고 있는 교육의 자주성․전문성․정치적 중립성을 구현하기 위한 것이므로, 정치권력에 대한 문화적 자치로서의 속성도 아울러 지니고 있다.","src":"2019 지방직 7급","a":true,"exp":"헌재 2008. 6. 26. 2007헌마1175"},{"set":4,"num":53,"q":"우리의 주민소환제는 기본적으로 사법적인 절차로서의 성격이 강한 것으로 평가될 수 있다 할 것이다.","src":"2014 법원행시","a":false,"exp":"주민소환제를 규범적인 차원에서 정치적인 절차로 설계할 것인지, 아니면 사법적인 절차로 할 것인지는 현실적인 차원에서 입법자가 여러 가지 사정을 고려하여 정책적으로 결정할 사항이라 할 것이다. 그런데 주민소환법에 주민소환의 청구사유를 두지 않은 것은 입법자가 주민소환을 기본적으로 정치적인 절차로 설정한 것으로 볼 수 있고, 외국의 입법례도 청구사유에 제한을 두지 않는 경우가 많다는 점을 고려할 때 우리의 주민소환제는 기본적으로 정치적인 절차로서의 성격이 강한 것으로 평가될 수 있다 할 것이다(헌재 2009.3.26. 2007헌마843). 따라서 사법적인 절차가 아니라 정치적인 절차이다."},{"set":4,"num":54,"q":"주민은 그 지방자치단체의 장 및 지역구 지방의회의원, 비례대표 지방의회의원을 소환할 권리를 가진다.","src":"2019 경정승진","a":false,"exp":"주민은 그 지방자치단체의 장 및 지방의회의원(비례대표 지방의회의원은 제외한다)을 소환할 권리를 가진다(지방자치법 제25조 제1항)."},{"set":5,"num":1,"q":"방송의 자유는 주관적 권리로서의 성격과 함께 자유로운 의견형성이나 여론형성을 위해 필수적인 기능을 행하는 객관적 규범질서로서 제도적 보장의 성격을 가진다.","src":"2019 법원행시","a":true,"exp":"헌법 제21조 제1항은 “모든 국민은 언론·출판의 자유와 집회·결사의 자유를 가진다”고 규정하였다. 같은 규정에 의해 보장되는 언론·출판의 자유에는 방송의 자유가 포함된다. 방송의 자유는 주관적인 자유권으로서의 특성을 가질 뿐 아니라 다양한 정보와 견해의 교환을 가능하게 함으로써 민주주의의 존립·발전을 위한 기초가 되는 언론의 자유의 실질적 보장에 기여한다는 특성을 가지고 있다. 방송매체에 대한 규제의 필요성과 정당성을 논의함에 있어서 방송사업자의 자유와 권리뿐만 아니라 수신자(시청자)의 이익과 권리도 고려되어야 하는 것은 방송의 이 와 같은 공적 기능 때문이다. 따라서 방송의 자유는 주관적 권리로서의 성격과 함께 신문의 자유와 마찬가지로 자유로운 의견형성이나 여론형성을 위해 필수적인 기능을 행하는 객관적 규범질서로서 제도적 보장의 성격을 함께 가진다(헌재 2003. 12. 18. 2002헌바49)."},{"set":5,"num":2,"q":"태아가 비록 그 생명의 유지를 위하여 모에게 의존해야 하지만, 그 자체로 모와 별개의 생명체이고 특별한 사정이 없는 한 인간으로 성장할 가능성이 크므로 태아에게도 생명권이 인정되어야 한다.","src":"2025 국가직 5급","a":true,"exp":"헌재 2008. 7. 31. 2004헌바81"},{"set":5,"num":3,"q":"모든 인간은 헌법상 생명권의 주체가 되며 형성 중의 생명인 태아에게도 생명권 주체성이 인정되므로, 국가의 보호 필요성은 별론으로 하고 수정 후 모체에 착상되기 전인 초기배아에 대해서도 기본권 주체성을 인정할 수 있다.","src":"2020 변호사시험","a":false,"exp":"초기배아는 수정이 된 배아라는 점에서 형성 중인 생명의 첫걸음을 떼었다고 볼 여지가 있기는 하나 아직 모체에 착상되거나 원시선이 나타나지 않은 이상 현재의 자연과학적 인식 수준에서 독립된 인간과 배아 간의 개체적연속성을 확정하기 어렵다고 봄이 일반적이라는 점, 배아의 경우 현재의 과학기술 수준에서 모태 속에서 수용될때 비로소 독립적인 인간으로의 성장가능성을 기대할 수 있다는 점, 수정 후 착상 전의 배아가 인간으로 인식된다거나 그와 같이 취급하여야 할 필요성이 있다는 사회적 승인이 존재한다고 보기 어려운 점 등을 종합적으로 고려할 때, 기본권 주체성을 인정하기 어렵다. (헌재 2010.5.27. 2005헌마346)"},{"set":5,"num":4,"q":"근로의 권리 중 인간의 존엄성 보장에 필요한 최소한의 근로조건을 요구할 수 있는 ‘일할 환경에 관한 권리’ 역시 외국인에게 보장된다.","src":"2020 지방직 7급","a":true,"exp":"근로의 권리가 “일할 자리에 관한 권리”만이 아니라 “일할 환경에 관한 권리”도 함께 내포하고 있는바, 후자는 인간의 존엄성에 대한 침해를 방어하기 위한 자유권적 기본권의 성격도 갖고 있어 건강한 작업환경, 일에 대한 정당한 보수, 합리적인 근로조건의 보장 등을 요구할 수 있는 권리 등을 포함한다고 할 것이므로 외국인 근로자라고 하여 이 부분에까지 기본권 주체성을 부인할 수는 없다. 즉 근로의 권리의 구체적인 내용에 따라, 국가에 대하여 고용증진을 위한 사회적ㆍ경제적 정책을 요구할 수 있는 권리는 사회권적 기본권으로서 국민에 대하여만인정해야 하지만, 자본주의 경제질서하에서 근로자가 기본적 생활수단을 확보하고 인간의 존엄성을 보장받기 위하여 최소한의 근로조건을 요구할 수 있는 권리는 자유권적 기본권의 성격도 아울러 가지므로 이러한 경우 외국인 근로자에게도 그 기본권 주체성을 인정함이 타당하다(헌재 2007.8.30. 2004헌마670)."},{"set":5,"num":5,"q":"외국인이 법률에 따라 고용허가를 받아 적법하게 근로관계를 형성한 경우에도 외국인은 그 근로관계를 유지하거나포기하는 데 있어서 직장선택의 자유에 대한 기본권 주체성을 인정할 수 없다.","src":"2020 변호사시험","a":false,"exp":"직업의 자유 중 이 사건에서 문제되는 직장 선택의 자유는 인간의 존엄과 가치 및 행복추구권과도 밀접한 관련을 가지는 만큼 단순히 국민의 권리가 아닌 인간의 권리로 보아야 할 것이므로 외국인도 제한적으로라도 직장선택의 자유를 향유할 수 있다고 보아야 한다. 청구인들이 이미 적법하게 고용허가를 받아 적법하게 우리나라에입국하여 우리나라에서 일정한 생활관계를 형성, 유지하는 등, 우리 사회에서 정당한 노동인력으로서의 지위를부여받은 상황임을 전제로 하는 이상, 이 사건 청구인들에게 직장 선택의 자유에 대한 기본권 주체성을 인정할 수 있다 할 것이다. (헌재 2011.9.29. 2007헌마1083)"},{"set":5,"num":6,"q":"헌법상 기본권인 참정권에 대한 외국인의 기본권주체성은 인정되지 아니한다.","src":"2023 법원행시","a":true,"exp":"참정권과 입국의 자유에 대한 외국인의 기본권주체성이 인정되지 않는다(헌재 2014.6.26. 2011헌마502)."},{"set":5,"num":7,"q":"입국의 자유는 인간의 존엄과 가치 및 행복추구권과 밀접한 관련이 있는 인간의 권리에 속하므로, 입국의 자유에 대한 외국인의 기본권주체성은 인정된다.","src":"2024 경찰 제2차","a":false,"exp":"참정권과 입국의 자유에 대한 외국인의 기본권주체성이 인정되지 않는다(헌재 2014.6.26. 2011헌마502)."},{"set":5,"num":8,"q":"공법인은 헌법의 수범자이지 기본권의 주체가 될 수 없으나, 축산업협동조합중앙회는 공법인성과 사법인성을 겸유한 특수한 법인으로서 기본권의 주체가 될 수 있다.","src":"2025 국가직 7급","a":true,"exp":"축협중앙회는 지역별․업종별 축협과 비교할 때 그 공법인성이 상대적으로 크다고 할 것이지만, 그 존립목적 및설립형식에서의 자주적 성격에 비추어 사법인적 성격을 부인할 수 없으므로 기본권의 주체가 될 수 있다(헌재 2000. 6. 1. 99헌마553)."},{"set":5,"num":9,"q":"인간의 존엄과 가치, 행복추구권은 그 성질상 자연인에게 인정되는 기본권이므로 법인에게는 적용되지 않는다.","src":"2017 법원직","a":true,"exp":"헌재 2006. 12. 28. 2004헌바67"},{"set":5,"num":10,"q":"법인은 법인의 목적과 사회적 기능에 비추어 볼 때 그 성질에 반하지 않는 범위 내에서 인격권의 한 내용인 사회적 신용이나 명예 등의 주체가 될 수 있다.","src":"2019 지방직 7급","a":true,"exp":"법인도 법인의 목적과 사회적 기능에 비추어 볼 때 그 성질에 반하지 않는 범위 내에서 인격권의 한 내용인 사회적 신용이나 명예 등의 주체가 될 수 있고 법인이 이러한 사회적 신용이나 명예 유지 내지 법인격의 자유로운 발현을 위하여 의사결정이나 행동을 어떻게 할 것인지를 자율적으로 결정하는 것도 법인의 인격권의 한 내용을이룬다고 할 것이다(헌재 2012. 8. 23. 2009헌가27)."},{"set":5,"num":11,"q":"국가기관 또는 공법인은 공권력 행사의 주체이자 기본권의 수범자로서 기본권 주체가 될 수 없으므로, 대통령이 나 지방자치단체장 등 개인이 국가기관의 지위를 겸하는 경우에도 기본권 주체성은 언제나 부정된다.","src":"2020 변호사시험","a":false,"exp":"원칙적으로 국가나 국가기관 또는 국가조직의 일부나 공법인은 공권력 행사의 주체이자 기본권의 ‘수범자’로서 기본권의 ‘소지자’인 국민의 기본권을 보호 내지 실현해야 할 책임과 의무를 지니고 있을 뿐이므로, 헌법소원을 제기할 수 있는 청구인적격이 없다. 그러나 국가기관의 직무를 담당하는 자연인이 제기한 헌법소원이 언제나 부적법하다고 볼 수는 없다. 만일 심판대상 조항이나 공권력 작용이 넓은 의미의 국가 조직영역 내에서 공적 과제를 수행하는 주체의 권한 내지 직무영역을 제약하는 성격이 강한 경우에는 그 기본권 주체성이 부정될 것이지만, 그것이 일반 국민으로서 국가에 대하여 가지는 헌법상의 기본권을 제약하는 성격이 강한 경우에는 기본권 주체성을 인정할 수 있다. (헌재 2008.1.17. 2007헌마700)"},{"set":5,"num":12,"q":"지방자치단체장은 국민의 기본권을 보호 내지 실현하여야 할 책임과 의무를 가지는 국가기관의 지위를 갖기 때문에 ｢주민소환에 관한 법률｣의 관련 규정으로 인해 자신의 공무담임권이 침해됨을 이유로 헌법소원을 청구할 수 있는 기본권 주체로 볼 수 없다.","src":"2019 지방직 7급","a":false,"exp":"국가 및 그 기관 또는 조직의 일부나 공법인은 원칙적으로는 기본권의 ‘수범자’로서 기본권의 주체가 되지 못하고, 다만 국민의 기본권을 보호 내지 실현하여야 할 책임과 의무를 지니는 데 그칠 뿐이므로, 공직자가 국가기관의 지위에서 순수한 직무상의 권한행사와 관련하여 기본권 침해를 주장하는 경우에는 기본권의 주체성을 인정하기 어렵다 할 것이나, 그 외의 사적인 영역에 있어서는 기본권의 주체가 될 수 있는 것이다. (헌재 2008.1.17. 2007헌마700)"},{"set":5,"num":13,"q":"공법상 재단법인인 방송문화진흥회가 최다출자자인 방송사업자는 ｢방송법｣ 등 관련 규정에 의하여 공법상의 의무를 부담하고 있지만, 그 설립목적이 언론의 자유의 핵심 영역인 방송 사업이므로 이러한 업무 수행과 관련해서는 기본권 주체가 될 수 있고, 그 운영을 광고수익에 전적으로 의존하고 있는 만큼 이를 위해 사경제 주체로서 활동하는 경우에도 기본권 주체가 될 수 있다.","src":"2022 국가직 7급","a":true,"exp":"청구인은 공법상 재단법인인 방송문화진흥회가 최다출자자인 방송사업자로서 방송법 등 관련 규정에 의하여 공법상의 의무를 부담하고 있지만, 그 설립목적이 언론의 자유의 핵심 영역인 방송 사업이므로 이러한 업무 수행과 관련해서는 기본권 주체가 될 수 있고, 그 운영을 광고수익에 전적으로 의존하고 있는 만큼 이를 위해 사경제 주체로서 활동하는 경우에도 기본권 주체가 될 수 있다(헌재 2013. 9. 26. 2012헌마271)."},{"set":5,"num":14,"q":"공법인이나 이에 준하는 지위를 가진 자라 하더라도, 공무를 수행하거나 고권적 행위를 하는 경우가 아닌 사경제 주체로서 활동하는 경우나 조직법상 국가로부터 독립한 고유 업무를 수행하는 경우에는 기본권의 주체가 될 수 있지만, 다른 공권력 주체와의 관계에서 지배복종관계가 성립되어 일반 사인처럼 그 지배하에 있는 경우에는 기본권 주체가 될 수 없다.","src":"2026 경찰 제2차","a":false,"exp":"공법인이나 이에 준하는 지위를 가진 자라 하더라도 공무를 수행하거나 고권적 행위를 하는 경우가 아닌 사경제 주체로서 활동하는 경우나 조직법상 국가로부터 독립한 고유 업무를 수행하는 경우, 그리고 다른 공권력 주체와의 관계에서 지배복종관계가 성립되어 일반 사인처럼 그 지배하에 있는 경우 등에는 기본권 주체가 될 수 있다 (헌재 2013. 9. 26. 2012헌마271)."},{"set":5,"num":15,"q":"법인 아닌 사단･재단의 경우 대표자의 정함이 있고 독립된 사회적 조직체로서 활동한다고 하더라도 그의 이름으로 헌법소원심판을 청구할 수는 없다.","src":"2023 경정승진","a":false,"exp":"법인 아닌 사단·재단이라고 하더라도 대표자의 정함이 있고 독립된 사회적 조직체로서 활동하는 때에는 성질상 법인이 누릴 수 있는 기본권을 침해당하게 되면 그의 이름으로 헌법소원심판을 청구할 수 있다(헌재 1991.6.3. 90헌마56)."},{"set":5,"num":16,"q":"정당이 등록이 취소된 이후에도 ‘등록정당’에 준하는 ‘권리능력 없는 사단’으로서의 실질을 유지하고 있다고 볼 수 있으면 헌법소원의 청구인능력을 인정할 수 있다.","src":"2022 국가직 7급","a":true,"exp":"사회당은 등록이 취소된 이후에도 ‘등록정당’에 준하는 ‘권리능력 없는 사단’으로서의 실질을 유지하고 있다고 볼 수 있으므로 이 사건 헌법소원의 청구인능력을 인정할 수 있다고 할 것이다. 정당의 청구인능력은 정당 법상의 등록요건을 구비함으로써 생기는 것이 아니고, 그 법적 성격이 권리능력 없는 사단이라는 점에서 인정되는 것이기 때문이다. 또한, 정당설립의 자유는 그 성질상 등록된 정당에게만 인정되는 기본권이 아니라 청구인과같이 등록정당은 아니지만 권리능력 없는 사단의 실체를 가지고 있는 정당에게도 인정되는 기본권이라고 할 수 있다(헌재 2006. 3. 30. 2004헌마246)."},{"set":5,"num":17,"q":"국가가 기본권 보호의무를 다하지 못하였다는 이유로 입법부작위 내지 불완전한 입법이 헌법에 위반된다고 판단할 때에는, 국가권력에 의해 국민의 기본권이 침해당하는 경우와는 다른 판단기준이 적용되어서는 아니 된다.","src":"2025 경위공채","a":false,"exp":"국가의 보호의무를 입법자가 어떻게 실현하여야 할 것인가 하는 문제는 원칙적으로 입법자의 책임범위에 속한다. 따라서 헌법재판소는 단지 제한적으로만 입법자에 의한 보호의무의 이행을 심사할 수 있다. 따라서 국가가 국민의 기본권을 보호하기 위한 충분한 입법조치를 취하지 아니함으로써 기본권보호의무를 다하지 못하였다는 이유로 입법부작위 내지 불완전한 입법이 헌법에 위반된다고 판단하기 위하여는, 국가권력에 의해 국민의 기본권이 침해당하는 경우와는 다른 판단기준이 적용되어야 마땅하다(헌재 1997. 1. 16. 90헌마110)."},{"set":5,"num":18,"q":"국가가 국민의 생명･신체의 안전에 대한 보호의무를 다하지 않았는지 여부를 헌법재판소가 심사할 때에는, 그 보호하기 위한 조치가 매우 불충분한 것임이 명백한 경우가 아니라, 필요한 상황인데도 불구하고 국가가 아무런 보호조치를 취하지 않거나 그 취한 조치가 법익을 보호하기에 전적으로 부적합한 경우에 한하여 보호의무의 위반을 확인하여야 한다.","src":"2027 경위공채","a":false,"exp":"국가가 국민의 생명·신체의 안전에 대한 보호의무를 다하지 않았는지 여부를 헌법재판소가 심사할 때에는 국가가 이 를 보호하기 위하여 적어도 적절하고 효율적인 최소한의 보호조치를 취하였는가 하는 이른바 ‘과소보호금지원칙’의 위반 여부를 기준으로 삼아, 국민의 생명·신체의 안전을 보호하기 위한 조치가 필요한 상황인데도 국가가 아무런 보호조치를 취하지 않았든지 아니면 취한 조치가 법익을 보호하기에 전적으로 부적합하거나 매우 불충분한 것임이 명백한 경우에 한하여 국가의 보호의무의 위반을 확인하여야 하는 것이다(헌재 1997. 1. 16. 90헌마110)."},{"set":5,"num":19,"q":"헌법재판소는 업무상과실 또는 중대한 과실로 인한 교통사고로 말미암아 피해자로 하여금 중상해에 이르게 한 경우, 교통사고를 일으킨 차가 종합보험 등에 가입되었다면 당해 차의 운전자에 대하여 공소를 제기할 수 없도록 한 ｢교통사고처리특례법｣ 조항은 교통사고 피해자에 대한 국가의 기본권 보호의무를 위반한다고 판시하였다.","src":"2015 변호사시험","a":false,"exp":"국가의 신체와 생명에 대한 보호의무는 교통과실범의 경우 발생한 침해에 대한 사후처벌뿐 아니라, 무엇보다도우선적으로 운전면허취득에 관한 법규 등 전반적인 교통관련법규의 정비, 운전자와 일반국민에 대한 지속적인 계몽과 교육, 교통안전에 관한 시설의 유지 및 확충, 교통사고 피해자에 대한 보상제도 등 여러 가지 사전적·사후적 조치를 함께 취함으로써 이행된다 할 것이므로, 형벌은 국가가 취할 수 있는 유효적절한 수많은 수단 중의 하나일 뿐이지, 결코 형벌까지 동원해야만 보호법익을 유효적절하게 보호할 수 있다는 의미의 최종적인 유일한 수단이 될 수는 없다 할 것이다. 따라서 이 사건 법률조항은 국가의 기본권보호의무의 위반 여부에 관한 심사기준인 과소보호금지의 원칙에 위반한 것이라고 볼 수 없다(헌재 2009. 2. 26. 2005헌마764)."},{"set":5,"num":20,"q":"헌법재판소는 대통령선거와 국회의원선거에서 확성장치의 사용과 관련하여 확성장치의 수만 규정하고 있을 뿐 확성장치의 소음규제기준을 마련하고 있지 아니한 ｢공직선거법｣ 조항은 과잉금지원칙에 위배되어 건강하고 쾌적한 환경에서 생활할 권리를 침해한다고 하였다.","src":"2021 변호사시험","a":false,"exp":"선거운동의 자유를 감안하여 선거운동을 위한 확성장치를 허용할 공익적 필요성이 인정된다고 하더라도 정온한생활환경이 보장되어야 할 주거지역에서 출근 또는 등교 이전 및 퇴근 또는 하교 이후 시간대에 확성장치의 최고출력 내지 소음을 제한하는 등 사용시간과 사용지역에 따른 수인한도 내에서 확성장치의 최고출력 내지 소음규제기준에 관한 규정을 두지 아니한 것은, 국민이 건강하고 쾌적하게 생활할 수 있는 양호한 주거환경을 위하여 노력하여야 할 국가의 의무를 부과한 헌법 제35조 제3항에 비추어 보면, 적절하고 효율적인 최소한의 보호조치를 취하지 아니하여 국가의 기본권 보호의무를 과소하게 이행한 것으로서, 청구인의 건강하고 쾌적한 환경에서 생활할 권리를 침해하므로 헌법에 위반된다. 종래 이와 견해를 달리하여 심판대상조항이 헌법에 위반되지 아니한다고 판시한 우리 재판소 결정은 이 결정 취지와 저촉되는 범위 안에서 변경하기로 한다(헌재 2019. 12. 27. 2018헌마730). 과잉금지원칙에 위배가 아니라 과소보호금지 원칙 위배로 위헌결정하였다."},{"set":5,"num":21,"q":"국가가 국민의 건강하고 쾌적한 환경에서 생활할 권리에 관한 보호의무를 다하지 않았는지를 헌법재판소가 심사할 때에는 ‘과소보호금지원칙’의 위반 여부를 기준으로 삼아, 개별 사례에서 기본권침해가 예상되어 보호가 필요한 ‘위험상황’에 대응하는 ‘보호조치’의 내용이, 문제 되는 위험상황의 성격에 상응하는 보호조치로서 필요한 최소한의 성격을 갖고 있는지에 따라 판단하는데, 위험상황의 성격 등은 ‘과학적 사실’과 ‘국제기준’에 근거하여 객관적으로 검토되어야 한다.","src":"2025 법원직","a":true,"exp":"헌재 2024. 8. 29. 2020헌마389"},{"set":5,"num":22,"q":"탄소중립법령이 설정한 온실가스 감축목표 등이 과소보호원칙을 위반하였는지 여부는 기후위기라는 위험상황의 성격에 상응하는 보호조치로서 필요한 최소한의 성격을 갖고 있는지를 기준으로 판단하여야 하며, 온실가스 감축의 구체적인 목표치가 전 지구적인 감축 노력의 관점에서 우리나라가 기여해야 할 몫에 부합하는지, 감축목표 설정의 체계가 기후변화의 영향과 온실가스 배출 제한의 측면에서 미래에 과중한 부담을 이전하지 않는 방식으로, 또한 온실가스 감축이 실효적으로 담보될 수 있는 방식으로 제도화되어 있는지 등을 과학적 사실과 국제기준을 고려하여 판단하여야 한다.","src":"2025 법원직","a":true,"exp":"헌재 2024. 8. 29. 2020헌마389"},{"set":5,"num":23,"q":"정부가 ‘국가 온실가스 배출량을 2030년까지 2018년의 국가 온실가스 배출량 대비 35퍼센트 이상의 범위에서 대통령령으로 정하는 비율만큼 감축하는 것’을 ‘중장기 국가 온실가스 감축 목표’로 하도록 규정한 기후위기 대응을 위한 탄소중립․녹색성장 기본법 제8조 제1항은 2031년부터 2049년까지의 감축목표에 관하여 어떤 형태의 정량적기준도 제시하지 않았는바, 미래에 과중한 부담을 이전하는 방식으로 온실가스 감축목표를 규율한 것으로, 2031년부터 2049년까지의 감축목표에 대한 규율에 관하여 기후위기라는 위험상황에 상응하는 보호조치로서 필요한 최소한의 성격을 갖추지 못하였으므로 과소보호금지원칙을 위반한다.","src":"2025 법원직","a":true,"exp":"헌재 2024. 8. 29. 2020헌마389"},{"set":5,"num":24,"q":"기후위기 대응을 위한 탄소중립․녹색성장 기본법 제8조 제1항이 2031년부터 2049년까지의 감축목표에 관하여 대강의 정량적 수준도 규정하지 않고 이에 관해 정부가 5년마다 정하도록 하였다고 하더라도, 온실가스 감축목표의 수치와 경로를 정하는 것은 과학적 예측과 분석에 기반한 전문적이고 기술적인 영역에 해당하여 법률에 이를 상세하게 정하는 것은 한계가 있으므로, 이를 들어 의회유보원칙과 법률유보원칙을 위반하였다고 할 수 없다.","src":"2025 법원직","a":false,"exp":"탄소중립기본법 제8조 제1항에서 2030년까지의 감축목표에 대하여 2030년을 목표연도로 한 2018년 대비 감축비율의 하한만 법률에서 정하였을 뿐, 구체적인 감축비율의 수치는 대통령령에 위임하고 감축의 경로는 정부가 설정하는 부문별 및 연도별 감축목표에 따르도록 한 것은 법률유보원칙을 위반한 것으로 볼 수 없다. 그러나 중장기적인 온실가스 감축목표와 감축경로를 계획할 때에는 매우 높은 수준의 사회적 합의가 필요하다는 점, 미래세대는 민주적 정치과정에 참여하는 것이 제약되어 있다는 점과 관련하여 입법자에게 더욱 구체적인 입법의무와 책임이 있음을 고려할 때, 2031년부터 2049년까지의 감축목표에 관하여 대강의 정량적 수준도 규정하지 않고 이에 관해 정부가 5년마다 정하도록 한 것은 의회유보원칙을 포함하는 법률유보원칙을 위반한 것이다(헌재 2024. 8. 29. 2020헌마389)."},{"set":5,"num":25,"q":"흡연권과 혐연권의 관계처럼 상하의 위계질서가 있는 기본권끼리 충돌하는 경우 상위기본권우선의 원칙에 따라 하위기본권이 제한될 수 있으므로, 흡연권은 혐연권을 침해하지 않는 한에서 인정되어야 한다.","src":"2022 법원직","a":true,"exp":"헌재 2004. 8. 26. 2003헌마457"},{"set":5,"num":26,"q":"노동조합이 당해 사업장에 종사하는 근로자의 3분의 2 이상을 대표하고 있을 때에는 근로자가 그 노동조합의 조합원이 될 것을 고용조건으로 하는 단체협약[이른바 유니언 샵(Union Shop)]과 관련하여 근로자의 단결하지 아니할 자유와 노동조합의 적극적 단결권(조직강제권)이 충돌하나, 근로자에게 보장되는 적극적 단결권이 단결하지 아니할 자유보다 특별한 의미를 가지고 있으므로 노동조합의 적극적 단결권은 근로자 개인의 단결하지 않을 자유보다 중시된다.","src":"2022 법원직","a":true,"exp":"헌재 2005. 11. 24. 2002헌바95"},{"set":5,"num":27,"q":"｢노동조합 및 노동관계조정법｣상 유니온 샵(Union Shop) 조항은 특정한 노동조합의 가입을 강제하는 단체협약의 체 결을 용인하고 있으므로 근로자의 개인적 단결권과 노동조합의 집단적 단결권이 서로 충돌하는 경우에 해당하며 이를 기본권의 서열이론이나 법익형량의 원리에 입각하여 어느 기본권이 더 상위기본권이라고 단정할 수는 없다.","src":"2023 경찰간부","a":true,"exp":"헌법상 보장된 근로자의 단결권은 단결할 자유만을 가리킬 뿐이고, 단결하지 아니할 자유 이른바 소극적 단결권은 이에 포함되지 않는다. 그렇다면 근로자가 노동조합을 결성하지 아니할 자유나 노동조합에 가입을 강제당하지 아니할 자유, 그리고 가입한 노동조합을 탈퇴할 자유는 근로자에게 보장된 단결권의 내용에 포섭되는 권리로서가 아니라 헌법 제10조의 행복추구권에서 파생되는 일반적 행동의 자유 또는 제21조 제1항의 결사의 자유에서 그 근거를 찾을 수 있다. 근로자에게 보장되는 적극적 단결권이 단결하지 아니할 자유보다 특별한 의미를 갖고 있고, 노동조합의 조직강제권도 이른바 자유권을 수정하는 의미의 생존권(사회권)적 성격을 함께 가지는 만큼 근로자 개인의 자유권에 비하여 보다 특별한 가치로 보장되는 점 등을 고려하면, 노동조합의 적극적 단결권은 근로자 개인의 단결하지 않을 자유보다 중시된다. 그러나 개인적 단결권과 집단적 단결권이 충돌하는 경우 기본권의 서열이론이나 법익형량의 원리에 입각하여 어느 기본권이 더 상위기본권이라고 단정할 수는 없다(헌재 2005. 11. 24. 2002헌바95)."},{"set":5,"num":28,"q":"보도기관이 누리는 언론의 자유에 대한 제약의 문제는 결국 피해자의 반론권과 서로 충돌하는 관계에 있고, 이와 같이 두 기본권이 서로 충돌하는 경우에는 헌법의 통일성을 유지하기 위하여 상충하는 기본권 모두가 최대한으로 그 기능과 효력을 나타낼 수 있도록 하는 조화로운 방법이 모색되어야 한다.","src":"2019 법원행시","a":true,"exp":"반론권은 보도기관이 사실에 대한 보도과정에서 타인의 인격권 및 사생활의 비밀과 사유에 대한 중대한 침해가 될 직접적 위험을 초래하게 되는 경우 이러한 법익을 보호하기 위한 적극적 요청에 의하여 마련된 제도인 것이지 언론의 자유를 제한하기 위한 소극적 필요에서 마련된 것은 아니기 때문에 이에 따른 보도기관이 누리는 언론의 자유에 대한 제약의 문제는 결국 피해자의 반론권과 서로 충돌하는 관계에 있는 것으로 보아야 할 것이다. 이와 같이 두 기본권이 서 로 충돌하는 경우에는 헌법의 통일성를 유지하기 위하여 상충하는 기본권 모두가 최대한으로 그 기능과 효력을 나타낼 수 있도록 하는 조화로운 방법이 모색되어야 할 것이고, 결국은 이 법에 규정한 정정보도청구제도가 과잉금지의 원칙에 따라 그 목적이 정당한 것인가 그러한 목적을 달성하기 위하여 마련된 수단 또한 언론의 자유를 제한하는 정도가인격권과의 사이에 적정한 비례를 유지하는 것인가의 여부가 문제된다 할 것이다(헌재 1991. 9. 16. 89헌마165)."},{"set":5,"num":29,"q":"채권자취소권에 관한 민법 규정으로 인하여 채권자의 재산권과 채무자 및 수익자의 일반적 행동의 자유, 그리고 채권자의 재산권과 수익자의 재산권이 동일한 장에서 충돌한다. 따라서 이러한 경우에는 상충하는 기본권 모두가 최대한으로 그 기능과 효력을 발휘할 수 있도록 이른바 규범조화적 해석방법에 따라 심사하여야 한다.","src":"2022 법원직","a":true,"exp":"헌재 2007. 10. 25. 2005헌바96"},{"set":5,"num":30,"q":"특별검사에 의한 수사대상을 특정인에 대한 특정 사건으로 한정하고 있는 ｢한나라당 대통령 후보 이명박의 주가조작 등 범죄혐의의 진상규명을 위한 특별검사의 임명 등에 관한 법률｣은 처분적 법률의 성격을 갖는다.","src":"2014 사법시험","a":true,"exp":"헌재 2008.1.10. 2007헌마1468"},{"set":5,"num":31,"q":"폐지대상인 ｢세무대학설치법｣ 자체가 이미 처분법률에 해당하는 것이라고 하더라도, 이를 폐지하는 법률도 당연히 그에 상응하여 처분법률의 형식을 띨 수밖에 없는 것은 아니다.","src":"2024 국가직 7급","a":false,"exp":"세무대학설치법 폐지 법률은 세무대학설치의 법적 근거로 제정된 기존의 세무대학설치법을 폐지함으로써 세무대학을 폐교하는 법적 효과를 발생하는 것이므로, 동법은 세무대학과 그 폐지만을 규율목적으로 삼는 처분법률의 형식을 띤다. 그러나 이와 같은 처분법률의 형식은 폐지대상인 세무대학설치법 자체가 이미 처분법률에 해당하는 것이므로, 이를 폐지하는 법률도 당연히 그에 상응하여 처분법률의 형식을 띨 수밖에 없는 필연적 현상이다(헌재2001. 2. 22. 99헌마613)."},{"set":5,"num":32,"q":"기본권 제한에 관한 법률유보의 원칙은 ‘법률에 근거한 규율’뿐만 아니라 ‘법률에 의한 규율’을 요청하는 것이므로, 기본권의 제한에는 법률의 근거가 필요할 뿐만 아니라 기본권 제한의 형식도 법률의 형식일 것을 요한다.","src":"2021 변호사시험","a":false,"exp":"법률유보의 원칙은 ‘법률에 의한 규율’을 요청하는 것이 아니라 ‘법률에 근거한 규율’을 요청하는 것이기 때문에 기본권의 제한에는 법률의 근거가 필요할 뿐이고 기본권 제한의 형식이 반드시 법률의 형식일 필요는 없 는 것이다. (헌재 2003. 11. 27. 2002헌마193)"},{"set":5,"num":33,"q":"비례의 원칙은 법치국가 원리에서 당연히 파생되는 헌법상의 기본원리로서, 모든 국가작용에 적용된다.","src":"2025 법원직","a":true,"exp":"비례의 원칙은 법치국가 원리에서 당연히 파생되는 헌법상의 기본원리로서, 모든 국가작용에 적용된다. 행정목적을 달성하기 위한 수단은 목적달성에 유효·적절하고, 가능한 한 최소침해를 가져오는 것이어야 하며, 아울러 그 수단의 도입에 따른 침해가 의도하는 공익을 능가하여서는 안 된다(대법원 2019. 7. 11. 2017두38874)."},{"set":5,"num":34,"q":"침해의 최소성의 관점에서, 입법자는 그가 의도하는 공익을 달성하기 위하여 우선 기본권을 보다 적게 제한하는 단계인 기본권 행사의 ‘방법’에 관한 규제로써 공익을 실현할 수 있는가를 시도하고, 이러한 방법으로는 공익달성이 어렵다고 판단되는 경우에 비로소 그 다음 단계인 기본권 행사의 ‘여부’에 관한 규제를 선택해야 한다.","src":"2015 변호사시험","a":true,"exp":"헌재 1998.5.28. 96헌가5"},{"set":5,"num":35,"q":"입법자가 선택한 수단보다 국민의 기본권을 덜 침해하는 수단이 존재하더라도 그 다른 수단이 효과 측면에서 입법자가 선택한 수단과 동등하거나 유사하다고 단정할 만한 명백한 근거가 없는 이상 과잉금지원칙에 위반된다고는 할 수 없다.","src":"2024 경정승진","a":true,"exp":"이 사건 토지를 농업인인 제3자에게 처분할 수 있도록 종중 명의의 등기를 허용한 후에 농지법상의 처분명령이나이행강제금 제도를 이용해 경자유전의 원칙을 실현하면서도 재산권 제한을 최소화할 수 있음에도 불구하고, 그러한 방법을 두지 않은 것이 최소침해원칙에 반하는지가 문제될 수 있다. 그러나 과잉금지원칙의 한 내용인 최소침해원칙은 입법목적의 달성에 있어 동일한 효과를 나타내는 수단 중에서 되도록 당사자의 기본권을 덜 침해하는 수단을 채택하라는 헌법적 요구로서, 설령 입법자가 택한 수단보다 국민의 기본권을 덜 침해하는 수단이 존재하더라도 그 다른 수단이 효과 측면에서 입법자가 선택한 수단과 동등하거나 유사하다고 단정할 만한 명백한 근거가 없는 이상, 과잉금지원칙에 위반된다고는 할 수 없다(헌재 2012. 8. 23. 2010헌가65)."},{"set":5,"num":36,"q":"기본권의 본질적 내용은 만약 이를 제한하는 경우에는 기본권 그 자체가 무의미하여지는 경우에 그 본질적인 요소를 말하는 것으로서, 이는 개별 기본권마다 다를 수 있다.","src":"2025
