 이용자의 익명표현의 자유와 개인정보자기결정권, 인터넷언론사의 언론의 자유를 침해한다(헌재 2021. 1. 28. 2018헌마456)."},{"set":10,"num":37,"q":"공공기관 등이 설치·운영하는 모든 게시판에 본인확인조치를 한 경우에만 정보를 게시하도록 하는 것은 게시판에 자신의 사상이나 견해를 표현하고자 하는 사람에게 표현의 내용과 수위 등에 대한 자기검열 가능성을 높이는 것이므로 익명표현의 자유를 침해한다.","src":"2024 경찰간부","a":false,"exp":"공공기관등이 게시판을 설치⋅운영하려면 그 게시판 이용자의 본인 확인을 위한 조치를 하도록 정한 법률조항은 익명표현의 자유를 침해하지 않는다(헌재 2022. 12. 22. 2019헌마654)."},{"set":10,"num":38,"q":"변호사법 제23조 제2항 제7의 위임을 받아 변호사 광고에 관한 구체적인 규제 사항 등을 정한 대한변호사협회의 ‘변호사 광고에 관한 규정’은 헌법소원심판의 대상이 되는 공권력의 행사에 해당한다.","src":"2025 법원직","a":true,"exp":"헌재 2022. 5. 26 2021헌마619"},{"set":10,"num":39,"q":"‘변호사 광고에 관한 규정’의 직접적인 수범자는 변호사로서, 법률서비스 온라인 플랫폼을 운영하며 변호사의 광고 등에 관한 영업행위를 하고 있는 업체는 ‘변호사 광고에 관한 규정’에 관한 기본권침해의 자기관련성이 인정되지 아니한다.","src":"2025 법원직","a":false,"exp":"법률서비스 온라인 플랫폼을 운영하며 변호사등의 광고ㆍ홍보ㆍ소개 등에 관한 영업행위를 하고 있는 청구인 회사는 이 사건 규정의 직접적인 수범자인 변호사의 상대방으로서 변호사가 준수해야 하는 광고방법, 내용 등의 제약을 그대로 이어받게 된다. 이는 실질적으로는 변호사등과 거래하는 위와 같은 사업자의 광고 수주 활동을 제한하거나 해당 부문 영업을 금지하는 것과 다르지 않은 점, 이 사건 규정 개정 목적의 가장 주요한 것이 청구인 회 사가 운영하는 것과 같은 온라인 플랫폼을 규제하는 것이었던 점 등에 비추어 보면, 이 사건 규정은 청구인 회사의 영업의 자유 내지 법적 이익에 불리한 영향을 주는 것이므로, 기본권침해의 자기관련성을 인정할 수 있다(헌재 2022. 5. 26 2021헌마619)."},{"set":10,"num":40,"q":"변호사 또는 소비자로부터 대가를 받고 법률상담 또는 사건들을 소개·알선·유인하기 위하여 변호사등을 광고·홍보·소개하는 행위를 금지하는 대한변호사협회의 ‘변호사광고에 관한 규정’ 중 대가수수 광고금지규정은 과잉금지원칙을 위반하여 청구인들의 표현의 자유를 침해한다.","src":"2024 경찰간부","a":true,"exp":"변호사광고에 대한 합리적 규제는 필요하지만, 광고표현이 지닌 기본권적 성질을 고려할 때 광고의 내용이나 방 법적 측면에서 꼭 필요한 한계 외에는 폭넓게 광고를 허용하는 것이 바람직하다. 각종 매체를 통한 변호사 광고를 원칙적으로 허용하는 변호사법 제23조 제1항의 취지에 비추어 볼 때, 변호사등이 다양한 매체의 광고업자에게 광고비를 지급하고 광고하는 것은 허용된다고 할 것인데, 이러한 행위를 일률적으로 금지하는 위 규정은 수단의 적합성을 인정하기 어렵다. 따라서 대가를 받고 변호사등을 광고·홍보·소개하는 행위를 금지한 규정은 과잉금지원칙에 위반되어 변호사들과 법률서비스 온라인 플랫폼 사업자의 표현의 자유, 직업의 자유를 침해한다(헌재 2022. 5. 26 2021헌마619)."},{"set":10,"num":41,"q":"인터넷신문의 언론으로서의 신뢰성을 제고하기 위해 5인 이상의 취재 및 편집 인력을 정식으로 고용하도록 강제하고, 이에 대한 확인을 위하여 국민연금 등 가입사실을 확인하는 것은 언론의 자유를 침해한다고 할 수 없다.","src":"2022 국가직 7급","a":false,"exp":"고용조항 및 확인조항은 5인 이상 취재 및 편집 인력을 고용하되, 그 확인을 위해 등록 시 서류를 제출하도록 하고 있다. ... 소규모 인터넷신문이 언론으로서 활동할 수 있는 기회 자체를 원천적으로 봉쇄할 수 있음에 비하여, 인터넷신문의 신뢰도 제고라는 입법목적의 효과는 불확실하다는 점에서 법익의 균형성도 잃고 있다. 따라서 고용조항 및 확인조항은 과잉금지원칙에 위배되어 청구인들의 언론의 자유를 침해한다(헌재 2016. 10. 27. 2015헌마1206)."},{"set":10,"num":42,"q":"표현의 자유와 명예보호 사이의 한계를 설정함에 있어서 그 표현으로 인한 피해자가 공적인 존재인지 사적인 존재인지, 그 표현이 공적인 관심 사안에 관한 것인지 순수한 사적인 영역에 속하는 사안에 관한 것인지, 그 표현이 객관적으로 국민이 알아야 할 공공성, 사회성을 갖춘 사안에 관한 것으로 여론형성이나 공개토론에 기여하는 것인지 아닌지 등을 가려서 심사기준에 차이를 두어야 한다.","src":"2025 법원직","a":true,"exp":"헌재 2025. 5. 29. 2022헌마154,"},{"set":11,"num":1,"q":"집회는 일정한 장소를 전제로 하여 특정 목적을 가진 다수인이 일시적으로 회합하는 것을 말하는 것으로, 여기서 의 다수인이 가지는 공동의 목적은 ‘내적인 유대 관계’로 족하지 않고 공통의 의사형성과 의사표현이라는 공동의 목적이 포함되어야 한다.","src":"2023 법원직","a":false,"exp":"일반적으로 집회는, 일정한 장소를 전제로 하여 특정 목적을 가진 다수인이 일시적으로 회합하는 것을 말하는 것으로 일컬어지고 있고, 그 공동의 목적은 ‘내적인 유대 관계’로 족하다(헌재 2009. 5. 28. 2007헌바22)."},{"set":11,"num":2,"q":"｢집회 및 시위에 관한 법률｣상의 시위는 반드시 ‘일반인이 자유로이 통행할 수 있는 장소’에서 이루어져야 하며 ‘행진’ 등 장소 이동을 동반해야만 성립한다.","src":"2024 경찰 제1차","a":false,"exp":"“공중이 자유로이 통행할 수 있는 장소”라는 장소적 제한개념은 모든 시위에 적용되는 “시위”개념의 필요불가결한 요소는 아니다. 그러므로 공중이 자유로이 통행할 수 없는 장소인 대학구내에서의 시위도 그것이 “위력 또는 기세를 보여 불특정다수인의 의견에 영향을 주거나 제압을 가하는 행위”에 해당하면 바로 집시법상의 시위로서 집시법의 규제대상이 되는 것이다. (헌재 1994. 4. 28. 91헌바14)"},{"set":11,"num":3,"q":"2인이 모인 집회도 집시법의 규제 대상이 된다.","src":"2023 변호사시험","a":true,"exp":"집회 및 시위에 관한 법률에 의하여 보장 및 규제의 대상이 되는 집회란 ‘특정 또는 불특정 다수인이 공동의 의견을 형성하여 이를 대외적으로 표명할 목적 아래 일시적으로 일정한 장소에 모이는 것’을 말하고, 모이는 장소나 사람의 다과에 제한이 있을 수 없으므로, 2인이 모인 집회도 위 법의 규제 대상이 된다고 보아야 한다(대법원 2012. 5. 24. 2010도11381)."},{"set":11,"num":4,"q":"｢집회 및 시위에 관한 법률｣이 옥외집회와 옥내집회를 구분하는 이유는, 옥외집회의 경우 외부세계, 즉 다른 기본권의 주체와 직접적으로 접촉할 가능성으로 인하여 옥내집회와 비교할 때 법익충돌의 위험성이 크다는 점에서 집회의 자유의 행사방법과 절차에 관하여 보다 자세하게 규율할 필요가 있기 때문이다.","src":"2024 지방직 7급","a":true,"exp":"헌재 2003. 10. 30. 2000헌바67"},{"set":11,"num":5,"q":"누구든지 헌법재판소의 결정에 따라 해산된 정당의 목적을 달성하기 위한 집회 또는 시위를 주최하여서는 아니 된다.","src":"2022 지방직 7급","a":true,"exp":"집시법 제5조 제1항 제1호"},{"set":11,"num":6,"q":"‘집회 및 시위에 관한 법률’은 종교에 관한 집회에는 옥외집회 및 시위의 신고제를 적용하지 아니한다.","src":"2022 법원직","a":true,"exp":"학문, 예술, 체육, 종교, 의식, 친목, 오락, 관혼상제 및 국경행사에 관한 집회에는 제6조부터 제12조까지의 규정을 적용하지 아니한다(집시법 제15조)."},{"set":11,"num":7,"q":"헌법 제21조제2항에서 규정한 집회의 허가제 금지는 헌법 자체에서 직접 집회의 자유에 대한 제한의 한계를 명시한 것이므로 기본권 제한에 관한 일반적 법률유보조항인 헌법 제37조제2항에 앞서서, 우선적이고 제1차적인 위헌 심사기준이 되어야 한다.","src":"2024 지방직 7급","a":true,"exp":"헌재 2009. 9. 24. 2008헌가25"},{"set":11,"num":8,"q":"막연히 폭력·불법적이거나 돌발적인 상황이 발생할 위험이 있다는 가정만을 근거로 하여 대통령 관저 인근이라는 특정한 장소에서 열리는 모든 집회를 금지하는 것은 헌법적으로 정당화되기 어렵다.","src":"2024 경찰간부","a":true,"exp":"막연히 폭력·불법적이거나 돌발적인 상황이 발생할 위험이 있다는 가정만을 근거로 하여 대통령 관저 인근에서 열리는 모든 집회를 금지하는 것은 정당화되기 어렵다. 따라서 대통령 관저 인근에서 집회를 금지하고 이를 위반하여 집회를 주최한 자를 처벌하는 ‘집회 및 시위에 관한 법률’조항은 과잉금지원칙에 위배되어 집회의 자유를 침해한다(헌재 2022. 12. 22. 2018헌바48)."},{"set":11,"num":9,"q":"국회의장 공관의 경계지점으로부터 100미터 이내의 장소에서의 옥외집회 또는 시위를 일률적으로 금지하고, 이를 위반한 집회․시위의 참가자를 처벌하는 것은 해당 장소에서 옥외집회․시위가 개최되더라도 국회의장에게 물리적 위해를 가하거나 국회의장 공관으로의 출입 내지 안전에 위협을 가할 우려가 없는 장소까지 포함되어 있다는 점에서 입법목적 달성에 필요한 범위를 넘어 집회의 자유를 과도하게 제한하는 것으로 집회의 자유를 침해한다.","src":"2023 법원직","a":true,"exp":"헌재 2023. 3. 23. 2021헌가1"},{"set":11,"num":10,"q":"국내 주재 외교기관 인근의 옥외집회 또는 시위를 예외적으로 허용하는 구｢집회 및 시위에 관한 법률｣ 제11조제4호 중 ‘국내 주재 외국의 외교기관’에 관한 부분은 행정청이 주체가 되어 집회의 허용 여부를 사전에 결정하는 것이므로 헌법 제21조제2항의 허가제금지에 위배된다.","src":"2024 국가직 7급","a":false,"exp":"헌법 제21조 제2항의 ‘허가’는 ‘행정청이 주체가 되어 집회의 허용 여부를 사전에 결정하는 것’으로서 행정청에 의한 사전허가는 헌법상 금지되지만, 입법자가 법률로써 일반적으로 집회를 제한하는 것은 헌법상 ‘사전허가금지’에 해당하지 않는다. 심판대상조항은 입법자가 법률로써 직접 집회의 장소적 제한을 규정한 것으로, 행정청이 주체가 되어 집회의 허용 여부를 사전에 결정하는 것이 아니므로 헌법 제21조 제2항의 허가제 금지에 위배되지 않는다(헌재 2023. 7. 20. 2020헌바131)."},{"set":11,"num":11,"q":"외교기관 인근의 옥외집회ㆍ시위를 원칙적으로 금지하면서도 외교기관의 기능을 침해할 우려가 없는 예외적인 경우에는 허용하고 있다면 집회의 자유를 침해하는 것은 아니다.","src":"2020 지방직 7급","a":true,"exp":"헌재 2010.10.28. 2010헌마111"},{"set":11,"num":12,"q":"집회의 금지와 해산은 집회의 자유를 보다 적게 제한하는 다른 수단, 즉 조건을 붙여 집회를 허용하는 가능성을 모두 소진한 후에 비로소 고려될 수 있는 최종적인 수단이다.","src":"2024 지방직 7급","a":true,"exp":"집회의 금지와 해산은 원칙적으로 공공의 안녕질서에 대한 직접적인 위협이 명백하게 존재하는 경우에 한하여 허용될 수 있다. 집회의 금지와 해산은 집회의 자유를 보다 적게 제한하는 다른 수단, 즉 조건을 붙여 집회를 허용하는 가능성을 모두 소진한 후에 비로소 고려될 수 있는 최종적인 수단이다(헌재 2003. 10. 30. 2000헌바67)."},{"set":11,"num":13,"q":"집회의 금지는 원칙적으로 공공의 안녕질서에 대한 직접적인 위협이 명백하게 존재하는 경우에 한하여 허용될 수 있다. 집회의 금지는 집회의 자유를 보다 적게 제한하는 다른 수단, 즉 집회참가자의 수의 제한, 집회 대상과의거리 제한, 집회 방법·시기·소요 시간의 제한 등과 같은 조건을 붙여 집회를 허용하는 가능성을 모두 소진한 후에 비로소 고려될 수 있는 최종적인 수단이다.","src":"2025 법원직","a":true,"exp":"헌재 2003. 10. 30. 2000헌바67"},{"set":11,"num":14,"q":"집시법에서 미신고 옥외집회를 해산명령 대상으로 정하면서 별도의 해산요건을 규정하고 있지 않더라도, 옥외집회 로 인하여 타인의 법익이나 공공의 안녕질서에 대한 직접적인 위험이 명백하게 초래된 경우에 한하여 해산을 명할 수 있다.","src":"2023 변호사시험","a":true,"exp":"대법원 2012. 4. 19. 2010도6388"},{"set":11,"num":15,"q":"누구든지 선거기간 중 선거에 영향을 미치게 하기 위하여 그 밖의 집회나 모임을 개최할 수 없고, 이를 위반한 자를 처벌하도록 규정한 공직선거법 조항은 선거기간 중에도 국민들이 제기하는 건전한 비판과 여론 형성을 금지하는 것은 아니므로 집회의 자유를 침해한다고 할 수 없다.","src":"2025 법원직","a":false,"exp":"집회의 금지는 원칙적으로 공공의 안녕질서에 대한 직접적인 위협이 명백하게 존재하는 경우에 한하여 허용될 수 있다. 그럼에도 불구하고 집회개최 금지조항은 선거의 공정과 평온에 대한 위험 상황이 구체적으로 존재하지 않는 경우까지도 예외 없이 선거에 영향을 미치게 하기 위한 선거기간 중의 집회나 모임을 금지하고 있는바, 이 는 입법목적의 달성에 필요한 범위를 넘는 과도한 제한이다. ... 선거기간 중 선거에 영향을 미치게 하기 위하여 ‘그 밖의 집회나 모임’을 개최할 수 없다고 규정한 것은 과잉금지원칙에 반하여 집회의 자유, 정치적 표현의 자유를 침해한다(헌재 2022. 7. 21. 2018헌바357)."},{"set":11,"num":16,"q":"근접촬영과 달리 먼 거리에서 집회ㆍ시위 현장을 전체적으로 촬영하는 소위 조망촬영이 기본권을 덜 침해하는 방법이라는 주장도 있으나, 최근 기술의 발달로 조망촬영과 근접촬영 사이에 기본권 침해라는 결과에 있어서 차이가 있다고 보기 어려워, 경찰이 집회ㆍ시위에 대해 조망촬영이 아닌 근접촬영을 하였다는 이유만으로 헌법에 위반되는 것은 아니다.","src":"2023 국가직 7급","a":true,"exp":"헌재 2018. 8. 30. 2014헌마843"},{"set":11,"num":17,"q":"구 ｢주택건설촉진법｣ 상의 주택조합은 주택이 없는 국민의 주거생활의 안정을 도모하고 모든 국민의 주거수준 향상을 기한다는 공공목적을 위하여 법이 구성원의 자격을 제한적으로 정해 놓은 특수조합이어서, 이는 헌법상 결사의 자유가 뜻하는 헌법상 보호법익의 대상이 되는 단체가 아니다.","src":"2017 국가직 7급","a":true,"exp":"헌법 제21조 제1항이 보장하고 있는 결사의 자유에 의하여 보호되는 “결사”개념에는 법이 특별한 공공목적에 의하여 구성원의 자격을 정하고 있는 특수단체의 조직활동까지 그에 해당하는 것으로 볼 수 없다. 주택건설촉진법상의 주택조합은 주택이 없는 국민의 주거생활의 안정을 도모하고 모든 국민의 주거수준의 향상을 기한다는 공공목적을 위하여 법이 구성원의 자격을 제한적으로 정해 놓은 특수조합이어서 이는 헌법상의 결사의 자유가 뜻하는 헌법상 보호법익의 대상이 되는 단체가 아니다(헌재 1994. 2. 24. 92헌바43)."},{"set":11,"num":18,"q":"지역농협 이사 선거의 경우 문자메시지를 포함한 전화 및 전자우편을 포함한 컴퓨터통신을 이용한 지지 호소의 선거운동방법을 금지하고 이를 위반한 자를 처벌하는 법률조항은, 선거가 과열되는 과정에서 후보자들의 경제력 차이에 따른 불균형한 선거운동 및 흑색선전을 통한 부당한 경쟁이 이루어짐으로써 선거의 공정이 해쳐지는 것을 방지하기 위한 것으로 결사의 자유를 침해하지 아니한다.","src":"2017 국가직 7급","a":false,"exp":"지역농협 이사 선거의 경우 전화·컴퓨터통신을 이용한 지지 호소의 선거운동방법을 금지하는 것은 결사의 자유와 표현의 자유를 침해한다. (헌재 2016. 11. 24. 2015헌바62)"},{"set":11,"num":19,"q":"공적인 역할을 수행하는 결사 또는 그 구성원들이 결사의 자유의 침해를 주장하는 경우, 과잉금지원칙 위반 여부를 판단함에 있어 순수한 사적인 임의결사의 결사의 자유가 제한되는 경우와 동일한 기준을 적용하여야 한다.","src":"2022 변호사시험","a":false,"exp":"공적인 역할을 수행하는 결사 또는 그 구성원들이 기본권의 침해를 주장하는 경우 과잉금지원칙 위반 여부를 판단함에 있어, 순수한 사적인 임의결사의 기본권이 제한되는 경우에 비하여 완화된 기준을 적용할 수 있다(헌재 2018. 2. 22. 2016헌바364)."},{"set":11,"num":20,"q":"헌법상 보장하고 있는 재산권은 경제적 가치가 있는 모든 공법상․사법상의 권리를 뜻한다.","src":"2024 법원직","a":true,"exp":"헌재 2000. 6. 29. 99헌마289"},{"set":11,"num":21,"q":"우리 헌법의 재산권 보장은 사유재산의 처분과 그 상속을 포함하는 것인바, 유언자가 생전에 최종적으로 자신의 재산권에 대하여 처분할 수 있는 법적 가능성을 의미하는 유언의 자유는 생전증여에 의한 처분과 마찬가지로 헌법상 재산권의 보호를 받는다.","src":"2023 법원직","a":true,"exp":"헌재 2008.12.26. 2007헌바128"},{"set":11,"num":22,"q":"건강보험수급권은 가입자가 납부한 보험료에 대한 반대급부의 성격을 가지며, 보험사고로 초래되는 재산상 부담을 전보하여 주는 경제적 유용성을 가지므로, 헌법상 재산권의 보호범위에 속한다고 볼 수 있다.","src":"2023 경찰간부","a":true,"exp":"헌재 2020. 4. 23. 2017헌바244"},{"set":11,"num":23,"q":"의료급여수급권은 공공부조의 일종으로서 순수하게 사회정책적 목적에서 주어지는 권리이므로 개인의 노력과 금전적 기여를 통하여 취득되는 재산권의 보호대상에 포함된다고 보기 어렵다.","src":"2020 국가직 7급","a":true,"exp":"헌재 2017. 12. 28. 2016헌바249"},{"set":11,"num":24,"q":"영리획득의 기회나 기업활동의 사실적·법적 여건의 경우에도 그것이 기업에게 중요한 의미를 갖는다면 재산권 보장의 대상이 된다.","src":"2019 법원행시","a":false,"exp":"헌법상 보장된 재산권은 원래 사적 유용성 및 그에 대한 원칙적인 처분권을 내포하는 재산가치 있는 구체적인 권리이므로 구체적 권리가 아닌 영리획득의 단순한 기회나 기업활동의 사실적·법적 여건은 기업에게는 중요한 의미를 갖는다고 하더라도 재산권 보장의 대상이 아니다(헌재 2005. 11. 24. 2004헌마536)."},{"set":11,"num":25,"q":"최저임금을 인상하는 내용의 고시는 근로자에게 지급하여야 할 임금 증가, 생산성 저하, 이윤 감소 등 사업자에게불이익을 겪게 할 우려가 있으므로 사업자의 재산권을 제한한다.","src":"2023 변호사시험","a":false,"exp":"최저임금을 인상하는 내용의 고시로 인하여 계약의 자유와 기업의 자유를 제한 받는 결과 근로자에게 지급하여야 할 임금이 늘어나거나 생산성 저하, 이윤 감소 등 불이익을 겪을 우려가 있거나, 그 밖에 사업상 어려움이 발생할 수 있다고 하더라도 이는 기업활동의 사실적·법적 여건에 관한 것으로 재산권 침해는 문제되지 않는다(헌재 2019. 12. 27. 2017헌마1366)."},{"set":11,"num":26,"q":"헌법 제23조에서 보장하는 재산권은 사적 유용성 및 그에 대한 원칙적 처분권을 내포하는 재산가치 있는 구체적 권리이므로, 구체적인 권리가 아닌 단순한 이익이나 재화의 획득에 관한 기회 또는 기업활동의 사실적ㆍ법적 여건 등은 재산권보장의 대상에 포함되지 아니한다. 구 감염병의 예방 및 관리에 관한 법률 제49조 제1항 제2호에 근거한 집합제한 조치로 인하여 청구인들의 일반음식점 영업이 제한되어 영업이익이 감소되었음에도 그에 대한 보상규정을 두지 않은 것은 청구인들의 재산권을 제한한다.","src":"2026 법원직","a":false,"exp":"감염병예방법에 근거한 집합제한 조치로 인하여 청구인들의 일반음식점 영업이 제한되어 영업이익이 감소되었다 하더라도, 청구인들이 소유하는 영업 시설ㆍ장비 등에 대한 구체적인 사용ㆍ수익 및 처분권한을 제한받는 것은 아니므로, 보상규정의 부재가 청구인들의 재산권을 제한한다고 볼 수 없다(헌재 2023. 6. 29. 2020헌마1669)."},{"set":11,"num":27,"q":"‘사업인정고시가 있은 후에 3년 이상 토지가 공익용도로 사용된 경우’ 토지소유자에게 매수 혹은 수용청구권을 인정한 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」의 조항을 통하여 인정되는 ‘수용청구권’은 사적유용성을 지닌 것으로서 재산의 사용, 수익, 처분에 관계되는 법적 권리이므로 헌법상 재산권에 포함된다.","src":"2022 경정승진","a":true,"exp":"헌재 2005. 7. 21. 2004헌바57"},{"set":11,"num":28,"q":"불법적인 사용의 경우에 인정되는 수용청구권은 재산권에 포함된다.","src":"2023 경찰간부","a":false,"exp":"토지보상법 조항조항을 통하여 적법한 공용사용의 경우에 인정되는 ‘수용청구권’은 사적유용성을 지닌 것으로서 재산의 사용, 수익, 처분에 관계되는 법적 권리이므로 헌법상 재산권에 포함된다. 그러나 위 조항은 적법한 공용사용의 경우에만 수용청구권을 인정하고 있으므로 청구인들이 주장하는 ‘불법적인 사용의 경우에 인정되는수용청구권’이란 재산권은 입법자에 의하여 인정된바 없다. 그러므로 재산권에 포함되지 않는다(헌재 2005. 7. 21. 2004헌바57)."},{"set":11,"num":29,"q":"농지의 경우 그 사회성과 공공성의 정도는 일반적인 토지의 경우와 동일하므로, 농지 재산권을 제한하는 입법에 대한 헌법심사의 강도는 다른 토지 재산권을 제한하는 입법에 대한 것보다 낮아서는 아니 된다.","src":"2021 지방직 7급","a":false,"exp":"토지재산권에 대하여는 강한 사회성 내지는 공공성으로 말미암아 다른 재산권에 비하여 더 강한 제한과 의무가부과될 수 있으나, 그렇다고 하더라도 토지재산권에 대한 제한입법 역시 다른 기본권을 제한하는 입법과 마찬가지로 과잉금지의 원칙을 준수해야 하고, 재산권의 본질적 내용인 사용ㆍ수익권과 처분권을 부인해서는 아니 된 다. 다만 농지의 경우 그 사회성과 공공성은 일반적인 토지의 경우보다 더 강하다고 할 수 있으므로, 농지 재산권을 제한하는 입법에 대한 헌법심사의 강도는 다른 토지 재산권을 제한하는 입법에 대한 것보다 낮다고 봄이 상당하다(헌재 2010. 2. 25. 2010헌바39)."},{"set":11,"num":30,"q":"법률에서 군법무관의 봉급과 그 밖의 보수를 법관 및 검사의 예에 준하여 지급하도록 하는 대통령령을 제정할 것을 규정하였다 하더라도, 군복무를 하고 있는 군장교들은 전투력의 확보를 위한 특수집단의 한 구성요소이므로 군조직 밖의 기준으로 군조직의 다른 요소와 분리시켜 기본적인 보수에 있어 우대적 차별을 하는 것은 불합리하므로, 대통령이 지금까지 해당 대통령령을 제정하지 않는다 하더라도 이는 군법무관의 재산권을 침해하지 아니한다.","src":"2023 법원직","a":false,"exp":"법률이 군법무관의 보수를 판사, 검사의 예에 의하도록 규정하면서 그 구체적 내용을 시행령에 위임하고 있다면, 이는 군법무관의 보수의 내용을 법률로써 일차적으로 형성한 것이고, 따라서 상당한 수준의 보수청구권이 인정되는 것이라 해석함이 상당하다. 그러므로 이 사건에서 대통령이 법률의 명시적 위임에도 불구하고 지금까지 해당 시행령을 제정하지 않아 그러한 보수청구권이 보장되지 않고 있다면 그러한 입법부작위는 정당한 이유 없이 청구인들의 재산권을 침해하는 것으로써 헌법에 위반된다(헌재 2004. 2. 26. 2001헌마718)."},{"set":11,"num":31,"q":"환매권의 발생기간을 제한하고 있는 ｢공익사업을 위한 토지 등의 취득 및 보상에 관한 법률｣ 조항 중 ‘토지의 협의취득일 또는 수용의 개시일부터 10년 이내에’ 부분의 위헌성은 헌법상 재산권인 환매권의 발생기간을 제한한 것 자체에 있다.","src":"2023 국가직 7급","a":false,"exp":"토지의 협의취득일 또는 수용의 개시일로부터 10년 이내로 환매권의 발생기간을 제한하는 것은 재산권을 침해한다. 다만 이 사건 법률조항의 위헌성은 환매권의 발생기간을 제한한 것 자체에 있다기보다는 그 기간을 10년 이내로 제한한 것에 있다(헌재 2020. 11. 26. 2019헌바131)."},{"set":11,"num":32,"q":"재산권 제한으로 인하여 토지소유자가 종래의 지목과 토지현황에 의한 이용방법에 따른 토지의 사용도 할 수 없거나 실질적으로 토지의 사용․수익을 전혀 할 수 없는 경우에는, 그러한 재산권 제한은 토지소유자가 수인해야 할 사회적 제약의 범주를 넘는 것으로서 손실을 완화하는 보상적 조치가 있어야 비례원칙에 부합한다.","src":"2021 지방직 7급","a":true,"exp":"개발제한구역 지정으로 인하여 토지를 종래의 목적으로도 사용할 수 없거나 또는 더 이상 법적으로 허용된 토지 이용의 방법이 없기 때문에 실질적으로 토지의 사용·수익의 길이 없는 경우에는 토지소유자가 수인해야 하는 사회적 제약의 한계를 넘는 것으로 보아야 한다. 종래의 지목과 토지현황에 의한 이용방법에 따른 토지의 사용도 할 수 없거나 실질적으로 사용·수익을 전혀 할 수 없는 예외적인 경우에도 아무런 보상 없이 이를 감수하도록하고 있는 한, 비례의 원칙에 위반되어 당해 토지소유자의 재산권을 과도하게 침해하는 것으로서 헌법에 위반된다(헌재 1998. 12. 24. 89헌마214)."},{"set":11,"num":33,"q":"｢가축전염병 예방법｣에 따른 가축의 살처분으로 인한 재산권의 제약은 가축의 소유자가 수인해야 하는 사회적 제약의 범위에 속하나, 권리자에게 수인의 한계를 넘어 가혹한 부담이 발생하는 예외적인 경우에는 이를 완화하는 보상규정을 두어야 하고, 그 방법에 관하여는 입법자에게 광범위한 형성의 자유가 부여된다.","src":"2024 국가직 7급","a":true,"exp":"가축의 살처분으로 인한 재산권의 제약은 가축의 소유자가 수인해야 하는 사회적 제약의 범위에 속하나, 권리자에게 수인의 한계를 넘어 가혹한 부담이 발생하는 예외적인 경우에는 이를 완화하는 보상규정을 두어야 하고, 그 방법에 관하여는 입법자에게 광범위한 형성의 자유가 부여된다. 그런데 축산계열화사업자가 가축의 소유자라 하여 살처분보상금을 오직 계약사육농가에만 지급하는 방식은 축산계열화사업자에 대한 재산권의 과도한 부담을 완화하기에 적절한 조정적 보상조치라고 할 수 없다. 따라서 심판대상조항은 조정적 보상조치에 관하여 인정되는 입법형성재량의 한계를 벗어나 가축의 소유자인 축산계열화사업자의 재산권을 침해한다(헌재 2024. 5. 30. 2021헌가3)."},{"set":11,"num":34,"q":"가축전염병 예방법상의 살처분으로 인한 재산권의 제약은 헌법 제23조 제1항 및 제2항에 따라 가축 소유자가 부담하여야 하는 사회적 제약에 속하므로, 권리자에게 수인의 한계를 넘어 가혹한 부담이 발생하는 예외적인 경우에도 이를 완화하는 보상규정을 둘 필요는 없다.","src":"2025 법원직","a":false,"exp":"가축의 살처분으로 인한 재산권의 제약은 가축의 소유자가 수인해야 하는 사회적 제약의 범위에 속하나, 권리자에게 수인의 한계를 넘어 가혹한 부담이 발생하는 예외적인 경우에는 이를 완화하는 보상규정을 두어야 하고, 그 방법에 관하여는 입법자에게 광범위한 형성의 자유가 부여된다. (헌재 2024. 5. 30. 2021헌가3)."},{"set":11,"num":35,"q":"구 가축전염병예방법에 따른 살처분 명령은 가축의 전염병이 전파가능성과 위해성이 매우 커서 타인의 생명, 신체 나 재산에 중대한 침해를 가할 우려가 있는 경우 이를 막기 위해 취해지는 조치이므로, 살처분 명령으로 인한 재산권의 제약은 가축 소유자가 수인해야 하는 사회적 제약의 범위에 속한다고 보아야 한다.","src":"2026 법원직","a":true,"exp":"헌재 2024. 5. 30. 2021헌가3"},{"set":11,"num":36,"q":"사립학교 교원 또는 사립학교 교원이었던 자가 재직 중의 사유로 금고 이상의 형을 받은 때에는 대통령령이 정하는 바에 의하여 퇴직급여 및 퇴직수당의 일부를 감액하여 지급하도록 한 것은 입법목적을 달성하는 데 적합한 수단이라고 볼 수 없다.","src":"2019 국가직 7급","a":true,"exp":"헌재 2010. 7. 29. 2008헌가15"},{"set":11,"num":37,"q":"배우자의 상속공제를 인정받기 위한 요건으로 배우자상속재산분할기한까지 배우자의 상속재산을 분할하여 신고할것을 요구하면서 위 기한이 경과하면 일률적으로 배우자의 상속공제를 부인하고 있는 조항은 배우자인 상속인의 재산권을 침해한다고 볼 수 없다.","src":"2016 사법시험","a":false,"exp":"이 사건 법률조항은 피상속인의 배우자가 상속공제를 받은 후에 상속재산을 상속인들에게 이전하는 방법으로 부 의 무상이전을 시도하는 것을 방지하고 상속세에 대한 조세법률관계를 조기에 확정하기 위한 정당한 입법목적을 가진 것이나, 상속재산분할심판과 같이 상속에 대한 실체적 분쟁이 계속 중이어서 법정기한 내에 재산분할을 마치기 어려운 부득이한 사정이 있는 경우, 후발적 경정청구 등에 의해 그러한 심판의 결과를 상속세 산정에 추후반영할 길을 열어두지도 않은 채, 위 기한이 경과하면 일률적으로 배우자 상속공제를 부인함으로써 비례원칙에 위배되어 청구인들의 재산권을 침해하고, 나아가 소송계속 등 부득이한 사유로 법정기한 내에 상속분할을 마치지 못한 상속인들을 그렇지 아니한 자와 동일하게 취급하는 것으로서 그 차별의 합리성이 없으므로 청구인들의 평등권을 침해한다(헌재 2012.5.31. 2009헌바190)."},{"set":11,"num":38,"q":"피상속인의 형제자매의 유류분을 규정한 구 ｢민법｣ 제1112조 제4호는 피상속인 및 유류분반환청구의 상대방인 수증자 및 수유자의 재산권을 침해하지 않는다.","src":"2026 경정승진","a":false,"exp":"상속재산형성에 대한 기여나 상속재산에 대한 기대 등이 거의 인정되지 않는 피상속인의 형제자매에게까지 유류분을 인정하는 민법 제1112조 제4호 역시 불합리하고 기본권제한입법의 한계를 벗어나 헌법에 위반된다(헌재 2024. 4. 25. 2020헌가4)."},{"set":11,"num":39,"q":"개인의 존엄과 양성의 평등을 기초로 한 가족생활의 보장을 규정한 헌법 제36조 제1항에 비추어 볼 때, 유류분제도가 추구하는 유족의 생존권 보호, 상속재산형성에 대한 기여, 상속재산에 대한 기대보장 및 가족 간의 연대라는 공익은 매우 중요하므로, 형제자매까지 유류분권리자로 규정하고 있는 민법 제1112조 제4호로 인하여 피상속인과 수증자가 받는 재산권의 침해가 위와 같은 공익보다 더 중대하다고 볼 수 없다.","src":"2025 법원직","a":false,"exp":"개인의 존엄과 양성의 평등을 기초로 한 가족생활의 보장을 규정한 헌법 제36조 제1항에 비추어 볼 때, 심판대상조항에 따른 유류분제도가 추구하는 유족의 생존권 보호, 상속재산형성에 대한 기여, 상속재산에 대한 기대보장 및 가족 간의 연대라는 공익은 매우 중요하다. 다만, 형제자매까지 유류분권리자로 규정하고 있는 민법 제1112조 제4호, 유류분상실사유를 별도로 규정하지 않은 민법 제1112조 제1호부터 제3호 및 기여분에 관한 제1008조의2를 준용하지않음으로써 유류분과 기여분을 단절하는 민법 제1118조는 현저히 불합리하고 부당하여 이로 인해 피상속인과 수증자 (수유자)가 받는 재산권의 침해가 위 공익보다 더 중대하고 심각하다고 할 것이다. 따라서 위 조항들에 관하여는 법익균형성이 충족되지 않는다(헌재 2024. 4. 25. 2020헌가4)."},{"set":11,"num":40,"q":"구 ｢공직선거법｣에서 지방자치단체의 장 선거 예비후보자가 정당의 공천심사에서 탈락한 후 후보자등록을 하지 않은 경우를 기탁금 반환 사유로 규정하지 않은 것은 과잉금지원칙에 위배된다.","src":"2023 경찰간부","a":true,"exp":"예비후보자가 본선거의 정당후보자로 등록하려 하였으나 자신의 의사와 관계없이 정당 공천관리위원회의 심사에서 탈락하여 본선거의 후보자로 등록하지 아니한 것은 후보자 등록을 하지 못할 정도에 이르는 객관적이고 예외적인 사유에 해당한다. 따라서 이러한 사정이 있는 예비후보자가 납부한 기탁금은 반환되어야 함에도 불구하고, 기탁금을 반환하지 아니 하는 것은 입법형성권의 범위를 벗어난 과도한 제한이라고 할 수 있다. ... 지방자치단체의 장선거 예비후보자가 정당의 공천심사에서 탈락한 후 후보자등록을 하지 않은 경우를 기탁금 반환 사유로 규정하지 않은 것은 과잉금지원칙에 위배되어 재산권을 침해한다(헌재 2020. 9. 24. 2018헌가15)."},{"set":11,"num":41,"q":"지역구 국회의원 예비후보자의 기탁금 반환 사유를 예비후보자의 사망, 당내경선 탈락으로 한정하고 있는 구 공직선거법 해당 조항은 재산권을 침해한다.","src":"2024 법원직","a":true,"exp":"공직선거법은 예비후보자가 사망하거나 당내경선의 후보자로서 당내경선에서 당해 정당의 후보자로 선출되지 아니한 경우에만 납부한 기탁금 전액을 반환하도록 규정하고 있다. 그러나 예비후보자가 본선거의 정당후보자로 등록하려 하였으나 자신의 의사와 관계없이 정당 공천관리위원회의 심사에서 탈락하여 본선거의 후보자로 등록하지 아니한 것은 후보자 등록을 하지 못할 정도에 이르는 객관적이고 예외적인 사유에 해당한다. 따라서 이러한 사정이 있는 예비후보자가 납부한 기탁금은 반환되어야 함에도 불구하고, 기탁금을 반환하지 아니 하는 것은 입법형성권의 범위를 벗어난 과도한 제한이라고 할 수 있다. 따라서 예비후보자가 정당 공천관리위원회의 심사에서 탈락하여 본선거의 후보자로 등록하지 아니한 경우에 그가 납부한 기탁금 전액을 반환하지 아니하도록 하는 것 은 과잉금지원칙을 위반하여 재산권을 침해한다(헌재 2018. 1. 25. 2016헌마541)."},{"set":11,"num":42,"q":"지방의회의원으로 선출되어 받게 되는 보수가 기존의 연금에 미치지 못하는 경우에도 연금 전액의 지급을 정지하도록 정한 구｢공무원연금법｣ 조항은, 연금을 대체할 만한 적정한 소득이 있다고 할 수 없는 경우에도 일률적으로연금전액의 지급을 정지하여 지급정지제도의 본질 및 취지에 어긋나 과잉금지원칙에 위배되어 재산권을 침해한다.","src":"2023 국가직 7급","a":true,"exp":"헌재 2022. 1. 27. 2019헌바161"},{"set":11,"num":43,"q":"공무원연금법상 퇴직연금 수급자가 지방의회의원에 취임한 경우 연금 전부를 지급 정지하도록 한 구 공무원연금법상지급정지 조항은 과잉금지원칙에 위반된다고 할 수 없으므로, 퇴직연금 수급자의 재산권을 침해하지 않는다.","src":"2025 법원직","a":false,"exp":"퇴직공무원의 적정한 생계 보장이라는 공무원연금제도의 취지에 비추어, 연금 지급을 정지하기 위해서는 ‘연금을 대체할 만한 소득’이 전제되어야 한다. 지방의회의원이 받는 의정비 중 의정활동비는 의정활동 경비 보전을위한 것이므로, 연금을 대체할 만한 소득이 있는지 여부는 월정수당을 기준으로 판단하여야 한다. 퇴직연금수급자인 지방의회의원 중 약 4분의 3에 해당하는 의원이 퇴직연금보다 적은 액수의 월정수당을 받고, 2020년 기준월정수당이 정지된 연금월액보다 100만 원 이상 적은 지방의회의원도 상당 수 있다. 다른 나라의 경우 연금과보수 중 일부를 감액하는 방식으로 선출직에 취임하여 보수를 받는 것이 생활보장에 더 유리하도록 제도를 설계하고 있다. 따라서 기본권을 덜 제한하면서 입법목적을 달성할 수 있는 다양한 방법이 있으므로 이 사건 조항은 침해의 최소성 요건을 충족하지 못하고, 법익의 균형성도 충족하지 못한다. 그러므로 이 사건 조항은 과잉금지원칙에 위배되어 청구인들의 재산권을 침해하므로 헌법에 위반된다(헌재 2022. 1. 27. 2019헌바161)."},{"set":11,"num":44,"q":"의료급여기관이 ｢의료법｣ 제33조제2항을 위반하였다는 사실을 수사기관의 수사결과로 확인한 경우 시장ㆍ군수ㆍ구청장으로 하여금 해당 의료급여기관이 청구한 의료급여비용의 지급을 보류할 수 있도록 규정한 ｢의료급여법｣ 조항 중 ‘의료법 제33조제2항’에 관한 부분은 과잉금지원칙에 반하여 의료급여기관 개설자의 재산권을 침해한다.","src":"2024 국가직 7급","a":true,"exp":"지급보류처분은 잠정적 처분이고, 그 처분 이후 사무장병원에 해당하지 않는다는 사실이 밝혀져서 무죄판결의 확 정 등 사정변경이 발생할 수 있으므로, 지급보류처분의 ‘처분요건’뿐만 아니라 위와 같은 사정변경이 발생할 경우 잠정적인 지급보류상태에서 벗어날 수 있는 ‘지급보류처분의 취소’에 관하여도 명시적인 규율이 필요하고, 그 ‘취소사유’는 ‘처분요건’과 균형이 맞도록 규정되어야 한다. 또한 사정변경사유가 발생할 경우 지급보류처분이 취소될 수 있도록 한다면, 이와 함께 지급보류기간동안 의료기관의 개설자가 수인해야 했던 재산권제한상황에 대한 적절하고 상당한 보상으로서의 이자 내지 지연손해금의 비율에 대해서도 규율이 필요하다. 이러한 사항들은 심판대상조항으로 인한 기본권 제한이 입법목적 달성에 필요한 최소한도에 그치기 위해 필요한 조치들이지만, 현재 이에 대한 어떠한 입법적 규율도 없다. 따라서 심판대상조항은 과잉금지원칙에 반하여 의료급여기관 개설자의 재산권을 침해한다(헌재 2024. 6. 27. 2021헌가19)."},{"set":11,"num":45,"q":"어떤 공과금이 조세인지 아니면 부담금인지는 단순히 법률에서 그것을 무엇으로 성격 규정하고 있느냐를 기준으로 할 것이 아니라, 그 실질적인 내용을 결정적인 기준으로 삼아야 한다.","src":"2020 국가직 7급","a":true,"exp":"헌재 2008. 2. 28. 2006헌바70"},{"set":11,"num":46,"q":"텔레비전방송수신료는 공영방송사업이라는 특정한 공익사업의 경비조달에 충당하기 위하여 수상기를 소지한 특정집단에 대하여 부과되는 특별부담금에 해당하여 조세나 수익자부담금과는 구분된다.","src":"2024 국가직 7급","a":true,"exp":"수신료는 공영방송사업이라는 특정한 공익사업의 소요경비를 충당하기 위한 것으로서(방송법 제56조) 일반 재정수입을 목적으로 하는 조세와 다르다. 또, 텔레비전방송을 수신하기 위하여 수상기를 소지한 자에게만 부과되어 공영방송의시청가능성이 있는 이해관계인에게만 부과된다는 점에서도 일반 국민․주민을 대상으로 하는 조세와 차이가 있다. 그리고 ‘한국방송공사의 텔레비전방송을 수신하는 자’가 아니라 ‘텔레비전방송을 수신하기 위하여 수상기를 소지하는 자’가 부과대상이므로 실제 방송시청 여부와 관계없이 부과된다는 점, 그 금액이 공사의 텔레비전방송의 수신정도와 관계없이 정액으로 정해져 있는 점 등을 감안할 때 이를 공사의 서비스에 대한 대가나 수익자부담금으로 보기도 어렵다. 따라서 수신료는 공영방송사업이라는 특정한 공익사업의 경비조달에 충당하기 위하여 수상기를 소지한 특정집단에 대하여 부과되는 특별부담금에 해당한다고 할 것이다(헌재 2008. 2. 28. 2006헌바70)."},{"set":11,"num":47,"q":"텔레비전방송수신료는 한국방송공사의 텔레비전방송을 시청하는 대가이므로 특정 이익의 혜택이나 특정 시설의사용가능성에 대한 금전적 급부인 수익자부담금에 해당한다.","src":"2024 법원직","a":false,"exp":"‘한국방송공사의 텔레비전방송을 수신하는 자’가 아니라 ‘텔레비전방송을 수신하기 위하여 수상기를 소지하는 자’ 가 부과대상이므로 실제 방송시청 여부와 관계없이 부과된다는 점, 그 금액이 공사의 텔레비전방송의 수신정도와 관계없이 정액으로 정해져 있는 점 등을 감안할 때 이를 공사의 서비스에 대한 대가나 수익자부담금으로 보기도 어렵다헌재 2008. 2. 28. 2006헌바70)."},{"set":11,"num":48,"q":"헌법 제23조 제3항은 재산권 수용의 주체를 한정하지 않고 있는바, 그 수용의 주체가 국가 등에 한정되어야 하는지, 아니면 민간기업에도 허용될 수 있는지 여부에 대하여 헌법이라는 규범적 층위에서는 구체적으로 결정된 내용이 없다는 것을 의미하므로, 수용의 주체를 국가 등 공적 기관에 한정하여 해석할 이유가 없다.","src":"2023 변호사시험","a":true,"exp":"헌법 제23조 제3항은 정당한 보상을 전제로 하여 재산권의 수용 등에 관한 가능성을 규정하고 있지만, 재산권 수용의 주체를 한정하지 않고 있다. 이는 재산의 수용과 관련하여 그 수용의 주체가 국가 등에 한정되어야 하는지, 아니면 민간기업에게도 허용될 수 있는지 여부에 대하여 헌법이라는 규범적 층위에서는 구체적으로 결정된 내용이 없다는 점을 의미하는 것이다. 따라서 위 수용 등의 주체를 국가 등의 공적 기관에 한정하여 해석할 이유가 없다. 위 헌법조항의 핵심은 당해 수용이 공공필요에 부합하는가, 정당한 보상이 지급되고 있는가 여부 등에 있는 것이지, 그 수용의 주체가 국가인지 민간기업인지 여부에 달려 있다고 볼 수 없다. 그렇다면 민간기업을 수용의 주체로 규정한 자체를 두고 위헌이라고 할 수 없다(헌재 2009. 9. 24. 2007헌바114)."},{"set":11,"num":49,"q":"헌법 제23조 제3항에서 규정하고 있는 공공필요의 개념은 공익성과 필요성이라는 요소로 구성되며, 공익성은 추상적인 공익 일반 또는 국가의 이익 이상의 중대한 공익을 요구하므로 기본권 일반의 제한사유인 공공복리보다좁게 보는 것이 타당하다.","src":"2024 변호사시험","a":true,"exp":"헌재 2014.10.30. 2011헌바172"},{"set":11,"num":50,"q":"헌법 제23조제3항에 따른 재산권의 수용ㆍ사용 또는 제한은 국가가 구체적인 공적 과제를 수행하기 위하여 이미 형성된 구체적인 재산적 권리를 전면적 또는 부분적으로 박탈하거나 제한하는 것을 의미한다.","src":"2024 지방직 7급","a":true,"exp":"헌재 2004. 10. 28. 2002헌바41"},{"set":11,"num":51,"q":"통일부장관이 2010. 5. 24. 발표한 북한에 대한 신규투자 불허 및 진행 중인 사업의 투자확대 금지 등을 내용으로 하는 대북조치에 의하여 개성공단에서의 신규투자와 투자확대를 불허함에 따라 개성공단 내의 토지이용권을 사용ㆍ수익하지 못하게 되는 제한이 발생하였고, 이는 공익목적을 위해 이미 형성된 구체적 재산권을 개별적, 구체적으로 제한하는 헌법 제23조 제3항 소정의 공용 제한한다.","src":"2025 법원직","a":false,"exp":"2010. 5. 24.자 대북조치가 개성공단에서의 신규투자와 투자확대를 불허함에 따라 청구인이 보유한 개성공단 내의 토지이용권을 사용ㆍ수익하지 못하게 되는 제한이 발생하기는 하였으나, 이는 개성공단이라는 특수한 지역에 위치한사업용 재산이 받는 사회적 제약이 구체화된 것일 뿐이므로, 공익목적을 위해 이미 형성된 구체적 재산권을 개별적, 구체적으로 제한하는 헌법 제23조 제3항 소정의 공용 제한과는 구별된다. 그렇다면 2010. 5. 24.자 대북조치로 인 한 토지이용권의 제한은 헌법 제23조 제1항, 제2항에 따라 재산권의 내용과 한계를 정한 것인 동시에 재산권의 사회적 제약을 구체화하는 것으로 볼 수 있다(헌재 2022. 5. 26. 2016헌마95)."},{"set":11,"num":52,"q":"도로 등 영조물 주변 일정 범위에서 관할 관청 또는 소유자 등의 허가나 승낙 하에서만 광업권자의 채굴행위를 허용하는 것은 입법자가 광업권에 관한 권리와 의무를 일반․추상적으로 확정하는 것이 아니라 이미 형성된 구체적인 재산권을 공익을 위해 개별적․구체적으로 제한하는 것으로서 헌법 제23조 제3항의 수용․사용 또는 제한을 규정한 것에 해당한다.","src":"2026 법원직","a":false,"exp":"위 조항은 이미 형성된 구체적인 재산권을 공익을 위하여 개별적ㆍ구체적으로 박탈하거나 제한하는 것으로서 보상을 요하는 헌법 제23조 제3항의 수용ㆍ사용 또는 제한을 규정한 것이라고 할 수는 없고, 입법자가 광업권에 관한 권리와 의무를 일반ㆍ추상적으로 확정하는, 재산권의 내용과 한계를 정하는 규정인 동시에 공익적 요청에 따른 재산권의 사회적 제약을 구체화하는 규정이라고 보아야 한다(헌재 2024. 1. 25. 2021헌바340)."},{"set":12,"num":1,"q":"‘직업’이란 생활의 기본적 수요를 충족시키기 위해서 행하는 계속적인 소득활동을 의미하므로 학교운영위원이 무보수봉사직이라는 점을 고려하면 운영위원으로서의 활동을 헌법상 직업의 개념에 포함시킬 수 없다.","src":"2024 경정승진","a":true,"exp":"헌재 2007. 3. 29. 2005헌마1144"},{"set":12,"num":2,"q":"게임 결과물의 환전은 게임이용자로부터 게임 결과물을 매수하여 다른 게임이용자에게 이윤을 붙여 되파는 것으로, 이러한 행위를 영업으로 하는 것은 생활의 기본적 수요를 충족시키는 계속적인 소득활동이 될 수 있으므로 게임 결과물의 환전업은 헌법 제15조가 보장하고 있는 직업에 해당한다.","src":"2025 경정승진","a":true,"exp":"헌재 2010.2.25. 2009헌바38"},{"set":12,"num":3,"q":"헌법 제15조에서 보장하는 ‘직업’이란 생활의 기본적 수요를 충족시키기 위하여 행하는 계속적인 소득활동을 의미하고, 성매매는 그것이 가지는 사회적 유해성과는 별개로 성판매자의 입장에서 생활의 기본적 수요를 충족하기 위 한 소득활동에 해당함을 부인할 수 없다 할 것이므로, 성매매를 한 자를 형사처벌하도록 한 규정은 성판매자의 직업선택의 자유를 제한하고 있다.","src":"2024 법원직","a":true,"exp":"헌재 2016. 3. 31. 2013헌가2"},{"set":12,"num":4,"q":"헌법 제15조의 직업선택의 자유는 자신이 원하는 직업을 자유롭게 선택하는 좁은 의미의 직업선택의 자유와 그가 선택한 직업을 자기가 원하는 방식으로 자유롭게 수행할 수 있는 직업수행의 자유를 포함하는 직업의 자유를 뜻하 고, 법인도 직업수행의 자유의 주체가 될 수 있다.","src":"2026 변호사시험","a":true,"exp":"헌재 2010. 6. 24. 2007헌바101"},{"set":12,"num":5,"q":"직업수행의 자유에 대하여는 직업선택의 자유와는 달리 공익목적을 위하여 상대적으로 폭넓은 입법적 규제가 가능한 것이므로 과잉금지의 원칙이 적용되는 것이 아니라 자의금지의 원칙이 적용되는 것이다.","src":"2019 국가직 7급","a":false,"exp":"직업수행의 자유에 대한 제한은 인격발현에 대한 침해의 효과가 일반적으로 직업선택 그 자체에 대한 제한에 비하여 작기 때문에, 그에 대한 제한은 보다 폭넓게 허용된다고 할 수 있다. 그러나 직업수행의 자유를 제한할 때에도헌법 제37조 제2항에 의거한 비례의 원칙에 위배되어서는 안 된다(헌재 2005. 2. 3. 2003헌마930)."},{"set":12,"num":6,"q":"직업의 자유를 제한함에 있어, 당사자의 능력이나 자격과 상관없는 객관적 사유에 의한 직업선택의 자유의 제한은월등하게 중요한 공익을 위하여 명백하고 확실한 위험을 방지하기 위한 경우에만 정당화될 수 있다.","src":"2024 경정승진","a":true,"exp":"헌재 2002. 4. 25. 2001헌마614"},{"set":12,"num":7,"q":"어떠한 직업분야에 관한 자격제도를 만들면서 그 자격요건을 어떻게 설정할 것인가에 관하여는 그 입법재량의 폭이 좁다 할 것이므로, 과잉금지원칙을 적용함에 있어서는 다른 방법으로 직업선택의 자유를 제한하는 경우에 비하여 보다 엄격한 심사가 필요하다.","src":"2024 법원직","a":false,"exp":"좁은 의미의 직업선택의 자유를 제한함에 있어, 어떤 직업의 수행을 위한 전제요건으로서 일정한 주관적 요건을 갖춘 자에게만 그 직업에 종사할 수 있도록 제한하는 경우에는 과잉금지의 원칙이 적용되어야 할 것이다. 다만, 과잉금지의 원칙을 적용함에 있어서도 어떠한 직업분야에 관한 자격제도를 만들면서 그 자격요건을 어떻게 설정할 것인가에 관하여는 국가에게 폭넓은 입법재량권이 부여되어 있는 것이므로 다른 방법으로 직업선택의 자유를 제한하는 경우에 비하여 보다 유연하고 탄력적인 심사가 필요하다 할 것이다(헌재 2009. 7. 30. 2007헌마1037)."},{"set":12,"num":8,"q":"소송사건의 대리인인 변호사라 하더라도 소송계속 사실 소명자료를 제출하지 못하면 수형자와 변호사접견을 하지 못하도록 규정한 ‘형의 집행 및 수용자의 처우에 관한 법률 시행규칙’ 제29조의2 제1항 제2호 중 ‘수형자 접견’에 관한 부분은 변호사의 직업수행의 자유를 침해하지 아니한다.","src":"2023 법원직","a":false,"exp":"소송계속 사실 소명자료를 제출하지 못하는 경우 변호사접견이 아니라 일반접견만 가능하도록 규정한 심판대상조항은 변호사인 청구인의 직업수행의 자유를 제한한다. 소송사건의 대리인인 변호사가 수형자를 접견하고자 하 는 경우 소송계속 사실을 소명할 수 있는 자료를 제출하도록 하는 것은 변호사의 접견권 남용행위 방지에 실효적인 수단이라고 보기 어려울 뿐 아니라 수형자의 재판청구권 행사에 장애를 초래할 뿐이므로, 심판대상조항은 수단의 적합성이 인정되지 아니한다. ... 과잉금지원칙에 위배되어 변호사인 청구인의 직업수행의 자유를 침해한다(헌재 2021. 10. 28. 2018헌마60)."},{"set":12,"num":9,"q":"접촉차단시설이 설치되지 않은 장소에서의 수용자 접견 대상을 소송사건의 대리인인 변호사로 한정한 구｢형의 집행 및 수용자의 처우에 관한 법률 시행령｣ 조항은, 그로 인해 접견의 상대방인 수용자의 재판청구권이 제한되는 효과 도 함께 고려하면 수용자의 대리인이 되려는 변호사의 직업수행의 자유와 수용자의 변호인의 조력을 받을 권리를 침해한다.","src":"2023 국가직 7급","a":false,"exp":"소송대리인이 되려는 변호사의 경우 변호인이 되려는 사람이나 소송사건의 대리인인 변호사와 비교하여 지위, 역할, 접견의 필요성 등에 차이가 있으므로, 접견제도의 운영에 있어 이들과 달리 취급할 필요가 있다. 따라서 접촉차단시설이 설치되지 않은 장소에서의 수용자 접견 대상을 소송사건의 대리인인 변호사로 한정한 것은 변호사인 청구인의 직업수행의 자유를 침해하지 않는다(헌재 2022. 2. 24. 2018헌마1010)."},{"set":12,"num":10,"q":"아동학대관련범죄로 벌금형이 확정된 날부터 10년이 지나지 아니한 사람은 어린이집을 설치·운영하거나 어린이집에 근무할 수 없도록 한 ｢영유아보육법｣ 조항은 사전에 영유아를 아동학대의 위험으로부터 철저히 보호해야 할 필요성이 인정되므로 직업의 자유를 침해하지 않는다.","src":"2025 변호사시험","a":false,"exp":"아동학대관련범죄전력자에 대해 범죄전력만으로 장래에 동일한 유형의 범죄를 다시 저지를 것이라고 단정하기는어려움에도 불구하고, 심판대상조항은 오직 아동학대관련범죄전력에 기초해 10년이라는 기간 동안 일률적으로 취업제한의 제재를 부과하는 점에서 침해의 최소성 요건을 충족했다고 보기 어렵다. 따라서 아동학대관련범죄로 벌금형이 확정된 날부터 10년이 지나지 아니한 사람은 어린이집을 설치･운영하거나 어린이집에 근무할 수 없고, 같 은 이유로 보육교사 자격이 취소되면 그 취소된 날부터 10년간 자격을 재교부받지 못하도록 한 영유아보육법 조항은 직업선택의 자유를 침해한다(헌재 2022. 9. 29. 2019헌마813)."},{"set":12,"num":11,"q":"세무사 자격 보유 변호사로 하여금 세무사로서 세무사 업무를 할 수 없도록 규정한 ｢세무사법｣ 규정은 세무사 자격에 기한 직업선택의 자유를 지나치게 제한하는 것으로 세무사 자격 보유 변호사의 직업선택의 자유를 침해한다.","src":"2025 경위공채","a":true,"exp":"세법 및 관련 법령에 대한 해석·적용에 있어서는 세무사나 공인회계사보다 변호사에게 오히려 전문성과 능력이인정됨에도 불구하고, 심판대상조항은 세무사 자격 보유 변호사로 하여금 세무대리를 일체 할 수 없도록 전면적으로 금지하고 있으므로, 수단의 적합성을 인정할 수 없다. 세무사 자격 보유 변호사에 대하여 세무사로서의 세무대리를 일체 할 수 없도록 전면 금지하는 것은 세무사 자격 부여의 의미를 상실시키는 것일 뿐만 아니라, 세무사 자격에 기한 직업선택의 자유를 지나치게 제한하는 것이다(헌재 2018. 4. 26. 2015헌가19)."},{"set":12,"num":12,"q":"청원경찰이 금고 이상의 형의 선고유예를 받은 경우 당연 퇴직되도록 규정한 ｢청원경찰법｣ 조항은 청원경찰의 직업의 자유를 침해한다.","src":"2022 국가직 7급","a":true,"exp":"금고 이상의 형의 선고유예를 받은 경우 사회적 비난가능성이 크거나 직무수행에 대한 국민의 신뢰 등에 미치는부정적인 영향이 크다고 일률적으로 단정하기 어렵고, 같은 금고 이상의 형의 선고유예를 받은 경우라고 하여도 범죄의 종류, 죄질, 내용이 지극히 다양하므로, 그에 따라 국민의 청원경찰직에 대한 신뢰 등에 미치는 영향도큰 차이가 있다. 따라서 선고유예 판결의 확정에 따른 당연 퇴직 사유를 규정함에 있어서 직업의 자유에 대한 제한을 최소화하기 위해서는 입법목적을 달성함에 반드시 필요한 범죄의 유형, 내용 등으로 그 범위를 가급적 한정하여 규정하거나, 혹은 적어도 청원경찰법상에 마련된 징계 등 별도의 제도로도 입법목적을 충분히 달성할 수 있 는 것으로 판단되는 경우를 당연 퇴직 사유에서 제외시켜 규정하여야 한다. 그럼에도 불구하고 심판대상조항은 청원경찰이 저지른 범죄의 종류나 내용을 불문하고 금고 이상의 형의 선고유예를 받게 되면 당연히 퇴직되도록 규정함으로써 청원경찰에게 공무원보다 더 가혹한 제재를 가하고 있으므로, 침해의 최소성 원칙에 위배된다. ... 과잉금지원칙에 반하여 직업의 자유를 침해한다(헌재 2018. 1. 25. 2017헌가26)."},{"set":12,"num":13,"q":"수범자인 경비업자로 하여금 허가받은 시설경비업무 외의 업무에 경비원을 종사하게 하는 것을 금지하고 이를 위반한 경우 경비업의 허가를 필요적으로 취소하도록 규정한 경비업법 해당 조항은, 시설경비업을 수행하는 경비업자에 대하여 직업을 수행하는 방법에 제한을 가하고 경비업자의 직업을 계속 유지하는 것을 불가능하게 하므로 직업의 자유를 제한한다.","src":"2025 법원직","a":true,"exp":"헌재 2023. 3. 23. 2020헌가19"},{"set":12,"num":14,"q":"헌법상 기본권인 참정권에 대한 외국인의 기본권주체성은 인정되지 아니한다.","src":"2023 법원행시","a":true,"exp":"참정권과 입국의 자유에 대한 외국인의 기본권주체성이 인정되지 않는다(헌재 2014.6.26. 2011헌마502)."},{"set":12,"num":15,"q":"헌법상 직접민주주의에 따른 참정권으로 헌법개정안에 대한 국민투표권과, 외교․국방․통일 기타 국가안위에 관한중요정책에 대한 국민투표권이 규정되어 있는데 전자는 필수적이고 후자는 대통령의 재량으로 이뤄진다.","src":"2022 지방직 7급","a":true,"exp":"헌법 제130조, 제72조"},{"set":12,"num":16,"q":"헌법상 국민에게 특정 국가정책에 관하여 국민투표에 회부할 것을 요구할 권리가 인정된다고 할 수 없다.","src":"2022 변호사시험","a":true,"exp":"헌법 제72조는 대통령에게 국민투표의 실시 여부, 시기, 구체적 부의사항, 설문내용 등을 결정할 수 있는 임의적인 국민투표발의권을 독점적으로 부여한 것이다. 따라서 특정의 국가정책에 대하여 다수의 국민들이 국민투표를 원하고 있음에도 불구하고 대통령이 이러한 희망과는 달리 국민투표에 회부하지 아니한다고 하여도 이를 헌법에 위반된다고 할 수 없고, 국민에게 특정의 국가정책에 관하여 국민투표에 회부할 것을 요구할 권리가 인정된다고 할 수도 없다(헌재 2013. 11. 28. 2012헌마166)."},{"set":12,"num":17,"q":"헌법 제72조의 국민투표권은 대통령이 어떠한 정책을 국민투표에 부의한 경우에 비로소 행사가 가능한 기본권이라 할 수 있다.","src":"2023 지방직 7급","a":true,"exp":"특정의 국가정책에 대하여 다수의 국민들이 국민투표를 원하고 있음에도 불구하고 대통령이 이러한 희망과는 달리 국민투표에 회부하지 아니한다고 하여도 이를 헌법에 위반된다고 할 수 없고, 국민에게 특정의 국가정책에 관하여 국민투표에 회부할 것을 요구할 권리가 인정된다고 할 수도 없다. 결국 헌법 제72조의 국민투표권은 대통령이 어떠한 정책을 국민투표에 부의한 경우에 비로소 행사가 가능한 기본권이라 할 수 있다(헌재 2013. 11. 28. 2012헌마166)."},{"set":12,"num":18,"q":"대통령이 위헌적인 재신임 국민투표를 단지 제안만 하였을 뿐 국민투표를 시행하지는 않았다면, 대통령의 이러한제안은 헌법 제72조에 위반되는 것이 아니다.","src":"2023 지방직 7급","a":false,"exp":"대통령이 위헌적인 재신임 국민투표를 단지 제안만 하였을 뿐 강행하지는 않았으나, 헌법상 허용되지 않는 재신임 국민투표를 국민들에게 제안한 것은 그 자체로서 헌법 제72조에 반하는 것으로 헌법을 실현하고 수호해야 할 대통령의 의무를 위반한 것이다(헌재 2004. 5. 14. 2004헌나1)."},{"set":12,"num":19,"q":"주권자인 국민의 지위에 아무런 영향을 미칠 수 없는 주민등록 여부만을 기준으로 하여 주민등록을 할 수 없는 재외국민의 국민투표권 행사를 전면적으로 배제하도록 한 구 국민투표법 해당 규정은 재외국민의 국민투표권을 침해한다.","src":"2025 법원직","a":true,"exp":"헌재 2007. 6. 28. 2004헌마644"},{"set":12,"num":20,"q":"주민등록이 되어 있지 않고 국내거소신고도 하지 않은 재외국민에게 국회의원 재·보궐선거의 선거권을 인정하지 않은 구 공직선거법상 재외선거인 등록신청조항은, 선거제도를 현저히 불합리하거나 불공정하게 형성한 것이므로 그 재외국민의 선거권을 침해하고 보통선거원칙에도 위배된다.","src":"2025 법원직","a":false,"exp":"입법자는 재외선거제도를 형성하면서, 잦은 재·보궐선거는 재외국민으로 하여금 상시적인 선거체제에 직면하게 하는 점, 재외 재·보궐선거의 투표율이 높지 않을 것으로 예상되는 점, 재·보궐선거 사유가 확정될 때마다 전 세계 해외 공관을 가동하여야 하는 등 많은 비용과 시간이 소요된다는 점을 종합적으로 고려하여 재외선거인에게 국회의원의 재·보궐선거권을 부여하지 않았다고 할 것이고, 이와 같은 선거제도의 형성이 현저히 불합리하거나 불공정하다고 볼 수 없다. 따라서 재주민등록이 되어 있지 않고 국내거소신고도 하지 않은 재외국민에게 국회의원 재·보궐선거의 선거권을 인정하지 않은 것은재외선거인의 선거권을 침해하거나 보통선거원칙에 위배된다고 볼 수 없다(헌재 2014. 7. 24. 2009헌마256)."},{"set":12,"num":21,"q":"공무원이 특정의 장소에서 근무하는 것 또는 특정의 보직을 받아 근무하는 것을 포함하는 일종의 공무수행의 자유 역시 공무담임권의 보호영역에 포함된다.","src":"2024 법원직","a":false,"exp":"공무담임권의 보호영역에는 공직취임 기회의 자의적인 배제 뿐 아니라, 공무원 신분의 부당한 박탈이나 권한(직무)의 부당한 정지도 포함된다. 그러나 공무원이 특정의 장소에서 근무하는 것이나 특정의 보직을 받아 근무하는 것을 포함하는 일종의 ‘공무수행의 자유’까지 포함된다고 보기 어렵다(헌재 2014. 1. 28. 2011헌마239)."},{"set":12,"num":22,"q":"‘승진시험의 응시제한’ 은 공직신분의 유지나 업무 수행에는 영향을 주지 않는 단순한 내부 승진인사에 관한 문제에 불과하여 공무담임권의 보호영역에 포함된다고 보기는 어려우므로, 시험요구일 현재를 기준으로 승진임용이 제한된 자에 대하여 승진시험응시를 제한하도록 한 공무원임용시험령이 공무담임권을 침해하였다고 볼 수 없다.","src":"2022 법원직","a":true,"exp":"공무담임권의 보호영역에는 일반적으로 공직취임의 기회보장, 신분박탈, 직무의 정지가 포함될 뿐이고 청구인이 주장하는 ‘승진시험의 응시제한’이나 이를 통한 승진기회의 보장 문제는 공직신분의 유지나 업무수행에는 영향을 주지 않는 단순한 내부 승진인사에 관한 문제에 불과하여 공무담임권의 보호영역에 포함된다고 보기는 어렵다(헌재 2007. 6. 28. 2005헌마1179)."},{"set":12,"num":23,"q":"공무담임권의 보호영역에는 공무원 신분의 부당한 박탈이나 권한 또는 직무의 부당한 정지뿐만 아니라 승진시험의 응시제한이나 이를 통한 승진기회의 보장 등 내부 승진인사에 관한 문제도 포함된다.","src":"2022 국가직 7급","a":false,"exp":"공무담임권의 보호영역에는 일반적으로 공직취임의 기회보장, 신분박탈, 직무의 정지가 포함될 뿐이고 청구인이 주장하는 ‘승진시험의 응시제한’이나 이를 통한 승진기회의 보장 문제는 공직신분의 유지나 업무수행에는 영향을 주 지 않는 단순한 내부 승진인사에 관한 문제에 불과하여 공무담임권의 보호영역에 포함된다고 보기는 어렵다(헌재 2007. 6. 28. 2005헌마1179)."},{"set":12,"num":24,"q":"수뢰죄를 범하여 금고 이상의 형의 선고유예를 받은 국가공무원을 당연퇴직하도록 하는 ｢국가공무원법｣ 조항은 해당 공무원의 공무담임권을 침해하지 않는다.","src":"2024 경정승진","a":true,"exp":"헌재 2013. 7. 25. 2012헌바409"},{"set":12,"num":25,"q":"법원이 성년후견개시 심판을 선고함으로써 직무수행능력의 지속적 결여가 객관적으로 인정된 경우에까지 공무원의 신분을 계속 유지하는 방식으로 생활보장을 해야 한다고 보기는 어려우므로, 피성년후견인인 국가공무원은 당연히 퇴직한다고 정한 국가공무원법 해당 조항이 공무담임권을 침해한다고 보기 어렵다.","src":"2024 법원직","a":false,"exp":"국가공무원법은 정신상의 장애로 직무를 감당할 수 없는 국가공무원에 대하여 임용권자가 최대 2년(공무상 질병또는 부상은 최대 3년)의 범위 내에서 휴직을 명하도록 하고, 휴직 기간이 끝났음에도 직무에 복귀하지 못하거나직무를 감당할 수 없게 된 때에 비로소 직권면직 절차를 통하여 직을 박탈하도록 하고 있다. 위 조항들을 성년후견이 개시된 국가공무원에게 적용하더라도 심판대상조항의 입법목적을 달성할 수 있다. 결국 심판대상조항과 같 은 정도로 입법목적을 달성하면서도 공무담임권의 침해를 최소화할 수 있는 대안이 있으므로, 심판대상조항은 침해의 최소성에 반한다. 따라서 국가공무원이 피성년후견인이 된 경우 당연퇴직되도록 한 구 국가공무원법 조항은 과잉금지원칙에 반하여 공무담임권을 침해한다(헌재 2022. 12. 22. 2020헌가8)."},{"set":12,"num":26,"q":"반인륜적인 범죄인 아동에 대한 성적 학대행위를 저지른 사람이 공무를 수행할 경우 공직 전반에 대한 국민의 신뢰를 유지하기 어려우므로, 아동에게 성적 수치심을 주는 성희롱 등의 성적 학대행위로 형을 선고받아 그 형이 확정된 사람은 일반직공무원으로 임용될 수 없도록 한 국가공무원법 해당조항이 공무담임권을 침해한다고 보기 어렵다.","src":"2024 법원직","a":false,"exp":"심판대상조항은 아동과 관련이 없는 직무를 포함하여 모든 일반직공무원 및 부사관에 임용될 수 없도록 하므로, 제한의 범위가 지나치게 넓고 포괄적이다. 또한, 심판대상조항은 영구적으로 임용을 제한하고, 결격사유가 해소될 수 있는 어떠한 가능성도 인정하지 않는다. 아동에 대한 성희롱 등의 성적 학대행위로 형을 선고받은 경우라고 하여도 범죄의 종류, 죄질 등은 다양하므로, 개별 범죄의 비난가능성 및 재범 위험성 등을 고려하여 상당한 기간 동안 임용을 제한하는 덜 침해적인 방법으로도 입법목적을 충분히 달성할 수 있다. 따라서 심판대상조항은 과잉금지원칙에 위배되어 청구인의 공무담임권을 침해한다(헌재 2022. 11. 24. 2020헌마1181)."},{"set":12,"num":27,"q":"아동･청소년대상 성범죄는 재범 위험성이 높고 시간이 지나도 공무수행을 맡기기에 충분할 만큼 국민의 신뢰가 회복되기 어려우므로, 아동･청소년이용음란물임을 알면서 이를 소지한 죄로 형을 선고받아 그 형이 확정된 사람은 일반직공무원으로 임용될 수 없도록 규정한 ｢국가공무원법｣ 및 ｢지방공무원법｣ 조항은 그 형이 확정된 사람의 공무담임권을 침해하지 않는다.","src":"2024 경찰 제2차","a":false,"exp":"심판대상조항은 아동ㆍ청소년과 관련이 없는 직무를 포함하여 모든 일반직공무원에 임용될 수 없도록 하므로, 제한의 범위가 지나치게 넓고 포괄적이다. 또한, 심판대상조항은 영구적으로 임용을 제한하고, 결격사유가 해소될수 있는 어떠한 가능성도 인정하지 않는다. 그런데 아동ㆍ청소년이용음란물소지죄로 형을 선고받은 경우라고 하여도 범죄의 종류, 죄질 등은 다양하므로, 개별 범죄의 비난가능성 및 재범 위험성 등을 고려하여 상당한 기간 동안 임용을 제한하는 덜 침해적인 방법으로도 입법목적을 충분히 달성할 수 있다. 따라서 심판대상조항은 과잉금지원칙에 위배되어 청구인들의 공무담임권을 침해한다. (헌재 2023. 6. 29. 2020헌마1605)"},{"set":12,"num":28,"q":"과거 3년 이내의 당원 경력을 법관 임용 결격사유로 정한 ｢법원조직법｣ 제43조 제1항 제5호 중 ‘당원의 신분을 상실한 날부터 3년이 경과되지 아니한 사람’에 관한 부분은 과잉금지원칙에 반하여 공무담임권을 침해한다.","src":"2025 경찰 제1차","a":true,"exp":"모든 법관의 정치적 중립성과 재판의 독립 보장이란 입법목적을 달성하기 위한 제도적 장치는 이미 마련되어 있 고, 가사 과거 당원 경력을 법관 임용 결격사유에 포함시켜야 할 필요성이 있다 하더라도 실제 정치활동에 대한 경중을 가려 그 입법목적 달성을 위해 합리적인 범위로 한정할 수 있음에도 불구하고, 심판대상조항은 그 입법목적을 달성함에 기여하는 정도를 넘어 관련성을 인정하기 어려운 경우까지 광범위하게 제한하고 있으므로, 침해의최소성이 인정되지 아니한다. ‘당원의 신분을 상실한 날부터 3년이 경과되지 아니한 사람’은 법관으로 임용할수 없도록 규정함으로써 과거 3년 이내의 당원 경력을 법관 임용 결격사유로 정하고 있는 법원조직법 조항은 과잉금지원칙에 반하여 청구인의 공무담임권을 침해한다(헌재 2024. 7. 18. 2021헌마460)."},{"set":12,"num":29,"q":"순경 공개경쟁채용시험의 응시연령 상한을 30세 이하로 규정한 ｢경찰공무원임용령｣ 조항은 공무담임권을 침해하지 않는다.","src":"2022 국가직 7급","a":false,"exp":"순경 공개경쟁채용시험의 응시연령 상한을 ‘30세 이하’로 규정한 경찰공무원임용령과 소방사·지방소방사·소방간부후보생 선발시험의 응시연령 상한을 ‘30세 이하’로 규정한 소방공무원임용령은 공무담임권을 침해한다 (헌재 2012. 5. 31. 2010헌마278)."},{"set":12,"num":30,"q":"직업공무원제도는 헌법과 법률에 의하여 공무원의 신분이 보장되는 공직구조에 관한 제도이며, 여기서 말하는 공무원에는 정치적 공무원이라든가 임시적 공무원은 포함되지 않는다.","src":"2023 경찰 제1차","a":true,"exp":"헌재 1989. 12. 18. 89헌마32"},{"set":12,"num":31,"q":"직업공무원제도는 바로 헌법이 보장하는 제도적 보장중의 하나임이 분명하므로 입법자는 직업공무원제도에 관하여‘최대한 보장’의 원칙에 의하여 입법을 형성할 책무가 있다.","src":"2021 법원직","a":false,"exp":"직업공무원제도는 바로 헌법이 보장하는 제도적 보장중의 하나임이 분명하므로 입법자는 직업공무원제도에 관하여 ‘최소한 보장’의 원칙의 한계 안에서 폭넓은 입법형성의 자유를 가진다(헌재 1997. 4. 24. 95헌바48)."},{"set":12,"num":32,"q":"지방자치단체장은 선거로 취임하는 공무원이지만 그 신분이나 직무수행상 다른 일반공무원과 차이가 없고, 해당 지방자치단체를 통합·대표하고 국가사무를 위임받아 처리하는 등 일반직 공무원에 비하여 중요한 업무를 수행하므로 헌법 제7조 제2항에 따라 신분보장이 필요하고 정치적 중립성이 요구되는 공무원에 해당한다.","src":"2025 법원직","a":false,"exp":"지방자치단체장은 특정 정당을 정치적 기반으로 하여 선거에 입후보할 수 있고 주민의 선거에 의하여 선출되는공무원이라는 점에서, 헌법 제7조 제2항에 따라 신분보장이 필요하고 정치적 중립성이 요구되는 공무원에 해당한다고 보기 어렵다(2014. 6. 26. 2012헌마459)."},{"set":13,"num":1,"q":"현행 헌법규정에 의하면 청원은 문서 또는 구두(口頭)로 할 수 있다.","src":"2023 국가직 7급","a":false,"exp":"현행 헌법규정에 의하면 청원은 문서로만 할 수 있고 구두로는 할 수 없다(헌법 제26조 제1항)."},{"set":13,"num":2,"q":"국민은 법령에 따라 행정 권한을 위임 또는 위탁받은 개인에게 청원을 제출할 수는 없다.","src":"2021 지방직 7급","a":false,"exp":"국민은 법령에 따라 행정 권한을 위임 또는 위탁받은 개인에게 청원을 제출할 수 있다(청원법 제4조 제3호)."},{"set":13,"num":3,"q":"청원권은 공권력과의 관계에서 일어나는 여러 가지 이해관계, 의견, 희망 등에 관하여 적법한 청원을 한 모든 국민에게 그주관관서인 국가기관이 청원을 수리할 뿐만 아니라 이를 심사하여 청원자에게 그 처리결과를 통지할 것을 요구할 수 있는 권리를 말한다.","src":"2024 경정승진","a":true,"exp":"헌재 1994. 2. 24. 93헌마213"},{"set":13,"num":4,"q":"국민이면 누구든지 널리 제기할 수 있는 민중적 청원제도는 재판청구권 기타 준사법적 구제청구와는 그 성질을 달리하므로 청원사항의 처리결과에 심판서나 재결서에 준하여 이유명시를 요구할 수 없다.","src":"2019 국가직 7급","a":true,"exp":"헌법 제26조와 청원법 규정에 의할 때 헌법상 보장된 청원권은 공권력과의 관계에서 일어나는 여러 가지 이해관계, 의견, 희망 등에 관하여 적법한 청원을 한 모든 국민에게, 국가기관이 청원을 수리할 뿐만 아니라, 이를 심사하여, 청원자에게 적어도 그 처리결과를 통지할 것을 요구할 수 있는 권리를 말한다. 그러나 청원권의 보호범위에는 청원사항의 처리결과에 심판서나 재결서에 준하여 이유를 명시할 것까지를 요구하는 것은 포함되지 아니한다고 할 것이다. 왜냐하면 국민이면 누구든지 널리 제기할 수 있는 민중적 청원제도는 재판청구권 기타 준사법적 구제청구와는 완전히 성질을 달리하는 것이기 때문이다. 그러므로 청원소관서는 청원법이 정하는 절차와 범위 내에서 청원사항을 성실·공정·신속히 심사하고 청원인에게 그 청원을 어떻게 처리하였거나 처리하려 하는지를알 수 있을 정도로 결과 통지함으로써 충분하다고 할 것이다. 따라서 적법한 청원에 대하여 국가기관이 수리, 심사하여 그 처리결과를 청원인 등에게 통지하였다면 이로써 당해 국가기관은 헌법 및 청원법상의 의무이행을 필 한 것이라 할 것이고, 비록 그 처리내용이 청원인 등이 기대한 바에 미치지 않는다고 하더라도 더 이상 헌법소원의 대상이 되는 공권력의 행사 내지 불행사라고는 볼 수 없다(헌재 1994. 2. 24. 93헌마213)."},{"set":13,"num":5,"q":"국회에 청원을 하려는 자는 국회의원의 소개를 받지 않더라도 청원할 수 있다.","src":"2021 변호사시험","a":true,"exp":"국회에 청원을 하려는 자는 의원의 소개를 받거나 국회규칙으로 정하는 기간 동안 국회규칙으로 정하는 일정한 수 이상의 국민의 동의를 받아 청원서를 제출하여야 한다(국회법 제123조 제1항)."},{"set":13,"num":6,"q":"헌법이 대법원을 최고법원으로 규정하였다고 하여 대법원이 곧바로 모든 사건을 상고심으로서 관할하여야 한다는 결론이 당연히 도출되는 것은 아니다.","src":"2021 지방직 7급","a":true,"exp":"헌재 1995. 1. 20. 90헌바1"},{"set":13,"num":7,"q":"심급제도는 하급심에서 잘못된 재판을 하였을 때 상소심으로 하여금 이를 바로잡게 하는 것이 재판청구권을 실질적으로 보장하는 방법이 된다는 의미에서 재판청구권을 보장하기 위한 하나의 수단이며, 사법에 의한 권리보호에 관하여 한정된 사법자원의 합리적인 분배의 문제인 동시에 재판의 적정과 신속이라는 상반되는 요청을 어떻게 조화시키느냐의 문제에 속한다.","src":"2025 법원직","a":true,"exp":"심급제도는 하급심에서 잘못된 재판을 하였을 때에는 상소심으로 하여금 이를 바로잡게 하는 것이 재판청구권을 실질적으로 보장하는 방법이 된다는 의미에서 재판청구권을 보장하기 위한 하나의 수단이나, 심급의 반복에 의한절차의 지연은 헌법 제27조 제3항에 의한 ‘신속한 재판을 받을 권리’라는 재판청구권의 또 다른 측면과 배치될 수 있고, 모든 사건에 대하여 아무런 제한 없이 상소를 허용하는 것은 제한된 사법자원의 효율적 활용과 합리적 분배를 저해할 수 있다. 따라서 심급제도는 사법에 의한 권리보호에 관하여 한정된 사법자원의 합리적인 분배의 문제인 동시에 재판의 적정과 신속이라는 상반되는 요청을 어떻게 조화시키느냐의 문제로서 원칙적으로 입법자의 형성의 자유에 속하는 사항이다(헌재 2020.3.26. 2018헌바202)."},{"set":13,"num":8,"q":"헌법재판소는 국민참여재판을 받을 권리도 헌법 제27조 제1항에서 규정한 재판을 받을 권리의 보호범위에 속한다고 보고 있다.","src":"2023 법원직","a":false,"exp":"우리 헌법상 헌법과 법률이 정한 법관에 의한 재판을 받을 권리는 직업법관에 의한 재판을 주된 내용으로 하는 것이므로 국민참여재판을 받을 권리가 헌법 제27조 제1항에서 규정한 재판을 받을 권리의 보호범위에 속한다고 볼 수 없다(헌재 2015. 7. 30. 2014헌바447)."},{"set":13,"num":9,"q":"헌법상 재판을 받을 권리의 보호범위에는 배심재판을 받을 권리가 포함되지 아니한다.","src":"2021 지방직 7급","a":true,"exp":"헌법 제27조 제1항의 재판을 받을 권리는 신분이 보장되고 독립된 법관에 의한 재판의 보장을 주된 내용으로 한 다. 따라서 형사소송절차에서 국민참여재판제도는 사법의 민주적 정당성과 신뢰를 높이기 위하여 배심원이 사실 심 법관의 판단을 돕기 위한 권고적 효력을 가지는 의견을 제시하는 제한적 역할을 수행하게 되고, 배심재판을 받을 권리를 헌법상 권리로 보장하고 있는 미국의 경우와 달리 우리 헌법상 재판을 받을 권리의 보호범위에는 배심재판을 받을 권리가 포함되지 아니한다(헌재 2014. 1. 28. 2012헌바298)."},{"set":13,"num":10,"q":"재심제도의 규범적 형성에 있어서는 재판의 적정성과 정의의 실현이라는 법치주의의 요청에 의해 입법형성의 자유가 축소된다.","src":"2016 사법시험","a":false,"exp":"재심제도의 규범적 형성에 있어서, 입법자는 확정판결을 유지할 수 없을 정도의 중대한 하자가 무엇인지를 구체적으로 가려내어야 하는바, 이는 사법에 의한 권리보호에 관하여 한정된 사법자원의 합리적인 분배의 문제인 동시에 법치주의에 내재된 두 가지의 대립적 이념 즉, 법적 안정성과 정의의 실현이라는 상반된 요청을 어떻게 조화시키느냐의 문제로 돌아가므로, 결국 이는 불가피하게 입법자의 형성적 자유가 넓게 인정되는 영역이라고 할 수 있다(헌재 1996.3.28. 93헌바27)."},{"set":13,"num":11,"q":"비상계엄하의 군사재판은 군인 군무원의 범죄나 군사에 관한 간첩죄의 경우와 초병 초소 유독음식물공급 포로에 관한 죄 중 법률이 정한 경우에 한하여 군사법원이 단심으로 재판할 수 있으나, 사형을 선고한 경우에는 그러하지 아니하다.","src":"2022 지방직 7급","a":true,"exp":"헌법 제110조 제4항"},{"set":13,"num":12,"q":"비상계엄하의 군인ㆍ군무원의 범죄에 대한 군사재판은 사형을 선고한 경우에도 단심으로 할 수 있다.","src":"2023 국가직 7급","a":false,"exp":"비상계엄하의 군사재판은 군인·군무원의 범죄나 군사에 관한 간첩죄의 경우와 초병·초소·유독음식물공급·포로에 관한 죄 중 법률이 정한 경우에 한하여 단심으로 할 수 있다. 다만, 사형을 선고한 경우에는 그러하지 아니하다(헌법 제110조 제4항). 따라서 비상계엄하의 군인ㆍ군무원의 범죄에 대한 군사재판은 사형을 선고한 경우에는 단심으로 할 수 없다."},{"set":13,"num":13,"q":"재판청구권에는 민사재판, 형사재판, 행정재판뿐만 아니라 헌법재판을 받을 권리도 포함되므로, 헌법상 보장되는 기본권인 ‘공정한 재판을 받을 권리’에는 ‘공정한 헌법재판을 받을 권리’도 포함된다.","src":"2025 법원직","a":true,"exp":"헌재 2014. 4. 24. 2012헌마2"},{"set":13,"num":14,"q":"헌법 제27조 제1항이 보장하는 공정한 재판을 받을 권리에는 공격, 방어권이 충분히 보장되는 재판을 받을 권리가 포함되어 있지만, 외국에 나가 증거를 수집할 권리까지 포함되는 것은 아니다.","src":"2024 경정승진","a":true,"exp":"헌재 2015. 9. 24. 2012헌바302"},{"set":13,"num":15,"q":"재판의 심리와 판결은 공개하는 것이 원칙이나, 국가의 안전보장 또는 안녕질서를 방해하거나 선량한 풍속을 해할 염려가 있을 때에는 법원의 결정으로 공개하지 아니할 수 있다.","src":"2025 변호사시험","a":false,"exp":"재판의 심리와 판결은 공개한다. 다만, 심리는 국가의 안전보장 또는 안녕질서를 방해하거나 선량한 풍속을 해할 염려가 있을 때에는 법원의 결정으로 공개하지 아니할 수 있다(헌법 제109조)."},{"set":13,"num":16,"q":"법관에 대한 징계처분 취소청구사건을 대법원의 단심재판에 의하도록 한 법관징계법 해당 규정은 재판청구권 및 평등권을 침해한다.","src":"2025 법원직","a":false,"exp":"구 법관징계법 제27조는 법관에 대한 대법원장의 징계처분 취소청구소송을 대법원에 의한 단심재판에 의하도록 규정하고 있는바, 이는 독립적으로 사법권을 행사하는 법관이라는 지위의 특수성과 법관에 대한 징계절차의 특수성을 감안하여 재판의 신속을 도모하기 위한 것으로 그 합리성을 인정할 수 있고, 대법원이 법관에 대한 징계처분 취소청구소송을 단심으로 재판하는 경우에는 사실확정도 대법원의 권한에 속하여 법관에 의한 사실확정의 기회가 박탈되었다고 볼 수 없으므로, 헌법 제27조 제1항의 재판청구권을 침해하지 아니한다(헌재 2012.02.23. 2009헌바34)."},{"set":13,"num":17,"q":"헌법은 피고인의 반대신문권을 미국이나 일본과 같이 헌법상의 기본권으로까지 규정하지는 않았으나, 형사소송법은 제161조의2에서 피고인의 반대신문권을 포함한 교호신문권을 명문으로 규정하여 피고인에게 불리한 증거에 대하여 반대신문할수 있는 권리를 원칙적으로 보장하고 있는바, 이는 헌법 제12조 제1항, 제27조 제1항, 제3항 및 제4항에 의한 공정한 재판을 받을 권리를 구현한 것이다.","src":"2023 법원직","a":true,"exp":"헌재 2021. 12. 23. 2018헌바524"},{"set":13,"num":18,"q":"디엔에이감식시료채취영장 발부 과정에서 채취대상자에게 자신의 의견을 밝히거나 영장 발부 후 불복할 수 있는 절차 등에 관하여 규정하지 아니한 디엔에이신원확인정보의 이용 및 보호에 관한 법률 의 조항은 채취대상자들의 재판청구권을 침해한다.","src":"2021 지방직 7급","a":true,"exp":"디엔에이감식시료채취영장 발부 여부는 채취대상자에게 자신의 디엔에이감식시료가 강제로 채취당하고 그 정보가영구히 보관·관리됨으로써 자신의 신체의 자유, 개인정보자기결정권 등의 기본권이 제한될 것인지 여부가 결정되는 중대한 문제이다. 그럼에도 불구하고 이 사건 영장절차 조항은 채취대상자에게 디엔에이감식시료채취영장 발부 과정에서 자신의 의견을 진술할 수 있는 기회를 절차적으로 보장하고 있지 않을 뿐만 아니라, 발부 후 그 영장 발부에 대하여 불복할 수 있는 기회를 주거나 채취행위의 위법성 확인을 청구할 수 있도록 하는 구제절차마저 마련하고 있지 않다. 따라서 디엔에이감식시료채취영장 발부 과정에서 채취대상자가 자신의 의견을 진술하거나 영장발부에 대하여 불복하는 등의 절차를 두지 아니한 ‘디엔에이신원확인정보의 이용 및 보호에 관한 법률’ 조항은 과잉금지원칙을 위반하여 청구인들의 재판청구권을 침해한다(헌재 2018. 8. 30. 2016헌마344)."},{"set":13,"num":19,"q":"즉시항고의 제기기간을 3일로 제한한 형사소송법 조항은 재판청구권을 침해한다.","src":"2023 법원행시","a":true,"exp":"심판대상조항은 즉시항고 제기기간을 지나치게 짧게 정함으로써 실질적으로 즉시항고 제기를 어렵게 하고, 즉시항고 제도를 단지 형식적이고 이론적인 권리로서만 기능하게 함으로써 헌법상 재판청구권을 공허하게 하므로 입법재량의 한계를 일탈하여 재판청구권을 침해하는 규정이다(헌재 2018.12.27. 2015헌바77)."},{"set":13,"num":20,"q":"현행 헌법은 행정심판에 관하여 규정을 두고 있지 않으나, 재판의 전심절차로서 행정심판을 할 수 있으며, 행정심판의 절차에는 사법절차가 준용되어야 한다.","src":"2019 국가직 7급","a":false,"exp":"재판의 전심절차로서 행정심판을 할 수 있다. 행정심판의 절차는 법률로 정하되, 사법절차가 준용되어야 한다(헌법 제107조 제3항). 현행 헌법은 행정심판에 관하여 규정을 두고 있다."},{"set":13,"num":21,"q":"행정심판이 재판의 전심절차로서 기능할 뿐만 아니라 사실확정에 관한 한 사실상 최종심으로 기능하더라도 재판청구권을 침해하는 것은 아니다.","src":"2024 경찰간부","a":false,"exp":"헌법 제107조 제3항 전문은 \"재판의 전심절차로서 행정심판을 할 수 있다\"고 규정하고 있다. 이는 우리 헌법이 국가권력의 남용을 방지하고 국민의 자유와 권리를 확보하기 위한 기본원리로서 채택한 3권분립주의의 구체적 표현 으로서 일체의 법률적 쟁송을 심리 재판하는 작용인 사법작용은 헌법 그 자체에 의한 유보가 없는 한 오로지 대법원을 최고법원으로 하는(헌법 제101조 제2항) 법원만이 담당할 수 있고, 또 행정심판은 어디까지나 법원에 의한 재판의 전심절차로서만 기능하여야 함을 의미한다. 대한변호사협회징계위원회에서 징계를 받은 변호사는 법무부변호사징계위원회에서의 이의절차를 밟은 후 곧바로 대법원에 즉시항고토록 하는 것은 재판의 전심절차로서만 기능해야 할 법무부변호사징계위원회를 사실확정에 관한 한 사실상 최종심으로 기능하게 하고 있는 것은, 앞에서 본 바 와 같이 일체의 법률적 쟁송에 대한 재판기능을 대법원을 최고법원으로 하는 법원에 속하도록 규정하고 있는 헌법 제101조 제1항 및 제107조 제3항에 위반된다(헌재 2000. 6. 29. 선고 99헌가9)."},{"set":13,"num":22,"q":"압수물은 공소사실을 입증하고자 하는 검사의 이익을 위해 존재하는 것이므로, 수사기관이 현행범 체포과정에서 압수하였지만 피고인의 소유권 포기가 없는 압수물을 임의로 폐기한 행위가 피고인의 공정한 재판을 받을 권리를 침해한다고 볼 수 없다.","src":"2024 변호사시험","a":false,"exp":"압수물은 검사의 이익을 위해서 뿐만 아니라 이에 대한 증거신청을 통하여 무죄를 입증하고자 하는 피고인의 이익을 위해서도 존재하므로 사건종결 시까지 이를 그대로 보존할 필요성이 있다. 따라서 사건종결 전 일반적 압수물의 폐기를 규정하고 있는 형사소송법 제130조 제2항은 엄격히 해석할 필요가 있으므로, 위 법률조항에서 말하는 ‘위험발생의 염려가 있는 압수물’이란 사람의 생명, 신체, 건강, 재산에 위해를 줄 수 있는 물건으로서 보 관 자체가 대단히 위험하여 종국판결이 선고될 때까지 보관하기 매우 곤란한 압수물을 의미하는 것으로 보아야 하고, 이러한 사유에 해당하지 아니하는 압수물에 대하여는 설사 피압수자의 소유권포기가 있다 하더라도 폐기가 허용되지 아니한다고 해석하여야 한다. 피청구인은 이 사건 압수물을 보관하는 것 자체가 위험하다고 볼 수 없을 뿐만 아니라 이를 보관하는 데 아무런 불편이 없는 물건임이 명백함에도 압수물에 대하여 소유권포기가 있다는 이유로 이를 사건종결 전에 폐기하였는바, 위와 같은 피청구인의 행위는 적법절차의 원칙을 위반하고, 청구인의 공정한 재판을 받을 권리를 침해한 것이다(헌재 2012. 12. 27. 2011헌마351)."},{"set":13,"num":23,"q":"직계혈족, 배우자, 동거친족, 동거가족 또는 그 배우자간의 권리행사방해죄에 대해 법관으로 하여금 여러 사정을 전혀 고려할 수 없도록 하고 획일적으로 형면제 판결을 선고하도록 하는 형법 조항은 형사피해자가 법관에게 적절한 형벌권을행사하여 줄 것을 청구할 수 없도록 하는 것으로서 입법재량을 일탈하여 현저히 불합리하거나 불공정하므로 형사피해자의 재판절차진술권을 침해한다.","src":"2025 변호사시험","a":true,"exp":"직계혈족, 배우자, 동거친족, 동거가족 또는 그 배우자간의 권리행사방해죄는 그 형을 면제하도록 한 형법 조항은 형사피해자의 재판절차진술권을 침해한다(헌재 2024. 6. 27. 2020헌마468)."},{"set":13,"num":24,"q":"직계혈족, 배우자, 동거친족, 동거가족 또는 그 배우자 이외의 친족 간에 권리행사방해죄를 범한 때는 고소가 있어야 공소를 제기할 수 있도록 한 형법 제328조 제2항은 ‘친족으로부터 재산적인 피해를 입은 국민’을 다른 국민과의 관계에서 합리적인 이유 없이 차별하여 헌법 제11조 제1항의 평등원칙에 위반된다.","src":"2025 법원직","a":false,"exp":"‘직계혈족, 배우자, 동거친족, 동거가족 또는 그 배우자’ 이외의 친족 사이의 재산범죄를 친고죄로 규정한 형 법 제328조 제2항은 일정한 친족 사이에서 발생한 재산범죄의 경우 피해자의 고소를 소추조건으로 정하여 피해자의 의사에 따라 국가형벌권 행사가 가능하도록 한 것으로서 합리적 이유가 있다. 따라서 직계혈족, 배우자, 동거친족, 동거가족 또는 그 배우자 이외의 친족 간에 권리행사방해죄를 범한 때는 고소가 있어야 공소를 제기할 수 있도록 한 형법 조항은 평등원칙에 위배되지 않는다(헌재 2024. 6. 27. 2023헌바449)."},{"set":13,"num":25,"q":"형사보상 및 명예회복에 관한 법률 에 따른 보상을 받을 자가 같은 원인에 대하여 다른 법률에 따라 손해배상을 받은 경우에 그 손해배상의 액수가 형사보상 및 명예회복에 관한 법률 에 따라 받을 보상금의 액수와 같거나 그보다 많을 때에는 보상하지 아니한다.","src":"2024 경찰간부","a":true,"exp":"형사보상 및 명예회복에 관한 법률 제6조 제2항"},{"set":13,"num":26,"q":"헌법재판소는 헌법 제28조는 형사보상청구권의 내용을 법률에 의해 구체화하도록 규정하고 있으므로 형사보상법에서 형사보상청구의 제척기간을 1년의 단기로 규정하거나, 형사보상의 청구에 대한 보상의 결정에 불복을 할 수 없도록 하여 단심재판으로 규정한 것은 형사보상청구권을 침해하는 것이 아니라고 보았다.","src":"2024 법원직","a":false,"exp":"이 사건 법률조항은 짧은 제척기간을 규정하고 있음에도 불구하고 형사피고인이 무죄판결의 선고 사실을 알고 있는지 여부와 관계없이 제척기간이 진행되도록 규정하고 있어 형사피고인이 책임질 수 없는 사유에 의하여 제척기간을 도과할 가능성을 더욱 높게 하였다. 이는 국가의 잘못된 형사사법작용에 의해서 신체의 자유라는 중대한 법익을 침해받은 국민의 기본권을 사법상의 권리보다도 가볍게 보호하는 것으로서 부당하다고 하지 않을 수 없다. 따라서 이 사건 법률조항은 입법목적 달성에 필요한 정도를 넘어서 국민의 기본권을 제한한 것으로서 피해의 최소성원칙에 위배된다 할 것이다(헌재 2010. 7. 29. 2008헌가4). 보상액의 산정에 기초되는 사실인정이나보상액에 관한 판단에서 오류나 불합리성이 발견되는 경우에도 그 시정을 구하는 불복신청을 할 수 없도록 하는 것은 형사보상청구권 및 그 실현을 위한 기본권으로서의 재판청구권의 본질적 내용을 침해하는 것이라 할 것이다(헌재 2010. 10. 28. 2008헌마514)."},{"set":13,"num":27,"q":"외형상·형식상으로 무죄의 재판이 없는 경우에는 형사사법절차에 내재하는 불가피한 위험으로 인하여 국민의 신체의 자유에 관하여 피해가 발생하였더라도 형사보상청구권을 인정할 수는 없다.","src":"2024 경찰간부","a":false,"exp":"헌법 제28조의 형사보상청구권이 국가의 형사사법작용에 의하여 신체의 자유가 침해된 국민에게 그 구제를 인정 하여 국민의 기본권 보호를 강화하는 데 그 목적이 있는 점에 비추어 보면, 외형상ㆍ형식상으로 무죄재판이 없다고 하더라도 형사사법절차에 내재하는 불가피한 위험으로 인하여 국민의 신체의 자유에 관하여 피해가 발생하였다면 형사보상청구권을 인정하는 것이 타당하다(헌재 2022. 2. 24. 2018헌마998)."},{"set":13,"num":28,"q":"무죄판결이 확정된 피고인이 구금 여부와 상관없이 재판에 들어간 비용의 보상을 법원에 청구할 수 있도록 하는 내용의 비용보상청구권의 제척기간을 무죄판결이 확정된 날부터 6개월로 규정한 구 형사소송법 해당 규정은 형사보상청구권을 제한한다.","src":"2025 법원직","a":false,"exp":"비용보상청구권의 제척기간을 무죄판결이 확정된 날부터 6개월로 규정한 심판대상조항은 무죄판결이 확정된 경우 피고인이 비용보상청구권을 재판상 행사할 수 있는 기간을 제한하는 규정이므로 기본적으로 청구권자의 재판청구권을 제한한다. 한편, 심판대상조항은 재산적 가치가 있는 비용보상청구권의 행사를 제한함으로써 비용보상청구권자의 재산권을 침해하고, 형사보상청구권이나 국가배상청구권과 비교할 때 청구기간이 지나치게 짧아 평등원칙에 위배된다고 볼 수 있다. 그런데 재산권이나 평등원칙 침해 여부는 재판청구권 침해 여부에 대한 판단에서 함께 다루어질 것이므로, 이 사건에서는 심판대상조항이 비용보상청구권자의 재판청구권을 침해하는지 여부를 중심으로판단한다. ... 형사소송법상 비용보상청구권은 입법자가 사회적 여건이 허락하는 범위 안에서 사법절차에서 피해를 입은 사람에 대한 구제범위를 확대해 나가는 과정에서 비로소 형성된 권리이다. 이 점에서 헌법 제정 당시부터 헌법적 차원에서 명시적으로 요건을 정해서 보장되어 온 형사보상청구권이나 국가의 위법행위에 따른 손해를 전보하는 국가배상청구권과는 기본적으로 규범의 성격이 다르다. ... 심판대상조항이 과잉금지원칙에 위배하여 청구인의재판청구권이나 재산권을 침해한다거나, 평등원칙에 위배된다고 보기 어렵다. (헌재 2015. 4. 30. 2014헌바408) 따라서 비용보상청구권의 제척기간을 무죄판결이 확정된 날부터 6개월로 규정한 법률조항은 재판청구권, 재산권, 평등권을 제한하지만 형사보상청구권을 제한하는 것은 아니다."},{"set":13,"num":29,"q":"비용보상청구권의 제척기간을 무죄판결이 확정된 날부터 6개월 이내로 규정한 구 군사법원법 해당 조항은 헌법에 위반된다.","src":"2024 법원직","a":true,"exp":"헌재 2023. 8. 31. 2020헌바252"},{"set":13,"num":30,"q":"국가배상법 제2조 소정의 “공무원”이라 함은 국가공무원법이나 지방공무원법에 의하여 공무원으로서의 신분을 가진 자에국한하지 않고, 널리 공무를 위탁받아 실질적으로 공무에 종사하고 있는 일체의 자를 가리키는 것이라고 봄이 상당하다.","src":"2024 법원직","a":true,"exp":"대법원 2001. 1. 5. 98다39060"},{"set":13,"num":31,"q":"국가배상법 이 정한 손해배상청구의 요건인 ‘공무원의 직무’에는 국가나 지방자치단체의 권력적 작용뿐만 아니라 비권력적 작용도 포함되지만 단순한 사경제의 주체로서 하는 작용은 포함되지 않는다.","src":"2018 지방직 7급","a":true,"exp":"대법원 2001. 1. 5. 98다39060"},{"set":13,"num":32,"q":"국가배상청구권의 성립요건으로서 공무원의 고의 또는 과실을 규정한 것은 법률로 이미 형성된 국가배상청구권의 행사 및 존속을 제한한다기보다는 국가배상청구권의 내용을 형성하는 것이다.","src":"2025 법원직","a":true,"exp":"헌법상 국가배상청구권은 청구권적 기본권이고, 그 요건인 ‘불법행위’는 법률에서 구체적으로 형성할 수 있는개념이라 할 것이다. 따라서 법률조항이 국가배상청구권의 성립요건으로서 공무원의 고의 또는 과실을 규정한 것 은 법률로 이미 형성된 국가배상청구권의 행사 및 존속을 제한한다고 보기 보다는 국가배상청구권의 내용을 형성하는 것이라고 할 것이다(헌재 2015.04.30. 2013헌바395)."},{"set":13,"num":33,"q":"대법원은 국회의원의 입법행위는 그 입법 내용이 헌법의 문언에 명백히 위반됨에도 불구하고 국회가 굳이 당해 입법을 한 것과 같은 특수한 경우가 아닌 한 국가배상법 제2조 제1항 소정의 위법행위에 해당된다고 볼 수 없다고 보았다.","src":"2024 법원직","a":true,"exp":"대법원 1997. 6. 13. 96다56115"},{"set":13,"num":34,"q":"법관이 행하는 재판사무의 특수성과 그 재판과정의 잘못에 대하여는 따로 불복절차에 의하여 시정될 수 있는 제도적 장치가 마련되어 있는 점 등에 비추어 보면, 특별한 사정이    없는 한 법관의 재판에 법령의 규정을 따르지 아니한 잘못이 있다 하더라도 이로써 바로 그 재판상 직무행위가 국가배상법 제2조 제1항에서 말하는 위법한 행위로 되어 국가의 손해배상책임이 발생하는 것은 아니다.","src":"2025 법원직","a":true,"exp":"법관이 행하는 재판사무의 특수성과 그 재판과정의 잘못에 대하여는 따로 불복절차에 의하여 시정될 수 있는 제도적 장치가 마련되어 있는 점 등에 비추어 보면, 법관의 재판에 법령의 규정을 따르지 아니한 잘못이 있다 하더라도 이로써 바로 그 재판상 직무행위가 국가배상법 제2조 제1항에서 말하는 위법한 행위로 되어 국가의 손해배상책임이 발생하는 것은 아니고, 그 국가배상책임이 인정되려면 당해 법관이 위법 또는 부당한 목적을 가지고 재판을 하는 등 법관이 그에게 부여된 권한의 취지에 명백히 어긋나게 이를 행사하였다고 인정할 만한 특별한 사정이 있어야 한다고 해석함이 상당하다(대법원 2001.4.24. 2000다16114)."},{"set":13,"num":35,"q":"당초 유효한 법률에 근거한 공무원의 직무집행이 사후에 그 근거가 되는 법률에 대한 헌법재판소의 위헌결정으로 위법하게 된 경우, 이에 이르는 과정에 있어 공무원의 고의, 과실을 어느 정도 인정할 수 있고, 그로써 국가의 청구인들에 대한 손해배상책임이 성립한다고 볼 수 있다.","src":"2022 경찰 제2차","a":false,"exp":"일반적으로 법률이 헌법에 위반된다는 사정은 헌법재판소의 위헌결정이 있기 전에는 객관적으로 명백한 것이라고 할 수 없으므로, 법률이 헌법에 위반되는지 여부를 심사할 권한이 없는 공무원으로서는 그 법률을 적용할 수밖에 없는 것이고, 따라서 법률에 근거한 행정처분이 사후에 그 처분의 근거가 되는 법률에 대한 헌법재판소의 위헌결정으로 결과적으로 위법하게 집행된 처분이 될지라도, 이에 이르는 과정에 있어서 공무원의 고의, 과실을 인정할 수는 없 다. 그러므로 국가의 청구인에 대한 손해배상책임은 성립되지 아니한다(헌재 2008. 4. 24. 2006헌바72)."},{"set":13,"num":36,"q":"일반적인 공무원의 직무상 불법행위로 손해를 받은 국민의 손해배상청구에 관하여 그 국가배상청구권의 소멸시효 기산점 을 피해자나 법정대리인이 그 손해 및 가해자를 안 날(주관적 기산점) 및 불법행위를 한 날(객관적 기산점)로 정하되, 그시효기간을 주관적 기산점으로부터 3년, 객관적 기산점으로부터 5년으로 정한 것이 국가배상청구권을 침해한다고 볼 수 없다.","src":"2023 법원행시","a":true,"exp":"헌재 2018. 8. 30. 2014헌바148"},{"set":13,"num":37,"q":"헌법상 범죄피해자구조청구권은 1987년 개정헌법에서 도입되었다.","src":"2025 법원직","a":true,"exp":"범죄피해자구조청구권이란 타인의 범죄행위로 인하여 생명 신체에 대한 피해를 받은 국민이 국가에 구조금을 요구할 수 있는 권리이다. 현행헌법(1987년 제9차 개정)에서 최초로 규정하였다."},{"set":13,"num":38,"q":"과실에 의한 행위로 사망한 경우는 범죄피해자 보호법상 구조의 대상이 되는 범죄피해에 해당하지 아니한다.","src":"2014 법원행시","a":true,"exp":"범죄피해자보호법 제3조 제1항 제4호"},{"set":13,"num":39,"q":"범죄피해자구조대상이 되는 범죄피해의 범위에는 형법 제20조 또는 제21조 제1항에 따라 처벌되지 아니하는 행위, 과실에 의한 행위는 제외한다.","src":"2022 법원직","a":true,"exp":"범죄피해자 보호법 제3조 제1항 제4호"},{"set":13,"num":40,"q":"구조대상 범죄피해를 받은 사람이나 유족이 해당 구조대상 범죄피해를 원인으로 하여 국가배상법 이나 그 밖의 법령에 따 른 급여 등을 받을 수 있는 경우에는 대통령령으로 정하는 바에 따라 구조금을 지급하지 아니한다.","src":"2024 경찰간부","a":true,"exp":"범죄피해자 보호법 제20조"},{"set":14,"num":1,"q":"공무원연금법상 연금수급권과 같은 사회보장수급권은 헌법 제34조의 규정으로부터 도출되는 사회적 기본권의 하나로서, 국가에 대하여 적극적으로 급부를 요구하는 것이므로 헌법규정만으로는 이를 실현할 수 없고, 법률에 의한 형성을 필요로 한다.","src":"2024 법원직","a":true,"exp":"헌재 1999. 4. 29. 97헌마333"},{"set":14,"num":2,"q":"사회보장수급권은 사회보장입법에 그 수급요건, 수급자의 범위, 수급액 등 구체적인 사항이 규정될 때 비로소 형성되는 법률적 차원의 권리에 불과하다.","src":"2025 국가직 7급","a":true,"exp":"헌재 2003. 7. 24. 2002헌바51"},{"set":14,"num":3,"q":"연금수급권에 재산권의 성격이 일부 있더라도 그것으로 인해 연금수급권은 사회보장법리의 영향을 받지 않으며, 사회보장수급권과 재산권의 두 요소가 불가분적으로 혼재되어 있다면 입법자로서는 연금수급권의 구체적 내용을 정함에 있어 이를 하나의 전체로서 파악해서도 안 되고, 어느 한 쪽의 요소에 중점을 두어서도 안 될 것이다.","src":"2025 국가직 7급","a":false,"exp":"공무원연금법상의 연금수급권은 사회보장수급권의 성격과 아울러 재산권적 성격을 가지고 있다는 점에서 양 권리의 성격이 불가분적으로 혼재되어 있으므로, 비록 연금수급권에 재산권의 성격이 일부 있다 하더라도 그것은 사회보장법리의 강한 영향을 받지 않을 수 없다. 사회보장수급권과 재산권의 두 요소가 불가분적으로 혼재되어 있다면, 입법자로서는 연금수급권의 구체적 내용을 정함에 있어 이를 하나의 전체로서 파악하여 어느 한 쪽의 요소에 보다 중점을 둘 수도 있다. 따라서 유족연금수급권의 구체적인 내용을 형성함에 있어서 입법자는 공무원연금의 재정상황, 국민 전체의 소득 및 생활수준, 기타 여러 사회적⋅경제적 여건 등을 종합하여 공무원연금법의 입법목적에 맞도록 합리적인 수준에서 결정할 수 있고, 여기에 필요한 정책적인 판단 및 결정은 일차적으로 입법자의 재량에 맡겨져 있다(헌재 2020. 6. 25. 2018헌마865)."},{"set":14,"num":4,"q":"인간다운 생활을 할 권리에 관한 헌법상 규정은 모든 국가기관을 기속하지만, 그 기속의 의미는 적극적･형성적 활동을 하는 입법부 또는 행정부의 경우와 헌법재판에 의한 사법적 통제기능을 하는 헌법재판소에 있어서 동일하지아니하다.","src":"2022 경찰 제2차","a":true,"exp":"인간다운 생활을 할 권리에 관한 헌법의 규정은 모든 국가기관을 기속하지만, 그 기속의 의미는 적극적·형성적 활동을 하는 입법부 또는 행정부의 경우와 헌법재판에 의한 사법적 통제기능을 하는 헌법재판소에 있어서 동일하지 아니하다. 위와 같은 헌법의 규정이, 입법부나 행정부에 대하여는 행위의 지침 즉 행위규범으로서 작용하지만, 헌법재판에 있어서는 통제규범으로 작용하는 것이다(헌재 1999. 12. 23. 98헌바33)."},{"set":14,"num":5,"q":"국가가 인간다운 생활을 보장하기 위한 헌법적 의무를 다하였는지의 여부가 사법적 심사의 대상이 된 경우에는, 국가가 생계보호에 관한 입법을 전혀 하지 아니하였다든가 그 내용이 현저히 불합리하여 헌법상 용인될 수 있는 재량의 범위를 명백히 일탈한 경우에 한하여 인간다운 생활을 할 권리를 보장한 헌법에 위반된다고 할 수 있다.","src":"2025 국가직 7급","a":true,"exp":"헌재 1997. 5. 29. 94헌마33"},{"set":14,"num":6,"q":"인간다운 생활을 보장하기 위한 객관적인 내용의 최소한을 보장하고 있는지 여부는 특정한 법률에 의한 생계급여만을 가지고 판단하면 되고, 여타 다른 법령에 의해 국가가 최저생활보장을 위하여 지급하는 각종 급여나 각종 부담의 감면 등을 총괄한 수준으로 판단할 것을 요구하지는 않는다.","src":"2020 국가직 7급","a":false,"exp":"국가가 행하는 생계보호의 수준이 그 재량의 범위를 명백히 일탈하였는지의 여부, 즉 인간다운 생활을 보장하기 위한 객관적 내용의 최소한을 보장하고 있는지의 여부는 생활보호법에 의한 생계보호급여만을 가지고 판단하여서는 아니되고그 외의 법령에 의거하여 국가가 생계보호를 위하여 지급하는 각종 급여나 각종 부담의 감면 등을 총괄한 수준을 가지고 판단하여야 한다(헌재 1997.5.29. 94헌마33)."},{"set":14,"num":7,"q":"헌법 제31조 제1항이 보장하는 ‘교육을 받을 권리’에 사회적·경제적 약자도 능력에 따른 실질적인 평등교육을 받을 수 있도록 적극적인 정책을 실현해야 할 국가의 의무가 포함된다고 볼 수 없다.","src":"2025 법원직","a":false,"exp":"헌법 제31조 제1항은 “모든 국민은 능력에 따라 균등하게 교육을 받을 권리를 가진다”고 규정하여 국민의 교육을 받을 권리를 보장하고 있다. ‘교육을 받을 권리’란, 모든 국민에게 저마다의 능력에 따른 교육이 가능하도록 그에 필요한 설비와 제도를 마련해야 할 국가의 과제와 아울러 이를 넘어 사회적․경제적 약자도 능력에 따 른 실질적 평등교육을 받을 수 있도록 적극적인 정책을 실현해야 할 국가의 의무를 뜻한다(헌재 2000. 4. 27. 98헌가16)."},{"set":14,"num":8,"q":"헌법 제31조제1항에서 보장되는 교육의 기회균등권은 모든 국민에게 균등한 교육을 받게 하고 특히 경제적 약자가 실질적인 평등교육을 받을 수 있도록 국가에게 적극적 정책을 실현할 것을 요구하므로, 헌법 제31조제1항으로부터국민이 직접 실질적 평등교육을 위한 교육비를 청구할 권리가 도출된다.","src":"2021 지방직 7급","a":false,"exp":"헌법 제31조 제1항에서 보장되는 교육의 기회균등권은 '정신적·육체적 능력 이외의 성별·종교·경제력·사회적신분 등에 의하여 교육을 받을 기회를 차별하지 않고, 즉 합리적 차별사유 없이 교육을 받을 권리를 제한하지 아니함과 동시에 국가가 모든 국민에게 균등한 교육을 받게 하고 특히 경제적 약자가 실질적인 평등교육을 받을 수 있도록 적극적 정책을 실현해야 한다는 것'을 의미하므로, 실질적인 평등교육을 실현해야 할 국가의 적극적인 의무가 인정되지만, 이러한 의무조항으로부터 국민이 직접 실질적 평등교육을 위한 교육비를 청구할 권리가 도출되는 것은 아니다(헌재 2003.11.27. 2003헌바39)."},{"set":14,"num":9,"q":"헌법 제31조 제1항에 따라 보장되는 교육을 받을 권리는 국가로 하여금 국가의 재정능력이 허용하는 범위 내에서 모든 국민에게 취학의 기회가 골고루 주어지도록 그에 필요한 교육시설 및 제도를 마련할 의무를 부과할 뿐만 아니라 국민이 국가에 대하여 직접 특정한 교육제도나 교육과정을 요구할 수 있는 것까지도 포함한다.","src":"2021 법원행시","a":false,"exp":"헌법 제31조 제1항에 의하여 보장되는 교육을 받을 권리에 국민이 국가에 대하여 직접 특정한 교육제도나 교육과정을 요구할 수 있는 권리나, 특정한 교육제도나 교육과정의 배제를 요구할 권리가 포함되는 것은 아니다(헌재2005.11.24. 2003헌마173)."},{"set":14,"num":10,"q":"헌법 제31조의 교육을 받을 권리는 국민이 국가에 대해 직접 특정한 교육제도나 학교시설을 요구할 수 있는 기본권이며, 자신의 교육환경을 최상 혹은 최적으로 만들기 위해 타인의 교육시설 참여 기회를 제한할 것을 청구할 수 있는 기본권이기도 하다.","src":"2021 지방직 7급","a":false,"exp":"교육을 받을 권리가 국가에 대하여 특정한 교육제도나 시설의 제공을 요구할 수 있는 권리를 뜻하는 것은 아니다(헌재 2000. 4. 27. 98헌가16). 교육을 받을 권리는 교육영역에서의 기회균등을 내용으로 하는 것이지, 자신의 교육환경을 최상 혹은 최적으로 만들기 위해 타인의 교육시설 참여 기회를 제한할 것을 청구할 수 있는 기본권은 아니므로, 기존의 재학생들에 대한 교육환경이 상대적으로 열악해질 수 있음을 이유로 새로운 편입학 자체를 하지 말도록 요구하는 것은 교육을 받을 권리의 내용으로는 포섭할 수 없다(헌재 2003. 9. 25. 2001헌마814)."},{"set":14,"num":11,"q":"헌법 제31조제4항에서 보장하고 있는 대학의 자율성에 따라 대학은 학생의 선발 및 전형 등 대학입시제도를 자율적으로 마련할 수 있으므로, 국립교육대학교 등이 검정고시 출신자의 수시모집 지원을 제한하는 것은 수시모집 에 지원하려는 검정고시 출신자의 균등하게 교육을 받을 권리를 침해하는 것이 아니다.","src":"2021 지방직 7급","a":false,"exp":"헌법 제22조 제1항이 보장하고 있는 학문의 자유와 헌법 제31조 제4항에서 보장하고 있는 대학의 자율성에 따라 대학이 학생의 선발 및 전형 등 대학입시제도를 자율적으로 마련할 수 있다 하더라도, 이러한 대학의 자율적 학생 선발권을 내세워 국민의 ‘균등하게 교육을 받을 권리’를 침해할 수 없으며, 이를 위해 대학의 자율권은 일정부분 제약을 받을 수 있다. 이 사건 수시모집요강이 수시모집에서 검정고시 출신의 응시자에게 수학능력이 있는지 여부를 평가할 수 있는 기회를 부여하지 아니하고 이를 박탈한다는 것은 수학능력에 따른 합리적인 차별이 라고 보기 어렵다. 따라서 서울교육대학교 등이 ‘2017학년도 신입생 수시모집 입시요강’에서 검정고시로 고등학교 졸업학력을 취득한 사람들의 수시모집 지원을 제한하는 것은 교육을 받을 권리를 침해한다(헌재 2017. 12. 28. 2016헌마649)."},{"set":14,"num":12,"q":"학문의 자유와 대학의 자율성에 따라 대학이 학생의 선발 및 전형 등 대학입시제도를 자율적으로 마련할 수 있다 하더라도, 국민의 ‘균등하게 교육을 받을 권리’를 위해 대학의 자율적 학생 선발권은 일정부분 제약을 받을 수 있다.","src":"2021 국가직 7급","a":true,"exp":"헌재 2017. 12. 28. 2016헌마649"},{"set":14,"num":13,"q":"고시 공고일을 기준으로 고등학교에서 퇴학된 날로부터 6월이 지나지 아니한 자를 고등학교 졸업학력 검정고시를받을 수 있는 자의 범위에서 제외하고 있는 ‘고등학교 졸업학력 검정고시 규칙’의 조항은 교육을 받을 권리를 침해한다.","src":"2024 경찰간부","a":false,"exp":"고시 공고일을 기준으로 고등학교에서 퇴학된 날로부터 6월이 지나지 아니한 자를 고등학교 졸업학력 검정고시를 받을 수 있는 자의 범위에서 제외하고 있는 ‘고등학교 졸업학력 검정고시 규칙’의 조항은 교육을 받을 권리를 침해하지 않는다(헌재 2008. 4. 24. 2007헌마1456)."},{"set":14,"num":14,"q":"헌법상 초등교육에 대한 의무교육과는 달리 중등교육의 단계에 있어서는 어느 범위에서 어떠한 절차를 거쳐 어느 시점에서 의무교육으로 실시할 것인가는 입법자의 형성의 자유에 속하는 사항으로서 국회가 입법정책적으로 판단하여 법률로 구체적으로 규정할 때에 비로소 헌법상의 권리로서 구체화되는 것으로 보아야 한다.","src":"2024 법원직","a":true,"exp":"헌재 1991. 2. 11. 90헌가27"},{"set":14,"num":15,"q":"헌법 제31조제3항의 의무교육 무상의 원칙은 교육을 받을 권리를 보다 실효성 있게 보장하기 위하여 의무교육 비용을 학령아동의 보호자 개개인의 직접적 부담에서 공동체 전체의 부담으로 이전하라는 명령일 뿐, 의무교육의 비용을 오로지 국가 또는 지방자치단체의 예산으로 해결해야 함을 의미하는 것은 아니다.","src":"2021 지방직 7급","a":true,"exp":"의무교육무상에 관한 헌법 제31조 제3항은 교육을 받을 권리를 보다 실효성 있게 보장하기 위하여 의무교육 비용을 학령아동의 보호자 개개인의 직접적 부담에서 공동체 전체의 부담으로 이전하라는 명령일 뿐이고 의무교육의 비용을 오로지 국가 또는 지방자치단체의 예산, 즉 조세로 해결해야 함을 의미하는 것은 아니다. 따라서 의무교육의 대상인 수분양자가 아닌 개발사업자에게 학교용지부담금을 부과하고 그 재원으로 의무교육시설을 마련하도록 하는 것은 더 이상 의무교육의 무상성과는 관계가 없다(헌재 2008. 9. 25. 2007헌가9)."},{"set":14,"num":16,"q":"의무교육 대상인 중학생의 학부모에게 급식 관련 비용 일부를 부담하도록 규정한 구｢학교급식법｣의 조항은 헌법상 의무교육의 무상원칙에 반하지 않는다.","src":"2022 지방직 7급","a":true,"exp":"헌재 2012. 4. 24. 2010헌바164"},{"set":14,"num":17,"q":"국가는 학교교육에 관한 한, 교육제도의 형성에 관한 폭넓은 권한을 가지고 있지만, 학교교육 밖의 사적인 교육영역에서는 원칙적으로 부모의 자녀교육권이 우위를 차지하고, 국가 또한 헌법이 지향하는 문화국가이념에 비추어, 학교교육과 같은 제도교육 외에 사적인 교육의 영역에서도 사인의 교육을 지원하고 장려해야 할 의무가 있으므로 사적인 교육영역에 대한 국가의 규율권한에는 한계가 있다.","src":"2023 국가직 7급","a":true,"exp":"헌재 2000. 4. 27. 98헌가16"},{"set":14,"num":18,"q":"교원의 지위를 포함한 교육제도 등의 법정주의를 규정하고 있는 헌법 제31조 제6항은 교원의 기본권보장 내지지위보장뿐만 아니라 교원의 기본권을 제한하는 근거가 될 수도 있다.","src":"2024 경정승진","a":true,"exp":"교원지위법정주의는 단순히 교원의 권익보장만을 위한다거나 교원의 지위를 행정권력에 의한 부당한 침해로부터보호하는 것만을 목적으로 한 것은 아니고, 국민의 교육을 받을 권리를 실효성 있게 보장하는 것도 그 중요한 목적이라 할 것이므로, 입법부가 교원의 지위를 정하는 법률을 제정함에 있어 교원의 신분보장이나 경제적․사회적지위보장과 함께 국민의 교육을 받을 권리를 저해할 우려가 있는 행위의 금지 등 교원의 의무에 관한 사항을 포함하여 교원의 기본권을 제한하는 사항까지도 규율할 수 있다(헌재 2008. 11. 27. 2005헌가21)."},{"set":14,"num":19,"q":"헌법 제32조 제1항이 규정한 근로의 권리는 개인인 근로자 외에 노동조합 또한 그 주체가 된다.","src":"2021 법원직","a":false,"exp":"헌법 제32조 제1항은 국가의 개입·간섭을 받지 않고 자유로이 근로를 할 자유와, 국가에 대하여 근로의 기회를 제공하는 정책을 수립해 줄 것을 요구할 수 있는 권리 등을 기본적인 내용으로 하고 있고, 이 때 근로의 권리는 근로자를 개인의 차원에서 보호하기 위한 권리로서 개인인 근로자가 근로의 권리의 주체가 되는 것이고, 노동조합은 그 주체가 될 수 없는 것으로 이해되고 있다(헌재 2009. 2. 26. 2007헌바27)."},{"set":14,"num":20,"q":"타인과의 사용종속관계 하에서 근로를 제공하고 그 대가로 임금 등을 받아 생활하는 사람은 노동조합 및 노동관계조정법(이하 ‘노동조합법’이라고 한다)상 근로자에 해당하고, 노동조합법상의 근로자성이 인정되는 한, 그러한 근로자가외국인인지 여부나 취업자격의 유무에 따라 노동조합법상 근로자의 범위에 포함되지 아니한다고 볼 수는 없다.","src":"2023 법원직","a":true,"exp":"대법원 2015. 6. 25. 2007두4995"},{"set":14,"num":21,"q":"｢교원의 노동조합 설립 및 운영 등에 관한 법률｣에 의하면 사립학교 교원은 단결권과 단체교섭권이 인정되고 단체행동권이 금지되지만, 국·공립학교 교원은 근로3권이 모두 부인된다.","src":"2019 지방직 7급","a":false,"exp":"교원노조법은 사립학교 교원뿐 아니라 국·공립학교 교원에게도 단결권과 단체교섭권을 허용하고 있다. 따라서 국공립학교 교원의 경우에도 단결권과 단체교섭이 인정된다."},{"set":14,"num":22,"q":"헌법 제15조의 직업의 자유 또는 헌법 제32조의 근로의 권리, 사회국가원리 등에 근거하여 실업방지 및 부당한 해고로부터 근로자를 보호하여야 할 국가의 의무를 도출할 수 있으므로, 국가에 대한 직접적인 직장존속보장청구권을 근로자에게 인정할 헌법상의 근거가 있다. 따라서 근로관계의 당연승계를 보장하는 입법을 반드시 하여야 할 헌법상의 의무를 인정할 수 있다.","src":"2023 법원직","a":false,"exp":"헌법 제15조의 직업의 자유 또는 헌법 제32조의 근로의 권리, 사회국가원리 등에 근거하여 실업방지 및 부당한 해고로부터 근로자를 보호하여야 할 국가의 의무를 도출할 수는 있을 것이나, 국가에 대한 직접적인 직장존속보장청구권을 근로자에게 인정할 헌법상의 근거는 없다. 따라서 한국보건산업진흥원법 부칙 제3조가 기존 연구기관의 재산상의 권리·의무만을 새로이 설립되는 한국보건산업진흥원에 승계시키고, 직원들의 근로관계가 당연히승계되는 것으로 규정하지 않았다 하여 위헌이라 할 수 없다(헌재 2002. 11. 28. 2001헌바50)."},{"set":14,"num":23,"q":"사실상 노무에 종사하는 공무원 중 대통령령 등이 정하는 자에 한하여 근로3권을 인정하는 국가공무원법 조항은, 근로3권이 보장되는 공무원의 범위를 사실상 노무에 종사하는 공무원으로 한정하고 있으나, 이는 헌법 제33조 제2항에 근거한 것으로, 전체국민의 공공복리와 사실상 노무에 종사하는 공무원의 직무의 내용, 노동조건 등을 고려해 보았을 때 입법자에게 허용된 입법재량권의 범위를 벗어난 것이라 할 수 없다.","src":"2023 법원직","a":true,"exp":"헌재 1992. 4. 28. 90헌바27"},{"set":14,"num":24,"q":"월급근로자로서 6개월이 되지 못한 자를 해고예고제도의 적용예외사유로 규정하고 있는 ｢근로기준법｣ 조항은 근무기간이 6개월 미만인 월급근로자의 근로의 권리를 침해하고 평등원칙에 위배된다.","src":"2016 지방직 7급","a":true,"exp":"헌재 2015.12.23. 2014헌바3"},{"set":14,"num":25,"q":"일용근로자로서 3개월을 계속 근무하지 아니한 자를 해고예고제도의 적용제외사유로 규정하고 있는 ｢근로기준법｣ 규정은 일용근로자인 청구인의 근로의 권리를 침해하지 않는다.","src":"2022 경찰 제1차","a":true,"exp":"해고예고는 본질상 일정기간 이상을 계속하여 사용자에게 고용되어 근로제공을 하는 것을 전제로 하는데, 일용근로자는 계약한 1일 단위의 근로기간이 종료되면 해고의 절차를 거칠 것도 없이 근로관계가 종료되는 것이 원칙 이므로, 그 성질상 해고예고의 예외를 인정한 것에 상당한 이유가 있다. 따라서 심판대상조항이 청구인의 근로의 권리를 침해한다고 보기 어렵다(헌재 2017. 5. 25. 2016헌마640)."},{"set":14,"num":26,"q":"청원경찰의 복무에 관하여 ｢국가공무원법｣ 제66조제1항을 준용함으로써 노동운동을 금지하는 ｢청원경찰법｣ 제5조제4항 중 ｢국가공무원법｣ 제66조제1항 가운데 ‘노동운동’ 부분을 준용하는 부분은 국가기관이나 지방자치단체 이외의 곳에서 근무하는 청원경찰의 근로3권을 침해한다.","src":"2019 지방직 7급","a":true,"exp":"청원경찰은 일반근로자일 뿐 공무원이 아니므로 원칙적으로 헌법 제33조 제1항에 따라 근로3권이 보장되어야 한 다. 심판대상조항이 모든 청원경찰의 근로3권을 전면적으로 제한하는 것은 과잉금지원칙을 위반하여 청구인들의 근로3권을 침해하는 것이다(헌재 2017.9.28. 2015헌마653)."},{"set":14,"num":27,"q":"｢교원의 노동조합 설립 및 운영 등에 관한 법률｣의 적용을 받는 교원의 범위를 초․중등학교에 재직 중인 교원으로 한정하고 해직교원을 제외하는 것은 전국교직원노동조합 및 해직교원들의 단결권을 침해하지 않는다.","src":"2016 지방직 7급","a":true,"exp":"‘교원노조법’의 적용을 받는 교원의 범위를 초·중등학교에 재직 중인 교원으로 한정하고 있는 법률조항은 아 직 임용되지 않은 교사자격취득자 또는 해고된 교원의 단결권 및 이들을 조합원으로 가입·유지하려는 교원노조의 단결권을 지나치게 제한한다고 볼 수 없다(헌재 2015. 5. 28. 2013헌마671)."},{"set":14,"num":28,"q":"교원노조를 설립하거나 가입하여 활동할 수 있는 자격을 초중등 교원으로 한정함으로써 교육공무원이 아닌 대학 교원에 대해서 근로기본권의 핵심인 단결권조차 전면적으로 부정한 법률조항은 그 입법목적의 정당성을 인정하기 어렵고, 수단의 적합성 역시 인정할 수 없다.","src":"2020 경정승진","a":true,"exp":"교육공무원 아닌 대학 교원에 대해서는 과잉금지원칙 위배 여부를 기준으로, 교육공무원인 대학 교원에 대해서는 입법형성의 범위를 일탈하였는지 여부를 기준으로 나누어 심사하기로 한다. ... 교원노조를 설립하거나 가입하여 활동할 수 있는 자격을 초·중등교원으로 한정함으로써 교육공무원이 아닌 대학 교원에 대해서는 근로기본권의 핵심인 단결권조차 전면적으로 부정한 측면에 대해서는 그 입법목적의 정당성을 인정하기 어렵다. ... 과잉금지원칙에 위배되어 교육공무원 아닌 대학 교원의 단결권을 침해한다. ... 교육공무원인 대학 교원에게 근로3권을 일체 허용하지 않고 전면적으로 부정하는 것은 합리성을 상실한 과도한 것으로서 입법형성권의 범위를 벗어나 헌법에 위반된다. (헌재 2018. 8. 30. 2015헌가38)"},{"set":14,"num":29,"q":"환경권의 보호대상이 되는 환경에는 자연환경뿐만 아니라 인공적 환경과 같은 생활환경도 포함되므로, 일상생활에서 소음을 제거ㆍ방지하여 정온한 환경에서 생활할 권리는 환경권의 한 내용을 구성한다.","src":"2025 국가직 7급","a":true,"exp":"헌재 2019. 12. 27. 2018헌마730"},{"set":14,"num":30,"q":"국가가 국민의 건강하고 쾌적한 환경에서 생활할 권리에 관한 보호의무를 다하지 않았는지를 헌법재판소가 심사할 때에는 원칙적으로 헌법 제37조제2항에 근거하는 과잉금지원칙의 위반 여부를 기준으로 삼아야 한다.","src":"2025 국가직 7급","a":false,"exp":"국가가 국민의 건강하고 쾌적한 환경에서 생활할 권리에 대한 보호의무를 다하지 않았는지 여부를 헌법재판소가 심사할 때에는 이른바 ‘과소보호금지원칙’의 위반 여부를 기준으로 삼아야 한다(헌재 2019. 12. 27. 2018헌마730)."},{"set":14,"num":31,"q":"법적으로 승인되지 아니한 사실혼은 헌법 제36조 제1항의 보호범위에 포함된다고 보기 어렵다.","src":"2023 변호사시험","a":true,"exp":"헌법 제36조 제1항에서 규정하는 ‘혼인’이란 양성이 평등하고 존엄한 개인으로서 자유로운 의사의 합치에 의하여생활공동체를 이루는 것으로서 법적으로 승인받은 것을 말하므로, 법적으로 승인되지 아니한 사실혼은 헌법 제36조 제1항의 보호범위에 포함된다고 보기 어렵다. (헌재 2014. 8. 28. 2013헌바119)."},{"set":14,"num":32,"q":"부모가 자녀의 이름을 지어주는 것은 자녀의 양육과 가족생활을 위하여 필수적인 것이고, 가족생활의 핵심적 요소라 할 수 있으므로, ‘부모가 자녀의 이름을 지을 자유’는 혼인과 가족생활을 보장하는 헌법 제36조 제1항과 행복추구권을 보장하는 헌법 제10조에 의하여 보호받는다.","src":"2023 법원직","a":true,"exp":"헌재 2016. 7. 28. 2015헌마964"},{"set":14,"num":33,"q":"육아휴직신청권은 비록 헌법에 명문으로 규정되어 있지는 아니하지만, 이는 모든 인간이 누리는 불가침의 인권으로서 혼인과 가족생활을 보장하는 헌법 제36조 제1항, 행복추구권을 보장하는 헌법 제10조 및 ‘국민의 자유와 권리는 헌법에 열거되지 아니한 이유로 경시되지 아니한다.’고 규정한 헌법 제37조 제1항에서 나오는 중요한 기본권이다.","src":"2024 경찰간부","a":false,"exp":"육아휴직신청권은 헌법 제36조 제1항 등으로부터 개인에게 직접 주어지는 헌법적 차원의 권리라고 볼 수는 없 고, 입법자가 입법의 목적, 수혜자의 상황, 국가예산, 전체적인 사회보장수준, 국민정서 등 여러 요소를 고려하여제정하는 입법에 적용요건, 적용대상, 기간 등 구체적인 사항이 규정될 때 비로소 형성되는 법률상의 권리에 불과하다. (헌재 2008. 10. 30. 2005헌마1156)"},{"set":14,"num":34,"q":"1세대 3주택 이상에 해당하는 주택에 대하여 양도소득세 중과세를 규정하고 있는 구｢소득세법｣ 조항이 혼인이나 가족생활을 근거로 부부 등 가족이 있는 자를 혼인하지 아니한 자 등에 비하여 차별 취급하는 것이라면 비례의 원칙에 의한 심사에 의하여 정당화되지 않는 한 헌법 제36조제1항에 위반된다.","src":"2024 국가직 7급","a":true,"exp":"헌재 2011. 11. 24. 2009헌바146"},{"set":14,"num":35,"q":"혼인한 등록의무자는 배우자가 아닌 본인의 직계존·비속의 재산을 등록하도록 법이 개정되었으나, 개정 전 이미 배우자의 직계존·비속의 재산을 등록한 혼인한 여성 등록의무자는 종전과 동일하게 계속해서 배우자의 직계․존비속의 재산을 등록하도록 한 부칙 조항은 그 목적의 정당성을 발견할 수 없다.","src":"2022 법원직","a":true,"exp":"혼인한 남성 등록의무자와 달리 혼인한 여성 등록의무자의 경우에만 본인이 아닌 배우자의 직계존ㆍ비속의 재산을 등록하도록 하는 것은 여성의 사회적 지위에 대한 그릇된 인식을 양산하고, 가족관계에 있어 시가와 친정이라는 이분법적 차별구조를 정착시킬 수 있으며, 이것이 사회적 관계로 확장될 경우에는 남성우위ㆍ여성비하의 사회적 풍토를 조성하게 될 우려가 있다. 이는 성별에 의한 차별금지 및 혼인과 가족생활에서의 양성의 평등을 천명하고 있는 헌법에 정면으로 위배되는 것으로 그 목적의 정당성을 인정할 수 없다(헌재 2021. 9. 30. 2019헌가3)."},{"set":14,"num":36,"q":"혼인 종료 후 300일 이내에 출생한 자(子)를 전남편의 친생자로 추정하는 ｢민법｣ 조항은 혼인관계가 해소된 이후에 자가 출생하고 생부가 출생한 자를 인지하려는 경우마저도, 아무런 예외 없이 그 자를 전남편의 친생자로추정함으로써 친생부인의 소를 거치도록 하는 것은 모가 가정생활과 신분관계에서 누려야 할 인격권을 침해한다.","src":"2019 지방직 7급","a":true,"exp":"헌재 2015. 4. 30. 2013헌마623"},{"set":14,"num":37,"q":"헌법재판소는 8촌 이내의 혈족 사이에서는 혼인할 수 없도록 하는 민법 제809조 제1항이 혼인의 자유를 침해한다고 보았다.","src":"2023 법원직","a":false,"exp":"8촌 이내의 혈족 사이의 혼인을 무효로 하는 민법 조항은 과잉금지원칙에 위배하여 혼인의 자유를 침해하지만, 8촌 이내의 혈족 사이에서는 혼인할 수 없도록 하는 민법 조항은 혼인의 자유를 침해하지 않는다(헌재 2022. 10. 27. 2018헌바115)."},{"set":14,"num":38,"q":"국가정보원이 주관하는 신규채용경쟁시험에서 ‘남자는 병역을 필한 자’로 제한하여, 현역군인 신분자의 시험응시기회를 제한하는데, 이는 병역의무를 이행하느라 받는 불이익이므로 헌법 제39조 제2항에서 금지하는 ‘불이익한 처우’에 해당한다.","src":"2024 경찰 제2차","a":false,"exp":"이 사건 공고는 현역군인 신분자에게 다른 직종의 시험응시기회를 제한하고 있으나 이는 병역의무 그 자체를 이행하느라 받는 불이익으로서 병역의무 중에 입는 불이익에 해당될 뿐, 병역의무의 이행을 이유로 한 불이익은 아니므로 이 사건 공고로 인하여 현역군인이 타 직종에 시험응시를 하지 못하는 것은 헌법 제39조 제2항에서 금지하는 ‘불이익한 처우’라 볼 수 없다. (헌재 2007. 5. 31. 2006헌마627)"},{"set":15,"num":1,"q":"국회의원의 원내활동을 기본적으로 각자에게 맡기는 자유위임은 의회 내에서의 정치의사형성에 정당의 협력을 배척하는 것은 아니지만, 적어도 국회의원이 정당과 교섭단체의 지시에 기속되는 것을 배제하는 근거가 된다.","src":"2019 지방직 7급","a":false,"exp":"자유위임은 의회 내에서의 정치의사형성에 정당의 협력을 배척하는 것이 아니며, 의원이 정당과 교섭단체의 지시에 기속되는 것을 배제하는 근거가 되는 것도 아니다. 국회의원의 국민대표성을 중시하는 입장에서도 특정 정당에 소속된 국회의원이 정당기속 내지는 교섭단체의 결정(소위 ‘당론’)에 위반하는 정치활동을 한 이유로 제재를 받는 경우, 국회의원 신분을 상실하게 할 수는 없으나 “정당내부의 사실상의 강제” 또는 소속 “정당으로부터의 제명”은 가능하다고 보고 있다. 그렇다면, 당론과 다른 견해를 가진 소속 국회의원을 당해 교섭단체의 필요에 따라 다른 상임위원회로 전임(사·보임)하는 조치는 특별한 사정이 없는 한 헌법상 용인될 수 있는 “정당내부의 사실상 강제”의 범위 내에 해당한다. (헌재 2003. 10. 30. 2002헌라1)"},{"set":15,"num":2,"q":"권력분립원칙이란 국가권력의 기계적 분립과 엄격한 절연을 의미하는 것이 아니라 권력상호간의 견제와 균형을 통 한 국가권력의 통제를 의미한다.","src":"2022 변호사시험","a":true,"exp":"헌재 2008. 1. 10. 2007헌마1468"},{"set":15,"num":3,"q":"국회의장은 헌법에 규정되어 있는 헌법기관이지만, 부의장은 헌법에 규정되어 있지 않은 법률상 기관에 불과하여 국회부의장을 3인으로 하기 위해서는 헌법개정 없이 ｢국회법｣을 개정하는 것으로 족하다.","src":"2023 변호사시험","a":false,"exp":"국회는 의장 1인과 부의장 2인을 선출한다(헌법 제48조). 따라서 국회의장과 부의장은 모두 헌법에 규정되어 있 는 헌법기관이며 그 수가 의장 1인과 부의장 2인으로 정해져 있다. 그러므로 국회부의장을 3인으로 하기 위해서는 헌법개정이 필요하다."},{"set":15,"num":4,"q":"국회의장이 사고가 있을 때에는 소속 의원 수가 많은 교섭단체 소속 부의장의 순으로 의장의 직무를 대행한다.","src":"2025 법원직","a":false,"exp":"의장이 사고가 있을 때에는 의장이 지정하는 부의장이 그 직무를 대리한다(국회법 제12조 제1항). 의장이 심신상실 등 부득이한 사유로 의사표시를 할 수 없게 되어 직무대리자를 지정할 수 없을 때에는 소속 의원 수가 많은 교섭단체 소속 부의장의 순으로 의장의 직무를 대행한다(국회법 제12조 제2항)."},{"set":15,"num":5,"q":"국회의원이 국회의장 또는 부의장으로 당선된 때에는 당선된 다음 날부터 국회의장 또는 부의장으로 재직하는 동안은 당적을 가질 수 없다.","src":"2023 변호사시험","a":false,"exp":"의원이 의장으로 당선된 때에는 당선된 다음 날부터 의장으로 재직하는 동안은 당적을 가질 수 없다. 다만, 국회의원 총선거에 있어서 「공직선거법」 제47조에 따른 정당추천후보자로 추천을 받으려는 경우에는 의원 임기만료일 90일 전부터 당적을 가질 수 있다(국회법 제20조의2 제1항). 따라서 부의장은 당적을 가질 수 있다. 한편 의장은 원칙적으로 의장 재직 중에는 당적을 가질 수 없지만, 국회의원 총선거에서 정당추천을 받으려는 경우에는 의원 임기만료일 90일 전부터 당적을 가질 수 있다."},{"set":15,"num":6,"q":"국민권익위원회 소관에 속하는 사항은 국회운영위원회 소관 사항이다.","src":"2026 국가직 7급","a":false,"exp":"국민권익위원회 소관에 속하는 사항은 정무위원회 소관 사항이다(국회법 제37조 제1항 제3호)."},{"set":15,"num":7,"q":"각 교섭단체의 대표의원은 국회운영위원회의 위원 및 정보위원회의 위원이 된다.","src":"2022 국가직 7급","a":true,"exp":"국회법 제39조 제2항, 제48조 제3항 단서"},{"set":15,"num":8,"q":"상임위원회의 위원 정수는 국회규칙으로 정한다. 다만, 정보위원회의 위원 정수는 12명으로 한다.","src":"2022 국가직 7급","a":true,"exp":"국회법 제38조"},{"set":15,"num":9,"q":"보임(補任)되거나 개선(改選)된 상임위원의 임기는 전임자 임기의 남은 기간으로 한다.","src":"2024 국가직 7급","a":true,"exp":"국회법 제40조 제3항"},{"set":15,"num":10,"q":"예산결산특별위원회의 위원 수는 50명으로 하고 위원장은 교섭단체 소속 의원 수의 비율과 상임위원회 위원 수의 비율에 따라 각 교섭단체 대표의원의 요청으로 위원을 선임한다.","src":"2022 국가직 7급","a":false,"exp":"예산결산특별위원회의 위원 수는 50명으로 한다. 이 경우 의장은 교섭단체 소속 의원 수의 비율과 상임위원회 위원 수의 비율에 따라 각 교섭단체 대표의원의 요청으로 위원을 선임한다(국회법 제45조 제2항)."},{"set":15,"num":11,"q":"정기회의 회기는 100일을, 임시회의 회기는 30일을 초과할 수 없으며, 정기회와 임시회를 합하여 연 150일을 초과할 수 없다.","src":"2022 지방직 7급","a":false,"exp":"정기회의 회기는 100일을, 임시회의 회기는 30일을 초과할 수 없다는 부분은 맞다(헌법 제47조 제2항). 그러나 정기회와 임시회를 합하여 연 150일을 초과할 수 없다는 부분은 틀렸다. 7차 개헌 8차 개헌에서는 정기회와 임시회를 합하여 연 150일을 초과할 수 없다는 규정을 두었으나, 현행헌법에서는 연간회기일수를 제한하는 규정이삭제되었다."},{"set":15,"num":12,"q":"대통령이 임시회의 집회를 요구할 때에는 기간과 집회요구의 이유를 명시하여야 한다.","src":"2022 국가직 7급","a":true,"exp":"헌법 제47조 제3항"},{"set":15,"num":13,"q":"대통령은 국회 임시회의 집회를 요구할 수 있으며, 집회를 요구할 때 집회기간을 명시하여야 하는 것은 아니다.","src":"2023 국가직 7급","a":false,"exp":"대통령이 임시회의 집회를 요구할 때에는 기간과 집회요구의 이유를 명시하여야 한다(헌법 제47조 제3항)."},{"set":15,"num":14,"q":"헌법 제50조 제1항의 의사공개의 원칙은 단순한 행정적 회의를 제외한 국회의 헌법적 기능과 관련한 모든 회의 가 원칙적으로 국민에게 공개되어야 함을 천명한 것으로 국회 본회의뿐만 아니라 위원회의 회의에도 적용된다.","src":"2022 법원직","a":true,"exp":"헌재 2022. 1. 27. 2018헌마1162"},{"set":15,"num":15,"q":"국회의 회의는 출석의원 과반수의 찬성이 있거나 의장이 국가의 안전보장을 위하여 필요하다고 인정할 때에는 공개하지 않을 수 있다.","src":"2022 법원직","a":true,"exp":"헌법 제50조 제1항"},{"set":15,"num":16,"q":"본회의는 공개하지만, 국회의장의 제의 또는 국회의원 10명 이상의 연서에 의한 동의로 본회의 의결이 있거나 국회의장이 각 교섭단체 대표의원과 협의하여 국가의 안전보장을 위하여 필요하다고 인정할 때에는 공개하지 아니할 수 있다.","src":"2024 국가직 7급","a":true,"exp":"국회법 제75조 제1항 단서"},{"set":15,"num":17,"q":"본회의는 공개하며, 의장의 제의 또는 의원 10명 이상의 연서에 의한 동의(動議)로 본회의 의결이 있거나 의장이 각 교섭단체 대표의원과 협의하여 국가의 안전보장을 위하여 필요하다고 인정할 때에는 공개하지 아니할 수 있다.","src":"2022 지방직 7급","a":true,"exp":"국회법 제75조 제1항 단서"},{"set":15,"num":18,"q":"헌법은 국회회의의 공개 여부에 관하여 회의 구성원의 자율적 판단을 허용하고 있으므로, 소위원회 회의의 공개여부 또한 소위원회 또는 소위원회가 속한 위원회에서 여러 가지 사정을 종합하여 합리적으로 결정할 수 있다.","src":"2023 지방직 7급","a":true,"exp":"소위원회의 회의도 가능한 한 국민에게 공개하는 것이 바람직하나, 전문성과 효율성을 위한 제도인 소위원회의 회의를 공개할 경우 우려되는 부정적 측면도 외면할 수 없고, 헌법은 국회회의의 공개여부에 관하여 회의 구성원의 자율적 판단을 허용하고 있으므로, 소위원회 회의의 공개여부 또한 소위원회 또는 소위원회가 속한 위원회에서 여러 가지 사정을 종합하여 합리적으로 결정할 수 있다 할 것인바, 예산결산특별위원회의 계수조정소위원회방청불허행위를 헌법이 설정한 국회 의사자율권의 범위를 벗어난 위헌적인 공권력의 행사라고 할 수 없다(헌재 2000. 6. 29. 98헌마443)."},{"set":15,"num":19,"q":"국회에 제출된 법률안은 회기 중에 의결되지 못한 이유로 폐기되지 않지만, 국회의원의 임기가 만료된 때에는 그러하지 아니하다.","src":"2023 국가직 7급","a":true,"exp":"헌법 제51조"},{"set":15,"num":20,"q":"국회는 헌법 또는 법률에 특별한 규정이 없는 한 재적의원 과반수의 출석과 출석의원 과반수의 찬성으로 의결하 며, 가부동수인 때에는 가결된 것으로 본다.","src":"2023 국가직 7급","a":false,"exp":"국회는 헌법 또는 법률에 특별한 규정이 없는 한 재적의원 과반수의 출석과 출석의원 과반수의 찬성으로 의결하 며, 가부동수인 때에는 부결된 것으로 본다(헌법 제49조)."},{"set":15,"num":21,"q":"헌법 제52조는 “20명 이상의 국회의원과 정부는 법률안을 제출할 수 있다.”고 규정하고 있다.","src":"2023 지방직 7급","a":false,"exp":"헌법 제52조는 “국회의원과 정부는 법률안을 제출할 수 있다.”고 규정하고 있다. 그리고 국회법 제79조 제1항은 “의원은 10명 이상의 찬성으로 의안을 발의할 수 있다.”고 규정하고 있다."},{"set":15,"num":22,"q":"｢국회법｣상 안건조정위원회의 활동기한 90일은 국회 소수세력의 안건처리 지연을 통한 의사 저지 수단을 제도적 으로 보장한 것으로서 90일을 초과할 수 없고, 그 축소도 안건조정위원회를 구성할 때 안건조정위원회의 위원장과 간사가 합의한 경우에만 가능하므로, 안건조정위원회의 활동기한이 만료되기 전 안건조정위원회가 안건에 대 한 조정 심사를 마쳐서 조정안을 의결하여 안건조정위원회 위원장이 그 조정안의 가결을 선포한 것은 ｢국회법｣위반이다.","src":"2023 지방직 7급","a":false,"exp":"국회법상 안건조정위원회의 활동기한은 그 활동할 수 있는 기간의 상한을 의미한다고 보는 것이 타당하고, 안건조정위원회의 활동기한이 만료되기 전이라고 하더라도 안건조정위원회가 안건에 대한 조정 심사를 마치면 조정안을 의결할수 있다. 이 사건에서 안건조정위원회의 활동기한이 도래하지 않았음에도 피청구인 조정위원장이 이 사건 조정안의 가결을 선포하였다는 사정만으로 국회법을 위반하였다고 볼 수는 없다(헌재 2020. 5. 27. 2019헌라5)."},{"set":15,"num":23,"q":"위원회에 회부된 안건을 ｢국회법｣ 규정에 따른 신속처리대상안건으로 지정하려는 경우 의원은 재적의원 과반수가서명한 신속처리대상안건 지정요구 동의를 의장에게 제출하고, 의장은 지체 없이 신속처리대상안건 지정요구 동의를 무기명투표로 표결하되 재적의원 5분의 3 이상의 찬성으로 의결한다.","src":"2026 국가직 7급","a":true,"exp":"국회법 제85조의2 제1항"},{"set":15,"num":24,"q":"의장은 각 교섭단체 대표의원과 합의하는 경우 위원회에 회부하는 안건에 대하여 심사기간을 지정할 수 있고, 이 경우 위원회가 이유 없이 지정된 심사기간 내에 심사를 마치지 아니하였을 때에는 의장은 중간보고를 들은 후 다 른 위원회에 회부하거나 바로 본회의에 부의할 수 있다.","src":"2026 국가직 7급","a":true,"exp":"국회법 제85조"},{"set":15,"num":25,"q":"국회 본회의에서 수정동의를 지나치게 넓은 범위에서 인정할 경우, 국회가 의안 심의에 관한 국회운영의 원리로 채택하고 있는 위원회 중심주의를 저해할 우려가 있다.","src":"2023 지방직 7급","a":true,"exp":"국회법 제95조가 본회의에서 수정동의를 제출할 수 있도록 한 취지는 일정한 범위 내에서 국회의원이 본회의에 상정된의안에 대한 수정의 의사를 위원회의 심사절차를 거치지 아니하고 곧바로 본회의의 심의과정에서 표시할 수 있도록 허용함으로써 의안 심의의 효율성을 제고하기 위한 것이다. 그런데 수정동의를 지나치게 넓은 범위에서 인정할 경우 국회가 의안 심의에 관한 국회운영의 원리로 채택하고 있는 위원회 중심주의를 저해할 우려가 있다. 국회법 제95조 제5항의 입법취지는 원안에 대한 위원회의 심사절차에서 심사가 이루어질 여지가 없는 경우에는 수정동의의 제출을 제한함으로써 위원회 중심주의를 공고히 하는 것이다. 국회법 제95조 제5항 본문의 문언, 입법취지, 입법경과를 종합적으로 고려하면, 위원회의 심사를 거쳐 본회의에 부의된 법률안의 취지 및 내용과 직접 관련이 있는지 여부는 ‘원안에서 개정하고자 하는 const pool=()=>Q.filter(q=>EX==='전체'||q.ex===EX);
function pick(p,n){const now=Date.now();const sc=q=>{const b=S.box[q.id];return b===undefined?2+Math.random():(S.due[q.id]<=now?0:4)+b*.3+Math.random()*.5};return p.slice().sort((a,b)=>sc(a)-sc(b)).slice(0,n)}
const dueN=()=>Q.filter(q=>S.box[q.id]!==undefined&&S.due[q.id]<=Date.now()).length;
const weak=()=>Q.filter(q=>(S.wrong[q.id]||0)>0&&(S.box[q.id]||0)<3);
function start(list,label){if(!list.length){alert('해당하는 문제가 아직 없어요.');return}
 X={qs:list.map(q=>q),i:0,hp:5,ok:0,no:0,xp:0,combo:0,ans:null,miss:[],unsure:false,label};V={s:'quiz'};render()}
function answer(a){const q=X.qs[X.i];if(X.ans!==null)return;const ok=a===q.a,now=Date.now(),b=S.box[q.id]||0,sure=!X.unsure;
 X.ans=a;X.hyper=false;
 if(ok){S.box[q.id]=sure?Math.min(b+1,5):b;S.due[q.id]=now+IV[S.box[q.id]]*DAY;X.ok++;X.combo++;const g=sure?10:6;X.xp+=g;S.xp+=g}
 else{S.box[q.id]=0;S.due[q.id]=now;S.wrong[q.id]=(S.wrong[q.id]||0)+1;X.no++;X.hp--;X.combo=0;X.hyper=sure;if(!X.miss.includes(q))X.miss.push(q);if((q.rq||0)<1){q.rq=1;X.qs.push(q)}}
 const t=today();if(S.last!==t){const y=new Date(Date.parse(t)-DAY).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=t}
 if(S.day.d!==t)S.day={d:t,n:0};S.day.n++;save();render()}
function next(){X.i++;X.ans=null;X.unsure=false;if(X.i>=X.qs.length||X.hp<=0){Q.forEach(q=>delete q.rq);V={s:'res'}}render();scrollTo(0,0)}
const tk=s=>s.split(/\s+/).filter(Boolean),nk=t=>t.replace(/[^\w가-힣]/g,'');
function dfs(q){if(q.a!==false)return '';
 const e=q.exp.replace(/[\(（](?:헌재|대법원|헌법)[^)]*[\)）]?\s*$/,'').trim();
 const A=tk(q.q),B=tk(e);if(B.length<5)return '';
 const n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1)),eq=(x,y)=>nk(x)&&nk(x)===nk(y);
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=eq(A[i],B[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 if(L[0][0]/Math.min(n,m)<.4)return '';
 let i=0,j=0,a='',b='';
 while(i<n||j<m){if(i<n&&j<m&&eq(A[i],B[j])){a+=esc(A[i])+' ';b+=esc(B[j])+' ';i++;j++}
  else if(j>=m||(i<n&&L[i+1][j]>=L[i][j+1])){a+='<del>'+esc(A[i])+'</del> ';i++}
  else{b+='<ins>'+esc(B[j])+'</ins> ';j++}}
 return `<p class="rel">🔍 <b>문제↔해설, 바뀐 부분</b> (<del>빨강</del> = 문제에서 틀린 부분, <ins>초록</ins> = 해설에서 바뀐 부분)</p><p>문제: ${a}</p><p>해설: ${b}</p>`}
function render(){const app=$('#app');
 if(V.s==='home'){const n=S.day.d===today()?S.day.n:0,gp=Math.min(100,n/20*100),wk=weak().length,bm=Object.keys(S.bm).filter(k=>S.bm[k]).length;
  app.innerHTML=`<div class="top"><span>🔥 ${S.streak}일</span><span>⭐ ${S.xp}</span><div class="goal" title="오늘 목표 20문항"><i style="width:${gp}%"></i></div><span>${n}/20</span></div>
  <h1>헌법 OX 퀴즈</h1><p class="sub">${Q.length}문항 · 틀린 문제는 간격을 두고 다시 나와요. 복습 대기 ${dueN()}개</p>
  <button class="btn" data-a="daily">오늘의 학습 15문항</button>
  <div class="row"><button class="btn bl" data-a="weak">틀린 문제 ${wk}</button><button class="btn bl" data-a="bm">북마크 ${bm}</button></div>
  <div class="path">${sets.map((s,i)=>{const l=Q.filter(q=>q.set===s),m=l.filter(q=>(S.box[q.id]||0)>=3).length,t=l.filter(q=>S.box[q.id]!==undefined).length;
   return `<button class="node" data-a="set" data-s="${s}" style="--p:${m/l.length*360}deg;margin-left:${Math.round(Math.sin(i*1.2)*70)}px" aria-label="${s}회 ${l.length}문항"><span>${s}</span><small>${t}/${l.length} 학습 · ${m} 암기</small></button>`}).join('')}</div>
  <div class="set"><span>숫자 = 회차 · 초록 테두리 = 암기 완료(3단계 이상)</span><span><button data-a="trap">함정단어 표시 ${S.trap?'끄기':'켜기'}</button><button data-a="reset">기록 초기화</button></span></div>`}
 else if(V.s==='quiz'){const q=X.qs[X.i],a=X.ans,rel=[...new Set(q.cs.flatMap(c=>cases[c]))].filter(i=>i!==q.id);
  app.innerHTML=`<div class="qtop"><button class="x" data-a="quit" aria-label="나가기">✕</button><div class="bar"><i style="width:${X.i/X.qs.length*100}%"></i></div><b>❤️ ${X.hp}</b></div>
  <span class="chip">${esc(q.src)} · ${q.set}회 ${q.num}번</span>
  <p class="stmt">${hl(q.q)}</p>
  <div class="ox ${a!==null&&a!==q.a?'shake':''}"><button class="o ${a===true?'pick':''}" data-a="ans" data-v="1" ${a!==null?'disabled':''} aria-label="맞다">O</button><button class="xx ${a===false?'pick':''}" data-a="ans" data-v="0" ${a!==null?'disabled':''} aria-label="틀리다">X</button></div>
  ${a===null?`<label class="sure"><input type="checkbox" data-a="unsure" ${X.unsure?'checked':''}> 긴가민가해요 (확신 없이 맞히면 복습 단계가 오르지 않아요)</label>`:`
  <div class="exp"><b class="k">정답은 ${q.a?'O':'X'}</b>
   <p>${esc(q.exp)}</p>${dfs(q)}
   ${rel.length?`<p class="rel">📎 같은 결정을 다룬 문항 ${rel.length}개: ${rel.slice(0,8).map(i=>byId[i].set+'회 '+byId[i].num+'번').join(', ')}</p>`:''}
   <button class="bm" data-a="bm1">${S.bm[q.id]?'★ 북마크됨':'☆ 북마크'}</button>
   <textarea rows="2" data-a="note" placeholder="나만의 암기 메모 (예: 문언 vs 판례, 헷갈린 이유)">${esc(S.note[q.id]||'')}</textarea></div>
  ${X.hyper?'<div class="msg">확신했는데 틀렸어요. 이런 오답이 가장 오래 기억에 남아요. 해설을 한 번 소리 내어 읽고, 곧 다시 만나요.</div>':''}
  <div class="sheet ${a===q.a?'ok':'no'}"><div><div class="j">${a===q.a?(X.combo>2?'🔥 '+X.combo+'연속 정답!':'정답이에요!'):'아쉬워요, 오답'}</div><button class="btn ${a===q.a?'':'r'}" data-a="next">${X.i+1>=X.qs.length||X.hp<=0?'결과 보기':'계속하기'}</button></div></div>`}`}
 else{const t=X.ok+X.no;app.innerHTML=`<div class="res"><div class="big">${X.hp<=0?'💔':X.no===0?'🏆':'🎉'}</div><h1>${X.hp<=0?'하트를 모두 썼어요':'학습 완료!'}</h1>
  <div class="stat"><div><small>정확도</small>${t?Math.round(X.ok/t*100):0}%</div><div><small>획득 XP</small>+${X.xp}</div><div><small>오답</small>${X.miss.length}</div></div>
  ${X.miss.length?`<button class="btn bl" data-a="again">틀린 ${X.miss.length}문항 다시 풀기</button><br>`:''}<button class="btn" data-a="home">홈으로</button></div>`}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a==='daily')start(pick(pool(),15));else if(a==='weak')start(pick(weak(),15));
 else if(a==='bm')start(pick(Q.filter(q=>S.bm[q.id]),20));
 else if(a==='set')start(pick(Q.filter(q=>q.set==t.dataset.s),10));
 else if(a==='trap'){S.trap=S.trap?0:1;save();render()}
 else if(a==='reset'){if(confirm('모든 학습 기록을 지울까요?')){S={box:{},due:{},wrong:{},bm:{},note:{},xp:0,streak:0,last:'',day:{d:'',n:0},trap:0};save();render()}}
 else if(a==='ans')answer(t.dataset.v==='1');else if(a==='next')next();
 else if(a==='quit'){V={s:'home'};render()}
 else if(a==='bm1'){const q=X.qs[X.i];S.bm[q.id]=!S.bm[q.id];save();t.textContent=S.bm[q.id]?'★ 북마크됨':'☆ 북마크'}
 else if(a==='again')start(X.miss.slice());else if(a==='home'){V={s:'home'};render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a==='ex'){EX=t.value;render()}else if(t.dataset.a==='unsure')X.unsure=t.checked});
document.addEventListener('input',e=>{if(e.target.dataset.a==='note'){S.note[X.qs[X.i].id]=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(V.s!=='quiz'||/TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if(X.ans===null){if(k==='o'||k==='arrowleft')answer(true);else if(k==='x'||k==='arrowright')answer(false)}else if(k==='enter'||k===' '){e.preventDefault();next()}});
render();
</script>
</body>
</html>
