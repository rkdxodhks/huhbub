 국가직 7급","a":true,"exp":"헌재 1989.12.22. 88헌가13"},{"set":5,"num":37,"q":"국가인권위원회는 11명의 인권위원으로 구성되며, 국회가 선출하는 4명, 대통령이 지명하는 4명, 대법원장이 지명하는 3명을 대통령이 임명한다.","src":"2017 국가직 7급","a":true,"exp":"국가인권위원회법 제5조"},{"set":5,"num":38,"q":"국가인권위원회는 피해자의 권리 구제를 위해 필요하다고 인정하면 피해자를 위하여 피해자의 명시적 의사에 관계없이 대한법률구조공단 또는 그 밖의 기관에 법률구조를 요청할 수 있다.","src":"2020 경정승진,","a":false,"exp":"법률구조 요청은 피해자의 명시한 의사에 반하여 할 수 없다(국가인권위원회법 제47조 제2항)."},{"set":6,"num":1,"q":"인간으로서의 존엄과 가치는 1962년 제3공화국 헌법에서 규정된 이래 1980년 제5공화국 헌법에서 행복추구권이추가되어 현행 헌법에 이르고 있다.","src":"2016 지방직 7급","a":true,"exp":"인간의 존엄성 조항은 1962년 제3공화국 제5차 헌법개정에서 신설되었다. 1980년 제5공화국의 제8차 헌법개정 때 행복추구권이 추가되면서 현행 헌법까지 이어지고 있다."},{"set":6,"num":2,"q":"헌법 제10조로부터 도출되는 일반적 인격권에는 개인의 명예에 관한 권리도 포함되며, 여기서 말하는 ‘명예’는 사람이나 그 인격에 대한 ‘사회적 평가’, 즉 객관적·외부적 가치평가뿐만 아니라 단순히 주관적·내면적인 명예감정까지포함한다.","src":"2022 변호사시험","a":false,"exp":"헌법 제10조로부터 도출되는 일반적 인격권에는 개인의 명예에 관한 권리도 포함될 수 있으나, 여기서 말하는 ‘명예’는 사람이나 그 인격에 대한 ‘사회적 평가’, 즉 객관적·외부적 가치평가를 말하는 것이지 단순히 주관적·내면적인 명예감정은 포함되지 않는다고 보아야 한다(헌재 2008. 11. 27. 2008헌마517)."},{"set":6,"num":3,"q":"사자(死者)에 대한 사회적 명예와 평가의 훼손은 사자와의 관계를 통하여 스스로의 인격상을 형성하고 명예를 지켜온 그 후손의 인격권을 제한한다.","src":"2022 국가직 7급","a":true,"exp":"‘일제강점하 반민족행위 진상규명에 관한 특별법’에 근거하여 조사대상자 선정 및 친일반민족행위결정이 이루어지면, 조사대상자의 사회적 평가에 영향을 미치므로 헌법 제10조에서 유래하는 일반적 인격권이 제한받는다. 다만 이러한 결정에 있어서 대부분의 조사대상자는 이미 사망하였을 것이 분명하나, 조사대상자가 사자(死者)의 경우에도 인격적 가치에 대한 중대한 왜곡으로부터 보호되어야 한다. 사자(死者)에 대한 사회적 명예와 평가의 훼손은 사자(死者)와의 관계를 통하여 스스로의 인격상을 형성하고 명예를 지켜온 그들의 후손의 인격권, 즉 유족의 명예 또는 유족의 사자(死者)에 대한 경애추모의 정을 제한하는 것이다(헌재 2011.3.31. 2008헌바111)."},{"set":6,"num":4,"q":"「일제강점하 반민족행위 진상규명에 관한 특별법｣에 근거한 친일반민족행위진상규명위원회의 조사대상자 선정 및친일반민족행위 결정이 이루어질 당시 조사대상자가 이미 사망한 경우라 하더라도 그 유족은 자신의 인격권 침해를 이유로 헌법소원심판을 청구할 수 있다.","src":"2016 사법시험","a":true,"exp":"헌재 2011.3.31. 2008헌바111"},{"set":6,"num":5,"q":"교정시설의 1인당 수용면적이 수형자의 인간으로서의 기본 욕구에 따른 생활조차 어렵게 할 만큼 지나치게 협소하다면, 이는 그 자체로 국가형벌권 행사의 한계를 넘어 수형자의 인간의 존엄과 가치를 침해하는 것이다.","src":"2019 지방직 7급","a":true,"exp":"헌재 2016. 12. 29. 2013헌마142"},{"set":6,"num":6,"q":"「국군포로의 송환 및 대우 등에 관한 법률」에 따라 대통령은 등록포로, 등록하기 전에 사망한 귀환포로, 귀환하기 전에 사망한 국군포로에 대한 예우의 신청, 기준, 방법 등에 필요한 사항을 대통령령으로 제·개정할 의무가 있음에도 상당한 기간 동안 정당한 사유 없이 그 예우에 관한 사항을 대통령령에 규정하지 않은 행정입법부작위는 등록포로 등의 가족인 청구인의 명예권을 침해한다.","src":"2024 경찰 제1차","a":true,"exp":"등록포로 등에 대하여 억류기간 중의 행적이나 공헌의 정도에 상응하는 예우를 한다는 것은, 대한민국을 위해 희생과 공헌을 한 자로서 숭고한 애국정신의 귀감으로 존중되고 합당한 예우를 받아야 하는 대상이라는 사회적 평가가 이루어진다는 것을 의미하고, 또한 사자에 대한 사회적 명예와 평가는 사자와의 관계를 통하여 스스로의 인격상을 형성하고 명예를 지켜온 그들의 후손의 인격권, 즉 유족의 명예 또는 유족의 사자에 대한 경애추모의 정 에도 영향을 미친다. 국군포로법 제15조의5 제1항은 등록포로 등에 대하여 국방부장관으로 하여금 억류기간 중의 행적이나 공헌의 정도에 상응하는 예우를 할 수 있도록 하고 있다. 대통령에게는 대통령령을 제정할 의무가 있음에도, 그 의무는 상당 기간 동안 불이행되고 있고, 이를 정당화할 이유도 찾아보기 어렵다. 그렇다면 그 예우에 관하여 대통령령으로 정하지 않은 행정입법부작위는 등록포로 등의 가족인 청구인의 명예권을 침해하는 것으로서 헌법에 위반된다(헌재 2018. 5. 31. 2016헌마626)."},{"set":6,"num":7,"q":"장래 가족의 구성원이 될 태아의 성별 정보에 대한 접근을 국가로부터 방해받지 않을 부모의 권리는 헌법 제10조로부터 도출되는 일반적 인격권에 의하여 보호된다.","src":"2025 변호사시험","a":true,"exp":"헌법 제10조로부터 도출되는 일반적 인격권에는 각 개인이 그 삶을 사적으로 형성할 수 있는 자율영역에 대한 보장이 포함되어 있음을 감안할 때, 장래 가족의 구성원이 될 태아의 성별 정보에 대한 접근을 국가로부터 방해받지 않을 부모의 권리는 이와 같은 일반적 인격권에 의하여 보호된다고 보아야 할 것인바, 태아의 성별에 대하여 이를 고지하는 것을 금지하는 것은 일반적 인격권으로부터 나오는 부모의 태아 성별 정보에 대한 접근을 방해받지 않을 권리를 제한하고 있다고 할 것이다(헌재 2008. 7. 31. 2004헌마1010)."},{"set":6,"num":8,"q":"임신 32주 이전에 태아의 성별을 고지하는 것을 금지하는 의료법 해당 조항은 낙태로 나아갈 의도가 없는 부모까지 규제하여 기본권을 제한하는 과도한 입법으로 부모가 태아의 성별 정보에 대한 접근을 방해받지 않을 권리를 침해한다.","src":"2024 법원직","a":true,"exp":"심판대상조항은 더 이상 태아의 성별을 이유로 한 낙태를 방지하기 위한 목적을 달성하는 데에 적합하고 실효성 있 는 수단이라고 보기 어렵고, 입법수단으로서도 현저하게 불합리하고 불공정하다. ... 과잉금지원칙을 위반하여 부모가 태아의 성별 정보에 대한 접근을 방해받지 않을 권리를 침해한다(헌재 2024. 2. 28. 2022헌마356)."},{"set":6,"num":9,"q":"현재는 남아선호사상이 상당히 쇠퇴하고 있다고 할 것이지만, 임부와 그 가족이 태아의 성별에 대한 선호도에 따라낙태핳 가능성은 여전히 남아 있다고 할 것이므로, 임신 32주 이전에 태아의 성별에 대한 고지를 금지하면 성별을 이유로 하는 낙태를 예방할 수 있는 효과가 있다는 점을 부인할 수 없다. 따라서 심판대상조항은 수단의 적합성이 인정된다.","src":"2025 법원직","a":false,"exp":"심판대상조항은 성별을 이유로 한 낙태를 방지함으로써 성비의 불균형을 해소하고 태아의 생명을 보호하기 위해 입법 된 것으로 목적의 정당성이 인정된다. 그러나 남아선호사상이 확연히 쇠퇴하고 있고, 심판대상조항이 사문화되었음에도 불구하고 출생성비가 자연성비의 정상범위 내이므로, 심판대상조항은 더 이상 태아의 성별을 이유로 한 낙태를 방지하기 위한 목적을 달성하는 데에 적합하고 실효성 있는 수단이라고 보기 어렵고, 입법수단으로서도 현저하게 불합리하고불공정하다헌재 2024. 2. 28. 2022헌마356)."},{"set":6,"num":10,"q":"보험사기를 이유로 체포된 피의자가 경찰서 내에서 수갑을 차고 얼굴을 드러낸 상태에서 조사받는 모습을 촬영할 수 있도록 허용한 행위는 일반 국민의 알 권리 보장을 위한 것이어서 목적의 정당성은 인정되나, 그 얼굴 및 수갑 등의 노출을 방지할 만한 조치를 전혀 취하지 아니한 것은 침해의 최소성 원칙을 충족하였다고 볼 수 없어 결 국 피의자의 인격권을 침해하였다고 할 것이다.","src":"2022 법원행시","a":false,"exp":"사람은 자신의 의사에 반하여 얼굴을 비롯하여 일반적으로 특정인임을 식별할 수 있는 신체적 특징에 관하여 함부로촬영당하지 아니할 권리를 가지고 있으므로, 촬영허용행위는 헌법 제10조로부터 도출되는 초상권을 포함한 일반적 인격권을 제한한다고 할 것이다. 피청구인은 기자들에게 청구인이 경찰서 내에서 수갑을 차고 얼굴을 드러낸 상태에서 조사받는 모습을 촬영할 수 있도록 허용하였는데, 청구인에 대한 이러한 수사 장면을 공개 및 촬영하게 할 어떠한 공 익 목적도 인정하기 어려우므로 촬영허용행위는 목적의 정당성이 인정되지 아니한다. ... 촬영허용행위는 과잉금지원칙에 위반되어 청구인의 인격권을 침해하였다(헌재 2014. 3. 27. 2012헌마652)."},{"set":6,"num":11,"q":"초상권, 사생활의 비밀과 자유에 대한 부당한 침해는 불법행위를 구성하고 위 침해는 그것이 공개된 장소에서 이루어졌다거나 민사소송의 증거를 수집할 목적으로 이루어졌다는 사유만으로는 정당화되지 않는다.","src":"2023 법원직","a":true,"exp":"사람은 누구나 자신의 얼굴 기타 사회통념상 특정인임을 식별할 수 있는 신체적 특징에 관하여 함부로 촬영 또는 그림묘사되거나 공표되지 아니하며 영리적으로 이용당하지 않을 권리를 가지는데, 이러한 초상권은 우리 헌법 제10조 제1문에 의하여 헌법적으로 보장되는 권리이다. 초상권 및 사생활의 비밀과 자유에 대한 부당한 침해는 불법행위를 구성하는데, 위 침해는 그것이 공개된 장소에서 이루어졌다거나 민사소송의 증거를 수집할 목적으로 이루어졌다는 사유만으로 정당화되지 아니한다. 보험회사 직원이 보험회사를 상대로 손해배상청구소송을 제기한 교통사고 피해자들의 장해 정도에 관한증거자료를 수집할 목적으로 피해자들의 일상생활을 촬영한 행위가 초상권 및 사생활의 비밀과 자유를 침해하는 불법행위에 해당한다(대법원 2006. 10. 13. 2004다16280)."},{"set":6,"num":12,"q":"행복추구권이란 국민이 행복을 추구하기 위한 활동을 국가권력의 간섭 없이 자유롭게 할 수 있다는 소극적 권리의 성격만을 가지는 것이 아니라 국민이 행복을 추구하기 위해 필요한 급부를 국가에게 요구할 수 있는 적극적 권리의 성격도 가진다.","src":"2012 국가직 7급","a":false,"exp":"헌법 제10조의 행복추구권은 국민이 행복을 추구하기 위하여 필요한 급부를 국가에게 적극적으로 요구할 수 있는 것을 내용으로 하는 것이 아니라, 국민이 행복을 추구하기 위한 활동을 국가권력의 간섭 없이 자유롭게 할 수 있다는 포괄적인 의미의 자유권으로서의 성격을 가진다(헌재 1995.7.21. 93헌가14)."},{"set":6,"num":13,"q":"행복추구권에는 일반적 행동자유권과 개성의 자유로운 발현권이 함축되어 있다.","src":"2024 경찰 제2차","a":true,"exp":"헌재 2003. 10. 30. 2002헌마518"},{"set":6,"num":14,"q":"가족에 대한 수형자의 접견교통권은 비록 헌법에 열거되지는 아니하였지만 헌법 제10조의 행복추구권에 포함되는 기본권의 하나로서의 일반적 행동자유권으로부터 나온다.","src":"2025 경위공채","a":true,"exp":"수형자가 갖는 접견교통권은 가족 등 외부와 연결될 수 있는 통로를 적절히 개방하고 유지함으로써 가족 등 타 인과 교류하는 인간으로서의 기본적인 생활관계가 인신의 구속으로 완전히 단절되어 정신적으로 황폐하게 되는 것을 방지하기 위하여 반드시 보장되지 않으면 안되는 인간으로서의 기본적인 권리에 해당하므로 성질상 헌법상의 기본권에 속한다. 이러한 수형자의 접견교통권은 비록 헌법에 열거되지는 아니하였지만 헌법 제10조의 행복추구권에 포함되는 기본권의 하나로서의 일반적 행동자유권으로부터 나온다고 할 것이다(헌재 2009. 9. 24. 2007헌마738)."},{"set":6,"num":15,"q":"기부행위자는 자신의 재산을 사회적 약자나 소외 계층을 위하여 출연함으로써 자기가 속한 사회에 공헌하였다는 행복감과 만족감을 실현할 수 있으므로, 기부행위는 행복추구권과 그로부터 파생되는 일반적 행동자유권에 의해 보호된다.","src":"2019 변호사시험","a":true,"exp":"기부행위자 본인은 자신의 재산을 사회적 약자나 소외 계층을 위하여 출연함으로써 자기가 속한 사회에 공헌하였다는 행복감과 만족감을 실현할 수 있으므로, 이는 헌법상 인격의 자유로운 발현을 위하여 필요한 행동을 할 수 있어야 한다는 의미의 행복추구권과 그로부터 파생되는 일반적 행동자유권의 행사로서 당연히 보호되어야 한다(헌재 2014. 2. 27. 2013헌바106)."},{"set":6,"num":16,"q":"병역의무의 이행으로서의 현역병 복무는 국가가 간섭하지 않으면 자유롭게 할 수 있는 행위에 속하므로, 현역병으로 복무할 권리는 일반적 행동자유권에 포함된다고 할 수 있다.","src":"2025 경위공채","a":false,"exp":"헌법 제10조의 행복추구권에서 파생하는 일반적 행동자유권은 모든 행위를 하거나 하지 않을 자유를 내용으로 하나, 그 보호대상으로서의 행동이란 국가가 간섭하지 않으면 자유롭게 할 수 있는 행위 내지 활동을 의미하고, 이를 국가권력이 가로막거나 강제하는 경우 자유권의 침해로서 논의될 수 있다 할 것인데, 병역의무의 이행으로서의 현역병 복무는 국가가 간섭하지 않으면 자유롭게 할 수 있는 행위에 속하지 않으므로, 현역병으로 복무할 권리가 일반적 행동자유권에 포함된다고 할 수도 없다(헌재 2010.12.28. 2008헌마527)."},{"set":6,"num":17,"q":"일반적 행동자유권은 개인에게 가치있는 행동을 그 보호영역으로 하는 것이므로, 여기에는 위험한 스포츠를 즐길권리와 같이 위험한 생활방식으로 살아갈 권리가 포함되지 않는다.","src":"2022 변호사시험","a":false,"exp":"일반적 행동자유권은 모든 행위를 할 자유와 행위를 하지 않을 자유로 가치 있는 행동만 그 보호영역으로 하는 것 은 아닌 것으로, 그 보호영역에는 개인의 생활방식과 취미에 관한 사항도 포함되며, 여기에는 위험한 스포츠를 즐길 권리와 같은 위험한 생활방식으로 살아갈 권리도 포함된다(헌재 2003. 10. 30. 2002헌마518)."},{"set":6,"num":18,"q":"응급의료종사자의 응급환자에 대한 진료를 폭행, 협박, 위계, 위력, 그 밖의 방법으로 방해하는 것을 금지하고 이에 위반 하는 자를 처벌하는 응급의료에 관한 법률조항은 해당 응급환자인 청구인의 일반적 행동의 자유를 제한한다.","src":"2024 경찰 제1차","a":false,"exp":"응급환자 본인의 행위가 응급환자의 생명과 건강에 중대한 위해를 가할 우려가 있어 사회통념상 용인될 수 없는 정도의 것으로 ‘응급진료 방해 행위’로 평가되는 경우 이는 정당한 자기결정권 내지 일반적 행동의 자유의 한계를 벗어난 것이므로, 이를 다른 응급진료 방해 행위와 마찬가지로 금지하고 형사처벌의 대상으로 한다고 하여 자기결정권 내지 일반적 행동의 자유의 제한의 문제가 발생하는 것은 아니다. (헌재 2019. 6. 28. 2018헌바128)"},{"set":6,"num":19,"q":"일반적 행동자유권의 보호대상으로서 행동이란 국가가 간섭하지 않으면 자유롭게 할 수 있는 행위를 의미하므로 병역의무 이행으로서 현역병 복무도 국가가 간섭하지 않으면 자유롭게 할 수 있는 행위에 속한다는 점에서, 현역병으로 복무할 권리도 일반적 행동자유권에 포함된다.","src":"2020 지방직 7급","a":false,"exp":"헌법 제10조의 행복추구권에서 파생하는 일반적 행동자유권은 모든 행위를 하거나 하지 않을 자유를 내용으로 하 나, 그 보호대상으로서의 행동이란 국가가 간섭하지 않으면 자유롭게 할 수 있는 행위 내지 활동을 의미하고, 이 를 국가권력이 가로막거나 강제하는 경우 자유권의 침해로서 논의될 수 있다 할 것인데, 병역의무의 이행으로서의 현역병 복무는 국가가 간섭하지 않으면 자유롭게 할 수 있는 행위에 속하지 않으므로, 현역병으로 복무할 권리가 일반적 행동자유권에 포함된다고 할 수도 없다(헌재 2010.12.28. 2008헌마527)."},{"set":6,"num":20,"q":"계약의 자유는 계약을 체결할 것인지의 여부, 체결한다면 어떠한 내용의 계약을, 어떠한 상대방과의 관계에서, 어떠한 방식으로 체결하느냐 하는 것도 당사자 자신이 자기의사로 결정하는 자유뿐만 아니라, 원치 않는 계약의 체 결을 법이나 국가에 의하여 강제 받지 않을 자유도 포함한다.","src":"2022 법원직","a":true,"exp":"헌재 1991. 6. 3. 89헌마204"},{"set":6,"num":21,"q":"석조, 석회조, 연와조 또는 이와 유사한 견고한 건물 기타 공작물의 소유를 목적으로 하는 토지임대차나 식목, 채염을 목적으로 하는 토지임대차를 제외한 임대차의 존속기간을 예외 없이 20년으로 제한한 조항은 사적 자치에의한 자율적 거래관계 형성을 왜곡하므로 계약의 자유를 침해한다.","src":"2022 법원직","a":true,"exp":"헌재 2013. 12. 26. 2011헌바234"},{"set":6,"num":22,"q":"친생부인의 소의 제척기간을 규정한 ｢민법｣ 제847조 제1항 중 ‘부가 그 사유가 있음을 안 날로부터 2년 내’ 부분은 친생부인의 소의 제척기간에 관한 입법재량의 한계를 일탈하지 않은 것으로서 헌법에 위반되지 아니한다.","src":"2022 변호사시험","a":true,"exp":"헌재 2015. 3. 26. 2012헌바357, 친생부인의 소의 제척기간 규정 중     ‘그 출생을 안 날로부터 1년 내’는 헌법불합치결정되었지만(헌재 1997. 3. 27. 95헌가14 등), “그 사유가 있음을 안 날부터 2년 내”는 합헌결정되었음을구별하여야 한다."},{"set":6,"num":23,"q":"민사재판의 당사자로 출석하는 수형자에 대하여 사복착용을 허용하지 아니한 것은 수형자의 인격권을 침해하지 않는다.","src":"2025 경위공채","a":true,"exp":"민사재판에서 법관이 당사자의 복장에 따라 불리한 심증을 갖거나 불공정한 재판진행을 하게 될 우려가 있다고 볼 수는 없으므로, 심판대상조항이 민사재판에 당사자로 출석하는 수형자의 사복착용을 불허하는 것으로 공정한 재판을 받을 권리가 침해되는 것은 아니다. 수형자가 민사법정에 출석하기까지 교도관이 반드시 동행하므로 수용자의 신분이 드러나게 되어 재소자용 의류로 인해 인격권과 행복추구권이 제한되는 정도는 제한적이고, 형사법정 이외의 법정 출입 방식은 미결수용자와 교도관 전용 통로 및 시설이 존재하는 형사재판과 다르며, 계호의 방식과 정도 도 확연히 다르다. 따라서 심판대상조항이 민사재판에 당사자로 출석하는 수형자에 대해 사복착용을 불허하는 것은 청구인의 인격권과 행복추구권을 침해하지 아니한다(헌재 2015.12.23. 2013헌마712)."},{"set":6,"num":24,"q":"형사재판과 같이 피고인의 방어권 보장이 절실한 경우조차 피고인으로 출석하는 수형자에 대하여 예외 없이 사복착용을 금지한 것은 과잉금지원칙에 위배된다.","src":"2024 경정승진","a":true,"exp":"수형자라 하더라도 확정되지 않은 별도의 형사재판에서만큼은 미결수용자와 같은 지위에 있으므로, 이러한 수형자로 하여금 형사재판 출석 시 아무런 예외 없이 사복착용을 금지하고 재소자용 의류를 입도록 하여 인격적인모욕감과 수치심 속에서 재판을 받도록 하는 것은 재판부나 검사 등 소송관계자들에게 유죄의 선입견을 줄 수 있고, 이미 수형자의 지위로 인해 크게 위축된 피고인의 방어권을 필요 이상으로 제약하는 것이다. 따라서 심판대상조항이 형사재판의 피고인으로 출석하는 수형자에 대하여 사복착용을 허용하지 아니한 것은 청구인의 공정한 재판을 받을 권리, 인격권, 행복추구권을 침해한다(헌재 2015.12.23. 2013헌마712)."},{"set":6,"num":25,"q":"누구든지 금융회사 등에 종사하는 자에게 타인의 금융거래의 내용에 관한 정보 또는 자료를 요구하는 것을 금지하고, 이를 위반 시 형사처벌하는 금융실명거래 및 비밀보장에 관한 법률 해당 조항은 공익에 비하여 지나치게 국민의 일반적 행동자유권을 제한한다.","src":"2024 법원직","a":true,"exp":"명의인의 동의를 받을 수 없는 상황에서 타인의 금융거래정보가 필요하여 금융기관 종사자에게 그 제공을 요구하는 경우가 있을 수 있는 등 금융거래정보 제공요구행위는 구체적인 사안에 따라 죄질과 책임을 달리한다고 할 것임에도, 심판대상조항은 정보제공요구의 사유나 경위, 행위 태양, 요구한 거래정보의 내용 등을 전혀 고려하지 아니하고 일률적으로 금지하고, 그 위반 시 형사처벌을 하도록 하고 있다. 따라서 심판대상조항은 과잉금지원칙에 반하여 일반적 행동자유권을 침해한다(헌재 2022. 2. 24. 2020헌가5)."},{"set":6,"num":26,"q":"청구인이 공적인 인물의 부당한 행위를 비판하는 과정에서 모욕적인 표현을 사용한 행위가 사회상규에 위배되지 아니하는 행위로서 정당행위에 해당될 여지가 있음에도, 이에 대한 판단 없이 청구인에게 모욕 혐의를 인정한 피청구인의 기소유예처분은 청구인의 행복추구권을 침해한다.","src":"2021 국가직 7급","a":true,"exp":"청구인이 공적인 인물의 부적절한 언행을 비판하면서 모욕적인 표현을 1회 사용한 행위는 청구인이 글을 게시한동기, 청구인이 게시한 글의 전체적인 맥락 등을 고려할 때 비판의 범위 내에 있는 것으로 평가될 수 있어 사회상규에 위배되지 아니하는 행위로서 정당행위에 해당한다고 볼 여지가 있다. 그럼에도 불구하고 정당행위 여부를 판단하지 않고 청구인에 대한 모욕 혐의를 인정한 이 사건 기소유예처분은 자의적인 검찰권의 행사로서 청구인의 평등권과 행복추구권을 침해하였다(헌재 2020. 9. 24. 2019헌마1285)."},{"set":6,"num":27,"q":"혼인 중인 여자와 남편 아닌 남자 사이에서 출생한 자녀에 대한 생부의 출생신고를 허용하도록 규정하지 않은 가족관계의 등록 등에 관한 법률 해당 조항은 혼인 외 출생자들의 태어난 즉시 ‘출생등록될 권리’를 침해한다.","src":"2024 법원직","a":true,"exp":"헌재 2023. 3. 23. 2021헌마975"},{"set":6,"num":28,"q":"혼인 중인 여자와 남편 아닌 남자 사이에서 출생한 자녀에 대한 생부의 출생신고를 허용하도록 규정하지 않은 가족관계의 등록 등에 관한 법률 해당 조항은 합리적 이유 없이 혼인 외 출생자의 신고의무를 모에게만 부과하고, 생부에게는 출생신고를 하도록 규정하지 않고 있어 평등원칙에 반한다.","src":"2024 법원직","a":false,"exp":"혼인 외 출생자의 신고의무를 모에게만 부과하고, 남편 아닌 남자인 생부에게 자신의 혼인 외 자녀에 대해서 출생신고를 할 수 있도록 규정하지 아니한 것은 합리적인 이유가 있다. 그렇다면 심판대상조항들은 생부인 청구인들의 평등권을 침해하지 않는다(헌재 2023. 3. 23. 2021헌마975)."},{"set":6,"num":29,"q":"대한민국 국민으로 태어난 아동은 태어난 즉시 ‘출생등록될 권리’를 가지며, 이러한 권리는 ‘법 앞에 국민으로 인정받을 권리’로서 법률로써 제한할 수 있을 뿐이다.","src":"2024 경찰간부","a":false,"exp":"출생 당시에 부 또는 모가 대한민국의 국민인 자(자)는 출생과 동시에 대한민국 국적을 취득한다(국적법 제2조 제1항). 대한민국 국민으로 태어난 아동에 대하여 국가가 출생신고를 받아주지 않거나 절차가 복잡하고 시간도 오래걸려 출생신고를 받아주지 않는 것과 마찬가지 결과가 발생한다면 이는 아동으로부터 사회적 신분을 취득할 기회를 박탈함으로써 인간으로서의 존엄과 가치, 행복추구권 및 아동의 인격권을 침해하는 것이다(헌법 제10조). 현대사회에서 개인이 국가가 운영하는 제도를 이용하려면 주민등록과 같은 사회적 신분을 갖추어야 하고, 사회적 신분의 취득은 개인에 대한 출생신고에서부터 시작한다. 대한민국 국민으로 태어난 아동은 태어난 즉시 ‘출생등록될 권리’를 가진다. 이러한 권리는 ‘법 앞에 인간으로 인정받을 권리’로서 모든 기본권 보장의 전제가 되는 기본권이므로 법률로써도 이를 제한하거나 침해할 수 없다(대법원 2020. 6. 8.자 2020스575)."},{"set":7,"num":1,"q":"죽음에 임박한 환자에게 ‘연명치료 중단에 관한 자기결정권’은 헌법상 기본권이므로, 헌법해석상 ‘연명치료 중단 등 에 관한 법률’을 제정할 국가의 입법의무가 명백하다고 볼 수 있다.","src":"2020 법원직","a":false,"exp":"‘연명치료 중단에 관한 자기결정권’을 보장하는 방법으로서 ‘법원의 재판을 통한 규범의 제시’와 ‘입법’ 중 어느 것이 바람직한가는 입법정책의 문제로서 국회의 재량에 속한다 할 것이다. 그렇다면 헌법해석상 ‘연명치료 중 단 등에 관한 법률’을 제정할 국가의 입법의무가 명백하다고 볼 수 없다(헌재 2009. 11. 26. 2008헌마385)."},{"set":7,"num":2,"q":"인수자가 없는 시체를 생전의 본인의 의사와는 무관하게 해부용 시체로 제공되도록 규정한 ｢시체 해부 및 보존에관한 법률｣ 규정은 추구하는 공익이 사후 자신의 시체가 자신의 의사와는 무관하게 해부용 시체로 제공됨으로써 침해되는 사익보다 크다고 할 수 없으므로 청구인의 시체처분에 대한 자기결정권을 침해한다.","src":"2019 국가직 7급","a":true,"exp":"이 사건 법률조항은 본인이 해부용 시체로 제공되는 것에 대해 반대하는 의사표시를 명시적으로 표시할 수 있는절차도 마련하지 않고 본인의 의사와는 무관하게 해부용 시체로 제공될 수 있도록 규정하고 있다는 점에서 침해의 최소성 원칙을 충족했다고 보기 어렵다. ... 이 사건 법률조항은 청구인의 시체 처분에 대한 자기결정권을 침해한다(헌재 2015. 11. 26. 2012헌마940)."},{"set":7,"num":3,"q":"혼인을 빙자하여 부녀를 간음한 남자를 처벌하는 ｢형법｣ 조항은 사생활의 비밀과 자유를 제한하는 것이라고 할 수 있지만, 혼인을 빙자하여 부녀를 간음한 남자의 성적자기결정권을 제한하는 것은 아니다.","src":"2019 국가직 7급","a":false,"exp":"혼인을 빙자하여 음행의 상습 없는 부녀를 기망하여 간음한 자를 처벌하는 형법조항은 남성의 성적자기결정권및 사생활의 비밀과 자유를 과잉제한하는 것으로 헌법에 위반된다(헌재 2009. 11. 26. 2008헌바58)."},{"set":7,"num":4,"q":"임신한 여성의 자기낙태를 처벌하는 ｢형법｣ 조항은 ｢모자보건법｣이 정한 일정한 예외를 제외하고는 임신기간 전체를통틀어 모든 낙태를 전면적ㆍ일률적으로 금지하고, 이를 위반할 경우 형벌을 부과하도록 정함으로써 임신한 여성에게임신의 유지ㆍ출산을 강제하고 있으므로, 과잉금지원칙을 위반하여 임신한 여성의 자기결정권을 침해한다.","src":"2023 지방직 7급","a":true,"exp":"헌재 2019. 4. 11. 2017헌바127"},{"set":7,"num":5,"q":"태아가 모체를 떠난 상태에서 독자적으로 생존할 수 있는 시점인 임신 22주 내외에 도달하기 전이면서 동시에 임신유지와 출산 여부에 관한 자기결정권을 행사하기에 충분한 시간이 보장되는 시기까지의 낙태에 대해서는 국가가 생명보호의 수단 및 정도를 달리 정할 수 있다.","src":"2019 법원행시","a":true,"exp":"헌재 2019. 4. 11. 2017헌바127"},{"set":7,"num":6,"q":"국가에게는 태아의 생명을 보호할 의무가 있으므로, 생명의 연속적 발전과정에 대하여 생명이라는 공통요소를 이유로 하여 언제나 동일한 법적 효과를 부여하여야 한다.","src":"2025 국가직 5급","a":false,"exp":"국가에게 태아의 생명을 보호할 의무가 있다고 하더라도 생명의 연속적 발전과정에 대하여 생명이라는 공통요소만을 이유로 하여 언제나 동일한 법적 효과를 부여하여야 하는 것은 아니므로 국가가 생명을 보호하는 입법적 조치를 취함에 있어 인간생명의 발달단계에 따라 그 보호정도나 보호수단을 달리하는 것은 불가능하지 않다. 따라서 태아가 모체를 떠난 상태에서 독자적으로 생존할 수 있는 시점인 임신 22주 내외에 도달하기 전이면서 동시에 임 신 유지와 출산 여부에 관한 자기결정권을 행사하기에 충분한 시간이 보장되는 시기까지의 낙태에 대해서는 국가가 생명보호의 수단 및 정도를 달리 정할 수 있다고 봄이 타당하다(헌재 2019. 4. 11. 2017헌바127)."},{"set":7,"num":7,"q":"형벌에 관한 책임주의는 형사법의 기본원리로서, 헌법상 법치국가의 원리에 내재하는 원리인 동시에, 국민 누구나 인간으로서의 존엄과 가치를 가지고 스스로의 책임에 따라 자신의 행동을 결정할 것을 보장하고 있는 헌법 제10조의 취지로부터 도출되는 원리이다.","src":"2025 국가직 5급","a":true,"exp":"헌재 2010.11.25. 2010헌가88"},{"set":7,"num":8,"q":"자기책임원리는 인간의 자유와 유책성, 그리고 인간의 존엄성을 진지하게 반영한 원리로 민사법이나 형사법에 국한된 원리라기보다는 근대법의 기본이념으로서 법치주의에 당연히 내재하는 원리이다.","src":"2022 지방직 7급","a":true,"exp":"헌재 2011. 9. 29. 2010헌마68"},{"set":7,"num":9,"q":"단순히 선박소유자가 고용한 선장이 선박소유자의 업무에 관하여 범죄행위를 하였다는 이유만으로 그 선박소유자에게도 동일한 벌금형을 과하도록 한 규정은 다른 사람의 범죄에 대하여 그 책임 유무를 묻지 않고 형벌을 부과하는 것으로서 책임주의원칙에 반한다.","src":"2018 국가직 7급","a":true,"exp":"이 사건 법률조항은 선장의 범죄행위에 관하여 비난할 근거가 되는 선장이 저지른 행위의 결과에 대한 선박소유자의 독자적인 책임에 관하여 전혀 규정하지 않은 채 단순히, 선박소유자가 고용한 선장이 업무에 관하여 범죄행위를 하였다는 이유만으로 선박소유자에 대하여 형사처벌을 과하고 있는바, 이는 다른 사람의 범죄에 대하여 그 책임 유무를 묻지 않고 형벌을 부과하는 것으로서, 법치국가의 원리 및 죄형법정주의로부터 도출되는 책임주의원칙에 반한다(헌재 2013.9.26. 2013헌가15)."},{"set":7,"num":10,"q":"법인의 대표자가 법인의 업무에 관하여 일정한 범죄행위를 할 경우 그 법인도 함께 처벌하는 구 ｢외국환거래법｣상 양벌규정은 법인의 독자적인 책임에 관하여 전혀 규정하지 않은 채, 단순히 법인의 대표자가 업무에 관하여 범죄행위를 하였다는 이유만으로 법인에 대하여 형사처벌을 과하고 있어 책임주의원칙에 반한다.","src":"2025 경찰 제1차","a":false,"exp":"법인 대표자의 법규위반행위에 대한 법인의 책임은, 법인 자신의 법규위반행위로 평가될 수 있는 행위에 대한 법인의 직접책임으로서, 대표자의 고의에 의한 위반행위에 대하여는 법인 자신의 고의에 의한 책임을, 대표자의 과실에 의한 위반행위에 대하여는 법인 자신의 과실에 의한 책임을 부담하는 것이므로, 법인의 대표자가 법인의 업무에 관하여 일정한 범죄행위를 할 경우 그 법인도 함께 처벌하는 이 사건 구 외국환거래법상 양벌규정은 책임주의원칙에 위배되지 아니한다(헌재 2011. 12. 29. 2010헌바117)."},{"set":7,"num":11,"q":"헌법 제11조제1항의 규범적 의미는 ‘법 적용의 평등’에서 끝나지 않고, 더 나아가 입법자에 대해서도 그가 입법을 통해서 권리와 의무를 분배함에 있어서 적용할 가치평가의 기준을 정당화할 것을 요구하는 ‘법 제정의 평등’을 포함한다.","src":"2021 지방직 7급","a":true,"exp":"헌법 제11조 제1항이 규정하고 있는 평등원칙은 법치국가질서의 근본요청으로서 모든 국가기관에게 법을 적용함에 있어서 정당한 근거 없이 개인이나 일정한 인적 집단을 불평등하게 대우하는 것을 금지한다. 따라서 모든 사람은 평등하게 법규범을 통해서 의무를 부담하고 권리를 부여받으며, 반대로 모든 공권력주체에 대해서는 일정한 사람들에게 유리하거나 불리하게 법을 적용하거나 적용하지 않는 것이 금지된다. 그러나 헌법 제11조 제1항의 규범적 의미는 이와 같은 ‘법 적용의 평등’에서 끝나지 않고, 더 나아가 입법자에 대해서도 그가 입법을 통해서 권리와 의무를 분배함에 있어서 적용할 가치평가의 기준을 정당화할 것을 요구하는 ‘법 제정의 평등’을 포함한다. 따라서 평등원칙은 입법자가 법률을 제정함에 있어서 법적 효과를 달리 부여하기 위하여 선택한 차별의 기준이 객관적으로 정당화될 수 없을 때에는 그 기준을 법적 차별의 근거로 삼는 것을 금지한다(헌재 2000. 8. 31. 97헌가12)."},{"set":7,"num":12,"q":"헌법재판소는 헌법 제11조 제1항 제2문의 “사회적 신분”이란 사회에서 장기간 점하는 지위로서 일정한 사회적 평가 를 수반하는 것을 의미한다고 할 것이므로 전과자도 사회적 신분에 해당한다고 판시하였다.","src":"2012 변호사시험","a":true,"exp":"헌재 1995.2.23. 93헌바43"},{"set":7,"num":13,"q":"헌법상 평등의 원칙은 국가가 언제 어디에서 어떤 계층을 대상으로 하여 기본권에 관한 사항이나 제도의 개선을시작할 것인지를 선택하는 것을 방해하지는 않는다. 따라서 국가가 종전의 상황을 개선함에 있어서 그 개선의 효과가 일부의 사람에게만 미치고 동일한 상황하에 있는 다른 사람에게는 미치지 않아 그들 사이에 일견 차별이 생기게 된다고 하더라도 그것만으로는 평등의 원칙을 위반한 것이라고는 할 수 없다.","src":"2024 법원직","a":true,"exp":"헌재 2005. 10. 27. 2003헌바50"},{"set":7,"num":14,"q":"평등권 침해 여부를 판단함에 있어서 시혜적인 법률의 경우에는 국민의 권리를 제한하거나 새로운 의무를 부과하는 법률의 경우와는 달리 입법자에게 보다 광범위한 입법형성의 자유가 인정된다.","src":"2007 사법시험","a":true,"exp":"평등원칙은 입법자에게 객관적으로 같은 것은 같게, 다른 것은 다르게 규범의 대상을 실질적으로 평등하게 규율할 것을 요구한다. 그런데 시혜적인 법률에 있어서는 국민의 권리를 제한하거나 새로운 의무를 부과하는 법률과는 달리 입법자에게 보다 광범위한 입법형성의 자유가 인정된다고 할 것이다. 그러므로 입법자는 그 입법의 목 적, 수혜자의 상황, 국가예산 내지 보상능력 등 제반상황을 고려하여 그에 합당하다고 스스로 판단하는 내용의 입법을 할 권한이 있다고 할 것이고, 그렇게 하여 제정된 법률의 내용이 현저하게 합리성이 결여되어 있는 것이 아닌 한 헌법에 위반된다고 할 수는 없다. ... 심사기준은 합리적 근거 유무에 관한 자의금지 심사라고 할 것이다(헌재 2004. 6. 24. 2003헌바111)."},{"set":7,"num":15,"q":"평등원칙 위반의 특수성은 대상 법률이 정하는 ‘법률효과’ 자체가 위헌이 아니라 그 법률효과가 수범자의 한 집단에만 귀속되어 ‘다른 집단과 사이에 차별’이 발생한다는 점에 있기 때문에, 평등원칙의 위반을 인정하기 위해서는 우선 법적용과 관련하여 상호 배타적인 ‘두 개의 비교집단’을 일정한 기준에 따라서 구분할 수 있어야 한다.","src":"2022 국가직 7급","a":true,"exp":"헌재 2003. 12. 18. 2002헌마593"},{"set":7,"num":16,"q":"비교되는 두 사실관계를 법적으로 동일한 것으로 볼 것인지 아니면 다른 것으로 볼 것인지를 판단하기 위하여서는 어떠한 요소가 결정적인 기준이 되는가가 문제되는데, 두 개의 사실관계가 본질적으로 동일한가의 판단은 일반적으로 당해 법률조항의 의미와 목적에 달려 있다.","src":"2010 사법시험","a":true,"exp":"헌재 2001.11.29. 99헌마494"},{"set":7,"num":17,"q":"평등의 원칙은 입법자에게 본질적으로 같은 것을 자의적으로 다르게, 본질적으로 다른 것을 자의적으로 같게 취급하는 것을 금하고 있다. 그러므로 비교의 대상을 이루는 두 개의 사실관계 사이에 서로 상이한 취급을 정당화할 수 있을 정도의 차이가 없음에도 불구하고 두 사실관계를 서로 다르게 취급한다면, 입법자는 이로써 평등권을 침해하 게 된다.","src":"2024 법원직","a":true,"exp":"헌재 2020. 12. 23. 2018헌바222"},{"set":7,"num":18,"q":"특정한 조세 법률조항이 혼인이나 가족생활을 근거로 부부 등 가족이 있는 자를 혼인하지 아니한 자 등에 비하여 차별 취급하는 것이 과세단위를 설정하는데 있어 입법자의 입법형성의 재량에 속하는 정책적 문제라면 헌법 제36조 제1항에 위반되는지 여부는 단지 차별의 합리적인 이유의 유무만을 확인하는 정도로 심사하여야 한다.","src":"2025 경정승진","a":false,"exp":"특정한 조세 법률조항이 혼인이나 가족생활을 근거로 부부 등 가족이 있는 자를 혼인하지 아니한 자 등에 비하여 차별 취급하는 것이라면 비례의 원칙에 의한 심사에 의하여 정당화되지 않는 한 헌법 제36조 제1항에 위반된다(헌재 2008. 11. 13. 2006헌바112)."},{"set":7,"num":19,"q":"국가유공자 본인이 국가기관이 실시하는 채용시험에 응시하는 경우에 10%의 가점을 주도록 한 ｢국가유공자 등 예우 및 지원에 관한 법률｣ 조항은 헌법 제32조 제6항에서 특별히 평등을 요구하고 있는 경우에 해당하므로, 이 에 대해서는 엄격한 비례성 심사에 따라 평등권 침해 여부를 심사하여야 한다.","src":"2017 변호사시험","a":false,"exp":"헌법재판소의 종전 결정은 국가유공자와 그 가족에 대한 가산점제도는 모두 헌법 제32조 제6항에 근거를 두고 있으므로 평등권 침해 여부에 관하여 보다 완화된 기준을 적용한 비례심사를 하였으나, 국가유공자 본인의 경우는 별론으로 하고, 그 가족의 경우는 위에서 본 바와 같이 헌법 제32조 제6항이 가산점제도의 근거라고 볼 수 없으므로 그러한 완화된 심사는 부적절한 것이다(헌재 2006. 2. 23. 2004헌마675). 따라서 국가유공자 본인의 경우는 여전히 완화된 기준을 적용한 비례심사를 한다."},{"set":7,"num":20,"q":"친일반민족행위자의 후손이라는 점이 헌법 제11조제1항 후문의 사회적 신분에 해당한다면 헌법에서 특별히 평등을 요구하고 있는 경우에 해당하여 친일반민족행위자의 후손에 대한 차별은 평등권 침해 여부의 심사에서 엄격한 기준을 적용해야 한다.","src":"2022 국가직 7급","a":false,"exp":"사회적 신분에 대한 차별금지는 헌법 제11조 제1항 후문에서 예시된 것인데, 헌법 제11조 제1항 후문의 규정은 불합리한 차별의 금지에 초점이 있는 것으로서, 예시한 사유가 있는 경우에 절대적으로 차별을 금지할 것을 요구함으로써 입법자에게 인정되는 입법형성권을 제한하는 것은 아니다. 그렇다면 친일반민족행위자의 후손이라는 점이 헌법 제11조 제1항 후문의 사회적 신분에 해당한다 할지라도 이것만으로는 헌법에서 특별히 평등을 요구하고 있는 경우라고 할 수 없고, 그 차별취급으로 기본권에 대한 중대한 제한을 초래하는 경우라고 할 수 없으므로, 역시 평등권 침해 여부의 심사에서 엄격한 기준을 적용해야 하는 경우에 해당하지 않는다. 따라서 이 사건 귀속조항으로 인한 차별이 청구인들의 평등권을 침해하였는지 여부에 대한 심사는 완화된 기준이 적용되어야 한다(헌재 2011. 3. 31. 2008헌바141)."},{"set":7,"num":21,"q":"“약사 또는 한약사가 아니면 약국을 개설할 수 없다.”고 규정한 ｢약사법｣ 조항은 다른 직종들에 대하여는 법인을 구성하여 업무를 수행할 수 있도록 하면서, 약사에게만 합리적 이유 없이 이를 금지하는 것으로 평등권을 침해한다.","src":"2025 국가직 7급","a":true,"exp":"“약사 또는 한약사가 아니면 약국을 개설할 수 없다.”고 규정한 약사법 조항은 법인을 구성하여 약국을 개설․운영하려고 하는 약사들 및 이들 약사들로 구성된 법인의 직업선택의 자유와 결사의 자유를 침해한다. 또한 변호사, 공인회계사 등 여타 전문직과 의약품제조업자 등 약사법의 규율을 받는 다른 직종들에 대하여는 법인을 구성하여 업무를 수행할 수 있도록 하면서, 약사에게만 합리적 이유 없이 이를 금지하는 것은 헌법상의 평등권을 침해하는 것이다(헌재 2002. 9. 19. 2000헌바84)."},{"set":7,"num":22,"q":"치과전문의 자격 인정 요건으로 ‘외국의 의료기관에서 치과의사 전문의 과정을 이수한 사람’을 포함하지 아니한 ｢치과의사전문의의 수련 및 자격 인정 등에 관한 규정｣ 제18조제1항은 청구인들의 평등권을 침해한다.","src":"2023 지방직 7급","a":true,"exp":"외국의 의료기관에서 치과전문의 과정을 이수한 사람에 대해 치과전문의 자격시험에 앞서 예비시험제도를 두는 등 직업의 자유를 덜 제한하는 방법으로도 입법목적을 달성할 수 있으므로, 심판대상조항은 침해의 최소성원칙에 위배되고 법익의 균형성도 충족하지 못한다. 따라서 심판대상조항은 과잉금지원칙에 위배되어 청구인들의 직업수행의 자유를 침해한다. ... 치과전문의의 자격 인정 요건을 의사전문의의 경우와 다르게 규정할 특별한 사정이 있다고 보기도 어렵다. 따라서 심판대상조항은 청구인들의 평등권을 침해한다. (헌재 2015. 9. 24. 2013헌마197)"},{"set":7,"num":23,"q":"병원, 치과병원, 종합병원과 달리 정신병원에 대하여는 한의사를 두어 한의과 진료과목을 추가로 설치․운영할 수 있다는 규정을 두지 아니한 ｢의료법｣ 조항은 정신병원과 다른 병원의 차이점을 반영한 것으로 정신병원을 운영하는 청구인의 평등권을 침해하지 아니한다.","src":"2026 경찰 제1차","a":false,"exp":"정신병원을 운영하는 자를 종합병원․병원․치과병원을 운영하는 자와 달리 취급하는 데에 합리적인 이유가 있다고 볼 수 없으므로, 심판대상조항은 정신병원을 운영하는 청구인의 평등권을 침해한다(헌재 2025. 1. 23. 2021헌마886)."},{"set":7,"num":24,"q":"중혼의 취소권자를 민법이 규정하면서 직계비속을 제외한 것은 합리적 이유 없이 직계존속에게는 중혼의 취소청구권을 부여하고 직계비속에게는 부여하지 않았다고 할 것이어서 평등원칙에 반한다.","src":"2022 법원직","a":true,"exp":"중혼의 취소청구권자를 규정한 이 사건 법률조항은 그 취소청구권자로 직계존속과 4촌 이내의 방계혈족을 규정 하면서도 직계비속을 제외하였는바, 합리적인 이유 없이 직계비속을 차별하고 있어, 평등원칙에 위반된다. (헌재 2010. 7. 29. 2009헌가8)"},{"set":7,"num":25,"q":"특별교통수단에 있어 표준휠체어만을 기준으로 휠체어 고정설비의 안전기준을 정하고 있는 ｢교통약자의 이동편의증진법 시행규칙｣ 조항은 표준휠체어를 이용할 수 없는 장애인의 평등권을 침해한다.","src":"2025 변호사시험","a":true,"exp":"헌재 2023. 5. 25. 2019헌마1234"},{"set":7,"num":26,"q":"6․25전몰군경자녀에게 6․25전몰군경자녀수당을 지급하면서 그 수급권자를 6․25전몰군경자녀 중 1명에 한정하고, 나이가 많은 자를 우선하도록 정한 구 ‘국가유공자 등 예우 및 지원에 관한 법률’은 나이가 적은 6․25전몰군경자녀의 평등권을 침해한다.","src":"2023 법원행시","a":true,"exp":"이 사건 법률조항은 국가가 국가유공자의 유족인 6·25전몰군경자녀에게 이 사건 수당을 지급함에 있어 합리적인 이유 없이 그 수급권자의 수를 자녀 중 1명으로 한정하고, 수급권자의 수를 확대할 수 있는 어떠한 예외도 두 지 않고 있으며, 6·25전몰군경자녀 중 나이가 많은 자와 그렇지 않은 자를 합리적 이유 없이 차별하여 나이가 많은 자에게 우선하여 이 사건 수당을 지급하고 있으므로, 나이가 적은 6·25전몰군경자녀의 평등권을 침해하여 헌법에 위반된다(헌재 2021.03.25. 2018헌가6)."},{"set":7,"num":27,"q":"1991년 개정 ｢농어촌의료법｣이 적용되기 전에 공중보건의사로 복무한 사람이 사립학교 교직원으로 임용된 경우공중보건 의사로 복무한 기간을 사립학교 교직원 재직기간에 산입하도록 규정하지 않은 ｢사립학교교직원 연금법｣상 조항은 공중보건의사가 출·퇴근을 하며 병역을 이행한다는 점에서 그 복무기간을 재직기간에 산입하지 않는 것에 합리적 이유가 있다.","src":"2024 경찰간부","a":false,"exp":"공중보건의사로 복무하였던 사람이 사립학교 교직원으로 임용되었을 경우 현역병 등과 달리 공중보건의사 복무기간을 재직기간에 반영하도록 규정하지 아니한 것은 차별취급에 합리적인 이유가 없다. 따라서 공중보건의사로 복무한 사람이 사립학교 교직원으로 임용된 경우 공중보건의사로 복무한 기간을 사립학교 교직원 재직기간에 산입하도록 규정하지 않은 것은 평등원칙에 위배된다(헌재 2016. 2. 25. 2015헌가15)."},{"set":7,"num":28,"q":"근로자가 사업주의 지배관리 아래 출퇴근하던 중 발생한 사고로 부상 등이 발생한 경우만 업무상 재해로 인정하는산업재해보상보험법(2007. 12. 14. 법률 제8694호로 전부개정된 것) 제37조 제1항 제1호 다목은 평등원칙에 위반된다.","src":"2023 법원직","a":true,"exp":"사업장 규모나 재정여건의 부족 또는 사업주의 일방적 의사나 개인 사정 등으로 출퇴근용 차량을 제공받지 못하거나 그에 준하는 교통수단을 지원받지 못하는 비혜택근로자는 비록 산재보험에 가입되어 있다 하더라도 출퇴근재해에 대하여 보상을 받을 수 없는데, 이러한 차별을 정당화할 수 있는 합리적 근거를 찾을 수 없다. 따라서 근로자가 사업주의 지배관리 아래 출퇴근하던 중 발생한 사고로 부상 등이 발생한 경우만 업무상 재해로 인정하는 산업재해보상보험법 조항은 평등원칙에 위배된다(헌재 2016. 9. 29. 2014헌바254)."},{"set":7,"num":29,"q":"근로자가 사업주의 지배관리 아래 출퇴근하던 중 발생한 사고로 부상 등이 발생한 경우만 업무상 재해로 인정하는 것은 평등원칙에 위배된다.","src":"2025 국가직 7급","a":true,"exp":"헌재 2016. 9. 29. 2014헌바254"},{"set":7,"num":30,"q":"주민투표권은 법률상 권리에 불과하나, 당해 지방자치단체의 관할구역에 주민등록 되어 있는 자에 한해 주민투표권을 인정함으로써 결과적으로 주민등록을 할 수 없는 재외국민인 주민을 다르게 취급한 경우에는 헌법상 평등권 심사의 대상이 된다.","src":"2022 법원직","a":true,"exp":"헌재 2007. 6. 28. 2004헌마643"},{"set":7,"num":31,"q":"대한민국 국적을 가지고 있는 영유아 중에서 재외국민인 영유아를 보육료ㆍ양육수당의 지원대상에서 제외함으로써, 청구인들과 같이 국내에 거주하면서 재외국민인 영유아를 양육하는 부모를 차별하는 보건복지부지침은 청구인들의 평등권을 침해한다.","src":"2023 지방직 7급","a":true,"exp":"단순한 단기체류가 아니라 국내에 거주하는 재외국민 특히 외국의 영주권을 보유하고 있으나 상당한 기간 국내에서 계속 거주하고 있는 자들은 주민등록법상 재외국민으로 등록 관리될 뿐 ‘국민인 주민’이라는 점에서는 다른 일반 국민과 실질적으로 동일하므로, 단지 외국의 영주권을 취득한 재외국민이라는 이유로 달리 취급할 아무런 이유가 없어 위와 같은 차별은 청구인들의 평등권을 침해한다(헌재 2018. 1. 25. 2015헌마1047)."},{"set":7,"num":32,"q":"외국인만으로 구성된 가구 중 영주권자 및 결혼이민자만을 긴급재난지원금 지급대상에 포함시키고 난민인정자를 제외한 관계부처합동 ‘긴급재난지원금 가구구성 및 이의신청 처리기준(2차)’ 중 해당 부분은, ‘영주권자 및 결혼이민자’와 ‘난민인정자’ 간 합리적 차별이라 할 것이므로 난민인정자의 인간다운 생활을 할 권리를 침해하지 아니한다.","src":"2024 경찰 제2차","a":false,"exp":"영주권자 및 결혼이민자만을 재난지원금 지급대상에 포함시키고 난민인정자를 제외하고 있는 이 사건 처리기준이 영주권자 및 결혼이민자와의 관계에서 청구인의 평등권을 침해하는지 여부를 살펴본다. 청구인은 인간다운 생활을 할 권리도 침해한다는 주장을 하고 있으나 이는 결국 영주권자 및 결혼이민자에 대해서는 재난지원금을 지급하면서 난민인정자에 대해서는 이를 지급하지 않는 것이 현저히 불합리하다는 주장과 다르지 아니하므로, 평등권 침해 여부를 판단하는 이상 이에 관하여는 따로 판단하지 아니한다. ... 긴급재난지원금 지급 대상에 외국인 중에서도 ‘영주권자 및 결혼이민자’를 포함시키면서 ‘난민인정자’를 제외한 것은 합리적 이유 없는 차별이라 할 것이므로, 이 사건 처리기준은 청구인의 평등권을 침해한다(헌재 2024. 3. 28. 2020헌마1079)."},{"set":7,"num":33,"q":"내국인등 지역가입자와 달리 외국인 지역가입자가 보험료를 체납한 경우에는 다음 달부터 곧바로 보험급여를 제한하는 ｢국민건강보험법｣ 조항은, 외국인 지역가입자에 대하여 체납횟수와 경제적 사정 등을 전혀 고려하지 않고 예외 없이 1회의 보험료 체납사실만으로도 보험급여를 제한하고 있어 외국인 지역가입자의 평등권을 합리적 이유 없이 침해한다.","src":"2024 지방직 7급","a":true,"exp":"보험급여제한 조항은 외국인의 경우 보험료의 1회 체납만으로도 별도의 공단 처분 없이 곧바로 그 다음 달부터 보험급여를 제한하도록 규정하고 있으므로, 보험료가 체납되었다는 통지도 실시되지 않는다. 그러나 절차적으로 보험료 체납을 통지하는 것은 당사자로 하여금 착오를 시정할 수 있도록 하거나 잘못된 보험료 부과 또는 보험급여제한처분에 불복할 기회를 부여하는 것이기 때문에, 이를 통지하지 않는 것은 정당화될 수 없는 차별이다. 따라서 보험급여제한 조항은 청구인들의 평등권을 침해한다(헌재 2023. 9. 26. 2019헌마1165)."},{"set":7,"num":34,"q":"자율형 사립고등학교를 지원한 학생에게 평준화지역 후기학교에 중복지원하는 것을 금지한 ｢초ㆍ중등교육법 시행령｣ 제81조제5항 중 ‘제91조의3에 따른 자율형 사립고등학교는 제외한다’ 부분은 고교별 특성을 고려한 것으로 청구인 학생의 평등권을 침해하지 않는다.","src":"2023 지방직 7급","a":false,"exp":"자사고에 불합격한 학생들은 자신이 재학 중인 중학교의 소재지 또는 거주지의 시·도별 교육감의 정책에 따라 평준화지역 일반고에 배정되지 못하고 통학이 힘든 먼 거리의 비평준화지역의 학교에 진학하거나 고등학교 재수를 하여야 한다. 자사고에 지원하였다가 불합격한 어린 학생들에게 단지 자사고에 지원하였었다는 이유만으로 위 와 같은 불이익을 주는 것이 과연 적절한 조치인지 의문이 아닐 수 없다. 따라서 이 사건 중복지원금지 조항은 청구인 학생 및 학부모의 평등권을 침해하여 헌법에 위반된다(헌재 2019.4.11. 2018헌마221)."},{"set":7,"num":35,"q":"헌법불합치결정에 따라 실질적인 혼인관계가 존재하지 아니한 기간을 제외하고 분할연금을 산정하도록 개정된 ｢국민연금법｣ 조항을 개정법 시행 후 최초로 분할연금 지급사유가 발생한 경우부터 적용하도록 하는 ｢국민연금법｣ 부칙 제2조가 분할연금 지급 사유 발생시점이 신법 조항 시행일 전･후인지와 같은 우연한 사정을 기준으로 달리 취급하는 것은 합리적인 이유를 찾기 어렵다.","src":"2025 경위공채","a":true,"exp":"헌법재판소는 2016. 12. 29. 별거나 가출 등으로 실질적인 혼인관계가 존재하지 아니하여 연금 형성에 기여가 없는 이혼배우자에 대해서까지 법률혼 기간을 기준으로 분할연금 수급권을 인정하는 구 국민연금법 제64조 제1항이 노령연금 수급권자의 재산권을 침해하므로 헌법에 합치되지 아니한다고 결정하였다(헌재 2015헌바182, 이 하 ‘종전 헌법불합치결정’이라 한다). 심판대상조항은 국민연금법 제64조 제1항 및 제4항의 개정규정을 신법 조항 시행 후 최초로 분할연금 지급 사유가 발생한 경우부터 적용하도록 규정하고 있는바, 실질적인 혼인관계가해소되어 분할연금의 기초가 되는 노령연금 수급권 형성에 아무런 기여가 없는 경우에는 노령연금 분할을 청구할 전제를 갖추지 못한 것으로 볼 수 있다는 점에서 분할연금 지급 사유 발생 시점이 신법 조항 시행일 전인 경우와 후인 경우 사이에 아무런 차이가 없으므로, 분할연금 지급 사유 발생시점이 신법 조항 시행일 전ㆍ후인지와같은 우연한 사정을 기준으로 달리 취급하는 것은 합리적인 이유를 찾기 어렵다. 따라서 심판대상조항은 평등원칙에 위반된다(헌재 2024. 5. 30. 2019헌가29)."},{"set":7,"num":36,"q":"국가를 상대로 하는 당사자소송의 경우에는 가집행선고를 할 수 없다고 규정한 ｢행정소송법｣ 제43조는 공법상 법률관계를 전제로 한다는 점에서 일반 사법상 법률관계와 달리 취급할 합리적 이유가 있으므로 평등원칙에 위배되지 아니한다.","src":"2022 경찰 제2차","a":false,"exp":"심판대상조항은 재산권의 청구에 관한 당사자소송 중에서도 피고가 공공단체 그 밖의 권리주체인 경우와 국가인경우를 다르게 취급한다. 가집행의 선고는 불필요한 상소권의 남용을 억제하고 신속한 권리실행을 하게 함으로써 국민의 재산권과 신속한 재판을 받을 권리를 보장하기 위한 제도이고, 당사자소송 중에는 사실상 같은 법률조항에 의하여 형성된 공법상 법률관계라도 당사자를 달리 하는 경우가 있다. 동일한 성격인 공법상 금전지급 청구소송임에도 피고가 누구인지에 따라 가집행선고를 할 수 있는지 여부가 달라진다면 상대방 소송 당사자인 원고로 하여금 불합리한 차별을 받도록 하는 결과가 된다. 재산권의 청구가 공법상 법률관계를 전제로 한다는 점만으로 국가를 상대로 하는 당사자소송에서 국가를 우대할 합리적인 이유가 있다고 할 수 없고, 집행가능성 여부에 있어서도 국가와 지방자치단체 등이 실질적인 차이가 있다고 보기 어렵다는 점에서, 심판대상조항은 국가가 당사자소송의 피고인 경우 가집행의 선고를 제한하여, 국가가 아닌 공공단체 그 밖의 권리주체가 피고인 경우에 비하여 합리적인 이유 없이 차별하고 있으므로 평등원칙에 반한다(헌재 2022. 2. 24. 2020헌가12)."},{"set":7,"num":37,"q":"구 ｢소년법｣ 규정이 소년으로 범한 죄에 의하여 형의 선고를 받은 자가 그 집행을 종료하거나 면제받은 때와 달리 집행유예를 선고받은 소년범에 대한 자격완화 특례규정을 두지 아니하여 자격제한을 함에 있어 ｢군인사법｣ 등 해 당 법률의 적용을 받도록 한 것은 불합리한 차별이라 할 것이므로 평등원칙에 위반된다.","src":"2018 국가직 7급","a":true,"exp":"이 사건 조항은 소년의 건전한 성장과 정상적인 사회복귀를 위해 형의 집행이 종료되거나 면제된 이후에는 유예기간 없이 공무원 등으로 임용될 수 있도록 하면서, 그보다 가벼운 형이라 할 수 있는 집행유예의 경우에는 그 기간을 경과하였더라도 기간 종료 후 일정 기간 동안 자격이 제한되는 것을 가능하게 하고 있으므로, 이는 명백히 자의적인 차별로서 정당화되지 아니한다(헌재 2018.1.25. 2017헌가7)."},{"set":7,"num":38,"q":"A국립대학교 총장 乙이 금요일 일몰부터 토요일 일몰까지 학교 활동 및 시험 응시 등의 세속적 행위를 금지하는 ○○교 신자 甲의 면접일시 변경을 거부함으로써 甲이 종교적 신념을 이유로 받게 된 중대한 불이익을 방치한 乙의 행위는 헌법상 평등원칙을 위반한 것으로 위법하다.","src":"2026 변호사시험","a":true,"exp":"대법원 2024. 4. 4. 2022두56661"},{"set":7,"num":39,"q":"갑이 동성인 을과 교제하다가 서로를 동반자로 삼아 함께 생활하기로 합의하고 동거하던 중 결혼식을 올린 뒤 국민건강보험공단에 건강보험 직장가입자인 을의 사실혼 배우자로 피부양자 자격취득 신고를 하여 피부양자 자격을 취득한 것으로 등록되었는데, 이 사실이 언론에 보도되자 국민건강보험공단이 갑을 피부양자로 등록한 것이 ‘착오처리’였다며 갑의 피부양자 자격을 소급하여 상실시키고 지역가입자로 갑의 자격을 변경한 후 그동안의 지역가입자로서의 건강보험료 등을 납입할 것을 고지한 것은 헌법상 평등원칙을 위반한 것이다.","src":"2027 경위공채","a":true,"exp":"대법원 2024. 7. 18. 2023두36800"},{"set":8,"num":1,"q":"생명에 대한 권리는 비록 헌법에 명문의 규정이 없다 하더라도 인간의 생존본능과 존재목적에 바탕을 둔 선험적이고자연법적인 권리로서 헌법에 규정된 모든 기본권의 전제로서 기능하는 기본권 중의 기본권이다.","src":"2025 국가직 5급","a":true,"exp":"헌재 2010.2.25. 2008헌가23"},{"set":8,"num":2,"q":"생명권은 헌법에 명문으로 규정하고 있지 않지만 다른 어느 기본권보다 우월한 가치를 가지는 절대적 권리로서 헌 법 제37조 제2항에 의한 일반적 법률유보의 대상이 될 수 없다.","src":"2014 지방직 7급","a":false,"exp":"헌법은 절대적 기본권을 명문으로 인정하고 있지 아니하며, 헌법 제37조 제2항에서는 국민의 모든 자유와 권리는 국가안전보장･질서유지 또는 공공복리를 위하여 필요한 경우에 한하여 법률로써 제한할 수 있도록 규정하고 있어, 비록 생명이 이념적으로 절대적 가치를 지닌 것이라 하더라도 생명에 대한 법적 평가가 예외적으로 허용될 수 있다고 할 것이므로, 생명권 역시 헌법 제37조 제2항에 의한 일반적 법률유보의 대상이 될 수밖에 없다(헌재 2010.2.25. 2008헌가23)."},{"set":8,"num":3,"q":"모든 인간의 생명은 자연적 존재로서 동등한 가치를 갖는다고 할 것이나 그 동등한 가치가 서로 충돌하게 되거나생명의 침해에 못지 아니한 중대한 공익을 침해하는 등의 경우에는 국민의 생명ㆍ재산 등을 보호할 책임이 있는 국가는 어떠한 생명 또는 법익이 보호되어야 할 것인지 그 규준을 제시할 수 있다.","src":"2025 국가직 5급","a":true,"exp":"모든 인간의 생명은 자연적 존재로서 동등한 가치를 갖는다고 할 것이나 그 동등한 가치가 서로 충돌하게 되거나 생명의 침해에 못지 아니한 중대한 공익을 침해하는 등의 경우에는 국민의 생명·재산 등을 보호할 책임이 있는 국가는 어떠한 생명 또는 법익이 보호되어야 할 것인지 그 규준을 제시할 수 있는 것이다. 인간의 생명을 부정하는 등의 범죄행위에 대한 불법적 효과로서 지극히 한정적인 경우에만 부과되는 사형은 죽음에 대한 인간의 본능적 공포심과 범죄에 대한 응보욕구가 서로 맞물려 고안된 \"필요악\"으로서 불가피하게 선택된 것이며 지금 도 여전히 제 기능을 하고 있다는 점에서 정당화될 수 있다. 따라서 사형은 이러한 측면에서 헌법상의 비례의 원칙에 반하지 아니한다 할 것이고, 적어도 우리의 현행 헌법이 스스로 예상하고 있는 형벌의 한 종류이기도 하므로 아직은 우리의 헌법질서에 반하는 것으로 판단되지 아니한다(헌재 1996. 11. 28. 95헌바1)."},{"set":8,"num":4,"q":"생명권의 경우, 다른 일반적인 기본권 제한의 구조와는 달리, 생명의 일부 박탈이라는 것을 상정할 수 없고 생명권에대한 제한은 필연적으로 생명권의 완전한 박탈을 의미하게 되기 때문에 생명권의 제한이 정당화될 수 있는 예외적인 경우라 하더라도 생명권의 박탈이 초래된다면 곧바로 기본권의 본질적인 내용을 침해하는 것이라 볼 수 있다.","src":"2023 법원직","a":false,"exp":"생명권의 제한이 정당화될 수 있는 예외적인 경우에는 생명권의 박탈이 초래된다 하더라도 곧바로 기본권의 본질적인 내용을 침해하는 것이라 볼 수는 없다. (헌재 2010. 2. 25. 2008헌가23)"},{"set":8,"num":5,"q":"금치의 징벌을 받은 수용자에 대해 금치기간 중 실외운동을 원칙적으로 제한하고, 예외적으로 실외운동을 허용하는 경우에도 실외운동의 기회가 부여되어야 하는 최저기준을 명시하지 않고 있는 구 형의 집행 및 수용자의 처우에 관한 법률 해당 규정은 침해의 최소성 원칙에 위배되어 신체의 자유를 침해한다.","src":"2024 법원직","a":true,"exp":"헌재 2016. 5. 26. 2014헌마45"},{"set":8,"num":6,"q":"보호의무자 2인의 동의와 정신건강의학과 전문의 1인의 진단으로 정신질환자에 대한 보호입원이 가능하도록 한 ｢정신보건법｣ 조항은 과잉금지원칙을 위반하여 신체의 자유를 침해한다.","src":"2025 경정승진","a":true,"exp":"헌재 2016. 9. 29. 2014헌가9"},{"set":8,"num":7,"q":"병에 대한 징계처분으로 일정기간 부대나 함정 내의 영창, 그 밖의 구금장소에 감금하는 영창처분이 가능하도록 규정한 구 군인사법 제57조 제2항 중 ‘영창’에 관한 부분은 신체의 자유를 침해하여 헌법에 위반된다.","src":"2026 법원직","a":true,"exp":"헌재 2020. 9. 24. 2017헌바157"},{"set":8,"num":8,"q":"강제퇴거명령을 받은 사람을 보호할 수 있도록 하면서 보호기간의 상한을 마련하지 않은 출입국관리법 해당 조항은 침해의 최소성과 법익의 균형성을 충족하지 못하여 피보호자의 신체의 자유를 침해한다.","src":"2024 법원직","a":true,"exp":"헌재 2023. 3. 23. 2020헌가1"},{"set":8,"num":9,"q":"강제퇴거명령을 받은 사람을 보호할 수 있도록 하면서 보호기간의 상한을 마련하지 아니한 ｢출입국관리법｣ 제63조제1항은 적법절차원칙에 위배된다.","src":"2024 국가직 7급","a":true,"exp":"헌재 2023. 3. 23. 2020헌가1"},{"set":8,"num":10,"q":"강제퇴거명령을 받은 사람을 보호할 수 있도록 하면서 보호기간의 상한을 마련하지 아니한 ｢출입국관리법｣ 조항에 의한 보호는 형사절차상 ‘체포 또는 구속’에 준하는 것으로 볼 수 있는 점을 고려하면, 보호의 개시 또는 연장 단계에서 그 집행기관인 출입국관리공무원으로부터 독립되고 중립적인 지위에 있는 기관이 보호의 타당성을 심사하여 이를 통제할 수 있어야 한다.","src":"2023 국가직 7급","a":true,"exp":"행정절차상 강제처분에 의해 신체의 자유가 제한되는 경우 강제처분의 집행기관으로부터 독립된 중립적인 기관이 이 를 통제하도록 하는 것은 적법절차원칙의 중요한 내용에 해당한다. 심판대상조항에 의한 보호는 신체의 자유를 제한하는 정도가 박탈에 이르러 형사절차상 ‘체포 또는 구속’에 준하는 것으로 볼 수 있는 점을 고려하면, 보호의 개 시 또는 연장 단계에서 그 집행기관인 출입국관리공무원으로부터 독립되고 중립적인 지위에 있는 기관이 보호의 타당성을 심사하여 이를 통제할 수 있어야 한다. 그러나 현재 출입국관리법상 보호의 개시 또는 연장 단계에서 집행기관으로부터 독립된 중립적 기관에 의한 통제절차가 마련되어 있지 아니하다. 당사자에게 의견 및 자료제출의 기회를 부여하는 것은 적법절차원칙에서 도출되는 중요한 절차적 요청이므로, 심판대상조항에 따라 보호를 하는 경우에도피보호자에게 위와 같은 기회가 보장되어야 하나, 심판대상조항에 따른 보호명령을 발령하기 전에 당사자에게 의견을 제출할 수 있는 절차적 기회가 마련되어 있지 아니하다. 따라서 심판대상조항은 적법절차원칙에 위배되어 피보호자의 신체의 자유를 침해한다(헌재 2023. 3. 23. 2020헌가1)."},{"set":8,"num":11,"q":"행정절차상 강제처분에 의해 신체의 자유가 제한되는 경우 강제처분의 집행기관으로부터 독립된 중립적인 기관이 이를 통제하도록 하는 것은 적법절차원칙의 중요한 내용에 해당한다.","src":"2025 법원직","a":true,"exp":"헌재 2023. 3. 23. 2020헌가1"},{"set":8,"num":12,"q":"과태료는 행정질서벌에 해당할 뿐 형벌이 아니므로 죄형법정주의의 규율대상에 해당하지 아니한다.","src":"2026 법원직","a":true,"exp":"헌재 1998. 5. 28. 96헌바83"},{"set":8,"num":13,"q":"죄형법정주의란 무엇이 범죄이며 그에 대한 형벌이 어떠한 것인가를 반드시 국민의 대표로 구성된 입법부가 제정한 법률로써 정하여야 한다는 원칙을 말하므로, 형사처벌요건을 입법부가 행정부에서 제정한 명령이나 규칙에 위 임하는 것은 허용되지 않는다.","src":"2022 지방직 7급","a":false,"exp":"형벌법규에 대하여도 특히 긴급한 필요가 있거나 미리 법률로서 자세히 정할 수 없는 부득이한 사정이 있는 경우에 한하여 수권법률(위임법률)이 구성요건의 점에서는 처벌대상인 행위가 어떠한 것일거라고 이를 예측할 수 있을 정도로 구체적으로 정하고, 형벌의 점에서는 형벌의 종류 및 그 상한과 폭을 명확히 규정하는 것을 조건으로 위임입법이 허용되며 이러한 위임입법은 죄형법정주의에 반하지 않는다(헌재 1996. 2. 29. 94헌마213)."},{"set":8,"num":14,"q":"현대국가의 사회적 기능증대와 사회현상의 복잡화에 따라 국민의 권리ㆍ의무에 관한 사항이라 하여 모두 입법부에서 제정한 법률만으로 다 정할 수는 없기 때문에 합리적인 이유가 있으면 예외적으로 행정부에서 제정한 명령에 위 임하는 것이 허용된다. 그러나 형사처벌을 동반하는 처벌법규의 위임은 죄형법정주의원칙에 따라 허용될 수 없다.","src":"2026 법원직","a":false,"exp":"형벌법규에 대하여도 특히 긴급한 필요가 있거나 미리 법률로서 자세히 정할 수 없는 부득이한 사정이 있는 경우에 한하여 수권법률(위임법률)이 구성요건의 점에서는 처벌대상인 행위가 어떠한 것일거라고 이를 예측할 수 있 을 정도로 구체적으로 정하고, 형벌의 점에서는 형벌의 종류 및 그 상한과 폭을 명확히 규정하는 것을 조건으로위임입법이 허용되며 이러한 위임입법은 죄형법정주의에 반하지 않는다(헌재 1996. 2. 29. 94헌마213)."},{"set":8,"num":15,"q":"노역장유치조항의 시행 전에 행해진 범죄행위에 대해서 공소제기의 시기가 노역장유치조항의 시행 이후이면 노역장유치조항을 적용하도록 하는 것은 헌법상 형벌불소급원칙에 위반된다.","src":"2024 경찰간부","a":true,"exp":"노역장유치조항의 시행 전에 행해진 범죄행위에 대해서도 공소제기의 시기가 노역장유치조항의 시행 이후이면 이를 적용하도록 하고 있으므로, 이는 범죄행위 당시 보다 불이익한 법률을 소급 적용하도록 하는 것으로서 헌법상 형벌불소급원칙에 위반된다(헌재 2017. 10. 26. 2015헌바239)."},{"set":8,"num":16,"q":"죄형법정주의에서 파생되는 명확성의 원칙은, 누구나 법률이 처벌하고자 하는 행위가 무엇이며 그에 대한 형벌이 어떠한 것인지를 예견할 수 있고 그에 따라 자신의 행위를 결정 지울 수 있도록 구성요건이 명확할 것을 의미한다.","src":"2023 법원직","a":true,"exp":"헌재 1998. 4. 30. 95헌가16"},{"set":8,"num":17,"q":"처벌법규의 구성요건을 일일이 세분하여 명확성의 요건을 모든 경우에 요구하는 것은 입법기술상 불가능하거나 현저히 곤란하므로, 처벌법규의 구성요건이 어느 정도 명확하여야 하는가는 일률적으로 정할 수 없고, 각 구성요건의 특수성과 그러한 법적 규제의 원인이 된 여건이나 처벌의 정도 등을 고려하여 종합적으로 판단하여야 하며, 다소 광범위하고 어느 정도의 범위에서는 법관의 보충적인 해석을 필요로 하는 개념을 사용하여 규정하였다고 하더라도 그 적용단계에서 다의적으로 해석될 우려가 없는 이상 그 점만으로 헌법이 요구하는 명확성의 요구에 배치된다고는 보기 어렵다.","src":"2023 법원직","a":true,"exp":"헌재 2001. 8. 30. 99헌바92"},{"set":8,"num":18,"q":"명확성원칙의 엄격한 적용이 요구되는 경우에는 그 적용대상자와 금지 행위를 구체적으로 알 수 있도록 구체적이고 서술적인 개념에 의하여 규정하여야 하고, 다소 광범위하여 법관의 보충적인 해석을 필요로 하는 개념을 사용 해서는 아니된다.","src":"2024 법원직","a":false,"exp":"헌재 2001. 8. 30. 99헌바92"},{"set":8,"num":19,"q":"규율대상인 대전제(일반조항)를 규정함과 동시에 거기에 해당하는 구체적 개별 사례들을 예시적으로 규정하는 예시적 입법형식이 명확성원칙에 위배되지 않으려면, 일반조항 자체가 구체적인 예시들을 포괄할 수 있는 의미를 담고 있는 개념이어야 하지만, 예시한 구체적인 사례들이 그 자체로 일반조항의 해석을 위한 판단지침까지 내포하고 있어야 하는 것은 아니다.","src":"2025 변호사시험","a":false,"exp":"예시적 입법형식에 있어서 구성요건의 일반조항이 지나치게 포괄적이어서 법관의 재량이 광범위하게 인정되어자의적인 해석을 통하여 그 적용범위를 확장할 가능성이 있는 경우라면, 죄형법정주의 원칙에 위배된다. 따라서 예시적 입법형식이 법률명확성의 원칙에 위배되지 않으려면 예시한 구체적인 사례(개개 구성요건)들이 그 자체로 일반조항의 해석을 위한 판단지침을 내포하고 있어야 할 뿐 아니라, 그 일반조항 자체가 그러한 구체적인 예시들을 포괄할 수 있는 의미를 담고 있는 개념이어야 한다(헌재 2000.4.27. 98헌바95)."},{"set":8,"num":20,"q":"범죄의 성립과 처벌은 법률에 의하여야 한다는 죄형법정주의 본래의 취지에 비추어 볼 때 정당방위와 같은 위법성 조각 사유 규정에도 죄형법정주의의 명확성원칙은 적용된다.","src":"2021 변호사시험","a":true,"exp":"정당방위 규정은 법 각칙 전체의 구성요건 조항에 대한 소극적 한계를 정하고 있는 규정으로서, 한편으로는 위법 성을 조각시켜 범죄의 성립을 부정하는 기능을 하지만, 다른 한편으로는 정당방위가 인정되지 않는 경우 위법한 행위로서 범죄의 성립을 인정하게 하는 기능을 하므로 적극적으로 범죄 성립을 정하는 구성요건 규정은 아니라 하더라도 죄형법정주의가 요구하는 명확성 원칙이 적용된다(헌재 2001.6.28. 99헌바31)."},{"set":8,"num":21,"q":"｢국가공무원법｣ 조항 중 초ㆍ중등교원인 교육공무원의 가입 등이 금지되는 ‘그 밖의 정치단체’에 관한 부분은 ‘특정정당이나 특정 정치인을 지지ㆍ반대하는 단체로서 그 결성에 관여하거나 가입하는 경우 공무원의 정치적 중립성 및 교육의 정치적 중립성을 훼손할 가능성이 높은 단체’로 한정할 수 있어 명확성원칙에 반하지 않는다.","src":"2023 국가직 7급","a":false,"exp":"국가공무원법조항 중 ‘그 밖의 정치단체’에 관한 부분은, ‘그 밖의 정치단체’라는 불명확한 개념을 사용하고 있어, 표현의 자유를 규제하는 법률조항, 형벌의 구성요건을 규정하는 법률조항에 대하여 헌법이 요구하는 명확성원칙의 엄격한 기준을 충족하지 못하였다. 명확성원칙에 위배되어 청구인들의 정치적 표현의 자유, 결사의 자유를 침해하여 헌법에 위반된다(헌재 2020. 4. 23. 2018헌마551)."},{"set":8,"num":22,"q":"“공공의 안녕질서” 또는 “미풍양속”은 ‘모든 국민이 준수하고 지킬 것이 요구되는 최소한도의 질서 또는 도덕률’ 을 의미한다고 보아야 할 것이므로, 공공의 안녕질서 또는 미풍양속을 해하는 통신을 금지하는 구 전기통신사업법 해당 조항은 명확성원칙에 위배되지 아니한다.","src":"2024 법원직","a":false,"exp":"공공의 안녕질서 또는 미풍양속을 해하는 내용의 통신을 금하는 전기통신사업법 조항은 명확성의 원칙에 위배된다(헌재 2002. 6. 27. 99헌마480)."},{"set":8,"num":23,"q":"공중도덕상 유해한 업무에 취업시킬 목적으로 근로자를 파견한 사람을 형사처벌하도록 규정한 구｢파견근로자보호등에 관한 법률｣ 조항 중 ‘공중도덕상 유해한 업무’ 부분은 그 행위의 의미가 문언상 불분명하다고 할 수 없으므로 죄형법정주의의 명확성원칙에 위배되지 않는다.","src":"2022 지방직 7급","a":false,"exp":"공중도덕상 유해한 업무에 취업시킬 목적으로 근로자를 파견한 사람을 형사처벌하도록 규정한 구 ｢파견근로자보호 등에 관한 법률｣ 조항은 그 조항의 입법목적, 위 법률의 체계, 관련조항 등을 모두 종합하여 보더라도 ‘공중도덕상 유해한 업무’의 내용을 명확히 알 수 없고, 위 조항에 관한 이해관계기관의 확립된 해석기준이 마련되어있다거나, 법관의 보충적 가치판단을 통한 법문 해석으로 그 의미내용을 확인하기도 어려우므로 명확성원칙에 위배된다(헌재 2016. 11. 24. 2015헌가23)."},{"set":8,"num":24,"q":"범죄의 처벌에 관한 문제, 즉 법정형의 종류와 범위의 선택은 입법자가 결정할 사항이지만, 광범위한 입법재량 내 지 형성의 자유가 인정된다고 볼 수 없다.","src":"2023 법원직","a":false,"exp":"어떤 범죄를 어떻게 처벌할 것인가 하는 문제, 즉 법정형의 종류와 범위의 선택은 광범위한 입법재량 내지 형성의 자유가 인정되어야 할 분야이기는 하지만, 이러한 입법재량은 무제한한 것이 될 수는 없다. 입법재량권이 헌법규정이나 헌법상의 제원리에 반하여 자의적으로 행사된 것으로 평가되는 경우에는 이와 같은 법정형을 규정한 법률조항은 헌법에 반한다고 보아야 한다(헌재 2006. 4. 27. 2006헌가5)."},{"set":8,"num":25,"q":"법정형의 종류와 범위를 정함에 있어서 고려해야 할 사항 중 가장 중요한 것은 당해 범죄의 보호법익과 죄질로서, 보호법익이 다르면 법정형의 내용이 다를 수 있고 보호법익이 같지만 죄질이 다를 경우 법정형의 내용이 달라질 수는 없다.","src":"2024 지방직 7급","a":false,"exp":"법정형의 종류와 범위를 정함에 있어서 고려해야 할 사항 중 가장 중요한 것은 당해 범죄의 보호법익과 죄질로서, 보호법익이 다르면 법정형의 내용이 다를 수 있고, 보호법익이 같다고 하더라도 죄질이 다르면 또 그에 따라 법정형의 내용이 달라질 수밖에 없다. 그러므로 보호법익과 죄질이 서로 다른 둘 또는 그 이상의 범죄를 동일 선상에 놓고 그 중 어느 한 범죄의 법정형을 기준으로 하여 단순한 평면적인 비교로써 다른 범죄의 법정형의 과중여부를 판정하여서는 아니 된다(헌재 2019. 5. 30. 2017헌바462)."},{"set":8,"num":26,"q":"음주운전 금지규정을 2회 이상 위반한 사람을 2년 이상 5년 이하의 징역이나 1천만원 이상 2천만원 이하의 벌금에 처하도록 한 구｢도로교통법｣ 조항은 보호법익에 미치는 위험 정도가 비교적 낮은 유형의 재범 음주운전행위도 일률적으로 그 법정형의 하한인 2년 이상의 징역 또는 1천만원 이상의 벌금을 기준으로 처벌하도록 하고 있어 책임과 형벌 간의 비례원칙에 위반된다.","src":"2022 국가직 7급","a":true,"exp":"헌재 2021. 11. 25. 2019헌바446"},{"set":8,"num":27,"q":"음주운전 금지규정 위반 전력이 1회 이상 있는 사람이 다시 음주측정거부를 한 경우 2년 이상 5년 이하의 징역이나 1천만 원 이상 2천만 원 이하의 벌금에 처하도록 규정한 구 도로교통법 제148조의2 제1항 및 도로교통법 제148조의2 제1항 중 각 ‘제44조 제1항을 1회 이상 위반한 사람으로서 다시 같은 조 제2항을 위반한 사람’에 관 한 부분은 책임과 형벌 간의 비례원칙에 위반된다.","src":"2025 법원직","a":true,"exp":"헌재 2022. 5. 26. 2021헌가32"},{"set":8,"num":28,"q":"예비군대원 본인의 부재시 예비군훈련 소집통지서를 수령한 같은 세대 내의 가족 중 성년자가 정당한 사유없이 소집통지서를 본인에게 전달하지 아니한 경우 형사처벌을 하는 ｢예비군법｣ 조항은 책임과 형벌 사이의 비례원칙에 위배되지 않는다.","src":"2023 경정승진","a":false,"exp":"예비군훈련을 위한 소집통지서 전달 업무는 정부가 수행하여야 하는 공적 사무로서, 정부는 직접 전달방식 외에도우편법령에 따른 송달이나 전자문서의 방식을 사용하여 예비군대원 본인에게 소집통지서를 충분히 전달할 수 있음에도 불구하고, 심판대상조항은 예비군대원 본인이 부재중이기만 하면 예비군대원 본인과 세대를 같이한다는 이유만으로 위와 같은 협력의 범위를 넘어서 가족 중 성년자에게 소집통지서를 전달할 의무를 위반하면 6개월 이하의 징역 또는 500만 원 이하의 벌금이라는 형사처벌까지 하고 있는데, 이러한 심판대상조항의 태도는 예비군훈련을 위한 소집통지서의 전달이라는 정부의 공적 의무와 책임을 단지 행정사무의 편의를 위하여 개인에게 전가하는 것으로 이것이 실효적인 예비군훈련 실시를 위한 전제로 그 소집을 담보하고자 하는 것이라도 지나치다고 아니할 수 없다. 따라서 가족 중 성년자가 예비군훈련 소집통지서를 예비군대원 본인에게 전달하여야 하는 의무를 위반한 행위를 형사처벌하는 예비군법 조항은 책임과 형벌 간의 비례원칙에 위반된다(헌재 2022. 5. 26. 2019헌가12)."},{"set":8,"num":29,"q":"주거침입강제추행죄 및 주거침입준강제추행죄에 대하여 무기징역 또는 7년 이상의 징역에 처하도록 한 ｢성폭력범죄의 처벌 등에 관한 특례법｣ 상 조항은 책임과 형벌의 비례원칙에 위반되지 않는다.","src":"2024 경찰간부","a":false,"exp":"주거침입죄와 강제추행·준강제추행죄는 모두 행위 유형이 매우 다양한바, 이들이 결합된다고 하여 행위 태양의다양성이 사라지는 것은 아니므로, 그 법정형의 폭은 개별적으로 각 행위의 불법성에 맞는 처벌을 할 수 있는 범위로 정할 필요가 있다. 심판대상조항은 법정형의 하한을 ‘징역 5년’으로 정하였던 2020. 5. 19. 개정 이전의구 성폭력처벌법 제3조 제1항과 달리 그 하한을 ‘징역 7년’으로 정함으로써, 주거침입의 기회에 행해진 강제추행 또는 준강제추행의 경우에는 다른 법률상 감경사유가 없는 한 법관이 정상참작감경을 하더라도 집행유예를선고할 수 없도록 하였다. 이에 따라 주거침입의 기회에 행해진 강제추행 또는 준강제추행의 불법과 책임의 정도가 아무리 경미한 경우라고 하더라도, 다른 법률상 감경사유가 없으면 일률적으로 징역 3년 6월 이상의 중형에처할 수밖에 없게 되어, 형벌개별화의 가능성이 극도로 제한된다. ... 책임과 형벌 간의 비례원칙에 위배된다(헌재 2023. 2. 23. 2021헌가9)."},{"set":8,"num":30,"q":"주거침입강제추행죄 및 주거침입준강제추행죄에 대하여 무기징역 또는 7년 이상의 징역에 처하도록 한 구 성폭력범죄의 처벌 등에 관한 특례법 조항은 주거침입죄와 강제추행ㆍ준강제추행죄는 모두 행위 유형이 매우 다양함에도 그 하한을 ‘징역 7년’으로 정함으로써 책임과 형벌 간의 비례원칙에 위배된다.","src":"2026 법원직","a":true,"exp":"헌재 2023. 2. 23. 2021헌가9"},{"set":8,"num":31,"q":"벌금형에 대한 노역장 유치는 이미 형벌을 받은 사건에 대해 또다시 형을 부과하는 것이 아니라 단순한 형벌 집 행 방법의 변경에 불과한 것이므로 이중처벌금지원칙과 관련이 없다.","src":"2026 법원직","a":true,"exp":"벌금을 납입하지 않는 경우 노역장에 유치하여 작업에 복무하게 함으로써 벌금의 납입을 대체하기 위한 수단이노역장유치제도이다. 이처럼 벌금형에 대한 노역장 유치는 이미 형벌을 받은 사건에 대해 또 다시 형을 부과하는 것이 아니라 단순한 형벌 집행 방법의 변경에 불과한 것이므로 이중처벌금지원칙과는 관련이 없다(헌재 2010. 7. 29. 2008헌바88)."},{"set":8,"num":32,"q":"이행강제금은 과거의 일정한 법률위반 행위에 대한 제제로서의 형벌이 아니라 장래의 의무이행의 확보를 위한 강제수단일 뿐이어서, 범죄에 대한 국가의 형벌권 실행에 해당하지 아니한다.","src":"2026 법원직","a":true,"exp":"헌재 2011. 10. 25. 2009헌바140"},{"set":8,"num":33,"q":"형법상 사회봉사명령 또는 수강명령은 과거의 불법에 대한 책임에 기초하고 있는 제재에 해당하므로 이중처벌금지원칙에서 말하는 ‘처벌’과 본질적인 차이가 있다고 할 수 없다.","src":"2026 법원직","a":false,"exp":"집행유예의 취소 시 부활되는 본형은 집행유예의 선고와 함께 선고되었던 것으로 판결이 확정된 동일한 사건에 대하여 다시 심판한 결과 부과되는 것이 아니므로 일사부재리의 원칙과 무관하고, 사회봉사명령 또는 수강명령은 그 성격, 목적, 이행방식 등에서 형벌과 본질적 차이가 있어 이중처벌금지원칙에서 말하는 ‘처벌’이라 보기 어려우므로, 집행유예가 취소되는 경우 사회봉사 등 의무를 이행하였는지 여부와 관계없이 유예되었던 본형 전부를집행하는 것은 이중처벌금지원칙에 위반되지 아니한다(헌재 2013. 6. 27. 2012헌바345)."},{"set":8,"num":34,"q":"헌법 제13조 제1항의 이중처벌금지원칙은 동일한 범죄에 대하여 대한민국 내에서 거듭 형벌권이 행사되어서는안 된다는 의미이다.","src":"2026 법원직","a":true,"exp":"헌재 2015. 5. 28. 2013헌바129"},{"set":8,"num":35,"q":"외국에서 형의 전부 또는 일부의 집행을 받은 자에 대하여 형을 감경 또는 면제할 수 있도록 한 구 형법 해당 조항은 신체의 자유를 침해하지 않는다.","src":"2024 법원직","a":false,"exp":"외국에서 실제로 형의 집행을 받았음에도 불구하고 우리 형법에 의한 처벌 시 이를 전혀 고려하지 않는다면 신체의 자유에 대한 과도한 제한이 될 수 있으므로 그와 같은 사정은 어느 범위에서든 반드시 반영되어야 하고, 이러한 점에서 입법형성권의 범위는 다소 축소될 수 있다. 입법자는 국가형벌권의 실현과 국민의 기본권 보장의 요 구를 조화시키기 위하여 형을 필요적으로 감면하거나 외국에서 집행된 형의 전부 또는 일부를 필요적으로 산입하는 등의 방법을 선택하여 청구인의 신체의 자유를 덜 침해할 수 있음에도, 이 사건 법률조항과 같이 우리 형법에 의한 처벌 시 외국에서 받은 형의 집행을 전혀 반영하지 아니할 수도 있도록 한 것은 과잉금지원칙에 위배되어 신체의 자유를 침해한다(헌재 2015. 5. 28. 2013헌바129)."},{"set":8,"num":36,"q":"전투경찰순경에 대한 징계처분을 규정하고 있는 구｢전투경찰대 설치법｣의 조항 중 ‘전투경찰순경에 대한 영창’ 부분은 그 사유의 제한, 징계대상자의 출석권과 진술권의 보장 및 법률에 의한 별도의 불복절차가 마련되어 있으므로 헌법 제12조제1항의 적법절차원칙에 위배되지 않는다.","src":"2022 지방직 7급","a":true,"exp":"헌재 2016. 3. 31. 2013헌바190"},{"set":8,"num":37,"q":"헌법 제12조 제1항은 적법절차원칙의 일반조항이고, 제12조 제3항의 적법절차원칙은 기본권 제한 정도가 가장 심한 형사상 강제처분의 영역에서 기본권을 더욱 강하게 보장하려는 의지를 담아 중복 규정된 것이다.","src":"2025 경정승진","a":true,"exp":"헌법 제12조 제1항은 적법절차원칙의 일반조항이고, 제12조 제3항의 적법절차원칙은 기본권 제한 정도가 가장 심한 형사상 강제처분의 영역에서 기본권을 더욱 강하게 보장하려는 의지를 담아 중복 규정된 것이라고 해석함이 상당하다. 따라서 헌법 제12조 제3항의 영장주의는 헌법 제12조 제1항의 적법절차원칙의 특별규정이므로, 헌법상 영장주의원칙에 위배되는 법률조항은 헌법 제12조 제1항의 적법절차원칙에도 위배된다."},{"set":8,"num":38,"q":"형사재판에 계속 중인 사람에 대하여 출국을 금지할 수 있다고 규정한 출입국관리법 조항에 따른 법무부장관의출국금지결정은 형사재판에 계속 중인 국민의 출국의 자유를 제한하는 행정처분일 뿐이고, 영장주의가 적용되는 신체에 대하여 직접적으로 물리적 강제력을 수반하는 강제처분이라고 할 수 없다.","src":"2023 법원직","a":true,"exp":"헌재 2015. 9. 24. 2012헌바302"},{"set":8,"num":39,"q":"헌법 제12조제3항의 영장주의는 법관이 발부한 영장에 의하지 아니하고는 수사에 필요한 강제처분을 하지 못한 다는 원칙으로, 교도소장이 마약류 관련 수형자에게 소변을 받아 제출하도록 한 것은 교도소의 안전과 질서유지 를 위한 것으로 수사에 필요한 처분이 아닐 뿐만 아니라 검사대상자들의 협력이 필수적이어서 강제처분이라고 할 수도 없어 영장주의의 원칙이 적용되지 않는다.","src":"2022 지방직 7급","a":true,"exp":"헌재 2006. 7. 27. 2005헌마277"},{"set":8,"num":40,"q":"행정상 즉시강제는 그 본질상 급박성을 요건으로 하고 있어 법관의 영장을 기다려서는 그 목적을 달성할 수 없어 원칙적으로 영장주의가 적용되지 않는다.","src":"2023 법원직","a":true,"exp":"헌재 2002. 10. 31. 2000헌가12"},{"set":8,"num":41,"q":"행정상 즉시강제는 상대방의 임의이행을 기다릴 시간적 여유가 없을 때 하명 없이 바로 실력을 행사하는 것으로서 특별한 사정이 없는 한 원칙적으로 영장주의가 적용된다고 보아야 할 것이다.","src":"2026 법원직","a":false,"exp":"헌재 2002. 10. 31. 2000헌가12"},{"set":8,"num":42,"q":"헌법 제12조제3항이 영장의 발부에 관하여 ‘검사의 신청’에 의할 것을 규정한 취지는 모든 영장의 발부에 검사의신청이 필요하다는 데에 있는 것이 아니라 수사단계에서 영장의 발부를 신청할 수 있는 자를 검사로 한정함으로써 검사 아닌 다른 수사기관의 영장신청에서 오는 인권유린의 폐해를 방지하고자 함에 있다.","src":"2022 지방직 7급","a":true,"exp":"헌재 1997. 3. 27. 96헌바28"},{"set":8,"num":43,"q":"법원의 구속집행정지결정에 대하여 검사가 즉시항고할 수 있도록 한 ｢형사소송법｣ 조항은 법원의 구속집행정지결정을 무의미하게 할 수 있는 권한을 검사에게 부여한 것이라는 점에서 적법절차원칙에 위배되지만, 영장주의에 위배되는 것은 아니다.","src":"2018 변호사시험","a":false,"exp":"법원이 피고인의 구속 또는 그 유지 여부의 필요성에 관하여 한 재판의 효력이 검사나 다른 기관의 이견이나 불 복이 있다 하여 좌우되거나 제한받는다면 이는 영장주의에 위반된다고 할 것인바, 구속집행정지결정에 대한 검사의 즉시항고를 인정하는 이 사건 법률조항은 검사의 불복을 그 피고인에 대한 구속집행을 정지할 필요가 있다는 법원의 판단보다 우선시킬 뿐만 아니라, 사실상 법원의 구속집행정지결정을 무의미하게 할 수 있는 권한을 검사에게 부여한 것이라는 점에서 헌법 제12조 제3항의 영장주의원칙에 위배된다. 또한 헌법 제12조 제3항의 영장주의는 헌법 제12조 제1항의 적법절차원칙의 특별규정이므로, 헌법상 영장주의원칙에 위배되는 이 사건 법률조항은 헌법 제12조 제1항의 적법절차원칙에도 위배된다(헌재 2012. 6. 27. 2011헌가36)."},{"set":8,"num":44,"q":"구속집행정지는 법원이 직권으로 결정하는 것으로서, 구속집행정지 사유들은 한시적인 경우가 많아 그 시기를 놓치게 되면 피고인에게 집행정지의 의미가 없어지게 된다는 점을 고려하면, 법원의 구속집행정지결정에 대하여 검사가 즉시항고할 수 있도록 한 구 형사소송법 규정은 검사의 즉시항고에 의한 불복을 그 피고인에 대한 구속집행을 정지할 필요가 있다는 법원의 판단보다 우선시킬 뿐만 아니라, 사실상 법원의 구속집행정지결정을 무의미하게 할 수 있는 권한을 검사에게 부여한 것이라는 점에서 영장주의의 본질에 반하여 헌법 제12조 제3항의 영장주의원칙에 위배된다.","src":"2026 법원직","a":true,"exp":"헌재 2012. 6. 27. 2011헌가36"},{"set":8,"num":45,"q":"법원이 피고인의 구속 또는 그 유지 여부의 필요성에 관하여 한 재판의 효력이 검사나 다른 기관의 이견이나 불 복이 있다 하여 좌우되거나 제한받는다면 이는 영장주의에 위반된다.","src":"2025 경정승진","a":true,"exp":"헌재 2012. 6. 27. 2011헌가36"},{"set":8,"num":46,"q":"헌법 제12조제2항은 “모든 국민은 형사상 자기에게 불리한 진술을 강요당하지 아니한다.”라고 하여 진술거부권을보장하였는바, 이러한 진술거부권은 형사절차뿐만 아니라 행정절차나 국회에서의 조사절차에서도 보장된다.","src":"2023 지방직 7급","a":true,"exp":"헌재 2005. 12. 22. 2004헌바25"},{"set":8,"num":47,"q":"변호인의 조력을 받을 권리에 대한 헌법과 법률의 규정 및 취지에 비추어 보면 형사절차가 종료되어 교정시설에수용중인 수형자는 원칙적으로 변호인의 조력을 받을 권리의 주체가 될 수 없다.","src":"2022 국가직 7급","a":true,"exp":"헌재 1998. 8. 27. 96헌마398"},{"set":8,"num":48,"q":"체포 또는 구속된 자와 변호인 등 간의 접견이 실제로 이루어지는 경우에 있어서의 ‘자유로운 접견’은 어떠한 명분으로도 제한될 수 없는 성질의 것이므로 변호인 등과의 접견 자체에 대하여 아무런 제한도 가할 수 없다는 것 을 의미한다.","src":"2022 국가직 7급","a":false,"exp":"헌법재판소가 91헌마111 결정에서 미결수용자와 변호인과의 접견에 대해 어떠한 명분으로도 제한할 수 없다고 한 것은 구속된 자와 변호인 간의 접견이 실제로 이루어지는 경우에 있어서의 ‘자유로운 접견’, 즉 ‘대화내용에 대하여 비밀이 완전히 보장되고 어떠한 제한, 영향, 압력 또는 부당한 간섭 없이 자유롭게 대화할 수 있는 접견’을 제한할 수 없다는 것이지, 변호인과의 접견 자체에 대해 아무런 제한도 가할 수 없다는 것을 의미하는 것 이 아니므로 미결수용자의 변호인 접견권 역시 국가안전보장ㆍ질서유지 또는 공공복리를 위해 필요한 경우에는 법률로써 제한될 수 있음은 당연하다(헌재 2011. 5. 26. 2009헌마341)."},{"set":8,"num":49,"q":"체포적부심사를 청구하고자 하는 피의자의 변호인 접견권은 변호인의 조력을 받을 권리의 필수적 내용이므로, 미결수용자가 체포적부심사를 청구하기 위하여 변호인과 접견하려는 경우 ‘미결수용자의 처우를 위하여 접견이 특 히 필요한 경우’로 보아 접견 시간대 외에도 접견할 수 있도록 하여야 한다. 따라서 토요일 야간에 체포적부심사준비를 위한 변호인 접견신청에 대해 근무시간이 아니며 사전예약을 하지 않았다는 이유로 거부한 것은 헌법에 위반된다.","src":"2026 법원직","a":true,"exp":"헌재 2026. 1. 29. 2023헌마370"},{"set":8,"num":50,"q":"변호인의 조력을 받을 권리는 신체구속을 당한 사람에게 변호인과 사이의 충분한 접견교통을 허용함은 물론 교통내용에 대하여 비밀이 보장되고 부당한 간섭이 없어야 하는 것이며, 이러한 취지는 접견의 경우뿐만 아니라 변호인과 미결수용자 사이의 서신에도 적용된다.","src":"2025 경정승진","a":true,"exp":"헌재 1995. 7. 21. 92헌마144"},{"set":8,"num":51,"q":"헌법 제12조 제4항 본문에 규정된 변호인의 조력을 받을 권리는 형사절차에서 피의자 또는 피고인의 방어권을 보장하기 위한 것으로서 ｢출입국관리법｣상 보호 또는 강제퇴거의 절차에는 적용되지 않는다.","src":"2019 변호사시험","a":false,"exp":"신체의 자유는 그에 대한 제한이 형사절차에서 가해졌든 행정절차에서 가해졌든 간에 보장되어야 하는 자연권적 속성 의 기본권이므로, 신체의 자유가 제한된 절차가 형사절차인지 아닌지는 신체의 자유의 보장 범위와 방법을 정함에 있 어 부차적인 요소에 불과하다. 헌법 제12조 제4항 본문의 문언 및 헌법 제12조의 조문 체계, 변호인 조력권의 속성, 헌법이 신체의 자유를 보장하는 취지를 종합하여 보면 헌법 제12조 제4항 본문에 규정된 “구속”은 사법절차에서 이루어진 구속뿐 아니라, 행정절차에서 이루어진 구속까지 포함하는 개념이다. 따라서 헌법 제12조 제4항 본문에 규정된 변호인의 조력을 받을 권리는 행정절차에서 구속을 당한 사람에게도 즉시 보장된다. ... 종래 이와 견해를 달리하여 헌법 제12조 제4항 본문에 규정된 변호인의 조력을 받을 권리는 형사절차에서 피의자 또는 피고인의 방어권을 보장하기 위한 것으로서 출입국관리법상 보호 또는 강제퇴거의 절차에도 적용된다고 보기 어렵다고 판시한 우리 재판소 결정은, 이 결정 취지와 저촉되는 범위 안에서 변경한다(헌재 2018. 5. 31. 2014헌마346)."},{"set":8,"num":52,"q":"헌법 제12조제4항 본문에 규정된 ‘구속’은 사법절차에서 이루어진 구속뿐 아니라 행정절차에서 이루어진 구속까지 포함하는 개념이므로 헌법 제12조제4항 본문에 규정된 변호인의 조력을 받을 권리는 행정절차에서 구속을 당 한 사람에게도 즉시 보장된다.","src":"2022 국가직 7급","a":true,"exp":"헌재 2018. 5. 31. 2014헌마346"},{"set":8,"num":53,"q":"교도소장이 금지물품 동봉 여부를 확인하기 위하여 미결수용자와 같은 지위에 있는 수형자의 변호인이 위 수형자에게 보낸 서신을 개봉한 후 교부한 행위는 교정사고를 미연에 방지하고 교정시설의 안전과 질서 유지를 위한 것으로, 금지물품이 들어 있는지를 확인하기 위하여 서신을 개봉하는 것만으로는 미결수용자와 같은 지위에 있는 수형자의 변호인의 조력을 받을 권리를 침해하지 않는다.","src":"2023 국가직 7급","a":true,"exp":"헌재 2021. 10. 28. 2019헌마973"},{"set":8,"num":54,"q":"수사서류에 대한 법원의 열람ㆍ등사 허용 결정이 있음에도 검사가 열람ㆍ등사를 거부하는 경우 수사서류 각각에 대하여 검사가 열람ㆍ등사를 거부할 정당한 사유가 있는지를 심사할 필요 없이 그 거부행위 자체로써 청구인의 변호인의 조력을 받을 권리를 침해하는 것이 되고, 이는 법원의 수사서류에 대한 열람ㆍ등사 허용 결정이 있음에도 검사가 해당 서류에 대한 열람만을 허용하고 등사를 거부하는 경우에도 마찬가지이다.","src":"2023 국가직 7급","a":true,"exp":"헌재 2017. 12. 28. 2015헌마632"},{"set":8,"num":55,"q":"법원이 검사의 열람･등사 거부처분에 정당한 사유가 없다고 판단하고 그러한 거부처분이 피고인의 헌법상 기본권을 침해한다는 취지에서 수사서류의 열람･등사를 허용하도록 명한 이상 검사로서는 당연히 법원의 그러한 결정에 지체 없이 따라야 하지만, 별건으로 공소제기되어 확정된 관련 형사사건 기록에 관한 경우에는 이를 따르지 않을 수 있다.","src":"2023 경찰 제1차","a":false,"exp":"법원이 검사의 열람ㆍ등사 거부처분에 정당한 사유가 없다고 판단하고 그러한 거부처분이 피고인의 헌법상 기본권을 침해한다는 취지에서 수사서류의 열람ㆍ등사를 허용하도록 명한 이상, 법치국가와 권력분립의 원칙상 검사로서는 당연히 법원의 그러한 결정에 지체 없이 따라야 하며, 이는 별건으로 공소제기되어 확정된 관련 형사사건 기록에 관한 경우에도 마찬가지이다. 그렇다면 별건으로 공소제기 후 확정되어 검사가 보관하고 있는 서류에 대하여 법원의 열람ㆍ등사 허용 결정이 있었음에도 검사가 청구인에 대한 형사사건과의 관련성을 부정하면서 해당서류의 열람ㆍ등사를 허용하지 아니한 행위는 청구인의 신속하고 공정한 재판을 받을 권리 및 변호인의 조력을 받을 권리를 침해한다(헌재 2022. 6. 30. 2019헌마356)."},{"set":8,"num":56,"q":"누구든지 체포 또는 구속을 당한 때에는 즉시 변호인의 조력을 받을 권리를 가지는데, 헌법은 형사피의자와 형사피고인이 스스로 변호인을 구할 수 없을 때에는 법률이 정하는 바에 의하여 국가가 변호인을 붙인다고 규정하고 있다.","src":"2024 국가직 5급","a":false,"exp":"누구든지 체포 또는 구속을 당한 때에는 즉시 변호인의 조력을 받을 권리를 가진다. 다만, 형사피고인이 스스로 변호인을 구할 수 없을 때에는 법률이 정하는 바에 의하여 국가가 변호인을 붙인다(헌법 제12조 제4항). 따라서형사피의자에게 국가가 변호인을 붙인다는 규정은 없다."},{"set":8,"num":57,"q":"‘변호인이 되려는 자’의 접견교통권은 피의자 등을 조력하기 위한 핵심적인 부분으로서, 피의자 등이 가지는 헌법상의 기본권인 ‘변호인이 되려는 자’와의 접견교통권과 표리의 관계에 있어, 피의자 등이 가지는 ‘변호인이 되려는 자’의 조력을 받을 권리가 실질적으로 확보되기 위해서는 ‘변호인이 되려는 자’의 접견교통권 역시 헌법상 기본권으로서 보장되어야 한다.","src":"2023 국가직 7급","a":true,"exp":"헌재 2019. 2. 28. 2015헌마1204"},{"set":8,"num":58,"q":"수사기관이 피의자신문에 참여한 변호인에게 신문이 시작되기 전에 피의자 후방에 착석할 것을 요구하였다고 하더라도, 변호인으로서는 그 요구에 따를 의무가 없고 그에 따르지 않더라도 어떠한 불이익을 받을 염려가 없으며 실제 피의자를 아무런 제한 없이 조력하였다면, 수사기관의 후방착석요구행위는 변호인의 변호권을 침해한다고 보기 어렵다.","src":"2026 법원직","a":false,"exp":"피의자신문에 참여한 변호인이 피의자 옆에 앉는다고 하여 피의자 뒤에 앉는 경우보다 수사를 방해할 가능성이높아진다거나 수사기밀을 유출할 가능성이 높아진다고 볼 수 없으므로, 이 사건 후방착석요구행위의 목적의 정당성과 수단의 적절성을 인정할 수 없다. 이 사건 후방착석요구행위로 인하여 위축된 피의자가 변호인에게 적극적으로 조언과 상담을 요청할 것을 기대하기 어렵고, 변호인이 피의자의 뒤에 앉게 되면 피의자의 상태를 즉각적으로 파악하거나 수사기관이 피의자에게 제시한 서류 등의 내용을 정확하게 파악하기 어려우므로, 이 사건 후방착석요구행위는 변호인인 청구인의 피의자신문참여권을 과도하게 제한한다. 그런데 이 사건에서 변호인의 수사방해나 수사기밀의 유출에 대한 우려가 없고, 조사실의 장소적 제약 등과 같이 이 사건 후방착석요구행위를 정당화할 그 외의 특별한 사정도 없으므로, 이 사건 후방착석요구행위는 침해의 최소성 요건을 충족하지 못한다. 이 사건 후방착석요구행위로 얻어질 공익보다는 변호인의 피의자신문참여권 제한에 따른 불이익의 정도가 크므로, 법익의 균형성 요건도 충족하지 못한다. 따라서 이 사건 후방착석요구행위는 변호인인 청구인의 변호권을 침해한다(헌재 2017. 11. 30. 2016헌마503)."},{"set":9,"num":1,"q":"변호사의 업무와 관련된 수임사건의 건수 및 수임액은 변호사의 내밀한 개인적 영역에 속하는 것이므로 이를 소속지방변호사회에 보고하도록 한 것은 헌법 제17조의 사생활의 비밀과 자유에 대한 제한에 해당한다.","src":"2021 지방직 7급","a":false,"exp":"변호사의 업무는 다른 어느 직업적 활동보다도 강한 공공성을 내포한다는 점 등을 감안하여 볼 때, 변호사의 업무와 관련된 수임사건의 건수 및 수임액이 변호사의 내밀한 개인적 영역에 속하는 것이라고 보기 어렵다(헌재 2009. 10. 29. 2007헌마667)."},{"set":9,"num":2,"q":"자동차를 도로에서 운전하는 중에 좌석안전띠를 착용할 것인가 여부의 생활관계는 개인의 전체적 인격과 생존에 관계되는 ‘사생활의 기본조건’이라거나 자기결정의 핵심적 영역 또는 인격적 핵심과 관련된다고 보기 어려워 더 이 상 사생활영역의 문제가 아니다.","src":"2025 경정승진","a":true,"exp":"헌재 2003. 10. 30. 2002헌마518"},{"set":9,"num":3,"q":"4급 이상의 공무원의 경우 모든 질병명을 예외 없이 공개토록 하는 것은 입법목적 실현을 위해 필요하기 때문에 해당 공무원들의 헌법 제17조가 보장하는 기본권인 사생활의 비밀과 자유를 침해한다고 보기는 어렵다.","src":"2023 법원직","a":false,"exp":"질병명은 내밀한 사적 영역에 근접하는 민감한 개인정보로서, 이러한 성격의 개인정보를 공개함으로써 사생활의 비밀과 자유를 제한하는 국가적 조치는 엄격한 기준과 방법에 따라 섬세하게 행하여지지 않으면 아니된다. 공적관심의 정도가 약한 4급 이상의 공무원들까지 대상으로 삼아 모든 질병명을 아무런 예외 없이 공개토록 한 것은 사생활의 비밀과 자유를 침해하는 것이다(헌재 2007. 5. 31. 2005헌마1139)."},{"set":9,"num":4,"q":"헌법 제12조 제3항이 정한 영장주의는 수사기관이 강제처분을 함에 있어 중립적 기관인 법원의 허가를 얻는 것뿐만 아니라 법원에 의한 사후 통제까지 마련되어야 함을 의미한다.","src":"2022 법원직","a":false,"exp":"인터넷회선 감청을 허용하는 통신비밀법 조항은 집행 단계 이후 객관적 통제 수단이 제대로 마련되어 있지 않아 청구인의 통신 및 사생활의 비밀과 자유를 침해한다. 그러나 헌법 제12조 제3항이 정한 영장주의가 수사기관이 강제처분을 함에 있어 중립적 기관인 법원의 허가를 얻어야 함을 의미하는 것 외에 법원에 의한 사후 통제까지 마련되어야 함을 의미한다고 보기 어려우므로 영장주의 위반 여부에 대해서는 별도로 판단하지 아니한다(헌재 2018. 8. 30. 2016헌마263)."},{"set":9,"num":5,"q":"사관생도의 모든 사적 생활에서까지 예외 없이 금주의무를 이행할 것을 요구하는 것은 사관생도의 일반적 행동자유권은 물론 사생활의 비밀과 자유를 지나치게 제한하는 것이다.","src":"2021 국가직 7급","a":true,"exp":"대법원 2018. 8. 30. 2016두60591"},{"set":9,"num":6,"q":"개인정보자기결정권의 보호대상이 되는 개인정보는 개인의 내밀한 영역이나 사사(私事)의 영역에 속하는 정보에국한되고 공적 생활에서 형성되었거나 이미 공개된 개인정보는 포함되지 않는다.","src":"2025 경정승진","a":true,"exp":"개인정보자기결정권의 보호대상이 되는 개인정보는 그 개인의 동일성을 식별할 수 있게 하는 일체의 정보라고 할 수 있고, 반드시 개인의 내밀한 영역이나 사사(私事)의 영역에 속하는 정보에 국한되지 않고 공적생활에서 형성되었거나 이미 공개된 개인정보까지 포함한다(헌재 2005.5.26. 99헌마513)."},{"set":9,"num":7,"q":"헌법 제17조의 사생활의 비밀과 자유 및 헌법 제18조의 통신의 자유에 의하여 보장되는 개인정보자기결정권의 보호대상이 되는 개인정보는 개인의 신체, 신념, 사회적 지위, 신분 등과 같이 개인의 사적 영역에 국한된 사항으로서 그 개인의 동일성을 식별할 수 있게 하는 일체의 정보라고 할 수 있다.","src":"2021 국가직 7급","a":false,"exp":"개인정보자기결정권의 보호대상이 되는 개인정보는 개인의 신체, 신념, 사회적 지위, 신분 등과 같이 개인의 인격주체성을 특징짓는 사항으로서 그 개인의 동일성을 식별할 수 있게 하는 일체의 정보라고 할 수 있고, 반드시 개인의 내밀한 영역이나 사사(私事)의 영역에 속하는 정보에 국한되지 않고 공적 생활에서 형성되었거나 이미 공개된 개인정보까지 포함한다(헌재 2005. 7. 21. 2003헌마282)."},{"set":9,"num":8,"q":"야당 소속 후보자 지지 혹은 정부 비판은 정치적 견해로서 개인의 인격주체성을 특징짓는 개인정보에 해당하지만, 그것이 지지 선언 등의 형식으로 공개적으로 이루어진 것이라면 개인정보자기결정권의 보호범위 내에 속하지 않는다.","src":"2021 국가직 7급","a":false,"exp":"개인정보자기결정권의 보호대상이 되는 개인정보는 개인의 신체, 신념, 사회적 지위, 신분 등과 같이 개인의 인격주체성을 특징짓는 사항으로서 그 개인의 동일성을 식별할 수 있게 하는 일체의 정보라고 할 수 있고, 반드시 개인의 내밀한 영역이나 사사(私事)의 영역에 속하는 정보에 국한되지 않고 공적 생활에서 형성되었거나 이미 공개된 개인정보까지 포함한다. 또한 그러한 개인정보를 대상으로 한 조사ㆍ수집ㆍ보관ㆍ처리ㆍ이용 등의 행위는 모두 원칙적으로 개인정보자기결정권에 대한 제한에 해당한다. 이 사건 정보수집 등 행위는 청구인 윤○○, 정○ ○이 과거 야당 후보를 지지하거나 세월호 참사에 대한 정부의 대응을 비판한 의사표시에 관한 정보를 대상으로 한다. 이러한 야당 소속 후보자 지지 혹은 정부 비판은 정치적 견해로서 개인의 인격주체성을 특징짓는 개인정보에 해당하고, 그것이 지지 선언 등의 형식으로 공개적으로 이루어진 것이라고 하더라도 여전히 개인정보자기결정권의 보호범위 내에 속한다. ... 대통령의 지시로 대통령 비서실장, 정무수석비서관, 교육문화수석비서관, 문화체육관광부장관이 야당 소속 후보를 지지하였거나 정부에 비판적 활동을 한 문화예술인이나 단체를 정부의 문화예술 지원사업에서 배제할 목적으로, 청구인들의 정치적 견해에 관한 정보를 수집·보유·이용한 행위는 청구인들의 개인정보자기결정권을 침해한 것이다(헌재 2020. 12. 23. 2017헌마416)."},{"set":9,"num":9,"q":"지문은 그 정보주체를 타인으로부터 식별가능하게 하는 개인정보가 아니므로, 경찰청장이 이를 보관·전산화하여 범죄수사목적에 이용하는 것은 정보주체의 개인정보자기결정권을 제한하는 것이 아니다.","src":"2021 국가직 7급","a":false,"exp":"개인정보자기결정권은 자신에 관한 정보가 언제 누구에게 어느 범위까지 알려지고 또 이용되도록 할 것인지를 그 정보주체가 스스로 결정할 수 있는 권리, 즉 정보주체가 개인정보의 공개와 이용에 관하여 스스로 결정할 권리를말하는바, 개인의 고유성, 동일성을 나타내는 지문은 그 정보주체를 타인으로부터 식별가능하게 하는 개인정보이므로, 시장·군수 또는 구청장이 개인의 지문정보를 수집하고, 경찰청장이 이를 보관·전산화하여 범죄수사목적에 이용하는 것은 모두 개인정보자기결정권을 제한하는 것이다(헌재 2005. 5. 26. 99헌마513)."},{"set":9,"num":10,"q":"변호사 정보 제공 웹사이트 운영자가 변호사들의 개인신상정보를 기반으로 한 인맥지수를 공개하는 서비스를 제공하는 행위는 변호사들의 개인정보에 관한 인격권을 침해한다.","src":"2022 국가직 7급","a":true,"exp":"변호사 정보 제공 웹사이트 운영자가 변호사들의 개인신상정보를 기반으로 변호사들의 ‘인맥지수’를 산출하여 공개하는 서비스를 제공한 경우, 위 인맥지수 서비스 제공행위는 변호사들의 개인정보에 관한 인격권을 침해하는 위법한 것이다. 그러나 변호사 정보 제공 웹사이트 운영자가 대법원 홈페이지에서 제공하는 ‘나의 사건검색’ 서비스를 통해 수집한 사건정보를 이용하여 변호사들의 ‘승소율이나 전문성 지수 등’을 제공하는 서비스를 하 는 행위는 변호사들의 개인정보에 관한 인격권을 침해하는 위법한 행위로 평가할 수 없다(대법원 2011. 9. 2. 2008다42430)."},{"set":9,"num":11,"q":"서울용산경찰서장이 전기통신사업자로부터 위치추적자료를 제공받아 청구인들의 위치를 확인하였거나 확인할 수 있었음에도 불구하고 청구인들의 검거를 위하여 국민건강보험공단으로부터 2년 내지 3년 동안의 요양급여정보를제공받은 것은 청구인들의 개인정보자기결정권에 대한 중대한 침해에 해당한다.","src":"2021 국가직 7급","a":true,"exp":"서울용산경찰서장은 청구인들을 검거하기 위해서 국민건강보험공단에게 청구인들의 요양급여내역을 요청한 것인데, 서울용산경찰서장은 그와 같은 요청을 할 당시 전기통신사업자로부터 위치추적자료를 제공받는 등으로 청구인들의 위치를 확인하였거나 확인할 수 있는 상태였다. 따라서 서울용산경찰서장이 청구인들을 검거하기 위하여 청구인들의 약 2년 또는 3년이라는 장기간의 요양급여내역을 제공받는 것이 불가피하였다고 보기 어렵다. 그렇다면 이 사건 정보제공행위는 침해의 최소성 및 법익의 균형성에 위배되어 청구인들의 개인정보자기결정권을 침해하였다(헌재 2018. 8. 30. 2014헌마368)."},{"set":9,"num":12,"q":"경찰서장이 국민건강보험공단에게 청구인들의 요양급여내역 제공을 요청한 행위는 강제력이 개입되지 않은 임의수사에 해당하므로 이에 응하여 이루어진 정보제공행위에는 영장주의가 적용되지 않는다.","src":"2022 법원직","a":true,"exp":"사실조회행위는 강제력이 개입되지 아니한 임의수사에 해당하므로, 이에 응하여 이루어진 이 사건 정보제공행위에도 영장주의가 적용되지 않는다(헌재 2018. 8. 30. 2014헌마368)."},{"set":9,"num":13,"q":"효율적인 수사와 정보수집의 신속성, 밀행성 등의 필요성을 고려하여 통신자료의 정보주체에게 통신자료 제공 내역을 통지하도록 하는 것이 적절하지 않기 때문에, “수사기관 등이 전기통신사업자에게 통신자료 제공을 요청하면전기통신사업자가 그 요청에 따를 수 있다”고 정한 ｢전기통신사업법｣ 조항이 통신자료 취득에 대한 사후통지절차를 두지 않은 것은 적법절차원칙에 위배되지 않는다.","src":"2023 경찰 제1차","a":false,"exp":"이 사건 법률조항에 의한 통신자료 제공요청이 있는 경우 통신자료의 정보주체인 이용자에게는 통신자료 제공요청이있었다는 점이 사전에 고지되지 아니하며, 전기통신사업자가 수사기관 등에게 통신자료를 제공한 경우에도 이러한 사실이 이용자에게 별도로 통지되지 않는다. 그런데 당사자에 대한 통지는 당사자가 기본권 제한 사실을 확인하고 그 정당성 여부를 다툴 수 있는 전제조건이 된다는 점에서 매우 중요하다. 효율적인 수사와 정보수집의 신속성, 밀행성 등 의 필요성을 고려하여 사전에 정보주체인 이용자에게 그 내역을 통지하도록 하는 것이 적절하지 않다면 수사기관 등이 통신자료를 취득한 이후에 수사 등 정보수집의 목적에 방해가 되지 않는 범위 내에서 통신자료의 취득사실을 이용자에게 통지하는 것이 얼마든지 가능하다. 그럼에도 이 사건 법률조항은 통신자료 취득에 대한 사후통지절차를 두지 않아 적법절차원칙에 위배되어 개인정보자기결정권을 침해한다(헌재 2022. 7. 21. 2016헌마388)."},{"set":9,"num":14,"q":"수사기관 등이 전기통신사업자에게 이용자의 성명 등 통신자료의 열람이나 제출을 요청할 수 있도록 한 ｢전기통신사업법｣ 제83조제3항 중 ‘검사 또는 수사관서의 장(군수사기관의 장을 포함한다), 정보수사기관의 장의 수사, 형의 집행 또는 국가안전보장에 대한 위해방지를 위한 정보수집을 위한 통신자료 제공요청’에 관한 부분은 통신자료 취득에 대한 사후통지절차를 두지 않아 적법절차원칙에 위배된다.","src":"2024 국가직 7급","a":true,"exp":"헌재 2022. 7. 21. 2016헌마388"},{"set":9,"num":15,"q":"헌법상 영장주의는 체포･구속･압수･수색 등 기본권을 제한하는 강제처분에 적용되므로 강제력이 개입되지 않은 임의수사에 해당하는 통신자료 제공 요청에 따른 검사의 통신자료 취득에 영장주의가 적용되지 않는다.","src":"2023 경찰 제1차","a":true,"exp":"헌재 2022. 7. 21. 2016헌마388"},{"set":9,"num":16,"q":"통신비밀보호법(2005. 5. 26. 법률 제7503호로 개정된 것) 제13조 제1항 중 ‘검사 또는 사법경찰관은 수사를 위하여 필요한 경우 전기통신사업법에 의한 전기통신사업자에게 제2조 제11호 가목 내지 라목의 통신사실 확인자료의 열람이나 제출을 요청할 수 있다’는 부분은 과잉금지원칙에 위반되어 개인정보자기결정권과 통신의 자유를 침해한다.","src":"2023 법원직","a":true,"exp":"‘검사 또는 사법경찰관은 수사를 위하여 필요한 경우 전기통신사업법에 의한 전기통신사업자에게 통신사실 확인자료의 열람이나 제출을 요청할 수 있다’고 규정한 통신비밀보호법 조항은 과잉금지원칙에 위반되어 개인정보자기결정권과 통신의 자유를 침해한다(헌재 2018. 6. 28. 2012헌마538)."},{"set":9,"num":17,"q":"기지국 수사를 허용하는 통신사실 확인자료 제공요청은 법원의 허가에 의해 해당 가입자의 동의나 승낙을 얻지아니하고도 제3자인 전기통신사업자에게 해당 가입자에 관한 통신사실 확인자료의 제공을 요청할 수 있도록 하는수사방법이므로 헌법상 영장주의가 적용되지 않는다.","src":"2023 법원직","a":false,"exp":"기지국수사는 통신비밀보호법이 정한 강제처분에 해당되므로 헌법상 영장주의가 적용된다. 헌법상 영장주의의 본 질은 강제처분을 함에 있어 중립적인 법관이 구체적 판단을 거쳐야 한다는 점에 있는바, 이 사건 허가조항은 수사기관이 전기통신사업자에게 통신사실 확인자료 제공을 요청함에 있어 관할 지방법원 또는 지원의 허가를 받도록 규정하고 있으므로 헌법상 영장주의에 위배되지 아니한다(헌재 2018. 6. 28. 2012헌마538)."},{"set":9,"num":18,"q":"기지국 수사를 허용하는 통신사실 확인자료 제공요청은 ｢통신비밀보호법｣이 규정하는 강제처분에 해당하므로, 법관이 발부한 영장에 의하지 않고 관할 지방법원 또는 지원의 허가만 받으면 이를 가능하게 한 것은 영장주의에 위반된다.","src":"2022 변호사시험","a":false,"exp":"기지국수사는 통신비밀보호법이 정한 강제처분에 해당되므로 헌법상 영장주의가 적용된다. 헌법상 영장주의의 본 질은 강제처분을 함에 있어 중립적인 법관이 구체적 판단을 거쳐야 한다는 점에 있는바, 이 사건 허가조항은 수사기관이 전기통신사업자에게 통신사실 확인자료 제공을 요청함에 있어 관할 지방법원 또는 지원의 허가를 받도록 규정하고 있으므로 헌법상 영장주의에 위배되지 아니한다(헌재 2018. 6. 28. 2012헌마538)."},{"set":9,"num":19,"q":"개인별로 주민등록번호를 부여하면서 주민등록번호 변경에 관한 규정을 두고 있지 않은 ｢주민등록법｣ 조항은 주민등록번호 불법 유출 등을 원인으로 자신의 주민등록번호를 변경하고자 하는 사람들의 개인정보자기결정권을 침해하는 것은 아니다.","src":"2025 경정승진","a":false,"exp":"개인별로 주민등록번호를 부여하면서 주민등록번호 변경에 관한 규정을 두고 있지 않은 주민등록법 조항은 개인정보자기결정권을 침해한다(헌재 2015. 12. 23. 2013헌바68)."},{"set":9,"num":20,"q":"‘가족관계의 등록 등에 관한 법률’ 제14조 제1항 본문 중 ‘직계혈족이 제15조에 규정된 증명서 가운데 가족관계증명서 및 기본증명서의 교부를 청구’하는 부분이 가정폭력 피해자의 개인정보를 보호하기 위한 구체적 방안을 마련하지 아니하였다고 하더라도 가정폭력 피해자인 청구인의 개인정보자기결정권을 침해하는 것은 아니다.","src":"2023 법원직","a":false,"exp":"이 사건 법률조항은 주민등록법과는 달리 가정폭력 피해자의 개인정보보호를 위한 별도의 조치를 마련하고 있지 않아서, 가정폭력 가해자는 언제든지 그 자녀 명의의 가족관계증명서 및 기본증명서를 교부받아서 이를 통하여 가정폭력 피해자의 개인정보를 획득할 수 있다. 따라서 가정폭력 가해자인 직계혈족이 그 자녀의 가족관계증명서와 기본증명서의 교부를 청구할 수 있게 규정한 법률조항은 개인정보자기결정권을 침해한다(헌재 2020. 8. 28. 2018헌마927)."},{"set":9,"num":21,"q":"구｢형의 실효 등에 관한 법률｣의 해당 조항이 법원에서 불처분결정된 소년부송치 사건에 대한 수사경력자료의 삭제 및 보존기간에 대하여 규정하지 아니하여 수사경력자료에 기록된 개인정보가 당사자의 사망 시까지 보존되면서 이용되는 것은 당사자의 개인정보자기결정권에 대한 제한에 해당한다.","src":"2021 국가직 7급","a":true,"exp":"이 사건 구법 조항은 법원에서 불처분결정된 소년부송치 사건에 대한 수사경력자료의 삭제와 보존기간에 대하여 규정하지 않아, 해당 수사경력자료는 당사자의 사망 시까지 보존되고 수사경력자료에는 지문정보와 인적사항, 죄 명, 입건관서, 입건일자, 처분결과 등의 정보가 기록된다. 그러므로 이 사건 구법 조항이 법원에서 불처분결정된 소년부송치 사건에 대한 수사경력자료의 삭제 및 보존기간에 대하여 규정하지 아니하여 수사경력자료에 기록된 개인정보가 당사자의 사망 시까지 보존되면서 이용되는 것은 당사자의 개인정보자기결정권에 대한 제한에 해당한다. ... 과잉금지원칙을 위반하여 소년부송치 후 불처분결정을 받은 자의 개인정보자기결정권을 침해한다(헌재 2021. 6. 24. 2018헌가2)."},{"set":9,"num":22,"q":"소년에 대한 수사경력자료의 삭제와 보존기간에 대하여 규정하면서 법원에서 불처분결정된 소년부송치 사건에 대하여 규정하지 않은 구 ‘형의 실효 등에 관한 법률’ 제8조의2 제1항 및 제3항과 ‘형의 실효 등에 관한 법률’ 제8조의2 제1항 및 제3항은 과잉금지원칙에 반하여 개인정보자기결정권을 침해한다.","src":"2023 법원직","a":true,"exp":"법원에서 불처분결정된 소년부송치 사건에 대한 수사경력자료의 보존기간과 삭제에 대한 규정을 두지 않은 것은 과잉금지원칙을 위반하여 소년부송치 후 불처분결정을 받은 자의 개인정보자기결정권을 침해한다(헌재 2021. 6. 24. 2018헌가2)."},{"set":9,"num":23,"q":"보안관찰처분대상자가 교도소 등에서 출소 후 신고한 거주예정지 등 정보에 변동이 생길 때마다 7일 이내 이를 신고하도록 규정한 ｢보안관찰법｣상 변동신고조항 및 위반 시 처벌조항은 청구인의 개인정보자기결정권을 침해하지 않는다.","src":"2023 경찰간부","a":false,"exp":"보안관찰처분대상자는 교도소에서 출소 후 7일 이내에 그 거주예정지 관할경찰서장에게 출소사실을 신고하여야 하고, 이를 위반할 경우 처벌하도록 정한 보안관찰법 조항은 청구인의 사생활의 비밀과 자유 및 개인정보자기결정권을 침해하지 아니한다. 그러나 보안관찰처분대상자는 교도소에서 출소한 후 기존에 신고한 거주예정지에 변동이 있을 때에는 7일 이내에 그 변동된 사항을 관할경찰서장에게 신고하여야 하고, 이를 위반할 경우 처벌하도록 정한 보안관찰법 조항은 과잉금지원칙을 위반하여 청구인의 사생활의 비밀과 자유 및 개인정보자기결정권을 침해한다(헌재 2021. 6. 24. 2017헌바479)."},{"set":9,"num":24,"q":"보안관찰처분대상자가 교도소 등에서 출소한 후 7일 이내에 출소사실을 신고하도록 하고 이를 위반하는 경우 처벌하는 법률조항은 보안관찰처분대상자의 불편이 크다거나 7일의 신고기간이 지나치게 짧다고 할 수 없으므로 개인정보자기결정권을 침해하지 아니한다.","src":"2024 변호사시험","a":true,"exp":"헌재 2021. 6. 24. 2017헌바479"},{"set":9,"num":25,"q":"｢출입국관리법｣에 의한 보호에 있어서 용의자에 대한 긴급보호를 위해 그의 주거에 들어간 것이라면 그 긴급보호가 적법한 이상 주거의 자유를 침해한 것으로 볼 수 없으므로 청구인에 대한 긴급보호가 적법한 이상 그 긴급보호 과정에서 청구인의 주거에 들어갔다고 하더라도 주거의 자유를 침해하였다고 볼 수 없다.","src":"2025 경정승진","a":true,"exp":"헌재 2012. 8. 23. 2008헌마430"},{"set":9,"num":26,"q":"불법체류 중인 외국인은 성질상 인간의 권리에 해당되는 신체의 자유, 주거의 자유, 변호인의 조력을 받을 권리, 재판청구권 등에 대해 주체성이 인정되므로 국가인권위원회의 공정한 조사를 받을 권리도 불법체류 중인 외국인에게 헌법상 인정되는 기본권이다.","src":"2023 경찰 제2차","a":false,"exp":"청구인(외국인)들이 침해받았다고 주장하고 있는 신체의 자유, 주거의 자유, 변호인의 조력을 받을 권리, 재판청구권 등은 성질상 인간의 권리에 해당한다고 볼 수 있으므로, 위 기본권들에 관하여는 청구인들의 기본권 주체성이 인정된다. 그러나 ‘국가인권위원회의 공정한 조사를 받을 권리’는 헌법상 인정되는 기본권이라고 하기 어렵다(헌재 2012. 8. 23. 2008헌마430)."},{"set":9,"num":27,"q":"헌법 제16조 후문은 영장주의에 대한 예외를 명문화하고 있지 않지만, 헌법 제16조의 영장주의에 대해서도 그 예외를 인정하되, 그 장소에 범죄혐의 등을 입증할 자료나 피의자가 존재할 개연성이 소명되고, 사전에 영장을 발부받기 어려운 긴급한 사정이 있는 경우에만 제한적으로 허용될 수 있다고 보는 것이 타당하다.","src":"2025 경정승진","a":true,"exp":"헌재 2018. 4. 26. 2015헌바370"},{"set":9,"num":28,"q":"체포영장을 발부받아 피의자를 체포하는 경우에 필요한 때에는 영장 없이 타인의 주거 등 내에서 피의자 수사를 할 수 있도록 한 형사소송법 조항은 별도로 영장을 발부받기 어려운 긴급한 사정이 있는지 여부를 구별하지 않고 피의자가 소재할 개연성만 소명되면 영장 없이 타인의 주거 등을 수색할 수 있도록 허용하고 있어 헌법 제16조의 영장주의에 위반된다.","src":"2023 법원직","a":true,"exp":"헌재 2018. 4. 26. 2015헌바370"},{"set":9,"num":29,"q":"거주･이전의 자유는 해외여행 및 해외 이주의 자유를 포함하고 있지만, 국적변경의 자유는 그 내용에 포섭되지않는다.","src":"2021 경정승진","a":false,"exp":"거주·이전의 자유는 국가의 간섭없이 자유롭게 거주와 체류지를 정할 수 있는 자유로서 정치·경제·사회·문화 등 모든 생활영역에서 개성신장을 촉진함으로써 헌법상 보장되고 있는 다른 기본권들의 실효성을 증대시켜주는 기능을 한다. 구체적으로는 국내에서 체류지와 거주지를 자유롭게 정할 수 있는 자유영역뿐 아니라 나아가 국외에서 체류지와 거주지를 자유롭게 정할 수 있는 ‘해외여행 및 해외 이주의 자유’를 포함하고 덧붙여 대한민국의 국적을 이탈할 수 있는 ‘국적변경의 자유’ 등도 그 내용에 포섭된다고 보아야 한다(헌재 2004. 10. 28. 2003헌가18)."},{"set":9,"num":30,"q":"서울특별시 서울광장은 생활형성의 거주지나 체류지에 해당하고, 서울광장에 출입하고 통행하는 행위가 그 장소를 중심으로 생활을 형성해 나가는 행위에 속하므로, 경찰청장이 경찰버스들로 서울광장을 둘러싸 통행을 제지하는 행위는 거주․이전의 자유를 제한한다.","src":"2024 법원직","a":false,"exp":"거주·이전의 자유는 거주지나 체류지라고 볼 만한 정도로 생활과 밀접한 연관을 갖는 장소를 선택하고 변경하는 행위를 보호하는 기본권인바, 이 사건에서 서울광장이 청구인들의 생활형성의 중심지인 거주지나 체류지에 해당한다고 할 수 없고, 서울광장에 출입하고 통행하는 행위가 그 장소를 중심으로 생활을 형성해 나가는 행위에 속한다고 볼 수도 없으므로 청구인들의 거주·이전의 자유가 제한되었다고 할 수 없다. (헌재 2011. 6. 30. 2009헌마406)"},{"set":9,"num":31,"q":"법인이 과밀억제권역 내에 본점의 사업용 부동산으로 건축물을 신축하여 이를 취득하는 경우 취득세를 중과세하는 구｢지방세법｣ 해당 조항 본문 중 “본점의 사업용 부동산을 취득하는 경우”에 관한 부분은 인구유입이나 경제력집중 효과에 관한 판단을 전적으로 배제한 것이므로 거주ㆍ이전의 자유를 침해한다.","src":"2024 국가직 7급","a":false,"exp":"이 사건 법률조항은 거주·이전의 자유와 영업의 자유를 침해하지 않는다(헌재 2014. 7. 24. 2012헌바408)."},{"set":9,"num":32,"q":"여권발급 신청인이 북한 고위직 출신의 탈북 인사로서 신변에 대한 위해 우려가 있다는 이유로 신청인의 미국 방문을 위한 여권발급을 거부한 것은 거주ㆍ이전의 자유를 과도하게 제한하는 것으로서 위법하다.","src":"2023 지방직 7급","a":true,"exp":"대법원 2008. 1. 24. 2007두10846"},{"set":9,"num":33,"q":"사생활의 비밀과 자유에 포섭될 수 있는 사적 영역에 속하는 통신의 자유를 헌법이 별개의 조항을 통해 기본권으로 보장하는 이유는 우편이나 전기통신의 운영이 전통적으로 국가독점에서 출발하였기 때문에 개인 간의 의사소통을 전제로 하는 통신은 국가에 의한 침해가능성이 여타의 사적 영역보다 크기 때문이다.","src":"2024 국가직 5급","a":true,"exp":"헌재 2018. 6. 28. 2012헌마538"},{"set":9,"num":34,"q":"헌법 제18조는 통신의 비밀보호를 그 핵심내용으로 하는 통신의 자유를 기본권으로 보장하고 있는데, 자유로운 의사소통은 통신내용의 비밀을 보장하는 것만으로 충분하고 구체적인 통신으로 발생하는 외형적인 사실관계, 특 히 통신관여자의 인적 동일성･통신시간･통신장소･통신횟수 등 통신의 외형을 구성하는 통신 이용의 전반적 상황의 비밀까지도 보장해야 하는 것은 아니다.","src":"2025 경정승진","a":false,"exp":"자유로운 의사소통은 통신내용의 비밀을 보장하는 것만으로는 충분하지 아니하고 구체적인 통신관계의 발생으로야기된 모든 사실관계, 특히 통신관여자의 인적 동일성ㆍ통신장소ㆍ통신횟수ㆍ통신시간 등 통신의 외형을 구성하는 통신이용의 전반적 상황의 비밀까지도 보장한다(헌재 2018. 6. 28. 2012헌마538)."},{"set":9,"num":35,"q":"3인 간의 대화에 있어서 그 중 한 사람이 그 대화를 녹음하는 경우에 다른 두 사람의 발언은 그 녹음자에 대한 관계에서 ‘타인간의 대화’라고 볼 수 없어 이런 녹음은 ｢통신비밀보호법｣ 제3조제1항에 위배되지 않는다.","src":"2023 지방직 7급","a":true,"exp":"대법원 2006. 10. 12. 2006도4981"},{"set":9,"num":36,"q":"통신제한조치기간의 연장을 허가함에 있어 총연장기간 또는 총연장횟수의 제한을 두지 않은 것은, 주요 범죄 내지 국가 안위를 위협하는 음모나 조직화된 집단범죄의 음모가 있는 경우 장기간에 걸친 지속적인 수사가 필요하고 그 증거수집을 위하여 지속적인 통신제한조치가 허용될 필요가 있기 때문이므로, 통신의 자유를 침해하지 않는다.","src":"2023 변호사시험","a":false,"exp":"통신제한조치기간의 연장을 허가함에 있어 총연장기간 또는 총연장횟수의 제한을 두지 아니한 것은 통신의 비밀을 침해한다(헌재 2010. 12. 28. 2009헌가30)."},{"set":9,"num":37,"q":"통신제한조치기간의 연장을 허가함에 있어 총연장기간 또는 총연장횟수의 제한을 두지 아니한 ｢통신비밀보호법｣ 조항은 장기간에 걸친 지속적인 수사가 필요한 경우 그 증거수집을 위하여 지속적인 통신제한조치가 허용될 필요가 있으므로 통신의 비밀을 침해하지 않는다.","src":"2026 국가직 7급","a":false,"exp":"통신제한조치기간의 연장을 허가함에 있어 총연장기간 또는 총연장횟수의 제한을 두지 아니한 것은 통신의 비밀을 침해한다(헌재 2010. 12. 28. 2009헌가30)."},{"set":9,"num":38,"q":"수용자가 내보내려는 모든 서신을 봉함하지 않은 상태로 교정시설에 제출하도록 한 규정은 교정시설의 안전과 질서유지, 수용자의 교화 및 사회복귀를 원활하게 하기 위한 것이므로 수용자의 통신의 자유를 침해하지 않는다.","src":"2016 사법시험","a":false,"exp":"이 사건 시행령조항은 교정시설의 안전과 질서유지, 수용자의 교화 및 사회복귀를 원활하게 하기 위해 수용자가밖으로 내보내는 서신을 봉함하지 않은 상태로 제출하도록 한 것이나, 이와 같은 목적은 교도관이 수용자의 면전에서 서신에 금지물품이 들어 있는지를 확인하고 수용자로 하여금 서신을 봉함하게 하는 방법, 봉함된 상태로 제출된 서신을 ×-ray 검색기 등으로 확인한 후 의심이 있는 경우에만 개봉하여 확인하는 방법, 서신에 대한 검열 이 허용되는 경우에만 무봉함 상태로 제출하도록 하는 방법 등으로도 얼마든지 달성할 수 있다고 할 것인바, 위 시행령 조항이 수용자가 보내려는 모든 서신에 대해 무봉함 상태의 제출을 강제함으로써 수용자의 발송 서신 모두를 사실상 검열 가능한 상태에 놓이도록 하는 것은 기본권 제한의 최소 침해성 요건을 위반하여 수용자인 청구인의 통신비밀의 자유를 침해하는 것이다(헌재 2012.2.23. 2009헌마333)."},{"set":9,"num":39,"q":"교도소장이 구 ｢형의 집행 및 수용자의 처우에 관한 법률 시행령｣ 조항에 근거하여 법원, 검찰청 등이 수용자에 게 보낸 문서를 열람한 행위는 수용자의 통신의 자유를 침해하지 않는다.","src":"2026 국가직 7급","a":true,"exp":""},{"set":9,"num":40,"q":"헌법 제18조로 보장되는 기본권인 통신의 자유란 통신수단을 자유로이 이용하여 의사소통할 권리이다. ‘통신수단의 자유로운 이용’이라 하더라도 자신의 인적 사항을 누구에게도 밝히지 않는 상태로 통신수단을 이용할 자유, 즉통신수단의 익명성 보장은 포함된다고 볼 수 없다.","src":"2023 법원직","a":false,"exp":"헌법 제18조로 보장되는 기본권인 통신의 자유란 통신수단을 자유로이 이용하여 의사소통할 권리이다. ‘통신수단의 자유로운 이용’에는 자신의 인적 사항을 누구에게도 밝히지 않는 상태로 통신수단을 이용할 자유, 즉 통신수단의 익명성 보장도 포함된다. 따라서 휴대전화를 통한 문자·전화·모바일 인터넷 등 통신기능을 사용하고자 하는 자에게 반드시 사전에 본인확인 절차를 거치는 데 동의해야만 이를 사용할 수 있도록 하는 법률조항은 익명으로 통신하고자 하는 청구인들의 통신의 자유를 제한한다(헌재 2019. 9. 26. 2017헌마1209)."},{"set":9,"num":41,"q":"전기통신역무제공에 관한 계약을 체결하는 경우 전기통신사업자로 하여금 가입자에게 본인임을 확인할 수 있는 증서 등을 제시하도록 요구하고 부정가입방지시스템 등을 이용하여 본인인지 여부를 확인하도록 한 ｢전기통신사업법｣ 조항 및 ｢전기통신사업법 시행령｣ 조항은 이동통신서비스에 가입하려는 청구인들의 통신의 비밀을 제한한다.","src":"2022 경찰 제1차","a":false,"exp":"심판대상조항은 휴대전화를 통한 문자·전화·모바일 인터넷 등 통신기능을 사용하고자 하는 자에게 반드시 사전에 본인확인 절차를 거치는 데 동의해야만 이를 사용할 수 있도록 하므로, 익명으로 통신하고자 하는 청구인들의 통신의 자유를 제한한다. 그러나 심판대상조항이 통신의 비밀을 제한하는 것은 아니다. 가입자의 인적사항이라는 정보는 통신의 내용·상황과 관계없는 ‘비 내용적 정보’이며 휴대전화 통신계약 체결 단계에서는 아직 통신수단을 통하여 어떠한 의사소통이 이루어지는 것이 아니므로 통신의 비밀에 대한 제한이 이루어진다고 보기는 어렵기 때문이다. (헌재 2019. 9. 26. 2017헌마1209)"},{"set":9,"num":42,"q":"수용자가 집필한 문서의 내용이 사생활의 비밀 또는 자유를 침해하는 등 우려가 있는 때 교정시설의 장이 문서의 외부반출을 금지하도록 규정한 법률 조항은, 집필문을 창작하거나 표현하는 것을 금지하거나 이에 대한 허가를 요구하는 조항이므로, 제한되는 기본권은 통신의 자유가 아니라 표현의 자유로 보아야 한다.","src":"2022 지방직 7급","a":false,"exp":"청구인은 수용자가 작성한 집필문의 외부반출을 규정한 법률조항에 의해 표현의 자유 또는 예술창작의 자유가제한된다고 주장하나, 심판대상조항은 집필문을 창작하거나 표현하는 것을 금지하거나 이에 대한 허가를 요구하는 조항이 아니라 이미 표현된 집필문을 외부의 특정한 상대방에게 발송할 수 있는지 여부에 대해 규율하는 것이므로, 제한되는 기본권은 헌법 제18조에서 정하고 있는 통신의 자유로 봄이 상당하다(헌재 2016. 5. 26. 2013헌바98)."},{"set":10,"num":1,"q":"양심은 그 대상이나 내용 또는 동기에 의하여 판단되는 것으로, 특히 양심상의 결정이 이성적·합리적인가, 타당한가 또는 법질서나 사회규범·도덕률과 일치하는가 하는 관점이 양심의 존재를 판단하는 기준이 된다.","src":"2019 국가직 7급","a":false,"exp":"양심은 민주적 다수의 사고나 가치관과 일치하는 것이 아니라, 개인적 현상으로서 지극히 주관적인 것이므로 양심은 그 대상이나 내용 또는 동기에 의하여 판단될 수 없으며, 특히 양심상의 결정이 이성적·합리적인가, 타당한가 또는 법질서나 사회규범·도덕률과 일치하는가 하는 관점은 양심의 존재를 판단하는 기준이 될 수 없다(헌재 2018. 6. 28. 2011헌바379)."},{"set":10,"num":2,"q":"내심적 자유, 즉 양심형성의 자유와 양심적 결정의 자유는 내심에 머무르는 한 절대적 자유라고 할 수 있지만, 양심실현의 자유는 타인의 기본권이나 다른 헌법적 질서와 저촉되는 경우 헌법 제37조 제2항에 따라 국가안전보장․질서유지 또는 공공복리를 위하여 법률에 의하여 제한될 수 있는 상대적 자유라고 할 수 있다.","src":"2022 법원직","a":true,"exp":"헌재 2011. 8. 30. 2008헌가22"},{"set":10,"num":3,"q":"헌법이 보장하는 양심의 자유는 정신적인 자유로서, 어떠한 사상ㆍ감정을 가지고 있다고 하더라도 그것이 내심에 머무르는 한 절대적인 자유이므로 제한할 수 없다.","src":"2020 지방직 7급","a":true,"exp":"헌재 1997.11.27. 92헌바28"},{"set":10,"num":4,"q":"보호되어야 할 양심에는 세계관·인생관·주의·신조 등은 물론 널리 개인의 인격형성에 관계되는 내심에 있어서의 가치적·윤리적 판단이나 단순한 사실관계의 확인과 같이 가치적·윤리적 판단이 개입될 여지가 없는 경우까지도 포함될 수 있다..","src":"2024 경찰간부","a":false,"exp":"개인의 인격형성에 관계되는 내심의 가치적ㆍ윤리적 판단이 개입될 여지가 없는 단순한 사실관계의 확인에 불과한 경우에는, 헌법 제19조에 의하여 보호되는 양심에 포함되지 아니한다(헌재 2021. 8. 31. 2020헌마12)."},{"set":10,"num":5,"q":"수범자가 수혜를 스스로 포기하거나 권고를 거부함으로써 법질서와 충돌하지 아니한 채 자신의 양심을 유지, 보존하는 경우에도 양심 변경에 대한 강요로서 양심의 자유 침해가 된다.","src":"2023 국가직 5급","a":false,"exp":"양심의 자유는 내심에서 우러나오는 윤리적 확신과 이에 반하는 외부적 법질서의 요구가 서로 회피할 수 없는 상태로 충돌할 때에만 침해될 수 있다. 그러므로 당해 실정법이 특정의 행위를 금지하거나 명령하는 것이 아니라 단지 특별한 혜택을 부여하거나 권고 내지 허용하고 있는 데에 불과하다면, 수범자는 수혜를 스스로 포기하거나 권고를 거부함으로써 법질서와 충돌하지 아니한 채 자신의 양심을 유지, 보존할 수 있으므로 양심의 자유에 대한 침해가 된다 할 수 없다(헌재 2002. 4. 25. 98헌마425)."},{"set":10,"num":6,"q":"누구라도 자신이 비행을 저질렀다고 믿지 않는 자에게 본심에 반하여 사죄 내지 사과를 강요한다면 이는 윤리적･도의적 판단을 강요하는 것으로서 양심의 자유를 침해하는 행위에 해당하므로, 사업자단체의 ｢독점규제 및 공정거래에 관한 법률｣ 위반행위가 있을 때 공정거래위원회가 당해 사업자단체에 대하여 ‘법위반사실의 공표’를 명할 수 있도록 하는 법률조항은 양심의 자유를 침해한다.","src":"2022 법원직","a":false,"exp":"단순한 사실관계의 확인과 같이 가치적･윤리적 판단이 개입될 여지가 없는 경우는 물론, 법률해석에 관하여 여러 견해가 갈리는 경우처럼 다소의 가치관련성을 가진다고 하더라도 개인의 인격형성과는 관계가 없는 사사로운 사유나 의견 등은 양심의 자유의 보호대상이 아니라고 할 것이다. 이 사건의 경우와 같이 경제규제법적 성격을 가진 공정거래법에 위반하였는지 여부에 있어서도 각 개인의 소신에 따라 어느 정도의 가치판단이 개입될 수 있는소지가 있고 그 한도에서 다소의 윤리적 도덕적 관련성을 가질 수도 있겠으나, 이러한 법률판단의 문제는 개인의 인격형성과는 무관하며, 대화와 토론을 통하여 가장 합리적인 것으로 그 내용이 동화되거나 수렴될 수 있는 포용성을 가지는 분야에 속한다고 할 것이므로 헌법 제19조에 의하여 보장되는 양심의 영역에 포함되지 아니한다고 봄이 상당하다. 따라서 이 사건 법률조항의 경우 사죄 내지 사과를 강요함으로 인하여 발생하는 양심의 자유의침해문제는 발생하지 않는다(헌재 2002. 1. 31. 2001헌바43)."},{"set":10,"num":7,"q":"양심적 병역거부는 실상 당사자의 양심에 따른 혹은 양심을 이유로 한 병역거부를 가리키는 것이며 병역거부가 도덕적이고 정당하다는 의미도 갖는다.","src":"2024 경찰간부","a":false,"exp":"‘양심적’ 병역거부는 당사자의 ‘양심에 따른’ 혹은 ‘양심을 이유로 한’ 병역거부를 가리키는 것일 뿐이지 병역거부가 ‘도덕적이고 정당하다’는 의미는 아니므로, ‘양심적’ 병역거부라는 용어를 사용한다고 하여 병역의무이행은 ‘비양심적’이 된다거나, 병역을 이행하는 거의 대부분의 병역의무자들과 병역의무이행이 국민의 숭고한 의무라고 생각하는 대다수 국민들이 ‘비양심적’인 사람들이 되는 것은 결코 아니다(헌재 2018. 6. 28. 2011헌바379)."},{"set":10,"num":8,"q":"대체복무제를 도입함으로써 병역자원을 확보하고 병역부담의 형평을 기할 수 있음에도 불구하고, 양심적 병역거부자에 대한 처벌의 예외를 인정하지 않고 일률적으로 형벌을 부과하는 처벌조항은 양심적 병역거부자의 양심의 자유를 침해한다.","src":"2019 변호사시험","a":false,"exp":"양심적 병역거부자에 대한 처벌은 대체복무제를 규정하지 아니한 병역종류조항의 입법상 불비와 양심적 병역거부는 처벌 조항의 ‘정당한 사유’에 해당하지 않는다는 법원의 해석이 결합되어 발생한 문제일 뿐, 처벌조항 자체에서 비롯된 문제가 아니다. 이는 병역종류조항에 대한 헌법불합치 결정과 그에 따른 입법부의 개선입법 및 법원의 후속 조치를 통하여 해결될 수 있는 문제이다. 따라서 처벌조항은 정당한 사유 없이 병역의무를 거부하는병역기피자를 처벌하는 조항으로서, 과잉금지원칙을 위반하여 양심적 병역거부자의 양심의 자유를 침해한다고 볼 수는 없다(헌재 2018. 6. 28. 2011헌바379)."},{"set":10,"num":9,"q":"신앙의 자유는 신과 피안 또는 내세에 대한 인간의 내적 확신에 대한 자유를 말하는 것으로서 이러한 신앙의 자유는 그 자체가 내심의 자유의 핵심이기 때문에 법률로써도 이를 침해할 수 없다.","src":"2024 법원직","a":true,"exp":"헌재 2011. 12. 29. 2009헌마527"},{"set":10,"num":10,"q":"헌법 제20조제1항에 근거한 종교전파의 자유는 국민에게 그가 선택한 임의의 장소에서 이를 자유롭게 행사할 수 있는 권리까지 보장한다.","src":"2021 지방직 7급","a":false,"exp":"종교전파의 자유는 국민에게 그가 선택한 임의의 장소에서 자유롭게 행사할 수 있는 권리까지 보장한다고 할 수 없으며, 그 임의의 장소가 대한민국의 주권이 미치지 아니하는 지역 나아가 국가에 의한 국민의 생명·신체 및 재산의 보호가 강력히 요구되는 해외 위난지역인 경우에는 더욱 그러하다(헌재 2008. 6. 26. 2007헌마1366)."},{"set":10,"num":11,"q":"육군훈련소장이 청구인들로 하여금 육군훈련소 내 종교행사에 참석하도록 한 종교행사 참석조치는 육군훈련소장이우월적 지위에서 청구인들에게 일방적으로 강제된 행위로, 헌법소원심판의 대상이 되는 권력적 사실행위에 해당한다.","src":"2025 법원직","a":true,"exp":"헌재 2022. 11. 24. 2019헌마941"},{"set":10,"num":12,"q":"육군훈련소장이 훈련병에게 개신교, 불교, 천주교, 원불교 종교행사 중 하나에 참석하도록 한 것은 국가가 종교를군사력 강화라는 목적을 달성하기 위한 수단으로 전락시키거나, 반대로 종교단체가 군대라는 국가권력에 개입하여 선교행위를 하는 등 영향력을 행사할 수 있는 기회를 제공하므로, 국가와 종교의 밀접한 결합을 초래한다는 점에서 헌법상 정교분리원칙에 위배된다.","src":"2023 경찰 제1차","a":true,"exp":"육군훈련소장이 청구인들에 대하여 육군훈련소 내 종교 시설에서 개최되는 개신교, 불교, 천주교, 원불교 종교행사 중 하나에 참석하도록 한 행위는 정교분리원칙에 위배되고, 과잉금지원칙에 위배되어 청구인들의 종교의 자유를 침해한다(헌재 2022. 11. 24. 2019헌마941)."},{"set":10,"num":13,"q":"국가의 종교적 중립성은 종교의 자유를 온전히 실현하기 위하여도 필요하지만, 국가가 특정한 종교를 장려하는 것이 다른 종교 또는 무종교의 자유에 대한 침해가 되지는 아니한다.","src":"2025 법원직","a":false,"exp":"국가의 종교적 중립성은 종교의 자유를 온전히 실현하기 위하여도 필요한데, 국가가 특정한 종교를 장려하는 것 은 다른 종교 또는 무종교의 자유에 대한 침해가 될 수 있다(헌재 2022. 11. 24. 2019헌마941)."},{"set":10,"num":14,"q":"종교의 자유에는 종교에 대한 적극적인 우대조치를 요구할 권리가 포함되어 있지만 특정 종교에 한정된 적극적인우대조치는 정교분리에 위배될 수 있기 때문에 허용되지 않는다.","src":"2025 지방직 7급","a":false,"exp":"종교의 자유에서 종교에 대한 적극적인 우대조치를 요구할 권리가 직접 도출되거나 우대할 국가의 의무가 발생하지 아니한다(헌재 2010. 2. 25. 2007헌바131)."},{"set":10,"num":15,"q":"연 2회 실시하는 간호조무사 국가시험의 시행일시를 모두 토요일 일몰 전으로 정하여 특정 종교의 교인들로 하여금 안식일에 관한 교리를 위반하도록 하거나 토요일 응시에 제한을 받도록 하는 것은, 두 번의 시험 중 적어도 한 번은 토요일이 아닌 날 시행할 수 있는 등 다른 방법을 고려할 수 있으므로, 과잉금지원칙에 반하여 종교의 자유를 침해한다.","src":"2024 법원직","a":false,"exp":"연 2회 실시하는 2021년도 간호조무사 국가시험의 시행일시를 모두 토요일 일몰 전으로 정한 ‘2021년도 간호조무사 국가시험 시행계획 공고’는 제칠일안식일예수재림교 신자의 종교의 자유를 침해하지 아니한다(헌재 2023. 6. 29. 2021헌마171)."},{"set":10,"num":16,"q":"헌법 제31조제4항이 규정하는 교육의 자주성 및 대학의 자율성은 대학에 부여된 헌법상 기본권인 대학의 자율권이므로, 국립대학도 이러한 대학의 자율권의 주체로서 헌법소원심판의 청구인능력이 인정된다.","src":"2017 지방직 7급","a":true,"exp":"헌재 2015. 12. 23. 2014헌마1149"},{"set":10,"num":17,"q":"대학의 자율성은 대학에게 부여된 헌법상 기본권이나, 교수나 교수회는 그 주체가 될 수 없으므로 교수나 교수회가 청구한 헌법재판소법 제68조 제1항의 헌법소원심판은 기본권침해의 자기관련성이 인정되지 아니한다.","src":"2024 법원직","a":false,"exp":"대학의 자치의 주체를 기본적으로 대학으로 본다고 하더라도 교수나 교수회의 주체성이 부정된다고 볼 수는 없 고, 가령 학문의 자유를 침해하는 대학의 장에 대한 관계에서는 교수나 교수회가 주체가 될 수 있고, 또한 국가에 의한 침해에 있어서는 대학 자체 외에도 대학 전구성원이 자율성을 갖는 경우도 있을 것이므로 문제되는 경우에 따라서 대학, 교수, 교수회 모두가 단독, 혹은 중첩적으로 주체가 될 수 있다고 보아야 할 것이다(헌재 2006. 4. 27. 2005헌마1047)."},{"set":10,"num":18,"q":"대학의 자율의 구체적인 내용은 법률이 정하는 바에 의하여 보장되며, 국가는 헌법 제31조 제6항에 따라 모든 학교제도의 조직·계획·운영·감독에 관한 포괄적인 권한을 부여받지만, 대학의 자율성 보장은 대학자치의 본질이므로 대학의 자율에 대한 침해 여부를 심사함에 있어서는 엄격한 과잉금지원칙을 적용하여야 한다.","src":"2018 변호사시험","a":false,"exp":"대학의 자율의 구체적인 내용은 법률이 정하는 바에 의하여 보장되며, 또한 국가는 헌법 제31조 제6항에 따라 모든 학교제도의 조직, 계획, 운영, 감독에 관한 포괄적인 권한 즉, 학교제도에 관한 전반적인 형성권과 규율권을 부여받았다고 할 수 있으므로 교육의 본질을 침해하지 않는 한 궁극적으로는 입법권자의 형성의 자유에 속하는 것이라 할 수 있다. 따라서 교육공무원법이 대학의 자유를 제한하고 있다고 하더라도 그 위헌 여부는 입법자가 기본권을 제한함에 있어 헌법 제37조 제2항에 의한 합리적인 입법한계를 벗어나 자의적으로 그 본질적 내용을 침해하였는지 여부에 따라 판단되어야 할 것이다(헌재 2006. 4. 27. 2005헌마1047). 법학전문대학원 인가주의 및 총정원주의를 규정한 법률조항은 학위과정의 설치‧운영에 관한 대학의 자율권을 제한하고 있으므로 이를제한함에는 헌법 제37조 제2항의 과잉금지 원칙을 준수하여야 할 것이다. 한편, 입법자는 일정한 전문분야에 관 한 자격제도를 마련함에 있어 광범위한 입법재량을 가지고 있으므로, 이 사건 법률조항의 위헌성을 판단함에 있 어 헌법 제37조 제2항의 요구는 다소 완화된다(헌재 2009. 2. 26. 2008헌마370)."},{"set":10,"num":19,"q":"대학의 자율성에 대한 침해 여부를 심사함에 있어서는 대학의 자치보장을 위하여 엄격한 심사를 하여야 하므로, 입법자가 입법형성의 한계를 넘는 자의적인 입법을 하였는지 여부만을 판단하여서는 아니된다.","src":"2023 지방직 7급","a":false,"exp":"대학의 자율성의 구체적인 내용은 법률이 정하는 바에 의하여 보장되고, 국가는 헌법 제31조 제6항에 따라 모든 학교제도의 조직⋅계획⋅운영⋅감독에 관한 포괄적인 권한, 즉 학교제도에 관한 전반적인 형성권과 규율권을 부여받는다. 다만 그 규율의 정도는 그 시대와 각급 학교의 사정에 따라 다를 수밖에 없으므로 교육의 본질을 침해하지 않는 한 궁극적으로는 입법권자의 형성의 자유에 속한다. 따라서 대학의 자율성에 대한 침해 여부를 심사함에 있어서는 입법자가 입법형성의 한계를 넘는 자의적인 입법을 하였는지 여부를 판단하여야 한다(헌재 2015. 11. 26. 2012헌바300)."},{"set":10,"num":20,"q":"정보통신망 이용촉진 및 정보보호 등에 관한 법률 해당 벌칙 조항의 “음란”이란 인간존엄 내지 인간성을 왜곡하는노골적이고 적나라한 성표현으로서 오로지 성적 흥미에만 호소할 뿐 전체적으로 보아 하등의 문학적, 예술적, 과학적 또는 정치적 가치를 지니지 않은 것으로서, 사회의 건전한 성도덕을 크게 해칠 뿐만 아니라 사상의 경쟁메커니즘에 의해서도 그 해악이 해소되기 어려우므로, 음란표현은 헌법 제21조가 규정하는 언론․출판의 자유의 보호영역에 해당하지 아니한다.","src":"2024 법원직","a":false,"exp":"음란표현도 헌법 제21조가 규정하는 언론·출판의 자유의 보호영역에는 해당하되, 다만 헌법 제37조 제2항에 따 라 국가 안전보장·질서유지 또는 공공복리를 위하여 제한할 수 있는 것이라고 해석하여야 할 것이다(헌재 2009. 5. 28. 2006헌바109)."},{"set":10,"num":21,"q":"상업광고도 표현의 자유의 보호영역에 속하는 것이므로 상업광고 규제에 관한 비례의 원칙 심사에 있어서 피해의 최소성 원칙에서는 같은 목적을 달성하기 위하여 달리 덜 제약적인 수단이 없을 것인지 혹은 입법목적을 달성하기 위하여 필요한 최소한의 제한인지를 심사한다.","src":"2017 국가직 7급","a":false,"exp":"상업광고는 표현의 자유의 보호영역에 속하지만 사상이나 지식에 관한 정치적, 시민적 표현행위와는 차이가 있 고, 한편 직업수행의 자유의 보호영역에 속하지만 인격발현과 개성신장에 미치는 효과가 중대한 것은 아니다. 그러므로 상업광고 규제에 관한 비례의 원칙 심사에 있어서 ‘피해의 최소성’ 원칙은 같은 목적을 달성하기 위하여 달리 덜 제약적인 수단이 없을 것인지 혹은 입법목적을 달성하기 위하여 필요한 최소한의 제한인지를 심사하기 보다는 ‘입법목적을 달성하기 위하여 필요한 범위 내의 것인지’를 심사하는 정도로 완화되는 것이 상당하다(헌재 2005. 10. 27. 2003헌가3)."},{"set":10,"num":22,"q":"방송의 자유는 헌법 제21조 제1항 및 제3항에서 도출되는 것으로서, 주관적인 자유권으로서의 특성을 가질 뿐 아니라 다양한 정보와 견해의 교환을 가능하게 함으로써 민주주의의 존립·발전을 위한 기초가 되는 언론의 자유의 실질적 보장에 기여한다는 특성을 가지고 있다.","src":"2025 법원직","a":true,"exp":"헌재 2003. 12. 18. 2002헌바49"},{"set":10,"num":23,"q":"일간신문의 지배주주가 뉴스통신 법인의 주식 또는 지분의 2분의1 이상을 취득 또는 소유하지 못하도록 함으로써이종 미디어 간의 결합을 규제하는 ｢신문법｣ 조항은 언론의 다양성을 보장하기 위한 필요한 한도 내의 제한이라고 할 것이어서 신문의 자유를 침해한다고 할 수 없다.","src":"2022 국가직 7급","a":true,"exp":"헌재 2006. 6. 29. 2005헌마165"},{"set":10,"num":24,"q":"국민은 헌법상 보장된 알권리의 한 내용으로서 국회에 대하여 입법과정의 공개를 요구할 권리를 가지며, 국회의 의사에 대하여는 직접적인 이해관계 유무와 상관없이 일반적 정보공개청구권을 가진다고 할 수 있다.","src":"2022 지방직 7급","a":true,"exp":"헌재 2009. 9. 24. 2007헌바17"},{"set":10,"num":25,"q":"국회 정보위원회의 모든 회의는 실질적으로 국가기밀에 관한 사항과 직․간접적으로 관련되어 있으므로 국가안전보장 을 위하여 회의 일체를 비공개로 하더라도 정보취득의 제한을 이유로 알권리에 대한 침해로 볼 수는 없다.","src":"2022 지방직 7급","a":false,"exp":"헌법 제50조 제1항 단서가 정하고 있는 회의의 비공개를 위한 절차나 사유는 그 문언이 매우 구체적이어서, 이 에 대한 예외도 엄격하게 인정되어야 한다. 따라서 헌법 제50조 제1항으로부터 일체의 공개를 불허하는 절대적인 비공개가 허용된다고 볼 수는 없는바, 특정한 내용의 국회의 회의나 특정 위원회의 회의를 일률적으로 비공개한다고 정하면서 공개의 여지를 차단하는 것은 헌법 제50조 제1항에 부합하지 아니한다. 따라서 정보위원회 회의는 공개하지 아니한다고 정하고 있는 국회법 조항은 의사공개원칙에 위배되어 청구인들의 알 권리를 침해한다 (헌재 2022. 1. 27. 2018헌마1162)."},{"set":10,"num":26,"q":"변호사시험 성적을 합격자에게 공개하지 않도록 규정한 구 변호사시험법 해당 조항은 알 권리(정보공개청구권)를 침해한다.","src":"2024 법원직","a":true,"exp":"변호사시험 성적 비공개를 통하여 법학전문대학원 간의 과다경쟁 및 서열화를 방지하기 위한 심판대상조항의 입법목적은 정당하다. 그러나 변호사시험 성적 비공개로 인하여 변호사시험 합격자의 능력을 평가할 수 있는 객관적인 자료가 없어서 오히려 대학의 서열에 따라 합격자를 평가하게 되어 대학의 서열화는 더욱 고착화된다. 따라서 변호사시험 성적의 비공개는 기존 대학의 서열화를 고착시키는 등의 부작용을 낳고 있으므로 수단의 적절성이 인정되지 않는다. ... 따라서 심판대상조항은 과잉금지원칙에 위배하여 청구인들의 알 권리를 침해한다(헌재 2015. 6. 25. 2011헌마769)."},{"set":10,"num":27,"q":"변호사시험성적 공개청구기간을 ｢변호사시험법｣ 시행일부터 6개월 내로 제한하는 동법 부칙조항은 청구인의 정보공개청구권을 침해한다.","src":"2024 경찰간부","a":true,"exp":"헌재 2019. 7. 25. 2017헌마1329"},{"set":10,"num":28,"q":"회계보고된 자료의 열람기간을 3월간으로 제한한 구 정치자금법 해당 조항은, 국민들의 회계자료에 대한 접근권을 본질적으로 침해한다고 보기 어려우므로 알 권리를 침해하지 않는다.","src":"2024 법원직","a":false,"exp":"정치자금의 지출 내역 등은 정치인이 어떻게 활동하는지 보여주는 핵심적 지표로서 유력한 평가자료가 되므로 국민들이 필요로 하는 만큼의 자료를 제공할 필요가 있다. 따라서 국민의 정치자금 자료에 대한 접근 제한은 필 요 최소한으로 이루어져야 한다. ... 정치자금법에 따라 회계보고된 자료의 열람기간을 3월간으로 제한한 정치자금법 조항은 과잉금지원칙에 위배되어 알권리를 침해한다(헌재 2021. 5. 27. 2018헌마1168)."},{"set":10,"num":29,"q":"헌법 제21조 제1항과 제2항은 모든 국민은 언론·출판의 자유를 가지며, 언론·출판에 대한 허가나 검열은 인정되지 아니한다고 규정하고 있으므로, 검열을 수단으로 한 제한은 국가안전보장·질서유지 또는 공공복리를 위하여 필요한 경우에 한하여 법률로써 하는 경우에만 허용될 수 있다.","src":"2020 법원직","a":false,"exp":"헌법 제21조 제2항이 언론·출판에 대한 검열금지를 규정한 것은 비록 헌법 제37조 제2항이 국민의 자유와 권리를 국가안전보장·질서유지 또는 공공복리를 위하여 필요한 경우에 한하여 법률로써 제한할 수 있도록 규정하고 있다고 할지라도 언론·출판에 대하여는 검열을 수단으로 한 제한만은 법률로써도 허용되지 아니한다는 것을 밝힌 것이다. (헌재 1996. 10. 4. 93헌가13 등)"},{"set":10,"num":30,"q":"사전검열금지원칙은 의사표현의 발표 여부가 오로지 행정권의 허가에 달려있는 사전심사만을 금지하는 것이 아니라 모든 형태의 사전적인 규제를 금지하는 것이다.","src":"2021 변호사시험","a":false,"exp":"헌법 제21조 제2항에서 규정한 검열 금지의 원칙은 모든 형태의 사전적인 규제를 금지하는 것이 아니고 단지 의사표현의 발표 여부가 오로지 행정권의 허가에 달려있는 사전심사만을 금지하는 것을 뜻하므로, 이 사건 법률조항에 의한 방영금지가처분은 행정권에 의한 사전심사나 금지처분이 아니라 개별 당사자간의 분쟁에 관하여 사법부가 사법절차에 의하여 심리, 결정하는 것이어서 헌법에서 금지하는 사전검열에 해당하지 아니한다(헌재 2001. 8. 30. 2000헌바36)."},{"set":10,"num":31,"q":"헌법 제21조제2항이 금지하는 검열은 사전검열만을 의미하므로 개인이 정보와 사상을 발표하기 이전에 국가기관이 미리 그 내용을 심사ㆍ선별하여 일정한 범위 내에서 발표를 저지하는 것만을 의미하고, 헌법상 보호되지 않는 의사 표현에 대하여 공개한 뒤에 국가기관이 간섭하는 것을 금지하는 것은 아니다.","src":"2025 국가직 5급","a":true,"exp":"헌재 1996. 10. 4. 93헌가13"},{"set":10,"num":32,"q":"의료기기에 대한 광고는 표현의 자유의 보호를 받는 대상이 되지만, 사상이나 지식에 관한 정치적, 시민적 표현행위와는 달리 인격발현과 개성신장에 미치는 효과가 중대하지 아니하므로, 사전검열금지원칙의 적용 대상에서 제외된다.","src":"2024 법원직","a":false,"exp":"현행 헌법상 사전검열은 표현의 자유 보호대상이면 예외 없이 금지된다. 의료기기에 대한 광고는 의료기기의 성능이나 효능 및 효과 또는 그 원리 등에 관한 정보를 널리 알려 해당 의료기기의 소비를 촉진시키기 위한 상업광고로서 헌법 제21조 제1항의 표현의 자유의 보호대상이 됨과 동시에 같은 조 제2항의 사전검열금지원칙의 적용대상이 된다(헌재 2020. 8. 28. 2017헌가35)."},{"set":10,"num":33,"q":"건강기능식품의 기능성 광고는 인체의 구조 및 기능에 대하여 보건용도에 유용한 효과를 준다는 기능성 등에 관 한 정보를 널리 알려 해당 건강기능식품의 소비를 촉진시키기 위한 상업광고에 불과하므로 헌법 제21조제2항의 사전검열 금지 대상이 아니다.","src":"2024 국가직 7급","a":false,"exp":"현행 헌법상 사전검열은 표현의 자유 보호대상이면 예외 없이 금지된다. 건강기능식품의 기능성 광고는 인체의 구조 및 기능에 대하여 보건용도에 유용한 효과를 준다는 기능성 등에 관한 정보를 널리 알려 해당 건강기능식품의 소비를 촉진시키기 위한 상업광고이지만, 헌법 제21조 제1항의 표현의 자유의 보호 대상이 됨과 동시에 같 은 조 제2항의 사전검열 금지 대상도 된다(헌재 2018. 6. 28. 2016헌가8)."},{"set":10,"num":34,"q":"광고의 심의기관이 행정기관인지 여부는 기관의 형식에 의하기보다는 그 실질에 따라 판단되어야 하지만, 행정기관이 자의로 민간심의기구의 심의업무에 개입할 가능성이 열려 있다는 개입 가능성의 존재 자체만으로 헌법이 금지하는 사전검열에 해당한다고 볼 수 없다.","src":"2025 경정승진","a":false,"exp":"광고의 심의기관이 행정기관인지 여부는 기관의 형식에 의하기보다는 그 실질에 따라 판단되어야 하고, 행정기관의 자의로 민간심의기구의 심의업무에 개입할 가능성이 열려 있다면 개입 가능성의 존재 자체로 ｢헌법｣이 금지하는 사전검열이라고 보아야 한다(헌재 2018. 6. 28. 2016헌가8)."},{"set":10,"num":35,"q":"｢신문 등의 진흥에 관한 법률｣의 등록조항은 인터넷신문의 명칭, 발행인과 편집인의 인적사항 등 인터넷신문의 외형적이고 객관적 사항을 제한적으로 등록하도록 하고 있는 바, 이는 인터넷신문에 대한 인적 요건의 규제 및 확인에 관 한 것으로 인터넷신문의 내용을 심사ㆍ선별하여 사전에 통제하기 위한 규정으로 사전허가금지원칙에 위배된다.","src":"2020 지방직 7급","a":false,"exp":"등록조항은 인터넷신문의 명칭, 발행인과 편집인의 인적사항 등 인터넷신문의 외형적이고 객관적 사항을 제한적으로 등록하도록 하고 있고, 고용조항 및 확인조항은 5인 이상 취재 및 편집 인력을 고용하되, 그 확인을 위해 등록 시 서류를 제출하도록 하고 있다. 이런 조항들은 인터넷신문에 대한 인적 요건의 규제 및 확인에 관한 것으로, 인터넷신문의 내용을 심사·선별하여 사전에 통제하기 위한 규정이 아님이 명백하다. 따라서 등록조항은 사전허가금지원칙에도 위배되지 않는다(헌재 2016. 10. 27. 2015헌마1206)."},{"set":10,"num":36,"q":"인터넷언론사는 선거운동기간 중 당해 홈페이지 게시판 등에 정당․후보자에 대한 지지․반대 등의 정보를 게시하는경우 실명을 확인받는 기술적 조치를 하도록 정하고, 실명확인을 위한 기술적 조치를 하지 아니하거나 실명인증의 표시가 없는 정보를 삭제하지 않는 경우 과태료를 부과하도록 한 규정은, 선거운동기간 중 무책임하게 선거의공정성이 훼손되는 것을 방지하기 위한 필요최소한의 조치이므로, 과잉금지원칙에 반하여 인터넷언론사 홈페이지 게시판 등 이용자의 익명표현의 자유를 침해한다고 볼 수 없다.","src":"2024 법원직","a":false,"exp":"인터넷언론사는 선거운동기간 중 당해 홈페이지 게시판 등에 정당ㆍ후보자에 대한 지지ㆍ반대 등의 정보를 게시하는 경우 실명을 확인받는 기술적 조치를 하도록 정한 공직선거법 조항과 행정안전부장관 및 신용정보업자는실명인증자료를 관리하고 중앙선거관리위원회가 요구하는 경우 지체 없이 그 자료를 제출해야 하며, 실명확인을 위한 기술적 조치를 하지 아니하거나 실명인증의 표시가 없는 정보를 삭제하지 않는 경우 과태료를 부과하도록 정한 공직선거법 조항은 과잉금지원칙에 반하여 인터넷언론사 홈페이지 게시판 등
